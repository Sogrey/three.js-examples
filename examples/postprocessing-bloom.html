<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js物体发光效果 - 使用EffectComposer和UnrealBloomPass">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 物体发光效果</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Monospace;
            font-size: 13px;
            line-height: 24px;
            overscroll-behavior: none;
        }
        .lil-gui {
            z-index: 2 !important;
        }
        @media all and (max-width: 640px) {
            .lil-gui.root {
                right: auto;
                top: auto;
                max-height: 50%;
                max-width: 80%;
                bottom: 0;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import Stats from 'three/addons/libs/stats.module.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        let camera, stats;
        let composer, renderer, mixer, clock;

        const params = {
            threshold: 0,
            strength: 1,
            radius: 0,
            exposure: 1,
        };

        init();

        function init() {
            const container = document.getElementById('threeContainer');

            stats = new Stats();
            container.appendChild(stats.dom);

            clock = new THREE.Clock();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            window.scene = scene;

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 100);
            camera.position.set(-5, 2.5, -3.5);
            window.camera = camera;

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.maxPolarAngle = Math.PI * 0.5;
            controls.minDistance = 3;
            controls.maxDistance = 8;

            scene.add(new THREE.AmbientLight(0xcccccc));

            const pointLight = new THREE.PointLight(0xffffff, 100);
            camera.add(pointLight);

            const renderScene = new RenderPass(scene, camera);

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5,
                0.4,
                0.85
            );
            bloomPass.threshold = params.threshold;
            bloomPass.strength = params.strength;
            bloomPass.radius = params.radius;

            const outputPass = new OutputPass();

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
            composer.addPass(outputPass);

            new GLTFLoader().load('../models/gltf/LeePerrySmith/LeePerrySmith.glb', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                mixer = new THREE.AnimationMixer(model);
                if (gltf.animations && gltf.animations.length > 0) {
                    const clip = gltf.animations[0];
                    mixer.clipAction(clip.optimize()).play();
                }

                animate();
            }, undefined, function (error) {
                console.error('加载模型失败:', error);
                createDemoScene(scene);
                animate();
            });

            const gui = new GUI();

            const bloomFolder = gui.addFolder('bloom');

            bloomFolder
                .add(params, 'threshold', 0.0, 1.0)
                .onChange(function (value) {
                    bloomPass.threshold = Number(value);
                });

            bloomFolder
                .add(params, 'strength', 0.0, 3.0)
                .onChange(function (value) {
                    bloomPass.strength = Number(value);
                });

            gui
                .add(params, 'radius', 0.0, 1.0)
                .step(0.01)
                .onChange(function (value) {
                    bloomPass.radius = Number(value);
                });

            const toneMappingFolder = gui.addFolder('tone mapping');

            toneMappingFolder
                .add(params, 'exposure', 0.1, 2)
                .onChange(function (value) {
                    renderer.toneMappingExposure = Math.pow(value, 4.0);
                });

            window.addEventListener('resize', onWindowResize);
        }

        function createDemoScene(scene) {
            const geometry = new THREE.TorusKnotGeometry(1, 0.4, 100, 16);
            const material = new THREE.MeshStandardMaterial({
                color: 0xff6b6b,
                metalness: 0.7,
                roughness: 0.2,
                emissive: 0xff0000,
                emissiveIntensity: 0.5
            });
            const torusKnot = new THREE.Mesh(geometry, material);
            scene.add(torusKnot);
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            composer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (mixer) {
                mixer.update(delta);
            }

            stats.update();
            composer.render();
        }
    </script>
    
    <script>
        let _screenshotRenderer;
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
