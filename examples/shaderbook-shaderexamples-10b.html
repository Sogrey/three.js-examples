<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="纹理切换遮罩 - 点击切换纹理，圆形遮罩显示不同纹理">
    <meta name="three-version" content="r179">
    <title>纹理切换遮罩</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.001, 1000);
        camera.position.set(0.5, 0.2, 1.6);

        window.scene = new THREE.Scene();

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0x488348);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(camera, window.renderer.domElement);

        const textureLoader = new THREE.TextureLoader();
        const tex0 = textureLoader.load('../images/textures/uv-grid.jpg');
        
        const canvas2 = document.createElement('canvas');
        canvas2.width = 256;
        canvas2.height = 256;
        const ctx2 = canvas2.getContext('2d');
        for (let i = 0; i < 256; i += 32) {
            for (let j = 0; j < 256; j += 32) {
                ctx2.fillStyle = ((i + j) / 64) % 2 === 0 ? '#ffffff' : '#cccccc';
                ctx2.fillRect(i, j, 32, 32);
            }
        }
        const tex1 = new THREE.CanvasTexture(canvas2);

        const planeWidth = 2.0;
        const planeHeight = 1.5;

        const backgroundGeometry = new THREE.PlaneGeometry(planeWidth * 1.2, planeHeight * 1.2);
        const backgroundMesh = new THREE.Mesh(backgroundGeometry, new THREE.MeshBasicMaterial({ color: 0xdfdfdf, side: THREE.DoubleSide }));
        backgroundMesh.position.z = -0.5;
        window.scene.add(backgroundMesh);

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                v_Uv: { value: new THREE.Vector2() },
                u_Texture: { value: tex0 },
                u_planeAspect: { value: new THREE.Vector2(planeWidth, planeHeight) }
            },
            vertexShader: vertexShader(),
            fragmentShader: fragmentShader(),
            transparent: true
        });

        const planeGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const planeMesh = new THREE.Mesh(planeGeometry, shaderMaterial);
        window.scene.add(planeMesh);

        let isTex0 = true;

        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('resize', onWindowResize);

        window.camera = camera;

        function onPointerUp() {
            if (!isTex0) {
                shaderMaterial.uniforms.u_Texture.value = tex0;
                isTex0 = true;
            } else {
                shaderMaterial.uniforms.u_Texture.value = tex1;
                isTex0 = false;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function vertexShader() {
            return `
                varying vec2 v_Uv;
                void main() {
                    v_Uv = uv;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;
        }

        function fragmentShader() {
            return `
                varying vec2 v_Uv;
                uniform sampler2D u_Texture;
                uniform vec2 u_planeAspect;

                void main() {
                    float aspect = u_planeAspect.x / u_planeAspect.y;
                    float radius = 0.45;

                    vec2 dotUV = vec2(fract(v_Uv * 10.0));
                    dotUV *= vec2(aspect, 1.0);
                    dotUV -= vec2(0.7, 0.53);

                    if(length(dotUV) > radius) discard;

                    vec3 color = texture(u_Texture, v_Uv).rgb;
                    gl_FragColor = vec4(color, 1.0);
                }
            `;
        }

        function animate() {
            requestAnimationFrame(animate);
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        let _screenshotRenderer;
        const MAX_RETRY = 3;
        const RETRY_DELAY = 200;

        function doScreenshot(retryCount = 0) {
            try {
                if (!_screenshotRenderer && window.renderer) {
                    _screenshotRenderer = window.renderer;
                }

                if (!_screenshotRenderer) {
                    throw new Error('渲染器未初始化');
                }

                if (!window.scene || !window.camera) {
                    throw new Error('场景或相机未初始化');
                }

                _screenshotRenderer.render(window.scene, window.camera);

                const quality = 0.8;
                const canvas = _screenshotRenderer.domElement;

                if (canvas.width === 0 || canvas.height === 0) {
                    throw new Error('Canvas尺寸无效');
                }

                const tempCanvas = document.createElement('canvas');
                const maxSize = 600;
                const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                tempCanvas.width = Math.floor(canvas.width * scale);
                tempCanvas.height = Math.floor(canvas.height * scale);

                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                window.parent.postMessage({
                    type: 'screenshot-data',
                    dataUrl: dataUrl
                }, '*');

            } catch (error) {
                console.error('截图失败 (尝试 ' + (retryCount + 1) + '):', error);

                if (retryCount < MAX_RETRY) {
                    setTimeout(() => {
                        doScreenshot(retryCount + 1);
                    }, RETRY_DELAY * (retryCount + 1));
                } else {
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                requestAnimationFrame(() => {
                    doScreenshot();
                });
            }
        });
    </script>
</body>
</html>
