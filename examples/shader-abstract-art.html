<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 抽象艺术动画 - 旋转流动的抽象艺术作品">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 抽象艺术动画</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body { margin: 0; overflow: hidden; background: #020010; }
        #threeContainer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const params = {
            speed: 1.0,
            colorPhase: 2.0,
            intensity: 1.0
        };

        let scene, camera, renderer;
        let shaderMaterial;
        let time = 0;
        let mouse = new THREE.Vector2(0.5, 0.5);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020010);

            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(renderer.domElement);

            const geometry = new THREE.PlaneGeometry(2, 2);

            shaderMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uMouse: { value: mouse },
                    uSpeed: { value: params.speed },
                    uColorPhase: { value: params.colorPhase },
                    uIntensity: { value: params.intensity }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform vec2 uMouse;
                    uniform float uSpeed;
                    uniform float uColorPhase;
                    uniform float uIntensity;
                    varying vec2 vUv;

                    mat2 rot(float a) {
                        float s = sin(a);
                        float c = cos(a);
                        return mat2(c, -s, s, c);
                    }

                    void main() {
                        vec2 FC = gl_FragCoord.xy;
                        vec2 r = uResolution;
                        float t = uTime * uSpeed;

                        vec4 o = vec4(0.0);

                        vec2 uv = (FC * 2.0 - r.xy) / r.y;
                        vec3 rayDir = normalize(vec3(uv, 1.0));

                        for(float i = 0.0; i < 20.0; i++) {
                            float z = i * 0.5 + 0.1;

                            vec3 p = z * rayDir;
                            vec2 mouseOffset = (uMouse - 0.5) * 1.0;

                            p.xz *= rot(t * 0.2 + mouseOffset.x);
                            p.yz *= rot(t * 0.15 + mouseOffset.y);
                            vec3 a = p;

                            float d;
                            for(d = 1.0; d < 4.0; d += 1.0) {
                                a -= sin(a * d + t + i*0.1).yzx / (d * 0.8);
                            }

                            vec3 q = abs(a);
                            float mx = max(max(q.x, q.y), q.z);
                            float s = a.z + a.y - t;

                            d = abs(2.0 - mx) + abs(cos(s)) / 7.0;

                            float z_col = z + d;

                            vec4 colorPhase = vec4(0.0, 2.0 + uMouse.y * 2.0, 4.0 - uMouse.y * 2.0, 0.0);

                            o += (cos(s - z_col + colorPhase) + 1.0) / (d*0.5 + 0.01);
                        }

                        o = o / 20.0;
                        o = o / (1.0 + o);
                        o = smoothstep(0.15, 0.85, o);
                        o *= uIntensity;

                        gl_FragColor = o;
                        gl_FragColor.a = 1.0;
                    }
                `
            });

            const mesh = new THREE.Mesh(geometry, shaderMaterial);
            scene.add(mesh);

            initGUI();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
        }

        function initGUI() {
            const gui = new GUI({ title: '抽象艺术动画参数', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            setTimeout(() => { gui.show(); }, 100);

            const animationFolder = gui.addFolder('动画设置');
            animationFolder.add(params, 'speed', 0.1, 3.0).name('速度').onChange(() => {
                shaderMaterial.uniforms.uSpeed.value = params.speed;
            });
            animationFolder.add(params, 'colorPhase', 0.0, 4.0).name('颜色相位').onChange(() => {
                shaderMaterial.uniforms.uColorPhase.value = params.colorPhase;
            });
            animationFolder.add(params, 'intensity', 0.5, 2.0).name('强度').onChange(() => {
                shaderMaterial.uniforms.uIntensity.value = params.intensity;
            });
            animationFolder.open();
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            shaderMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = event.clientX / window.innerWidth;
            mouse.y = 1.0 - (event.clientY / window.innerHeight);
            shaderMaterial.uniforms.uMouse.value = mouse;
        }

        function animate() {
            requestAnimationFrame(animate);

            time += 0.02;
            shaderMaterial.uniforms.uTime.value = time;

            renderer.render(scene, camera);
        }

        function stopAnimation() {
            cancelAnimationFrame(animate);
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                stopAnimation();
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: renderer.domElement.toDataURL('image/jpeg', 0.8)
                    }, '*');
                    animate();
                }, 100);
            }
        });
    </script>
</body>
</html>
