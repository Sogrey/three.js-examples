<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="正多边形绘制 - 使用极坐标公式绘制正多边形">
    <meta name="three-version" content="r179">
    <title>正多边形绘制</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0, 7);

        window.scene = new THREE.Scene();

        const planeWidth = 7.5;
        const planeHeight = 4.0;
        let aspect, pasp, casp;

        const N = 7;
        const c = new THREE.Vector2(0.6, 0.1);
        const r = 0.9;
        const s = Math.PI / 6.0;

        if (planeWidth > planeHeight) {
            aspect = planeWidth / planeHeight;
            pasp = new THREE.Vector2(aspect, 1.0);
            casp = new THREE.Vector2(aspect - 1.0, 0.0);
        } else {
            aspect = planeHeight / planeWidth;
            pasp = new THREE.Vector2(1.0, aspect);
            casp = new THREE.Vector2(0.0, aspect - 1.0);
        }

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                v_Uv: { value: new THREE.Vector2() },
                u_pasp: { value: pasp },
                u_casp: { value: casp },
                u_N: { value: N },
                u_c: { value: c },
                u_r: { value: r },
                u_s: { value: s }
            },
            vertexShader: vertexShader(),
            fragmentShader: fragmentShader(),
            side: THREE.DoubleSide,
            transparent: true
        });

        const planeGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const planeMesh = new THREE.Mesh(planeGeometry, shaderMaterial);
        window.scene.add(planeMesh);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0xfefefe);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(camera, window.renderer.domElement);

        window.camera = camera;

        function vertexShader() {
            return `
                varying vec2 v_Uv;

                void main() {
                    v_Uv = uv;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;
        }

        function fragmentShader() {
            return `
                #define PI 3.14159265359
                #define TWOPI 6.28318530718

                varying vec2 v_Uv;
                uniform vec2 u_pasp;
                uniform vec2 u_casp;

                uniform int u_N;
                uniform vec2 u_c;
                uniform float u_r;
                uniform float u_s;

                float regularPolygon(vec2 p, vec2 pasp, vec2 casp, int N, vec2 c, float r, float s) {
                    p *= pasp;
                    c += casp;
                    p = -1.0 + p * 2.0 - c;

                    float ap = atan(p.x, p.y) + PI + s;
                    float rp = TWOPI / float(N);

                    float d = cos(floor(0.5 + ap / rp) * rp - ap) * length(p);
                    float r2 = cos(0.5 * rp) * r;

                    return 1.0 - smoothstep(r2 - 0.005, r2, d);
                }

                void main() {
                    vec2 p = v_Uv;
                    vec2 pasp = u_pasp;
                    vec2 casp = u_casp;

                    int N = u_N;
                    vec2 c = u_c;
                    float r = u_r;
                    float s = u_s;

                    float polygon = regularPolygon(p, pasp, casp, N, c, r, s);

                    vec3 color = vec3(0.4, 0.6, 0.2);
                    color = color + vec3(polygon) * vec3(0.4, 0.8, 0.4);

                    gl_FragColor = vec4(color, 1.0);
                }
            `;
        }

        function animate() {
            requestAnimationFrame(animate);
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        let _screenshotRenderer;
        const MAX_RETRY = 3;
        const RETRY_DELAY = 200;

        function doScreenshot(retryCount = 0) {
            try {
                if (!_screenshotRenderer && window.renderer) {
                    _screenshotRenderer = window.renderer;
                }

                if (!_screenshotRenderer) {
                    throw new Error('渲染器未初始化');
                }

                if (!window.scene || !window.camera) {
                    throw new Error('场景或相机未初始化');
                }

                _screenshotRenderer.render(window.scene, window.camera);

                const quality = 0.8;
                const canvas = _screenshotRenderer.domElement;

                if (canvas.width === 0 || canvas.height === 0) {
                    throw new Error('Canvas尺寸无效');
                }

                const tempCanvas = document.createElement('canvas');
                const maxSize = 600;
                const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                tempCanvas.width = Math.floor(canvas.width * scale);
                tempCanvas.height = Math.floor(canvas.height * scale);

                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                window.parent.postMessage({
                    type: 'screenshot-data',
                    dataUrl: dataUrl
                }, '*');

            } catch (error) {
                console.error('截图失败 (尝试 ' + (retryCount + 1) + '):', error);

                if (retryCount < MAX_RETRY) {
                    setTimeout(() => {
                        doScreenshot(retryCount + 1);
                    }, RETRY_DELAY * (retryCount + 1));
                } else {
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                requestAnimationFrame(() => {
                    doScreenshot();
                });
            }
        });
    </script>
</body>
</html>
