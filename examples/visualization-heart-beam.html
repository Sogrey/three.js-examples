<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心形流动光束</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <script type="importmap">
    {
        "imports": {
            "three": "../libs/three/r179/build/three.module.js",
            "three/addons/": "../libs/three/r179/jsm/"
        }
    }
  </script>
  
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    class HeartCurve extends THREE.Curve {
      constructor(scale = 1) {
        super();
        this.scale = scale;
      }

      getPoint(a, optionalTarget = new THREE.Vector3()) {
        const t = a * Math.PI * 2;
        const tx = 16 * Math.pow(Math.sin(t), 3);
        const ty = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        const tz = 0;
        return optionalTarget.set(tx, ty, tz).multiplyScalar(this.scale);
      }
    }

    let scene, camera, renderer, controls, composer;
    let materials = [];
    const speed = 0.005;

    function init() {
      const container = document.getElementById('canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
      camera.position.set(8.23, 6.16, 80.05);

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      initLight();
      createHeartBeam();
      initPostProcessing();
      animate();
    }

    function initLight() {
      const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
      scene.add(ambientLight);
    }

    function createHeartBeam() {
      const commonUniforms = {
        uFade: { value: new THREE.Vector2(0, 0.5) },
        uDirection: { value: 1 },
        uSpeed: { value: 1 }
      };

      const lineWidth = 0.5;
      const height = 100;

      const spline = new HeartCurve(1);
      const geometry = new THREE.TubeGeometry(spline, height, lineWidth, 8, false);

      const vertexShader = `
        varying vec2 vUv;
        void main(void) {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`;

      const fragmentShader = `
        varying vec2 vUv;
        uniform float uSpeed;
        uniform float uTime;
        uniform vec2 uFade;
        uniform vec3 uColor;
        uniform float uDirection;
        void main() {
            vec3 color = uColor;
            float s = 0.0;
            float v = 0.0;
            if(uDirection == 1.0) {
                v = vUv.x;
                s = -uTime * uSpeed;
            } else {
                v = -vUv.x;
                s = -uTime * uSpeed;
            }
            float d = mod((v + s), 1.0);
            if(d > uFade.y) discard;
            else {
                float alpha = smoothstep(uFade.x, uFade.y, d);
                if(alpha < 0.0001) discard;
                gl_FragColor = vec4(color, alpha);
            }
        }`;

      {
        const c = new THREE.Color('pink');
        const material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          transparent: true,
          uniforms: {
            uColor: { value: c },
            uTime: { value: 0 },
            ...commonUniforms
          },
          vertexShader,
          fragmentShader
        });
        materials.push(material);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
      }

      {
        const c = new THREE.Color('#00BFFF');
        const material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          transparent: true,
          uniforms: {
            uColor: { value: c },
            uTime: { value: 0.5 },
            ...commonUniforms
          },
          vertexShader,
          fragmentShader
        });
        materials.push(material);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
      }
    }

    function initPostProcessing() {
      const params = {
        threshold: 0,
        strength: 0.5,
        radius: 0.5
      };

      const renderScene = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
      bloomPass.threshold = params.threshold;
      bloomPass.strength = params.strength;
      bloomPass.radius = params.radius;

      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);
    }

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      materials.forEach((m) => {
        m.uniforms.uTime.value += speed;
        if (m.uniforms.uTime.value > 1) {
          m.uniforms.uTime.value = 0;
        }
      });

      renderer.autoClear = false;
      renderer.clear();
      composer.render();
      renderer.clearDepth();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      composer.setSize(width, height);
    }

    window.addEventListener('resize', onWindowResize);
    init();
  </script>
</body>
</html>
