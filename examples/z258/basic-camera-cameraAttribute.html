<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示PerspectiveCamera的各种属性，包括视角、近平面、远平面、缩放、图层等参数的调整。">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 相机属性</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;
        let controls;
        let box1, box2;

        const params = {
            reset: function() {
                window.camera.fov = 50;
                window.camera.near = 0.1;
                window.camera.far = 1000;
                window.camera.zoom = 1;
                window.camera.filmOffset = 0;
                window.camera.filmGauge = 35;
                window.camera.position.set(0, 1, 4);
                window.camera.layers.mask = 1;
                window.camera.updateProjectionMatrix();
                gui.reset();
            }
        };

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x1a1a2e);

            window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            window.camera.position.set(0, 1, 4);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;

            const geometry = new THREE.PlaneGeometry(3, 3);
            const texture = new THREE.TextureLoader().load('../../images/textures/tex02.jpg');
            const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const plane = new THREE.Mesh(geometry, material);
            window.scene.add(plane);

            box1 = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshNormalMaterial()
            );
            box1.position.set(2, 1, 0);
            box1.layers.set(1);
            window.scene.add(box1);

            box2 = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                new THREE.MeshLambertMaterial({ color: 0xff6b6b })
            );
            box2.position.set(-2, 0.5, 0);
            window.scene.add(box2);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            window.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            window.scene.add(directionalLight);

            window.scene.add(new THREE.AxesHelper(5));
            window.scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x222222));

            initGUI();
            animate();
        }

        function initGUI() {
            const gui = new GUI();
            gui.title('相机属性控制');

            const onChange = () => window.camera.updateProjectionMatrix();

            gui.add(window.camera.layers, 'mask').name('图层掩码').onChange(onChange).listen();
            gui.add({ '切换图层1': () => window.camera.layers.toggle(1) }, '切换图层1').name('切换图层');
            
            gui.add(window.camera, 'fov').min(10).max(120).name('视角(FOV)').onChange(onChange);
            gui.add(window.camera, 'near').min(0.001).max(10).step(0.001).name('近平面').onChange(onChange);
            gui.add(window.camera, 'far').min(10).max(2000).name('远平面').onChange(onChange);
            gui.add(window.camera, 'zoom').min(0.1).max(3).step(0.1).name('缩放').onChange(onChange);
            gui.add(window.camera, 'filmOffset').min(-1).max(1).step(0.01).name('胶片偏移').onChange(onChange);
            gui.add(window.camera, 'filmGauge').min(10).max(100).name('胶片尺寸').onChange(onChange);

            const positionFolder = gui.addFolder('相机位置');
            positionFolder.add(window.camera.position, 'x').min(-10).max(10).step(0.1).name('X').listen();
            positionFolder.add(window.camera.position, 'y').min(-10).max(10).step(0.1).name('Y').listen();
            positionFolder.add(window.camera.position, 'z').min(-10).max(10).step(0.1).name('Z').listen();

            gui.add(params, 'reset').name('重置所有');
        }

        function animate() {
            if (box1) box1.rotation.y += 0.01;
            if (box2) box2.rotation.x += 0.005;
            if (controls) controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
