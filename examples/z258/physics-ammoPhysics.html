<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="物理Ammo - 使用Three.js内置AmmoPhysics实现物理模拟"
    />
    <meta name="three-version" content="r179" />
    <title>Three.js 示例 - 物理Ammo</title>
    <link rel="stylesheet" href="../../css/example-common.css" />
    <script src="../../libs/three/r179/jsm/libs/ammo.wasm.js"></script>
  </head>
  <body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../libs/three/r179/build/three.module.js",
          "three/addons/": "../../libs/three/r179/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { AmmoPhysics } from "three/addons/physics/AmmoPhysics.js";

      const container = document.getElementById("threeContainer");

      window.scene = new THREE.Scene();
      window.scene.background = new THREE.Color(0x0a0a1a);

      window.camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        1,
        10000,
      );
      window.camera.position.set(15, 15, 15);

      window.renderer = new THREE.WebGLRenderer({ antialias: true });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(window.renderer.domElement);

      const controls = new OrbitControls(
        window.camera,
        window.renderer.domElement,
      );
      controls.enableDamping = true;

      const dirLight = new THREE.DirectionalLight(0xffffff, 3);
      dirLight.position.set(10, 20, 10);
      window.scene.add(dirLight);
      window.scene.add(new THREE.AmbientLight(0xffffff, 0.4));

      const physics = await AmmoPhysics();

      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(60, 5, 60),
        new THREE.MeshLambertMaterial({ color: 0x444444 }),
      );
      floor.position.y = -20;
      floor.userData.physics = { mass: 0 };
      window.scene.add(floor);

      const geometries = [
        new THREE.IcosahedronGeometry(0.8, 0),
        new THREE.SphereGeometry(0.7, 16, 16),
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.ConeGeometry(0.7, 1.2, 16),
        new THREE.TorusGeometry(0.5, 0.2, 8, 16),
      ];

      for (let i = 0; i < 80; i++) {
        const geometry =
          geometries[Math.floor(Math.random() * geometries.length)];
        const material = new THREE.MeshLambertMaterial({
          color: 0xffffff * Math.random(),
        });
        const mesh = new THREE.Mesh(geometry, material);

        mesh.position.set(
          (Math.random() - 0.5) * 20,
          Math.random() * 20 + 5,
          (Math.random() - 0.5) * 20,
        );
        mesh.rotation.set(
          Math.random() * Math.PI,
          Math.random() * Math.PI,
          Math.random() * Math.PI,
        );
        mesh.userData.physics = { mass: 1 };
        window.scene.add(mesh);
      }

      physics.addScene(window.scene);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        window.renderer.render(window.scene, window.camera);
      }
      animate();

      window.addEventListener("resize", () => {
        window.camera.aspect = window.innerWidth / window.innerHeight;
        window.camera.updateProjectionMatrix();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "take-screenshot") {
          try {
            if (window.scene && window.camera) {
              window.renderer.render(window.scene, window.camera);
            }
            const quality = event.data.quality || 0.8;
            const canvas = window.renderer.domElement;
            const tempCanvas = document.createElement("canvas");
            const maxSize = 600;
            const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
            tempCanvas.width = Math.floor(canvas.width * scale);
            tempCanvas.height = Math.floor(canvas.height * scale);
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            const dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
            window.parent.postMessage(
              { type: "screenshot-data", dataUrl: dataUrl },
              "*",
            );
          } catch (error) {
            console.error("截图失败:", error);
            window.parent.postMessage(
              { type: "screenshot-error", error: error.message },
              "*",
            );
          }
        }
      });
    </script>
  </body>
</html>
