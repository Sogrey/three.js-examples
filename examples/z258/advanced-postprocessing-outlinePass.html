<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示OutlinePass的使用，点击物体显示轮廓光效果。">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 轮廓光</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;
        let controls;
        let composer;
        let outlinePass;

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x1a1a2e);

            window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            window.camera.position.set(15, 15, 15);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.02;

            composer = new EffectComposer(window.renderer);
            window.composer = composer;

            const renderPass = new RenderPass(window.scene, window.camera);
            composer.addPass(renderPass);

            outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), window.scene, window.camera);
            composer.addPass(outlinePass);

            const outputPass = new OutputPass();
            composer.addPass(outputPass);

            window.scene.add(new THREE.AxesHelper(500), new THREE.GridHelper(100, 20));

            for (let i = 0; i < 10; i++) {
                const geometry = new THREE.BoxGeometry();
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 * Math.random() });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.x = Math.random() * 10;
                cube.position.y = Math.random() * 10;
                cube.position.z = Math.random() * 10;
                window.scene.add(cube);
            }

            const raycaster = new THREE.Raycaster();

            window.renderer.domElement.addEventListener('click', (event) => {
                const rect = window.renderer.domElement.getBoundingClientRect();
                const mouse = new THREE.Vector2(
                    ((event.clientX - rect.left) / rect.width) * 2 - 1,
                    -((event.clientY - rect.top) / rect.height) * 2 + 1
                );

                raycaster.setFromCamera(mouse, window.camera);
                const intersects = raycaster.intersectObjects(window.scene.children, true);

                if (intersects.length > 0) {
                    outlinePass.selectedObjects = [intersects[0].object];
                } else {
                    outlinePass.selectedObjects = [];
                }
            });

            animate();
        }

        function animate() {
            if (controls) controls.update();
            composer.render();
        }

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
