<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="水流粒子效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 水流粒子</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.0000001, 100000);
        window.camera.position.set(10, 10, 5);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.scene.add(new THREE.AxesHelper(10));

        const params = {
            maxParticles: 3000,
            spawnRate: 12,
            gravity: 10,
            minSize: 0.5,
            maxSize: 1,
            minStrength: 1,
            maxStrength: 4,
            spread: 0.6,
            burstProbability: 0.7,
            burstMultiplier: 3,
            color: '#9da7af',
            blendingMode: 'Additive',
            rainLength: 0.6,
            opacity: 0.6,
            collisionY: 0,
            enableSplash: true,
            splashParticles: 6,
            splashSize: 0.3,
            splashSpeed: 3,
            splashLifeTime: 0.6
        };

        class SplashParticle {
            constructor(position) {
                this.position = position.clone();
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * params.splashSpeed;
                this.velocity = new THREE.Vector3(
                    Math.cos(angle) * speed,
                    Math.random() * speed * 0.8 + speed * 0.5,
                    Math.sin(angle) * speed
                );
                this.life = 0;
                this.maxLife = params.splashLifeTime * (0.7 + Math.random() * 0.6);
                this.size = params.splashSize * (0.5 + Math.random() * 0.5);
            }

            update(delta) {
                this.velocity.y -= params.gravity * delta * 0.8;
                this.position.addScaledVector(this.velocity, delta);
                this.life += delta;
                if (this.position.y < params.collisionY) {
                    this.position.y = params.collisionY;
                    this.velocity.y = 0;
                }
                return this.life <= this.maxLife;
            }
        }

        class SplashSystem {
            constructor(maxCount = 1000) {
                this.maxCount = maxCount;
                this.particles = [];
                this.geometry = new THREE.BufferGeometry();
                this.positions = new Float32Array(maxCount * 3);
                this.sizes = new Float32Array(maxCount);
                this.opacities = new Float32Array(maxCount);
                this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                this.geometry.setAttribute('size', new THREE.BufferAttribute(this.sizes, 1));
                this.geometry.setAttribute('opacity', new THREE.BufferAttribute(this.opacities, 1));
                this.geometry.setDrawRange(0, 0);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        color: { value: new THREE.Color(params.color) },
                        globalOpacity: { value: params.opacity }
                    },
                    vertexShader: `
                        attribute float size;
                        attribute float opacity;
                        varying float vOpacity;
                        void main() {
                            vOpacity = opacity;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            float distance = max(length(mvPosition.xyz), 0.1);
                            float scale = 300.0 / distance;
                            scale = min(scale, 50.0);
                            gl_PointSize = size * scale;
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float globalOpacity;
                        varying float vOpacity;
                        void main() {
                            vec2 center = vec2(0.5, 0.5);
                            float dist = distance(gl_PointCoord, center);
                            float alpha = smoothstep(0.5, 0.2, dist) * vOpacity * globalOpacity;
                            if (alpha < 0.01) discard;
                            gl_FragColor = vec4(color, alpha);
                        }
                    `,
                    blending: THREE.AdditiveBlending,
                    transparent: true
                });
                this.points = new THREE.Points(this.geometry, this.material);
                window.scene.add(this.points);
            }

            addSplash(position) {
                if (!params.enableSplash) return;
                for (let i = 0; i < params.splashParticles; i++) {
                    if (this.particles.length < this.maxCount) {
                        this.particles.push(new SplashParticle(position));
                    }
                }
            }

            update(delta) {
                let alive = 0;
                let aliveParticles = [];
                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];
                    if (p.update(delta)) {
                        this.positions[alive * 3] = p.position.x;
                        this.positions[alive * 3 + 1] = p.position.y;
                        this.positions[alive * 3 + 2] = p.position.z;
                        this.sizes[alive] = p.size;
                        this.opacities[alive] = 1.0 - (p.life / p.maxLife);
                        alive++;
                        aliveParticles.push(p);
                    }
                }
                this.particles = aliveParticles;
                this.geometry.setDrawRange(0, alive);
                this.geometry.attributes.position.needsUpdate = true;
                this.geometry.attributes.size.needsUpdate = true;
                this.geometry.attributes.opacity.needsUpdate = true;
            }
        }

        class Particle {
            constructor() {
                this.position = new THREE.Vector3(0, 5, 0);
                const angle = Math.random() * Math.PI * 2;
                const strength = Math.random() * (params.maxStrength - params.minStrength) + params.minStrength;
                const spread = Math.random() * params.spread;
                this.velocity = new THREE.Vector3(
                    Math.cos(angle) * spread * strength,
                    -Math.random() * strength - 2,
                    Math.sin(angle) * spread * strength
                );
                this.life = 0;
                this.maxLife = 1 + Math.random() * 0.5;
                this.size = this.initialSize = Math.random() * (params.maxSize - params.minSize) + params.minSize;
            }

            update(delta) {
                this.velocity.y -= params.gravity * delta * 0.5;
                this.position.addScaledVector(this.velocity, delta);
                this.life += delta;
                const lifeRatio = this.life / this.maxLife;
                this.size = this.initialSize * (1 - lifeRatio * 0.5);
                if (this.position.y <= params.collisionY && this.velocity.y < 0) {
                    splashSystem.addSplash(new THREE.Vector3(this.position.x, params.collisionY, this.position.z));
                    this.life = this.maxLife + 1;
                }
                return this.life <= this.maxLife;
            }
        }

        class ParticleSystem {
            constructor(maxCount = params.maxParticles) {
                this.maxCount = maxCount;
                this.particles = [];
                this.geometry = new THREE.BufferGeometry();
                this.positions = new Float32Array(this.maxCount * 3);
                this.sizes = new Float32Array(this.maxCount);
                this.opacities = new Float32Array(this.maxCount);
                this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                this.geometry.setAttribute('size', new THREE.BufferAttribute(this.sizes, 1));
                this.geometry.setAttribute('opacity', new THREE.BufferAttribute(this.opacities, 1));
                this.geometry.setDrawRange(0, 0);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        color: { value: new THREE.Color(params.color) },
                        rainLength: { value: params.rainLength },
                        globalOpacity: { value: params.opacity }
                    },
                    vertexShader: `
                        attribute float size;
                        attribute float opacity;
                        varying float vOpacity;
                        void main() {
                            vOpacity = opacity;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            float distance = max(length(mvPosition.xyz), 0.1);
                            float scale = 300.0 / distance;
                            scale = min(scale, 50.0);
                            gl_PointSize = size * scale;
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float rainLength;
                        uniform float globalOpacity;
                        varying float vOpacity;
                        void main() {
                            vec2 center = vec2(0.5, 0.5);
                            vec2 uv = gl_PointCoord - center;
                            float width = 0.05;
                            float y_offset = (gl_PointCoord.y - 0.5) * 2.0;
                            float shape = step(abs(uv.x), width * (1.0 - pow(y_offset, 2.0)));
                            shape *= step(gl_PointCoord.y, 0.5 + rainLength / 2.0) * step(0.5 - rainLength / 2.0, gl_PointCoord.y);
                            shape *= 1.0 - (0.5 - gl_PointCoord.y) * 0.5;
                            float alpha = shape * vOpacity * globalOpacity;
                            if (alpha < 0.01) discard;
                            gl_FragColor = vec4(color, alpha);
                        }
                    `,
                    blending: params.blendingMode === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending,
                    depthTest: false,
                    side: THREE.DoubleSide,
                    transparent: true
                });
                this.points = new THREE.Points(this.geometry, this.material);
            }

            spawn(count = params.spawnRate) {
                const burst = Math.random() > params.burstProbability ? params.burstMultiplier : 1;
                for (let i = 0, n = count * burst; i < n && this.particles.length < this.maxCount; i++) {
                    this.particles.push(new Particle());
                }
            }

            update(delta) {
                let alive = 0;
                let aliveParticles = [];
                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];
                    if (p.update(delta)) {
                        this.positions[alive * 3] = p.position.x;
                        this.positions[alive * 3 + 1] = p.position.y;
                        this.positions[alive * 3 + 2] = p.position.z;
                        this.sizes[alive] = p.size;
                        this.opacities[alive] = 1.0 - (p.life / this.maxLife);
                        alive++;
                        aliveParticles.push(p);
                    }
                }
                this.particles = aliveParticles;
                this.geometry.setDrawRange(0, alive);
                this.geometry.attributes.position.needsUpdate = true;
                this.geometry.attributes.size.needsUpdate = true;
                this.geometry.attributes.opacity.needsUpdate = true;
                this.spawn(params.spawnRate);
            }
        }

        const splashSystem = new SplashSystem();
        splashSystem.points.frustumCulled = false;

        let emitter = new ParticleSystem(params.maxParticles);
        emitter.points.frustumCulled = false;

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            splashSystem.material.uniforms.color.value.copy(emitter.material.uniforms.color.value);
            splashSystem.material.uniforms.globalOpacity.value = emitter.material.uniforms.globalOpacity.value;

            emitter.update(delta);
            splashSystem.update(delta);

            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.title('水流粒子参数调节');

        const particleFolder = gui.addFolder('粒子系统');
        particleFolder.add(params, 'maxParticles', 500, 5000, 100).name('最大粒子数').onChange(value => {
            emitter = new ParticleSystem(value);
        });
        particleFolder.add(params, 'spawnRate', 1, 50, 1).name('生成速率');

        const particlePhysicsFolder = gui.addFolder('物理属性');
        particlePhysicsFolder.add(params, 'gravity', 1, 30, 1).name('重力');
        particlePhysicsFolder.add(params, 'minStrength', 0.5, 10, 0.5).name('最小喷射强度');
        particlePhysicsFolder.add(params, 'maxStrength', 0.5, 10, 0.5).name('最大喷射强度');
        particlePhysicsFolder.add(params, 'spread', 0, 1, 0.01).name('发散程度');

        const particleVisualFolder = gui.addFolder('视觉属性');
        particleVisualFolder.add(params, 'minSize', 0.1, 2, 0.1).name('最小粒子尺寸');
        particleVisualFolder.add(params, 'maxSize', 0.1, 2, 0.1).name('最大粒子尺寸');
        particleVisualFolder.addColor(params, 'color').name('粒子颜色');
        particleVisualFolder.add(params, 'burstProbability', 0, 1, 0.05).name('突发概率');
        particleVisualFolder.add(params, 'burstMultiplier', 1, 10, 1).name('突发倍数');
        particleVisualFolder.add(params, 'blendingMode', ['Additive', 'Normal']).name('混合模式').onChange(value => {
            emitter.material.blending = value === 'Additive' ? THREE.AdditiveBlending : THREE.NormalBlending;
            emitter.material.needsUpdate = true;
        });
        particleVisualFolder.add(params, 'rainLength', 0.1, 1.0, 0.05).name('雨滴长度');
        particleVisualFolder.add(params, 'opacity', 0.1, 1.0, 0.05).name('整体透明度');

        const splashFolder = gui.addFolder('水花效果');
        splashFolder.add(params, 'enableSplash').name('启用水花效果');
        splashFolder.add(params, 'splashParticles', 1, 15, 1).name('水花粒子数');
        splashFolder.add(params, 'splashSize', 0.1, 1.0, 0.05).name('水花大小');
        splashFolder.add(params, 'splashSpeed', 1, 10, 0.5).name('水花飞溅速度');
        splashFolder.add(params, 'splashLifeTime', 0.1, 2.0, 0.1).name('水花生命时间');
        splashFolder.add(params, 'collisionY', -5, 10, 0.5).name('碰撞高度');

        particleFolder.open();
        particlePhysicsFolder.open();
        particleVisualFolder.open();
        splashFolder.open();

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
