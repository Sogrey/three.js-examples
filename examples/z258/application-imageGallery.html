<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D图片画廊，使用程序化生成的纹理">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D图片画廊</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #galleryUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 250px;
        }
        #galleryUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #galleryUI .info {
            font-size: 12px;
            color: #aaa;
            margin: 10px 0;
        }
        #galleryUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        #galleryUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #galleryUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #title {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #title.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="galleryUI">
        <h3>3D图片画廊</h3>
        <button class="btn" id="btnAuto">自动轮播</button>
        <button class="btn" id="btnLayout1">环形布局</button>
        <button class="btn" id="btnLayout2">墙面布局</button>
        <div class="info">
            左键拖拽旋转<br>
            滚轮缩放<br>
            点击图片聚焦
        </div>
    </div>
    
    <div id="title"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const spotLight = new THREE.SpotLight(0xffffff, 1);
        spotLight.position.set(0, 20, 0);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);
        
        // 创建程序化纹理
        function createProceduralTexture(type, colors) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // 背景
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(1, colors[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // 图案
            ctx.strokeStyle = colors[2] || '#ffffff';
            ctx.lineWidth = 3;
            
            if (type === 'circles') {
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        Math.random() * 512,
                        Math.random() * 512,
                        20 + Math.random() * 50,
                        0, Math.PI * 2
                    );
                    ctx.stroke();
                }
            } else if (type === 'lines') {
                for (let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * 512, Math.random() * 512);
                    ctx.lineTo(Math.random() * 512, Math.random() * 512);
                    ctx.stroke();
                }
            } else if (type === 'grid') {
                const size = 40;
                for (let x = 0; x < 512; x += size) {
                    for (let y = 0; y < 512; y += size) {
                        if (Math.random() > 0.5) {
                            ctx.fillStyle = colors[2] || '#ffffff';
                            ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
                        }
                    }
                }
            } else if (type === 'waves') {
                for (let i = 0; i < 10; i++) {
                    ctx.beginPath();
                    for (let x = 0; x < 512; x += 10) {
                        const y = 256 + Math.sin(x * 0.02 + i) * 100 + (i - 5) * 20;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            } else if (type === 'dots') {
                for (let i = 0; i < 100; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        Math.random() * 512,
                        Math.random() * 512,
                        5 + Math.random() * 15,
                        0, Math.PI * 2
                    );
                    ctx.fillStyle = colors[2] || '#ffffff';
                    ctx.fill();
                }
            } else if (type === 'triangles') {
                for (let i = 0; i < 15; i++) {
                    ctx.beginPath();
                    const x = Math.random() * 400 + 56;
                    const y = Math.random() * 400 + 56;
                    const size = 50 + Math.random() * 80;
                    ctx.moveTo(x, y - size);
                    ctx.lineTo(x + size * 0.866, y + size * 0.5);
                    ctx.lineTo(x - size * 0.866, y + size * 0.5);
                    ctx.closePath();
                    ctx.stroke();
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }
        
        // 画廊图片数据
        const galleryData = [
            { title: '圆形艺术', type: 'circles', colors: ['#1a1a2e', '#16213e', '#e94560'] },
            { title: '线条构成', type: 'lines', colors: ['#0f3460', '#16213e', '#e94560'] },
            { title: '网格图案', type: 'grid', colors: ['#1a1a2e', '#0f3460', '#e94560'] },
            { title: '波浪纹理', type: 'waves', colors: ['#16213e', '#1a1a2e', '#e94560'] },
            { title: '点阵设计', type: 'dots', colors: ['#0f3460', '#1a1a2e', '#e94560'] },
            { title: '三角几何', type: 'triangles', colors: ['#1a1a2e', '#0f3460', '#e94560'] },
            { title: '圆形艺术2', type: 'circles', colors: ['#16213e', '#1a1a2e', '#00ff88'] },
            { title: '线条构成2', type: 'lines', colors: ['#0f3460', '#16213e', '#00ff88'] }
        ];
        
        // 创建图片框
        const frames = [];
        const frameGeometry = new THREE.BoxGeometry(4, 5, 0.2);
        const frameMaterial = new THREE.MeshStandardMaterial({
            color: 0x333333,
            roughness: 0.5,
            metalness: 0.8
        });
        
        galleryData.forEach((data, index) => {
            const group = new THREE.Group();
            
            // 外框
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.castShadow = true;
            group.add(frame);
            
            // 图片平面
            const texture = createProceduralTexture(data.type, data.colors);
            const imageGeometry = new THREE.PlaneGeometry(3.6, 4.6);
            const imageMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.3,
                metalness: 0.1
            });
            const image = new THREE.Mesh(imageGeometry, imageMaterial);
            image.position.z = 0.11;
            image.userData = { title: data.title, index: index };
            group.add(image);
            
            // 存储引用
            group.userData = { title: data.title, index: index, imageMesh: image };
            frames.push(group);
            scene.add(group);
        });
        
        // 布局函数
        function layoutCircular() {
            const radius = 12;
            const angleStep = (Math.PI * 2) / frames.length;
            
            frames.forEach((frame, i) => {
                const angle = i * angleStep;
                frame.position.x = Math.sin(angle) * radius;
                frame.position.z = Math.cos(angle) * radius;
                frame.position.y = 2.5;
                frame.rotation.y = angle + Math.PI;
            });
            
            camera.position.set(0, 5, 0);
            controls.target.set(0, 2.5, 0);
        }
        
        function layoutWall() {
            const cols = 4;
            const spacing = 5;
            
            frames.forEach((frame, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                frame.position.x = (col - 1.5) * spacing;
                frame.position.y = 2.5 + (0.5 - row) * 6;
                frame.position.z = -10;
                frame.rotation.y = 0;
            });
            
            camera.position.set(0, 5, 15);
            controls.target.set(0, 2.5, -10);
        }
        
        // 初始布局
        layoutCircular();
        
        // 自动轮播
        let autoPlay = false;
        let currentIndex = 0;
        let autoPlayInterval;
        
        function focusOnFrame(index) {
            const frame = frames[index];
            const targetPos = frame.position.clone();
            targetPos.z += 8;
            targetPos.y = 2.5;
            
            // 平滑移动相机
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            let progress = 0;
            
            function animateCamera() {
                progress += 0.02;
                if (progress >= 1) progress = 1;
                
                camera.position.lerpVectors(startPos, targetPos, progress);
                controls.target.lerpVectors(startTarget, frame.position, progress);
                
                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            animateCamera();
            
            // 显示标题
            const titleEl = document.getElementById('title');
            titleEl.textContent = frame.userData.title;
            titleEl.classList.add('visible');
            setTimeout(() => titleEl.classList.remove('visible'), 2000);
        }
        
        // UI事件
        document.getElementById('btnAuto').addEventListener('click', () => {
            autoPlay = !autoPlay;
            document.getElementById('btnAuto').classList.toggle('active');
            
            if (autoPlay) {
                autoPlayInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % frames.length;
                    focusOnFrame(currentIndex);
                }, 3000);
            } else {
                clearInterval(autoPlayInterval);
            }
        });
        
        document.getElementById('btnLayout1').addEventListener('click', () => {
            layoutCircular();
        });
        
        document.getElementById('btnLayout2').addEventListener('click', () => {
            layoutWall();
        });
        
        // 鼠标点击检测
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        window.addEventListener('click', (event) => {
            if (event.target.closest('#galleryUI')) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const imageMeshes = frames.map(f => f.userData.imageMesh);
            const intersects = raycaster.intersectObjects(imageMeshes);
            
            if (intersects.length > 0) {
                const index = intersects[0].object.userData.index;
                currentIndex = index;
                focusOnFrame(index);
            }
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
