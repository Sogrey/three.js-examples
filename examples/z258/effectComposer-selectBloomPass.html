<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="辉光-postprocessing - Three.js选择性辉光效果">
    <title>辉光-postprocessing - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 240px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls button.active { background: #ff6b6b; }
        #controls .value { color: #4a9eff; float: right; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>✨ 选择性辉光</h3>
        <div class="control-group">
            <label>辉光强度 <span class="value" id="strengthValue">1.5</span></label>
            <input type="range" id="strengthRange" min="0" max="3" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <label>辉光半径 <span class="value" id="radiusValue">0.4</span></label>
            <input type="range" id="radiusRange" min="0" max="1" step="0.05" value="0.4">
        </div>
        <div class="control-group">
            <label>辉光阈值 <span class="value" id="thresholdValue">0.85</span></label>
            <input type="range" id="thresholdRange" min="0" max="1" step="0.05" value="0.85">
        </div>
        <button id="btnToggleBloom" class="active">✨ 辉光: 开启</button>
        <button id="btnToggleRotation">⏯️ 自动旋转</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.Fog(0x050510, 10, 50);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        // 创建发光物体组
        const bloomGroup = new THREE.Group();
        scene.add(bloomGroup);

        // 创建发光核心
        const coreGeometry = new THREE.IcosahedronGeometry(1, 4);
        const coreMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffaa00,
            emissive: 0xff4400,
            emissiveIntensity: 2
        });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        bloomGroup.add(core);

        // 创建发光环
        const ringGeometry = new THREE.TorusGeometry(2, 0.1, 16, 100);
        const ringMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff,
            emissive: 0x00ffff,
            emissiveIntensity: 2
        });
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial);
        ring1.rotation.x = Math.PI / 2;
        bloomGroup.add(ring1);

        const ring2 = new THREE.Mesh(ringGeometry, new THREE.MeshBasicMaterial({ 
            color: 0xff00ff,
            emissive: 0xff00ff,
            emissiveIntensity: 2
        }));
        ring2.rotation.x = Math.PI / 2;
        ring2.scale.setScalar(1.5);
        bloomGroup.add(ring2);

        // 创建粒子
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 200;
        const posArray = new Float32Array(particlesCount * 3);
        const colorArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i += 3) {
            const r = 3 + Math.random() * 5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);

            // 随机颜色
            const color = new THREE.Color();
            color.setHSL(Math.random(), 1, 0.5);
            colorArray[i] = color.r;
            colorArray[i+1] = color.g;
            colorArray[i+2] = color.b;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            emissive: 0xffffff,
            emissiveIntensity: 2
        });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        bloomGroup.add(particles);

        // 创建不发光物体
        const normalGroup = new THREE.Group();
        scene.add(normalGroup);

        // 地面网格
        const gridHelper = new THREE.GridHelper(30, 30, 0x333333, 0x111111);
        normalGroup.add(gridHelper);

        // 背景几何体（不发光）
        for(let i = 0; i < 10; i++) {
            const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.7,
                metalness: 0.3
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(
                (Math.random() - 0.5) * 15,
                0.25,
                (Math.random() - 0.5) * 15
            );
            normalGroup.add(mesh);
        }

        // 后期处理
        const renderScene = new RenderPass(scene, camera);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.4, 0.85
        );

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 配置
        const config = {
            bloomEnabled: true,
            autoRotate: false
        };

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 旋转动画
            if (config.autoRotate) {
                bloomGroup.rotation.y += 0.005;
                bloomGroup.rotation.z += 0.002;
            }

            // 核心脉动
            core.scale.setScalar(1 + Math.sin(time * 3) * 0.1);

            // 环旋转
            ring1.rotation.x = Math.PI / 2 + Math.sin(time) * 0.2;
            ring1.rotation.y = time * 0.5;
            ring2.rotation.x = Math.PI / 2 + Math.cos(time) * 0.2;
            ring2.rotation.y = -time * 0.3;

            // 粒子旋转
            particles.rotation.y = time * 0.1;

            controls.update();

            if (config.bloomEnabled) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        window.composer = composer;

        // 控制面板事件
        document.getElementById('strengthRange').addEventListener('input', (e) => {
            bloomPass.strength = parseFloat(e.target.value);
            document.getElementById('strengthValue').textContent = bloomPass.strength.toFixed(1);
        });

        document.getElementById('radiusRange').addEventListener('input', (e) => {
            bloomPass.radius = parseFloat(e.target.value);
            document.getElementById('radiusValue').textContent = bloomPass.radius.toFixed(2);
        });

        document.getElementById('thresholdRange').addEventListener('input', (e) => {
            bloomPass.threshold = parseFloat(e.target.value);
            document.getElementById('thresholdValue').textContent = bloomPass.threshold.toFixed(2);
        });

        document.getElementById('btnToggleBloom').addEventListener('click', () => {
            config.bloomEnabled = !config.bloomEnabled;
            const btn = document.getElementById('btnToggleBloom');
            btn.textContent = config.bloomEnabled ? '✨ 辉光: 开启' : '✨ 辉光: 关闭';
            btn.classList.toggle('active', config.bloomEnabled);
        });

        document.getElementById('btnToggleRotation').addEventListener('click', () => {
            config.autoRotate = !config.autoRotate;
            document.getElementById('btnToggleRotation').textContent = 
                config.autoRotate ? '⏹️ 停止旋转' : '⏯️ 自动旋转';
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
