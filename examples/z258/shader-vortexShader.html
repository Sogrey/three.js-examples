<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="扭曲 - 展示扭曲效果着色器">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 扭曲</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
        window.camera.position.set(1, 1, 1);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 2;
        controls.maxDistance = 10;

        const directionalLight = new THREE.DirectionalLight(0xffffff);
        directionalLight.position.set(0, 200, 100);
        window.scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load('../../images/textures/hardwood2_diffuse.jpg');

        const cubeShader = {
            uniforms: {
                tDiffuse: { type: 't', value: texture },
                vScreenSize: { type: 'v2', value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                vCenter: { type: 'v2', value: new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2) },
                fRadius: { type: 'f', value: window.innerWidth / 2.0 },
                fUzuStrength: { type: 'f', value: 2.0 },
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                varying vec2 vUv;
                uniform vec2 vScreenSize;
                uniform vec2 vCenter;
                uniform float fRadius;
                uniform float fUzuStrength;

                void main() {
                    vec2 pos = (vUv * vScreenSize) - vCenter;
                    float len = length(pos);
                    if (len >= fRadius) {
                        gl_FragColor = texture2D(tDiffuse, vUv);
                        return;
                    }

                    float uzu = min(max(1.0 - (len / fRadius), 0.0), 1.0) * fUzuStrength;
                    float x = pos.x * cos(uzu) - pos.y * sin(uzu);
                    float y = pos.x * sin(uzu) + pos.y * cos(uzu);
                    vec2 retPos = (vec2(x, y) + vCenter) / vScreenSize;
                    vec4 color = texture2D(tDiffuse, retPos);
                    gl_FragColor = color;
                }
            `,
        };

        const cubeMaterial = new THREE.ShaderMaterial({
            uniforms: cubeShader.uniforms,
            vertexShader: cubeShader.vertexShader,
            fragmentShader: cubeShader.fragmentShader,
            side: THREE.DoubleSide
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const plane = new THREE.Mesh(geometry, cubeMaterial);
        window.scene.add(plane);

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(w, h);
            cubeMaterial.uniforms.vScreenSize.value.set(w, h);
            cubeMaterial.uniforms.vCenter.value.set(w / 2, h / 2);
            cubeMaterial.uniforms.fRadius.value = w / 2.0;
        });

        const gui = new GUI();
        gui.domElement.style.position = 'absolute';
        gui.domElement.style.top = '50px';
        gui.domElement.style.right = '10px';
        gui.domElement.style.zIndex = '1000';
        gui.add(cubeMaterial.uniforms['fRadius'], 'value', 1.0, 1000.0).step(1.0).name('radius');
        gui.add(cubeMaterial.uniforms['fUzuStrength'], 'value', -4.0, 4.0).step(0.1).name('uzuStrength');
        gui.domElement.style.zIndex = '1000';

        function animate() {
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
