<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 示例 - 绘制面</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div class="info-panel" style="position: fixed; top: 60px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 15px; border-radius: 8px; font-size: 14px; z-index: 1000; max-width: 280px;">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #4af;">绘制面操作说明</div>
        <div style="margin-bottom: 8px;"><span style="color: #ff6;">1. 点击平面</span> - 添加顶点小红球</div>
        <div style="margin-bottom: 8px;"><span style="color: #ff6;">2. 移动鼠标</span> - 预览多边形形状</div>
        <div style="margin-bottom: 8px;"><span style="color: #ff6;">3. 右键点击</span> - 完成绘制多边形</div>
        <div style="margin-top: 10px; color: #aaa; font-size: 12px;">至少需要3个顶点才能形成面</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 3);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(0, 20, 0);
        scene.add(directionalLight, new THREE.AmbientLight(0xffffff, 0.5));

        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        const plane = new THREE.PlaneGeometry(5, 5);
        const material = new THREE.MeshStandardMaterial({ color: 0x666666, side: THREE.DoubleSide });
        const planeMesh = new THREE.Mesh(plane, material);
        planeMesh.rotation.x -= Math.PI / 2;
        scene.add(planeMesh);

        animate();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const raycaster = new THREE.Raycaster();

        const getPoint = (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(planeMesh);
            if (intersects.length > 0) return intersects[0].point;
        };

        const setPointBox = (point) => {
            const box = new THREE.BoxGeometry(0.06, 0.06, 0.06);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const boxMesh = new THREE.Mesh(box, material);
            boxMesh.position.copy(point);
            boxMesh.position.y += 0.03;
            scene.add(boxMesh);
        };

        const pointList = [];
        let drawMesh = null;
        let stop = false;

        container.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            stop = true;
            if (pointList.length < 3) return;
            const { indexGroup, faceGroup, uvGroup } = multShapeGroup(pointList);
            if (drawMesh) updateMultShapePlaneGeometry(drawMesh.geometry, faceGroup, indexGroup, uvGroup);
        });

        container.addEventListener('mousemove', (event) => {
            if (stop) return;
            const point = getPoint(event);
            if (!point || !drawMesh || pointList.length < 2) return;
            const { indexGroup, faceGroup, uvGroup } = multShapeGroup([...pointList, point]);
            updateMultShapePlaneGeometry(drawMesh.geometry, faceGroup, indexGroup, uvGroup);
        });

        container.addEventListener('click', (event) => {
            const point = getPoint(event);
            if (!point || stop) return;
            setPointBox(point);
            point.y += 0.001;
            pointList.push(point);
            const { indexGroup, faceGroup, uvGroup } = multShapeGroup(pointList);
            if (pointList.length < 3) return;
            if (!drawMesh) {
                const geometry = multShapePlaneGeometry(faceGroup, indexGroup, uvGroup);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x00ff00, 
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7
                });
                drawMesh = new THREE.Mesh(geometry, material);
                scene.add(drawMesh);
            } else {
                updateMultShapePlaneGeometry(drawMesh.geometry, faceGroup, indexGroup, uvGroup);
            }
        });

        function multShapeGroup(pList) {
            const indexGroup = pList
                .map((_, k) => (k >= 2) ? [0, k - 1, k] : false)
                .filter((i) => i)
                .reduce((i, j) => [...i, ...j], []);
            const faceGroup = pList.reduce((j, i) => [...j, i.x, i.y, i.z], []);
            const uvMaxMin = pList.reduce((p, i) => ({
                x: [...p['x'], i['x']],
                y: [...p['y'], i['y']],
                z: [...p['z'], i['z']]
            }), { x: [], y: [], z: [] });
            const Maxp = new THREE.Vector3(
                Math.max(...uvMaxMin.x),
                Math.max(...uvMaxMin.y),
                Math.max(...uvMaxMin.z)
            );
            const Minp = new THREE.Vector3(
                Math.min(...uvMaxMin.x),
                Math.min(...uvMaxMin.y),
                Math.min(...uvMaxMin.z)
            );
            const W = Maxp.x - Minp.x;
            const H = Maxp.y - Minp.y;
            const L = W > H ? W : H;
            const uvGroup = pList
                .map(i => new THREE.Vector2((i.x - Minp.x) / L, (i.y - Minp.y) / L))
                .reduce((i, j) => [...i, ...j], []);
            return { indexGroup, faceGroup, uvGroup };
        }

        function multShapePlaneGeometry(faceGroup, indexGroup, uvGroup) {
            const geometry = new THREE.BufferGeometry();
            const vertices = new Float32Array(faceGroup);
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            if (indexGroup) {
                let indexs = new Uint16Array(indexGroup);
                geometry.index = new THREE.BufferAttribute(indexs, 1);
            }
            if (uvGroup) geometry.attributes.uv = new THREE.Float32BufferAttribute(uvGroup, 2);
            geometry.computeVertexNormals();
            return geometry;
        }

        function updateMultShapePlaneGeometry(geometry, faceGroup, indexGroup, uvGroup) {
            geometry.setIndex(indexGroup);
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(faceGroup, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvGroup, 2));
            delete geometry.attributes.normal;
            geometry.computeVertexNormals();
        }
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
