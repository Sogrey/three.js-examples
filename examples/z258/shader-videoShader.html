<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="视频着色器 - 展示视频纹理与着色器混合效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 视频着色器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 10, 10);

        window.renderer = new THREE.WebGLRenderer();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            shader.uniforms.r.value.set(window.innerWidth, window.innerHeight);
        });

        const ambientLight = new THREE.AmbientLight(0xffffff, 4);
        window.scene.add(ambientLight);

        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        function updateCanvas(time) {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 100 + Math.sin(time / 500) * 30;

            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, `hsl(${time / 10}, 80%, 60%)`);
            gradient.addColorStop(0.5, `hsl(${time / 10 + 60}, 70%, 50%)`);
            gradient.addColorStop(1, 'transparent');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 5; i++) {
                const angle = (time / (1000 + i * 200)) + (i * Math.PI * 0.4);
                const x = centerX + Math.cos(angle) * (150 + i * 30);
                const y = centerY + Math.sin(angle * 1.3) * (150 + i * 30);

                ctx.fillStyle = `hsl(${time / 10 + i * 30}, 70%, 50%)`;
                ctx.beginPath();
                ctx.arc(x, y, 10 + Math.sin(time / 300 + i) * 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const canvasTexture = new THREE.CanvasTexture(canvas);

        let videoTexture = null;
        let useVideo = { value: true };

        async function loadVideoTexture() {
            const video = document.createElement('video');
            video.crossOrigin = 'anonymous';
            video.src = '../../images/textures/test.mp4';
            video.loop = true;
            video.muted = true;
            await new Promise(resolve => video.onloadeddata = resolve);
            video.play();
            videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            shader.uniforms.colorTexture.value = videoTexture;
        }
        loadVideoTexture();

        const shader = {
            uniforms: THREE.UniformsUtils.merge([
                THREE.ShaderLib['phong'].uniforms,
                {
                    r: {
                        type: 'v2',
                        value: new THREE.Vector2(window.innerWidth, window.innerHeight)
                    },
                    t: {
                        type: 'f',
                        value: 0.0
                    },
                    colorTexture: { value: canvasTexture },
                    calcType: {
                        value: 2
                    }
                }
            ]),
            vertexShader: THREE.ShaderLib['phong'].vertexShader,
            fragmentShader: THREE.ShaderLib['phong'].fragmentShader,
        };

        shader.vertexShader = shader.vertexShader.replace(/#include <common>/, `
            varying vec2 vUv;
            #include <common>
        `);

        shader.vertexShader = shader.vertexShader.replace('void main() {', `
            void main() {
            vUv = uv;
        `);

        shader.fragmentShader = shader.fragmentShader.replace(/#include <common>/, `
            precision highp float;
            varying vec2 vUv;
            uniform vec2 r;
            uniform float t;
            uniform float calcType;
            uniform sampler2D colorTexture;
            #include <common>
        `);

        shader.fragmentShader = shader.fragmentShader.replace('vec4 diffuseColor = vec4( diffuse, opacity );', `
            vec3 c;
            float l,z=t;
            for(int i=0;i<3;i++) {
                vec2 uv,p=gl_FragCoord.xy/r/2.0;
                uv=p + 2.0 * vUv;
                p-=.5;
                p.x*=r.x/r.y;
                z+=.07;
                l=length(p);
                uv+=p/l*(sin(z)+1.)*abs(sin(l*9.-z-z));
                c[i]=.01/length(mod(uv,1.)-.5);
            }
            vec3 color = texture2D(colorTexture, vUv).rgb;
            vec3 mixedColor;
            if (calcType == 0.0) mixedColor = max(color, c);
            else if(calcType == 1.0) mixedColor = min(color, c);
            else if(calcType == 2.0) mixedColor = mix(color, c, 0.5);
            else if(calcType == 3.0) mixedColor = mod(color, c);
            else if(calcType == 4.0) mixedColor = pow(color, c);
            else if(calcType == 5.0) mixedColor = step(color, c);
            else if(calcType == 6.0) mixedColor = color + c;
            else if(calcType == 7.0) mixedColor = color - c;
            else if(calcType == 8.0) mixedColor = c - color;
            else if(calcType == 9.0) mixedColor = color + c - vec3(1.0) * c * color;
            else mixedColor = color;
            vec4 diffuseColor = vec4(diffuse * mixedColor, opacity);
        `);

        const geometry = new THREE.BoxGeometry(5, 5, 5);
        const material = new THREE.ShaderMaterial({
            uniforms: shader.uniforms,
            vertexShader: shader.vertexShader,
            fragmentShader: shader.fragmentShader,
            lights: true
        });

        const cube = new THREE.Mesh(geometry, material);
        window.scene.add(cube);

        const gui = new GUI();
        gui.domElement.style.position = 'absolute';
        gui.domElement.style.top = '50px';
        gui.domElement.style.right = '10px';
        gui.domElement.style.zIndex = '1000';
        gui.add(useVideo, 'value').name('使用视频纹理').onChange(val => {
            shader.uniforms.colorTexture.value = val ? videoTexture : canvasTexture;
        });
        gui.add(shader.uniforms.calcType, 'value', {
            'max': 0,
            'min': 1,
            'mix': 2,
            'mod': 3,
            'pow': 4,
            'step': 5,
            'add': 6,
            'subtract': 7,
            'reverse': 8,
            'overlay': 9
        }).name('混合运算类型');

        function animate(time) {
            shader.uniforms.t.value += 0.1;
            updateCanvas(time);
            canvasTexture.needsUpdate = true;
            if (videoTexture) videoTexture.needsUpdate = true;
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
