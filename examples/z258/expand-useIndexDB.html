<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IndexedDB使用演示 - 展示如何使用浏览器IndexedDB存储和读取3D场景数据。功能：保存场景到本地数据库、从数据库加载场景、管理存储数据。原理：使用IndexedDB API创建对象存储，将Three.js场景序列化为JSON保存，支持增删改查操作。执行流程：1)打开数据库 2)创建对象存储 3)序列化场景数据 4)存储到IndexedDB 5)读取并恢复场景">
    <title>IndexedDB使用 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; font-size: 12px; }
        #container { width: 100vw; height: 100vh; }
        
        /* 控制面板 - 紧凑 */
        #controls {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 240px; font-size: 11px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 13px; }
        #controls .section { margin: 10px 0; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 6px; }
        #controls .section h4 { color: #4a9eff; margin-bottom: 8px; font-size: 11px; }
        #controls input[type="text"] {
            width: 100%; padding: 5px; margin: 4px 0;
            background: rgba(255,255,255,0.1); border: 1px solid #444;
            border-radius: 4px; color: white; font-size: 11px;
        }
        #controls input[type="text"]::placeholder { color: #888; }
        #controls button {
            width: 100%; padding: 6px; margin: 4px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 11px;
            transition: all 0.3s;
        }
        #controls button:hover { background: #3a8eef; }
        #controls button.danger { background: #ff6b6b; }
        #controls button.danger:hover { background: #ff5252; }
        #controls button.success { background: #6bcf7f; }
        #controls button.success:hover { background: #5cb86c; }
        #controls button:disabled { background: #666; cursor: not-allowed; }
        
        /* 存储列表 */
        #storage-list { max-height: 120px; overflow-y: auto; margin-top: 8px; }
        .storage-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px; margin: 3px 0; background: rgba(255,255,255,0.05);
            border-radius: 4px; font-size: 10px;
        }
        .storage-item:hover { background: rgba(255,255,255,0.1); }
        .storage-item .name { flex: 1; color: #fff; }
        .storage-item .date { color: #888; margin-right: 8px; font-size: 9px; }
        .storage-item button {
            width: auto; padding: 3px 8px; margin: 0 2px; font-size: 9px;
        }
        
        /* 状态信息 */
        #status {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 180px; font-size: 11px;
        }
        #status h4 { color: #4a9eff; margin-bottom: 10px; font-size: 12px; }
        #status .stat { display: flex; justify-content: space-between; margin: 6px 0; }
        #status .stat-value { color: #4a9eff; }
        #db-status { padding: 4px 8px; border-radius: 4px; font-size: 10px; text-align: center; margin-top: 8px; }
        #db-status.connected { background: rgba(107,207,127,0.3); color: #6bcf7f; }
        #db-status.disconnected { background: rgba(255,107,107,0.3); color: #ff6b6b; }
        
        /* 消息提示 */
        #message {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.9);
            color: white; padding: 12px 24px; border-radius: 8px;
            font-size: 12px; z-index: 200; opacity: 0; transition: opacity 0.3s;
        }
        #message.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>💾 IndexedDB 存储</h3>
        
        <div class="section">
            <h4>保存场景</h4>
            <input type="text" id="sceneName" placeholder="输入场景名称">
            <button onclick="saveScene()">💾 保存当前场景</button>
        </div>
        
        <div class="section">
            <h4>已保存的场景</h4>
            <div id="storage-list"></div>
            <button class="danger" onclick="clearAllScenes()">🗑️ 清空所有</button>
        </div>
        
        <div class="section">
            <h4>场景操作</h4>
            <button onclick="addRandomObject()">➕ 添加物体</button>
            <button onclick="clearScene()">🧹 清空场景</button>
            <button class="success" onclick="resetScene()">🔄 重置默认</button>
        </div>
    </div>
    
    <div id="status">
        <h4>📊 状态信息</h4>
        <div class="stat"><span>场景物体:</span><span class="stat-value" id="obj-count">0</span></div>
        <div class="stat"><span>存储记录:</span><span class="stat-value" id="record-count">0</span></div>
        <div class="stat"><span>数据库:</span><span class="stat-value" id="db-name">-</span></div>
        <div id="db-status" class="disconnected">未连接</div>
    </div>
    
    <div id="message"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 30, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // 地面
        scene.add(new THREE.GridHelper(100, 20, 0x444444, 0x222222));

        // 物体组
        const objectGroup = new THREE.Group();
        scene.add(objectGroup);

        // IndexedDB 配置
        const DB_NAME = 'ThreeJSScenesDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'scenes';
        let db = null;

        // 初始化 IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => {
                    updateDBStatus(false);
                    reject(request.error);
                };
                
                request.onsuccess = () => {
                    db = request.result;
                    updateDBStatus(true);
                    document.getElementById('db-name').textContent = DB_NAME;
                    refreshStorageList();
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        const store = database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('name', 'name', { unique: false });
                        store.createIndex('timestamp', 'timestamp', { unique: false });
                    }
                };
            });
        }

        // 更新数据库状态显示
        function updateDBStatus(connected) {
            const statusEl = document.getElementById('db-status');
            if (connected) {
                statusEl.textContent = '已连接';
                statusEl.className = 'connected';
            } else {
                statusEl.textContent = '未连接';
                statusEl.className = 'disconnected';
            }
        }

        // 序列化场景
        function serializeScene() {
            const objects = [];
            objectGroup.children.forEach(child => {
                objects.push({
                    type: child.geometry.type,
                    position: child.position.toArray(),
                    rotation: child.rotation.toArray(),
                    scale: child.scale.toArray(),
                    color: child.material.color.getHex(),
                    name: child.name
                });
            });
            return objects;
        }

        // 反序列化场景
        function deserializeScene(data) {
            clearScene();
            
            const geometries = {
                'BoxGeometry': () => new THREE.BoxGeometry(4, 4, 4),
                'SphereGeometry': () => new THREE.SphereGeometry(2.5, 32, 32),
                'ConeGeometry': () => new THREE.ConeGeometry(2.5, 5, 32),
                'CylinderGeometry': () => new THREE.CylinderGeometry(2, 2, 5, 32),
                'TorusGeometry': () => new THREE.TorusGeometry(3, 1, 16, 100),
                'OctahedronGeometry': () => new THREE.OctahedronGeometry(3),
                'DodecahedronGeometry': () => new THREE.DodecahedronGeometry(3)
            };
            
            data.forEach(objData => {
                const geometry = geometries[objData.type] ? geometries[objData.type]() : new THREE.BoxGeometry(4, 4, 4);
                const material = new THREE.MeshPhongMaterial({ color: objData.color });
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.fromArray(objData.position);
                mesh.rotation.fromArray(objData.rotation);
                mesh.scale.fromArray(objData.scale);
                mesh.name = objData.name;
                
                objectGroup.add(mesh);
            });
            
            updateObjectCount();
        }

        // 保存场景
        window.saveScene = async function() {
            const name = document.getElementById('sceneName').value.trim() || '未命名场景';
            
            if (!db) {
                showMessage('数据库未连接', true);
                return;
            }
            
            const sceneData = {
                name: name,
                timestamp: Date.now(),
                data: serializeScene()
            };
            
            try {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                await new Promise((resolve, reject) => {
                    const request = store.add(sceneData);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
                
                showMessage('场景保存成功！');
                document.getElementById('sceneName').value = '';
                refreshStorageList();
            } catch (error) {
                showMessage('保存失败：' + error.message, true);
            }
        };

        // 加载场景
        window.loadScene = async function(id) {
            if (!db) return;
            
            try {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const data = await new Promise((resolve, reject) => {
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
                
                if (data) {
                    deserializeScene(data.data);
                    showMessage(`已加载：${data.name}`);
                }
            } catch (error) {
                showMessage('加载失败：' + error.message, true);
            }
        };

        // 删除场景
        window.deleteScene = async function(id) {
            if (!db) return;
            
            try {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                await new Promise((resolve, reject) => {
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
                
                showMessage('已删除');
                refreshStorageList();
            } catch (error) {
                showMessage('删除失败：' + error.message, true);
            }
        };

        // 刷新存储列表
        async function refreshStorageList() {
            if (!db) return;
            
            try {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const data = await new Promise((resolve, reject) => {
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
                
                const listEl = document.getElementById('storage-list');
                listEl.innerHTML = '';
                
                data.reverse().forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'storage-item';
                    const date = new Date(item.timestamp).toLocaleDateString();
                    div.innerHTML = `
                        <span class="name">${item.name}</span>
                        <span class="date">${date}</span>
                        <button onclick="loadScene(${item.id})">加载</button>
                        <button class="danger" onclick="deleteScene(${item.id})">删除</button>
                    `;
                    listEl.appendChild(div);
                });
                
                document.getElementById('record-count').textContent = data.length;
            } catch (error) {
                console.error('刷新列表失败:', error);
            }
        }

        // 清空所有场景
        window.clearAllScenes = async function() {
            if (!db) return;
            if (!confirm('确定要清空所有保存的场景吗？')) return;
            
            try {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                await new Promise((resolve, reject) => {
                    const request = store.clear();
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
                
                showMessage('已清空所有场景');
                refreshStorageList();
            } catch (error) {
                showMessage('清空失败：' + error.message, true);
            }
        };

        // 添加随机物体
        window.addRandomObject = function() {
            const geometries = [
                new THREE.BoxGeometry(4, 4, 4),
                new THREE.SphereGeometry(2.5, 32, 32),
                new THREE.ConeGeometry(2.5, 5, 32),
                new THREE.CylinderGeometry(2, 2, 5, 32),
                new THREE.TorusGeometry(3, 1, 16, 100),
                new THREE.OctahedronGeometry(3),
                new THREE.DodecahedronGeometry(3)
            ];
            
            const colors = [0xff6b6b, 0x4ecdc4, 0xffd93d, 0x9b59b6, 0x1abc9c, 0xe74c3c, 0x3498db];
            
            const geometry = geometries[Math.floor(Math.random() * geometries.length)];
            const material = new THREE.MeshPhongMaterial({
                color: colors[Math.floor(Math.random() * colors.length)]
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(
                (Math.random() - 0.5) * 40,
                2 + Math.random() * 5,
                (Math.random() - 0.5) * 40
            );
            mesh.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            mesh.name = 'Object_' + objectGroup.children.length;
            
            objectGroup.add(mesh);
            updateObjectCount();
        };

        // 清空场景
        window.clearScene = function() {
            while(objectGroup.children.length > 0) {
                objectGroup.remove(objectGroup.children[0]);
            }
            updateObjectCount();
        };

        // 重置场景
        window.resetScene = function() {
            window.clearScene();
            
            // 添加默认物体
            const defaults = [
                { type: 'BoxGeometry', color: 0xff6b6b, pos: [0, 2, 0], name: 'Box' },
                { type: 'SphereGeometry', color: 0x4ecdc4, pos: [8, 2.5, 0], name: 'Sphere' },
                { type: 'ConeGeometry', color: 0xffd93d, pos: [-8, 2.5, 0], name: 'Cone' }
            ];
            
            const geometries = {
                'BoxGeometry': new THREE.BoxGeometry(4, 4, 4),
                'SphereGeometry': new THREE.SphereGeometry(2.5, 32, 32),
                'ConeGeometry': new THREE.ConeGeometry(2.5, 5, 32)
            };
            
            defaults.forEach(def => {
                const material = new THREE.MeshPhongMaterial({ color: def.color });
                const mesh = new THREE.Mesh(geometries[def.type], material);
                mesh.position.set(...def.pos);
                mesh.name = def.name;
                objectGroup.add(mesh);
            });
            
            updateObjectCount();
            showMessage('场景已重置');
        };

        // 更新物体数量
        function updateObjectCount() {
            document.getElementById('obj-count').textContent = objectGroup.children.length;
        }

        // 显示消息
        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.borderLeft = isError ? '4px solid #ff6b6b' : '4px solid #4a9eff';
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // 初始化
        initDB().catch(err => console.error('数据库初始化失败:', err));
        window.resetScene();

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到 window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
    </script>

    <!-- 截图支持脚本 -->
    <script>
        let _screenshotRenderer;
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) _screenshotRenderer = window.renderer;
                    if (!_screenshotRenderer) throw new Error('渲染器未初始化');
                    if (window.scene && window.camera) _screenshotRenderer.render(window.scene, window.camera);
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: tempCanvas.toDataURL('image/jpeg', quality) }, '*');
                } catch (error) {
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
