<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="栅格网格 - 展示动态栅格网格效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 栅格网格</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = new THREE.Scene();

        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10000);
        window.camera.position.set(5, 5, 5);

        window.renderer = new THREE.WebGLRenderer({
            antialias: true,
            logarithmicDepthBuffer: true,
        });
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const grid = new THREE.GridHelper(100);
        window.scene.add(grid);

        const light = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(light);

        const geometry = new THREE.PlaneGeometry(10, 10, 100, 100);

        const vertexShader = `
            varying vec2 vUv;

            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float iTime;
            varying vec2 vUv;
            #define PI 3.14159

            vec3 palette(float t) {
                vec3 a = vec3(0.5, 0.5, 0.5);
                vec3 b = vec3(0.5, 0.5, 0.5);
                vec3 c = vec3(1.0, 1.0, 1.0);
                vec3 d = vec3(0.263, 0.416, 0.557);

                return a + b * cos(PI * 2.0 * (c * t + d));
            }

            vec4 mainImage() {
                vec3 finalColor = vec3(0.0);
                vec2 uuv = vUv * 2.0 - 1.0;
                vec2 uv = vUv * 2.0 - 1.0;
                for(float i = 0.0; i < 4.0; i++) {
                    uv = fract(uv * 1.5) - 0.5;
                    float d = length(uv) * exp(-length(uuv));

                    vec3 col = palette(length(uuv) + i * 0.4 + iTime * 0.4);

                    d = sin(d * 8.0 + iTime) / 8.0;
                    d = abs(d);

                    d = pow(0.01 / d, 1.2);

                    finalColor += col * d;
                }
                return vec4(finalColor, 1.0);
            }

            void main() {
                gl_FragColor = mainImage();
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                iTime: {
                    value: 0,
                },
            },
            side: THREE.DoubleSide,
        });

        const plane = new THREE.Mesh(geometry, material);
        window.scene.add(plane);

        function animate(time) {
            controls.update();
            material.uniforms.iTime.value = time / 1000;
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
