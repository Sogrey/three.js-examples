<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示火焰效果，使用着色器实现动态火焰" />
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 火焰</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 0.6);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.renderer.setSize(w, h);
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
            uniforms.iResolution.value.set(w, h);
        });

        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const geometry = new THREE.PlaneGeometry(1, 1);

        const material = new THREE.ShaderMaterial({
            uniforms,
            transparent: true,
            side: THREE.DoubleSide,
            vertexShader: `
                varying vec3 vPosition;
                varying vec2 vUv;
                void main() { 
                    vUv = uv; 
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                const float PI = 3.14159265359; 

                uniform float iTime;
                uniform vec2 iResolution; 

                varying vec2 vUv;

                vec3 firePalette(float i) {
                    float T = 1400.0 + 1300.0 * i;
                    vec3 L = vec3(7.4, 5.6, 4.4);
                    L = pow(L, vec3(5)) * (exp(1.43876719683e5 / (T * L)) - 1.0);
                    return 1.0 - exp(-5e8 / L);
                } 

                vec3 hash33(vec3 p) { 
                    float n = sin(dot(p, vec3(7, 157, 113)));    
                    return fract(vec3(2097152.0, 262144.0, 32768.0) * n); 
                }

                float voronoi(vec3 p) {
                    vec3 b, r, g = floor(p);
                    p = fract(p);

                    float d = 1.0;  
                    for(int j = -1; j <= 1; j++) {
                        for(int i = -1; i <= 1; i++) {
                            b = vec3(float(i), float(j), -1.0);
                            r = b - p + hash33(g + b);
                            d = min(d, dot(r, r));

                            b.z = 0.0;
                            r = b - p + hash33(g + b);
                            d = min(d, dot(r, r));

                            b.z = 1.0;
                            r = b - p + hash33(g + b);
                            d = min(d, dot(r, r));
                        }
                    }

                    return d;
                }

                float noiseLayers(in vec3 p) {
                    vec3 t = vec3(0.0, 0.0, p.z + iTime * 1.5);

                    const int iter = 5;
                    float tot = 0.0, sum = 0.0, amp = 1.0;

                    for (int i = 0; i < iter; i++) {
                        tot += voronoi(p + t) * amp;
                        p *= 2.0;
                        t *= 1.5;
                        sum += amp;
                        amp *= 0.5;
                    }

                    return tot / sum;
                }

                float distanceTo(vec2 src, vec2 dst) {
                    float dx = src.x - dst.x;
                    float dy = src.y - dst.y;
                    float dv = dx * dx + dy * dy;
                    return sqrt(dv);
                }

                void main() { 
                    float len = distanceTo(vec2(0.5, 0.5), vec2(vUv.x, vUv.y)) * 2.0;  
                    vec2 uv = (vUv - 0.5) * 2.0;

                    uv += vec2(sin(iTime * 0.5) * 0.25, cos(iTime * 0.5) * 0.125);

                    vec3 rd = normalize(vec3(uv.x, uv.y, 3.1415926535898 / 8.0));

                    float cs = cos(iTime * 0.25), si = sin(iTime * 0.25); 
                    rd.xy = rd.xy * mat2(cs, -si, si, cs);  
                    float c = noiseLayers(rd * 2.0);

                    c = max(c + dot(hash33(rd) * 2.0 - 1.0, vec3(0.015)), 0.0);

                    c *= sqrt(c) * 1.5;
                    vec3 col = firePalette(c);
                    col = mix(col, col.zyx * 0.15 + c * 0.85, min(pow(dot(rd.xy, rd.xy) * 1.2, 1.5), 1.0));
                    col = pow(col, vec3(1.25));

                    gl_FragColor = vec4(sqrt(clamp(col, 0.0, 1.0)), 1.0 - pow(len, 2.0));
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        window.scene.add(mesh);

        function animate() {
            uniforms.iTime.value += 0.01;
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
