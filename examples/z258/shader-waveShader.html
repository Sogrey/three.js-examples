<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js图像波动示例 - 使用ShaderMaterial实现图像波动动画效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 图像波动</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // 场景设置
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        window.camera.position.set(0, 0, 3);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 创建程序纹理（条纹图案）
        function createStripedTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // 绘制背景
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, 512, 256);
            
            // 绘制条纹
            for (let i = 0; i < 20; i++) {
                const x = (i / 20) * 512;
                const hue = (i / 20) * 360;
                ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                ctx.fillRect(x, 0, 512 / 20 - 2, 256);
            }
            
            // 添加文字
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('WAVE SHADER', 256, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        const texture = createStripedTexture();

        // 波动着色器材质
        const waveMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                uniform float uTime;
                uniform float uFrequency;
                uniform float uAmplitude;
                
                varying vec2 vUv;
                
                void main() {
                    vUv = uv;
                    
                    vec4 modelPosition = modelMatrix * vec4(position, 1.0);
                    
                    // 正弦波动效果
                    float wave1 = sin((modelPosition.x + uTime) * uFrequency) * uAmplitude;
                    float wave2 = sin((modelPosition.y + uTime * 0.8) * uFrequency * 1.5) * uAmplitude * 0.5;
                    
                    modelPosition.z += wave1 + wave2;
                    
                    gl_Position = projectionMatrix * viewMatrix * modelPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D uTexture;
                uniform float uOpacity;
                
                varying vec2 vUv;
                
                void main() {
                    vec4 textureColor = texture2D(uTexture, vUv);
                    gl_FragColor = vec4(textureColor.rgb, textureColor.a * uOpacity);
                }
            `,
            side: THREE.DoubleSide,
            transparent: true,
            uniforms: {
                uTime: { value: 0 },
                uTexture: { value: texture },
                uFrequency: { value: 10.0 },
                uAmplitude: { value: 0.05 },
                uOpacity: { value: 1.0 }
            }
        });

        // 创建平面
        const planeGeometry = new THREE.PlaneGeometry(2, 1, 128, 128);
        const plane = new THREE.Mesh(planeGeometry, waveMaterial);
        window.scene.add(plane);

        // 添加边框线
        const edges = new THREE.EdgesGeometry(planeGeometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 });
        const wireframe = new THREE.LineSegments(edges, lineMaterial);
        plane.add(wireframe);

        // GUI 控制
        const params = {
            frequency: 10.0,
            amplitude: 0.05,
            speed: 1.0,
            opacity: 1.0
        };

        const gui = new GUI();
        gui.domElement.style.marginTop = '50px';

        gui.add(params, 'frequency', 1.0, 30.0, 0.1).name('频率').onChange(value => {
            waveMaterial.uniforms.uFrequency.value = value;
        });

        gui.add(params, 'amplitude', 0.01, 0.2, 0.01).name('振幅').onChange(value => {
            waveMaterial.uniforms.uAmplitude.value = value;
        });

        gui.add(params, 'speed', 0.1, 3.0, 0.1).name('速度');

        gui.add(params, 'opacity', 0.1, 1.0, 0.01).name('透明度').onChange(value => {
            waveMaterial.uniforms.uOpacity.value = value;
        });

        // 窗口大小变化
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            waveMaterial.uniforms.uTime.value += 0.01 * params.speed;
            
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
