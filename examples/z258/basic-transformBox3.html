<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="变换Box3 - Three.js包围盒变换示例">
    <title>变换Box3 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 240px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
        #info {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 4px;
            font-size: 11px; line-height: 1.6;
        }
        #info span { color: #4a9eff; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>📦 变换Box3</h3>
        <div class="control-group">
            <label>缩放 X <span class="value" id="scaleXValue">1.0</span></label>
            <input type="range" id="scaleX" min="0.5" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>缩放 Y <span class="value" id="scaleYValue">1.0</span></label>
            <input type="range" id="scaleY" min="0.5" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>缩放 Z <span class="value" id="scaleZValue">1.0</span></label>
            <input type="range" id="scaleZ" min="0.5" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>旋转 Y <span class="value" id="rotateYValue">0°</span></label>
            <input type="range" id="rotateY" min="0" max="360" step="5" value="0">
        </div>
        <button id="btnToggleBox">👁️ 切换包围盒</button>
        <button id="btnToggleSphere">👁️ 切换包围球</button>
        <button id="btnReset">🔄 重置变换</button>
    </div>

    <div id="info">
        <div>Box3 最小点: <span id="boxMin">-</span></div>
        <div>Box3 最大点: <span id="boxMax">-</span></div>
        <div>Box3 中心: <span id="boxCenter">-</span></div>
        <div>Box3 尺寸: <span id="boxSize">-</span></div>
        <div>包围球 半径: <span id="sphereRadius">-</span></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 8);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 创建组合物体
        const group = new THREE.Group();
        
        // 主体
        const mainGeometry = new THREE.BoxGeometry(2, 2, 2);
        const mainMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4a9eff,
            roughness: 0.3,
            metalness: 0.5
        });
        const mainMesh = new THREE.Mesh(mainGeometry, mainMaterial);
        mainMesh.castShadow = true;
        group.add(mainMesh);

        // 附加部件1
        const part1Geometry = new THREE.CylinderGeometry(0.5, 0.5, 3, 16);
        const part1Material = new THREE.MeshStandardMaterial({ 
            color: 0xff6b6b,
            roughness: 0.4
        });
        const part1 = new THREE.Mesh(part1Geometry, part1Material);
        part1.position.set(1.5, 0, 0);
        part1.rotation.z = Math.PI / 2;
        part1.castShadow = true;
        group.add(part1);

        // 附加部件2
        const part2Geometry = new THREE.SphereGeometry(0.8, 32, 32);
        const part2Material = new THREE.MeshStandardMaterial({ 
            color: 0x4ecdc4,
            roughness: 0.2,
            metalness: 0.3
        });
        const part2 = new THREE.Mesh(part2Geometry, part2Material);
        part2.position.set(-1.5, 1, 0);
        part2.castShadow = true;
        group.add(part2);

        // 附加部件3
        const part3Geometry = new THREE.ConeGeometry(0.6, 2, 16);
        const part3Material = new THREE.MeshStandardMaterial({ 
            color: 0xffe66d,
            roughness: 0.5
        });
        const part3 = new THREE.Mesh(part3Geometry, part3Material);
        part3.position.set(0, 0, 1.5);
        part3.castShadow = true;
        group.add(part3);

        scene.add(group);

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a4a,
            roughness: 0.8 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -3;
        ground.receiveShadow = true;
        scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(30, 30, 0x4a4a6a, 0x3a3a5a);
        gridHelper.position.y = -2.99;
        scene.add(gridHelper);

        // Box3 包围盒可视化
        const box3 = new THREE.Box3();
        const boxHelper = new THREE.Box3Helper(box3, 0x00ff00);
        boxHelper.visible = false;
        scene.add(boxHelper);

        // 包围球可视化
        const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xff00ff, 
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const sphereMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphereMesh.visible = false;
        scene.add(sphereMesh);

        // 配置
        const config = {
            scaleX: 1,
            scaleY: 1,
            scaleZ: 1,
            rotateY: 0,
            showBox: false,
            showSphere: false
        };

        // 更新 Box3
        function updateBox3() {
            // 计算世界坐标系下的包围盒
            box3.setFromObject(group);
            
            // 更新可视化
            boxHelper.updateMatrixWorld();
            
            // 计算包围球
            const sphere = new THREE.Sphere();
            box3.getBoundingSphere(sphere);
            
            sphereMesh.position.copy(sphere.center);
            sphereMesh.scale.setScalar(sphere.radius);
            
            // 更新信息显示
            const min = box3.min;
            const max = box3.max;
            const center = new THREE.Vector3();
            box3.getCenter(center);
            const size = new THREE.Vector3();
            box3.getSize(size);
            
            document.getElementById('boxMin').textContent = 
                `(${min.x.toFixed(2)}, ${min.y.toFixed(2)}, ${min.z.toFixed(2)})`;
            document.getElementById('boxMax').textContent = 
                `(${max.x.toFixed(2)}, ${max.y.toFixed(2)}, ${max.z.toFixed(2)})`;
            document.getElementById('boxCenter').textContent = 
                `(${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`;
            document.getElementById('boxSize').textContent = 
                `${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`;
            document.getElementById('sphereRadius').textContent = 
                sphere.radius.toFixed(2);
        }

        // 应用变换
        function applyTransform() {
            group.scale.set(config.scaleX, config.scaleY, config.scaleZ);
            group.rotation.y = config.rotateY * Math.PI / 180;
            updateBox3();
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('scaleX').addEventListener('input', (e) => {
            config.scaleX = parseFloat(e.target.value);
            document.getElementById('scaleXValue').textContent = config.scaleX.toFixed(1);
            applyTransform();
        });

        document.getElementById('scaleY').addEventListener('input', (e) => {
            config.scaleY = parseFloat(e.target.value);
            document.getElementById('scaleYValue').textContent = config.scaleY.toFixed(1);
            applyTransform();
        });

        document.getElementById('scaleZ').addEventListener('input', (e) => {
            config.scaleZ = parseFloat(e.target.value);
            document.getElementById('scaleZValue').textContent = config.scaleZ.toFixed(1);
            applyTransform();
        });

        document.getElementById('rotateY').addEventListener('input', (e) => {
            config.rotateY = parseInt(e.target.value);
            document.getElementById('rotateYValue').textContent = config.rotateY + '°';
            applyTransform();
        });

        document.getElementById('btnToggleBox').addEventListener('click', () => {
            config.showBox = !config.showBox;
            boxHelper.visible = config.showBox;
            document.getElementById('btnToggleBox').textContent = 
                config.showBox ? '🙈 隐藏包围盒' : '👁️ 显示包围盒';
        });

        document.getElementById('btnToggleSphere').addEventListener('click', () => {
            config.showSphere = !config.showSphere;
            sphereMesh.visible = config.showSphere;
            document.getElementById('btnToggleSphere').textContent = 
                config.showSphere ? '🙈 隐藏包围球' : '👁️ 显示包围球';
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            config.scaleX = 1;
            config.scaleY = 1;
            config.scaleZ = 1;
            config.rotateY = 0;
            
            document.getElementById('scaleX').value = 1;
            document.getElementById('scaleY').value = 1;
            document.getElementById('scaleZ').value = 1;
            document.getElementById('rotateY').value = 0;
            
            document.getElementById('scaleXValue').textContent = '1.0';
            document.getElementById('scaleYValue').textContent = '1.0';
            document.getElementById('scaleZValue').textContent = '1.0';
            document.getElementById('rotateYValue').textContent = '0°';
            
            applyTransform();
        });

        // 初始化
        updateBox3();
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
