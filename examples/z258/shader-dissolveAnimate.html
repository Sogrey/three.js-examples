<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="溶解动画 - 展示基于Y轴的溶解效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 溶解动画</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(15, 5, 15);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.addEventListener('resize', onWindowResize);

        const dissolveMap = createNoiseTexture();
        const textureLoader = new THREE.TextureLoader();
        
        const params = {
            flag: true
        };

        const uniforms = {
            dissolveMap: { value: dissolveMap },
            texture2: { value: null },
            time: { value: 0 },
            flag: { value: params.flag }
        };

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                varying vec2 vUv;
                varying vec3 worldPos;
                void main() {
                    vUv = uv;
                    worldPos = (modelMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                varying vec3 worldPos;
                uniform sampler2D dissolveMap;
                uniform sampler2D texture2;
                uniform float time;
                uniform bool flag;

                void main() {
                    float bottom = -2.0;
                    float top = 2.0;
                    float yScale = (worldPos.y - bottom) / (top - bottom);

                    vec4 color = texture2D(texture2, vUv);

                    float t;
                    if(flag) {
                        t = fract(time);
                    } else {
                        t = 1.0 - fract(time);
                    }

                    float h = texture2D(dissolveMap, vUv).r;
                    float dissolveWidth = 4.0;

                    float condition_if_1 = step(h + yScale * dissolveWidth, t * (dissolveWidth + 1.0) + 0.04);
                    float condition_if_2 = step(h + yScale * dissolveWidth, t * (dissolveWidth + 1.0));
                    color = mix(color, vec4(1.0, 1.0, 0.0, 1.0), condition_if_1);
                    color = color * (1.0 - condition_if_2);

                    gl_FragColor = color;
                }
            `,
            transparent: true,
            depthWrite: false
        });

        const geometry = new THREE.BoxGeometry(4, 4, 4);
        const cube = new THREE.Mesh(geometry, shaderMaterial);
        window.scene.add(cube);

        const axisHelper = new THREE.AxesHelper(10);
        window.scene.add(axisHelper);

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.add(params, 'flag').name('正向溶解').onChange((val) => {
            shaderMaterial.uniforms.flag.value = val;
        });

        textureLoader.load('../../images/textures/15-30-11-41_1280.jpg', (texture) => {
            shaderMaterial.uniforms.texture2.value = texture;
        }, undefined, () => {
            shaderMaterial.uniforms.texture2.value = createProceduralTexture();
        });

        function createNoiseTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(256, 256);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random();
                data[i] = noise * 255;
                data[i + 1] = noise * 255;
                data[i + 2] = noise * 255;
                data[i + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createProceduralTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#4ecdc4');
            gradient.addColorStop(1, '#45b7d1');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const radius = Math.random() * 30 + 10;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        function animate() {
            shaderMaterial.uniforms.time.value += 0.02;
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
