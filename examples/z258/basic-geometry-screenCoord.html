<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示三维坐标转屏幕坐标的方法，将3D物体位置映射到2D屏幕坐标。">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 三维转屏幕坐标</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;
        let controls;
        const list = [];

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x1a1a2e);

            window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            window.camera.position.set(10, 10, 10);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;

            window.scene.add(new THREE.AxesHelper(50));

            const R = () => Math.random() * 10 - 5;

            for (let i = 0; i < 30; i++) {
                const div = createDom('D' + i);

                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.3, 0.3, 0.3),
                    new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff })
                );

                mesh.position.set(R(), R(), R());

                window.scene.add(mesh);

                mesh.div = div;

                list.push(mesh);
            }

            animate();
        }

        function updateCSS2DVisibility() {
            list.forEach(mesh => {
                const worldPosition = mesh.getWorldPosition(new THREE.Vector3());
                worldPosition.project(window.camera);

                const width = window.renderer.domElement.clientWidth;
                const height = window.renderer.domElement.clientHeight;

                const screenX = (worldPosition.x + 1) / 2 * width;
                const screenY = (-worldPosition.y + 1) / 2 * height;

                mesh.div.style.left = screenX + 'px';
                mesh.div.style.top = screenY + 'px';
            });
        }

        function animate() {
            updateCSS2DVisibility();
            if (controls) controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function createDom(text) {
            const div = document.createElement('div');
            div.style.position = 'absolute';
            div.style.width = '50px';
            div.style.height = '50px';
            div.style.backgroundColor = 'rgba(255, 100, 100, 0.8)';
            div.style.borderRadius = '50%';
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.justifyContent = 'center';
            div.style.fontSize = '12px';
            div.style.color = 'white';
            div.style.fontWeight = 'bold';
            div.style.pointerEvents = 'none';
            div.style.zIndex = '100';
            div.innerHTML = text;
            document.body.appendChild(div);
            return div;
        }

        init();
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
