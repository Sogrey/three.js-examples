<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="新年快乐庆祝场景，包含3D文字和烟花粒子效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 新年快乐</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #yearUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
        }
        #yearUI h3 {
            margin: 0 0 10px 0;
            color: #ffd700;
            font-size: 16px;
        }
        #yearUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        #yearUI .btn:hover {
            background: #444;
            border-color: #ffd700;
        }
        #yearUI .info {
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="yearUI">
        <h3>🎊 新年快乐</h3>
        <button class="btn" id="btnFirework">发射烟花</button>
        <button class="btn" id="btnAuto">自动庆祝</button>
        <button class="btn" id="btnColor">切换主题色</button>
        <div class="info">
            左键拖拽旋转<br>
            滚轮缩放<br>
            点击发射烟花
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 20, 150);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 40);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        const spotLight = new THREE.SpotLight(0xffd700, 1);
        spotLight.position.set(0, 50, 0);
        spotLight.angle = Math.PI / 3;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);
        
        // 主题色
        const themes = [
            { primary: 0xffd700, secondary: 0xff6b6b, accent: 0x4ecdc4 }, // 金红青
            { primary: 0xff1493, secondary: 0x00ff7f, accent: 0xffd700 }, // 粉绿金
            { primary: 0x00bfff, secondary: 0xff69b4, accent: 0x7fff00 }, // 蓝粉绿
            { primary: 0xff4500, secondary: 0x1e90ff, accent: 0xffd700 }, // 橙蓝金
        ];
        let currentTheme = 0;
        
        // 创建文字纹理
        function createTextTexture(text, color, fontSize = 100) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // 背景透明
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 文字
            ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 发光效果
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = color;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            return new THREE.CanvasTexture(canvas);
        }
        
        // 创建3D文字
        function create3DText(text, y, scale = 1) {
            const texture = createTextTexture(text, '#ffd700');
            const geometry = new THREE.PlaneGeometry(20 * scale, 5 * scale);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = y;
            return mesh;
        }
        
        // 添加文字
        const yearText = create3DText('2026', 12, 1.2);
        scene.add(yearText);
        
        const happyText = create3DText('新年快乐', 6, 1);
        scene.add(happyText);
        
        const blessingText = create3DText('万事如意 · 阖家幸福', 2, 0.6);
        scene.add(blessingText);
        
        // 创建地面
        const floorGeometry = new THREE.CircleGeometry(50, 64);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // 创建装饰灯笼
        function createLantern(x, z, color) {
            const group = new THREE.Group();
            
            // 灯笼主体
            const geometry = new THREE.SphereGeometry(1.5, 32, 32);
            geometry.scale(1, 1.3, 1);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3,
                roughness: 0.3
            });
            const lantern = new THREE.Mesh(geometry, material);
            lantern.castShadow = true;
            group.add(lantern);
            
            // 灯笼顶部
            const topGeometry = new THREE.CylinderGeometry(0.8, 1.2, 0.5, 32);
            const topMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 1.8;
            group.add(top);
            
            // 灯笼底部
            const bottomGeometry = new THREE.CylinderGeometry(1.2, 0.8, 0.5, 32);
            const bottom = new THREE.Mesh(bottomGeometry, topMaterial);
            bottom.position.y = -1.8;
            group.add(bottom);
            
            // 悬挂线
            const lineGeometry = new THREE.CylinderGeometry(0.05, 0.05, 5, 8);
            const lineMaterial = new THREE.MeshBasicMaterial({ color: 0x8b4513 });
            const line = new THREE.Mesh(lineGeometry, lineMaterial);
            line.position.y = 4.25;
            group.add(line);
            
            // 点光源
            const light = new THREE.PointLight(color, 0.5, 10);
            light.position.y = 0;
            group.add(light);
            
            group.position.set(x, 8, z);
            return group;
        }
        
        // 添加灯笼
        const lanterns = [];
        const lanternColors = [0xff0000, 0xffd700, 0xff69b4, 0x00ff7f];
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const x = Math.sin(angle) * 25;
            const z = Math.cos(angle) * 25;
            const lantern = createLantern(x, z, lanternColors[i % lanternColors.length]);
            scene.add(lantern);
            lanterns.push(lantern);
        }
        
        // 烟花粒子系统
        class Firework {
            constructor(x, y, z, color) {
                this.particles = [];
                this.exploded = false;
                this.color = new THREE.Color(color);
                
                // 发射火箭
                this.rocket = {
                    position: new THREE.Vector3(x, 0, z),
                    velocity: new THREE.Vector3(0, 15 + Math.random() * 10, 0),
                    mesh: this.createRocketMesh(color)
                };
                scene.add(this.rocket.mesh);
                
                this.targetHeight = y;
            }
            
            createRocketMesh(color) {
                const geometry = new THREE.SphereGeometry(0.3, 8, 8);
                const material = new THREE.MeshBasicMaterial({ color: color });
                return new THREE.Mesh(geometry, material);
            }
            
            createParticle(position, color) {
                const geometry = new THREE.SphereGeometry(0.15, 6, 6);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.copy(position);
                
                // 随机速度方向
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 3 + Math.random() * 5;
                
                const velocity = new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * speed,
                    Math.sin(phi) * Math.sin(theta) * speed,
                    Math.cos(phi) * speed
                );
                
                scene.add(mesh);
                
                return {
                    mesh: mesh,
                    velocity: velocity,
                    life: 1.0,
                    decay: 0.01 + Math.random() * 0.01
                };
            }
            
            explode() {
                this.exploded = true;
                scene.remove(this.rocket.mesh);
                
                // 创建爆炸粒子
                const particleCount = 50 + Math.floor(Math.random() * 50);
                for (let i = 0; i < particleCount; i++) {
                    // 随机颜色变化
                    const hue = (this.color.getHSL({}).h + (Math.random() - 0.5) * 0.1) % 1;
                    const color = new THREE.Color().setHSL(hue, 1, 0.5);
                    this.particles.push(this.createParticle(this.rocket.position, color));
                }
            }
            
            update(deltaTime) {
                if (!this.exploded) {
                    // 更新火箭
                    this.rocket.velocity.y -= 9.8 * deltaTime;
                    this.rocket.position.add(this.rocket.velocity.clone().multiplyScalar(deltaTime));
                    this.rocket.mesh.position.copy(this.rocket.position);
                    
                    // 到达目标高度或开始下落时爆炸
                    if (this.rocket.velocity.y < 0 || this.rocket.position.y >= this.targetHeight) {
                        this.explode();
                    }
                } else {
                    // 更新粒子
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        
                        // 物理更新
                        p.velocity.y -= 9.8 * deltaTime * 0.3;
                        p.velocity.multiplyScalar(0.98);
                        p.mesh.position.add(p.velocity.clone().multiplyScalar(deltaTime));
                        
                        // 生命周期
                        p.life -= p.decay;
                        p.mesh.material.opacity = p.life;
                        p.mesh.scale.setScalar(p.life);
                        
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            p.mesh.geometry.dispose();
                            p.mesh.material.dispose();
                            this.particles.splice(i, 1);
                        }
                    }
                }
                
                return this.exploded && this.particles.length === 0;
            }
            
            dispose() {
                if (this.rocket.mesh) {
                    scene.remove(this.rocket.mesh);
                    this.rocket.mesh.geometry.dispose();
                    this.rocket.mesh.material.dispose();
                }
            }
        }
        
        const fireworks = [];
        
        function launchFirework(x, z, height, color) {
            fireworks.push(new Firework(x, height, z, color));
        }
        
        // 自动庆祝
        let autoCelebrate = false;
        let autoInterval;
        
        function startAutoCelebrate() {
            autoCelebrate = !autoCelebrate;
            document.getElementById('btnAuto').textContent = autoCelebrate ? '停止庆祝' : '自动庆祝';
            
            if (autoCelebrate) {
                autoInterval = setInterval(() => {
                    const x = (Math.random() - 0.5) * 40;
                    const z = (Math.random() - 0.5) * 40;
                    const height = 20 + Math.random() * 15;
                    const theme = themes[currentTheme];
                    const colors = [theme.primary, theme.secondary, theme.accent];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    launchFirework(x, z, height, color);
                }, 800);
            } else {
                clearInterval(autoInterval);
            }
        }
        
        // UI事件
        document.getElementById('btnFirework').addEventListener('click', () => {
            const x = (Math.random() - 0.5) * 40;
            const z = (Math.random() - 0.5) * 40;
            const height = 20 + Math.random() * 15;
            const theme = themes[currentTheme];
            const colors = [theme.primary, theme.secondary, theme.accent];
            const color = colors[Math.floor(Math.random() * colors.length)];
            launchFirework(x, z, height, color);
        });
        
        document.getElementById('btnAuto').addEventListener('click', startAutoCelebrate);
        
        document.getElementById('btnColor').addEventListener('click', () => {
            currentTheme = (currentTheme + 1) % themes.length;
            const theme = themes[currentTheme];
            
            // 更新聚光灯颜色
            spotLight.color.setHex(theme.primary);
            
            // 更新文字颜色
            yearText.material.map = createTextTexture('2026', '#' + theme.primary.toString(16).padStart(6, '0'));
            yearText.material.needsUpdate = true;
        });
        
        // 鼠标点击发射烟花
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        window.addEventListener('click', (event) => {
            if (event.target.closest('#yearUI')) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObject(floor);
            if (intersects.length > 0) {
                const point = intersects[0].point;
                const height = 20 + Math.random() * 15;
                const theme = themes[currentTheme];
                const colors = [theme.primary, theme.secondary, theme.accent];
                const color = colors[Math.floor(Math.random() * colors.length)];
                launchFirework(point.x, point.z, height, color);
            }
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // 旋转灯笼
            lanterns.forEach((lantern, i) => {
                lantern.rotation.y = Math.sin(time + i) * 0.1;
                lantern.position.y = 8 + Math.sin(time * 2 + i) * 0.3;
            });
            
            // 文字浮动
            yearText.position.y = 12 + Math.sin(time) * 0.5;
            happyText.position.y = 6 + Math.sin(time * 1.2 + 1) * 0.3;
            blessingText.position.y = 2 + Math.sin(time * 0.8 + 2) * 0.2;
            
            // 更新烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const isDead = fireworks[i].update(delta);
                if (isDead) {
                    fireworks[i].dispose();
                    fireworks.splice(i, 1);
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        // 初始烟花
        setTimeout(() => {
            launchFirework(0, 0, 25, themes[0].primary);
        }, 1000);
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
