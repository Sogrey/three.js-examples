<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="视频碎片效果，展示视频碎片化动画">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 视频碎片</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #000;
            margin: 0;
            overflow: hidden;
        }
        #videoUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #videoUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #videoUI .control {
            margin: 10px 0;
        }
        #videoUI label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #videoUI input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #videoUI .value {
            font-size: 10px;
            color: #00ff00;
            text-align: right;
        }
        #videoUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #videoUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #videoUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #videoUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    <div id="loading">加载视频中...</div>
    
    <div id="videoUI">
        <h3>🎬 视频碎片</h3>
        <div class="control">
            <label>水平分割</label>
            <input type="range" id="xGrid" min="2" max="8" value="4" step="1">
            <div class="value" id="xGridValue">4</div>
        </div>
        <div class="control">
            <label>垂直分割</label>
            <input type="range" id="yGrid" min="2" max="6" value="3" step="1">
            <div class="value" id="yGridValue">3</div>
        </div>
        <div class="control">
            <label>碎片间隙</label>
            <input type="range" id="offset" min="0" max="1" value="0.1" step="0.05">
            <div class="value" id="offsetValue">0.10</div>
        </div>
        <div class="control">
            <label>动画强度</label>
            <input type="range" id="animStrength" min="0" max="2" value="1" step="0.1">
            <div class="value" id="animValue">1.0</div>
        </div>
        <button class="btn active" id="btnPlay">播放</button>
        <button class="btn" id="btnPause">暂停</button>
        <button class="btn" id="btnReset">重置碎片</button>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            视频被分割成多个碎片并独立运动
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        const loadingDiv = document.getElementById('loading');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 创建视频元素
        const video = document.createElement('video');
        video.crossOrigin = 'anonymous';
        video.src = '../../images/textures/test.mp4';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        
        // 等待视频加载
        video.addEventListener('loadeddata', () => {
            loadingDiv.style.display = 'none';
            video.play();
            createVideoFragments();
        });
        
        video.addEventListener('error', (e) => {
            loadingDiv.textContent = '视频加载失败';
            console.error('视频加载失败:', e);
        });
        
        // 视频纹理
        let videoTexture;
        let fragmentGroup;
        let clock = new THREE.Clock();
        
        // 配置参数
        let config = {
            width: 16,
            height: 9,
            xGrid: 4,
            yGrid: 3,
            offset: 0.1
        };
        let animStrength = 1;
        
        function createVideoFragments() {
            // 清理旧的碎片
            if (fragmentGroup) {
                scene.remove(fragmentGroup);
                fragmentGroup.children.forEach(child => {
                    child.geometry.dispose();
                    child.material.dispose();
                });
            }
            
            // 创建视频纹理
            if (!videoTexture) {
                videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
            }
            
            fragmentGroup = new THREE.Group();
            
            const ux = 1 / config.xGrid;
            const uy = 1 / config.yGrid;
            const planeWidth = config.width / config.xGrid - config.offset;
            const planeHeight = config.height / config.yGrid - config.offset;
            
            for (let i = 0; i < config.xGrid; i++) {
                for (let j = 0; j < config.yGrid; j++) {
                    const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
                    const material = new THREE.MeshBasicMaterial({
                        map: videoTexture,
                        side: THREE.DoubleSide
                    });
                    
                    // 切割UV实现纹理映射
                    const uvs = geometry.attributes.uv.array;
                    for (let index = 0; index < uvs.length; index += 2) {
                        uvs[index] = (uvs[index] + i) * ux;
                        uvs[index + 1] = (uvs[index + 1] + j) * uy;
                    }
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    // 每个碎片的随机运动参数
                    mesh.dx = 0.004 * (0.5 - Math.random());
                    mesh.dy = 0.004 * (0.5 - Math.random());
                    mesh.dz = 0.002 * (0.5 - Math.random());
                    
                    // 初始位置
                    const x = (i - config.xGrid / 2) * planeWidth + planeWidth * 0.5 + (i * config.offset) / 2;
                    const y = (j - config.yGrid / 2) * planeHeight + planeHeight * 0.5 + (j * config.offset) / 2;
                    mesh.position.set(x, y, 0);
                    
                    // 保存初始位置
                    mesh.initialPosition = mesh.position.clone();
                    mesh.initialRotation = mesh.rotation.clone();
                    
                    fragmentGroup.add(mesh);
                }
            }
            
            scene.add(fragmentGroup);
        }
        
        // UI控制
        const xGridSlider = document.getElementById('xGrid');
        const xGridValueDisplay = document.getElementById('xGridValue');
        const yGridSlider = document.getElementById('yGrid');
        const yGridValueDisplay = document.getElementById('yGridValue');
        const offsetSlider = document.getElementById('offset');
        const offsetValueDisplay = document.getElementById('offsetValue');
        const animStrengthSlider = document.getElementById('animStrength');
        const animValueDisplay = document.getElementById('animValue');
        
        function updateFragments() {
            config.xGrid = parseInt(xGridSlider.value);
            config.yGrid = parseInt(yGridSlider.value);
            config.offset = parseFloat(offsetSlider.value);
            createVideoFragments();
        }
        
        xGridSlider.addEventListener('input', (e) => {
            xGridValueDisplay.textContent = e.target.value;
        });
        xGridSlider.addEventListener('change', updateFragments);
        
        yGridSlider.addEventListener('input', (e) => {
            yGridValueDisplay.textContent = e.target.value;
        });
        yGridSlider.addEventListener('change', updateFragments);
        
        offsetSlider.addEventListener('input', (e) => {
            offsetValueDisplay.textContent = parseFloat(e.target.value).toFixed(2);
        });
        offsetSlider.addEventListener('change', updateFragments);
        
        animStrengthSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            animValueDisplay.textContent = value.toFixed(1);
            animStrength = value;
        });
        
        document.getElementById('btnPlay').addEventListener('click', () => {
            video.play();
            document.getElementById('btnPlay').classList.add('active');
            document.getElementById('btnPause').classList.remove('active');
        });
        
        document.getElementById('btnPause').addEventListener('click', () => {
            video.pause();
            document.getElementById('btnPause').classList.add('active');
            document.getElementById('btnPlay').classList.remove('active');
        });
        
        document.getElementById('btnReset').addEventListener('click', () => {
            if (fragmentGroup) {
                fragmentGroup.children.forEach(mesh => {
                    mesh.position.copy(mesh.initialPosition);
                    mesh.rotation.copy(mesh.initialRotation);
                });
            }
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            if (fragmentGroup && animStrength > 0) {
                const elapsedTime = clock.getElapsedTime();
                
                for (const mesh of fragmentGroup.children) {
                    // 旋转动画
                    mesh.rotation.x += Math.sin(elapsedTime * 0.5) * mesh.dx * animStrength;
                    mesh.rotation.y += Math.sin(elapsedTime * 0.3) * mesh.dy * animStrength;
                    
                    // 位置动画
                    mesh.position.x = mesh.initialPosition.x + Math.sin(elapsedTime * 0.4) * mesh.dx * 10 * animStrength;
                    mesh.position.y = mesh.initialPosition.y + Math.sin(elapsedTime * 0.6) * mesh.dy * 5 * animStrength;
                    mesh.position.z = mesh.initialPosition.z + Math.cos(elapsedTime * 0.3) * mesh.dz * 3 * animStrength;
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
