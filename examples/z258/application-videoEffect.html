<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="视频碎片效果 - 将视频切割成多个碎片并添加动态效果">
    <title>视频碎片 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 200px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🎬 视频碎片</h3>
        <div class="control-group">
            <label>动画速度 <span class="value" id="speedValue">1.0</span></label>
            <input type="range" id="speedRange" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>碎片数量 X <span class="value" id="xGridValue">4</span></label>
            <input type="range" id="xGridRange" min="2" max="8" step="1" value="4">
        </div>
        <div class="control-group">
            <label>碎片数量 Y <span class="value" id="yGridValue">3</span></label>
            <input type="range" id="yGridRange" min="2" max="6" step="1" value="3">
        </div>
        <button id="btnReset">🔄 重置碎片</button>
        <button id="btnPause">⏸️ 暂停/播放</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // 相机
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 20);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 视频元素
        const video = document.createElement('video');
        video.crossOrigin = 'anonymous';
        video.src = '../../images/textures/test.mp4';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;

        // 视频纹理
        let videoTexture = null;
        let group = null;
        let isPaused = false;
        let animationSpeed = 1.0;

        // 配置
        const config = {
            width: 16,
            height: 9,
            xGrid: 4,
            yGrid: 3,
            offset: 0.1
        };

        // 创建碎片
        function createFragments() {
            if (group) {
                scene.remove(group);
                group = null;
            }

            group = new THREE.Group();
            const ux = 1 / config.xGrid;
            const uy = 1 / config.yGrid;
            const planeWidth = config.width / config.xGrid - config.offset;
            const planeHeight = config.height / config.yGrid - config.offset;

            for (let i = 0; i < config.xGrid; i++) {
                for (let j = 0; j < config.yGrid; j++) {
                    const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
                    const material = new THREE.MeshBasicMaterial({
                        map: videoTexture,
                        side: THREE.DoubleSide
                    });

                    // 切割UV实现纹理映射
                    const uvs = geometry.attributes.uv.array;
                    for (let index = 0; index < uvs.length; index += 2) {
                        uvs[index] = (uvs[index] + i) * ux;
                        uvs[index + 1] = (uvs[index + 1] + j) * uy;
                    }

                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.dx = 0.004 * (0.5 - Math.random());
                    mesh.dy = 0.004 * (0.5 - Math.random());

                    const x = (i - config.xGrid / 2) * planeWidth + planeWidth * 0.5 + (i * config.offset) / 2;
                    const y = (j - config.yGrid / 2) * planeHeight + planeHeight * 0.5 + (j * config.offset) / 2;
                    mesh.position.set(x, y, 0);
                    
                    // 保存初始位置
                    mesh.initialPosition = mesh.position.clone();
                    
                    group.add(mesh);
                }
            }
            scene.add(group);
        }

        // 初始化视频
        async function initVideo() {
            await new Promise(resolve => {
                video.onloadeddata = () => {
                    videoTexture = new THREE.VideoTexture(video);
                    videoTexture.minFilter = THREE.LinearFilter;
                    videoTexture.magFilter = THREE.LinearFilter;
                    resolve();
                };
                video.play().catch(e => console.log('视频自动播放被阻止:', e));
            });
            createFragments();
        }

        initVideo();

        // 动画
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused && group) {
                const elapsedTime = clock.getElapsedTime();

                for (const mesh of group.children) {
                    mesh.rotation.x += Math.sin(elapsedTime * 0.1) * mesh.dx * animationSpeed;
                    mesh.rotation.y += Math.sin(elapsedTime * 0.2) * mesh.dy * animationSpeed;

                    mesh.position.x = mesh.initialPosition.x - Math.sin(elapsedTime * 0.1) * mesh.dx * 10 * animationSpeed;
                    mesh.position.y = mesh.initialPosition.y + Math.sin(elapsedTime * 0.3) * mesh.dy * 10 * animationSpeed;
                    mesh.position.z = Math.cos(elapsedTime * 0.2) * mesh.dx * 10 * animationSpeed;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('speedRange').addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = animationSpeed.toFixed(1);
        });

        document.getElementById('xGridRange').addEventListener('input', (e) => {
            config.xGrid = parseInt(e.target.value);
            document.getElementById('xGridValue').textContent = config.xGrid;
            createFragments();
        });

        document.getElementById('yGridRange').addEventListener('input', (e) => {
            config.yGrid = parseInt(e.target.value);
            document.getElementById('yGridValue').textContent = config.yGrid;
            createFragments();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            clock.start();
            createFragments();
        });

        document.getElementById('btnPause').addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                video.pause();
            } else {
                video.play();
            }
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
