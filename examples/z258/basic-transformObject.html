<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js拖拽控制示例 - 使用TransformControls实现物体的平移、旋转、缩放操作">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 拖拽控制</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // 场景设置
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(8, 5, 8);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.shadowMap.enabled = true;
        window.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        window.scene.add(directionalLight);

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        window.scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        window.scene.add(gridHelper);

        // 可控制的对象数组
        const controlObjects = [];

        // 创建彩色立方体
        const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
        const boxMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4488ff,
            roughness: 0.3,
            metalness: 0.7
        });
        const box = new THREE.Mesh(boxGeometry, boxMaterial);
        box.position.set(0, 1, 0);
        box.castShadow = true;
        box.receiveShadow = true;
        box.name = '彩色立方体';
        window.scene.add(box);
        controlObjects.push(box);

        // 创建球体
        const sphereGeometry = new THREE.SphereGeometry(1.2, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff4444,
            roughness: 0.2,
            metalness: 0.8
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(-4, 1.2, 3);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        sphere.name = '红色球体';
        window.scene.add(sphere);
        controlObjects.push(sphere);

        // 创建圆柱体
        const cylinderGeometry = new THREE.CylinderGeometry(0.8, 0.8, 3, 32);
        const cylinderMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x44ff44,
            roughness: 0.4,
            metalness: 0.6
        });
        const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
        cylinder.position.set(4, 1.5, -2);
        cylinder.castShadow = true;
        cylinder.receiveShadow = true;
        cylinder.name = '绿色圆柱';
        window.scene.add(cylinder);
        controlObjects.push(cylinder);

        // 创建圆环
        const torusGeometry = new THREE.TorusGeometry(1.5, 0.4, 16, 100);
        const torusMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffaa00,
            roughness: 0.3,
            metalness: 0.7
        });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.position.set(-3, 1.5, -4);
        torus.rotation.x = Math.PI / 2;
        torus.castShadow = true;
        torus.receiveShadow = true;
        torus.name = '黄色圆环';
        window.scene.add(torus);
        controlObjects.push(torus);

        // 变换控制器
        const transformControls = new TransformControls(window.camera, window.renderer.domElement);
        const transformHelper = transformControls.getHelper();
        window.scene.add(transformHelper);

        // 拖拽时禁用轨道控制
        transformControls.addEventListener('dragging-changed', event => {
            controls.enabled = !event.value;
        });

        // GUI 控制
        const params = {
            mode: 'translate',
            selectedObject: '彩色立方体',
            space: 'world'
        };

        const gui = new GUI();
        gui.domElement.style.marginTop = '50px';

        // 变换模式
        gui.add(params, 'mode', ['translate', 'rotate', 'scale']).name('变换模式').onChange(value => {
            transformControls.setMode(value);
        });

        // 坐标空间
        gui.add(params, 'space', ['world', 'local']).name('坐标空间').onChange(value => {
            transformControls.setSpace(value);
        });

        // 选择对象
        gui.add(params, 'selectedObject', controlObjects.map(obj => obj.name)).name('选择对象').onChange(value => {
            const selected = controlObjects.find(obj => obj.name === value);
            if (selected) {
                transformControls.attach(selected);
            }
        });

        // 初始附加第一个对象
        transformControls.attach(box);

        // 添加操作按钮
        const actionsFolder = gui.addFolder('操作');
        
        actionsFolder.add({
            重置位置: () => {
                const selected = controlObjects.find(obj => obj.name === params.selectedObject);
                if (selected) {
                    selected.position.set(0, selected.geometry.parameters.height / 2 || 1, 0);
                    selected.rotation.set(0, 0, 0);
                    selected.scale.set(1, 1, 1);
                }
            }
        }, '重置位置');

        actionsFolder.add({
            解除控制: () => {
                transformControls.detach();
            }
        }, '解除控制');

        // 窗口大小变化
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
