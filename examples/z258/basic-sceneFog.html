<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js场景雾化示例 - 展示线性雾和指数雾效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 场景雾化</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // 场景设置
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 20, 80);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(50, 100, 50);
        window.scene.add(directionalLight);

        // 创建多个立方体阵列展示雾化效果
        const boxGeometry = new THREE.BoxGeometry(4, 4, 4);
        const boxMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4488ff,
            roughness: 0.4,
            metalness: 0.6
        });

        const boxes = [];
        for (let x = -10; x <= 10; x++) {
            for (let z = -10; z <= 10; z++) {
                const box = new THREE.Mesh(boxGeometry, boxMaterial.clone());
                box.position.set(x * 8, 2, z * 8);
                
                // 根据距离改变颜色
                const distance = Math.sqrt(x * x + z * z);
                const hue = (distance / 15) % 1;
                box.material.color.setHSL(hue, 0.7, 0.5);
                
                window.scene.add(box);
                boxes.push(box);
            }
        }

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(300, 300);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222,
            roughness: 0.9,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        window.scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(300, 60, 0x444444, 0x222222);
        window.scene.add(gridHelper);

        // 雾化设置函数
        function getFog(type, color, near, far, density) {
            window.renderer.setClearColor(color);
            if (type === 'linear') {
                return new THREE.Fog(color, near, far);
            } else {
                return new THREE.FogExp2(color, density);
            }
        }

        // GUI 控制
        const params = {
            enableFog: true,
            fogType: 'exp2',
            fogColor: '#0a0a1a',
            near: 20,
            far: 150,
            density: 0.015
        };

        const gui = new GUI();
        gui.domElement.style.marginTop = '50px';
        
        gui.add(params, 'enableFog').name('启用雾效').onChange(updateFog);
        gui.add(params, 'fogType', ['linear', 'exp2']).name('雾类型').onChange(updateFog);
        gui.addColor(params, 'fogColor').name('雾颜色').onChange(updateFog);
        gui.add(params, 'near', 0, 100).name('近点距离').onChange(updateFog);
        gui.add(params, 'far', 50, 300).name('远点距离').onChange(updateFog);
        gui.add(params, 'density', 0.001, 0.05).name('雾密度').onChange(updateFog);

        function updateFog() {
            if (params.enableFog) {
                window.scene.fog = getFog(
                    params.fogType, 
                    params.fogColor, 
                    params.near, 
                    params.far, 
                    params.density
                );
            } else {
                window.scene.fog = null;
                window.renderer.setClearColor(params.fogColor);
            }
        }

        // 初始化雾效
        updateFog();

        // 窗口大小变化
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
