<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="使用内置几何点绘制面，展示Three.js几何体内部顶点结构">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 绘制面_内置点</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #drawUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #drawUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #drawUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #drawUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #drawUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #drawUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #vertexInfo {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 100;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="drawUI">
        <h3>🎨 绘制面_内置点</h3>
        <button class="btn active" id="btnCube">立方体</button>
        <button class="btn" id="btnSphere">球体</button>
        <button class="btn" id="btnCylinder">圆柱体</button>
        <button class="btn" id="btnTorus">圆环体</button>
        <button class="btn" id="btnIcosahedron">二十面体</button>
        <button class="btn" id="btnPoints">显示顶点</button>
        <button class="btn" id="btnWireframe">线框模式</button>
        <div class="info">
            左键拖拽旋转<br>
            滚轮缩放<br>
            查看几何体内部顶点结构
        </div>
    </div>
    
    <div id="vertexInfo">
        顶点数: 0 | 面数: 0
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // 网格地面
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 几何体定义
        const geometries = {
            cube: {
                name: '立方体',
                create: () => new THREE.BoxGeometry(2, 2, 2, 2, 2, 2)
            },
            sphere: {
                name: '球体',
                create: () => new THREE.SphereGeometry(1.5, 16, 16)
            },
            cylinder: {
                name: '圆柱体',
                create: () => new THREE.CylinderGeometry(1, 1, 3, 16, 4)
            },
            torus: {
                name: '圆环体',
                create: () => new THREE.TorusGeometry(1.5, 0.5, 8, 24)
            },
            icosahedron: {
                name: '二十面体',
                create: () => new THREE.IcosahedronGeometry(1.5, 1)
            }
        };
        
        let currentGeometry = 'cube';
        let mainMesh = null;
        let pointsMesh = null;
        let wireframeMesh = null;
        let showPoints = false;
        let wireframeMode = false;
        
        // 创建几何体
        function createGeometry(type) {
            // 清除旧几何体
            if (mainMesh) {
                scene.remove(mainMesh);
                mainMesh.geometry.dispose();
                mainMesh.material.dispose();
            }
            if (pointsMesh) {
                scene.remove(pointsMesh);
                pointsMesh.geometry.dispose();
                pointsMesh.material.dispose();
            }
            if (wireframeMesh) {
                scene.remove(wireframeMesh);
                wireframeMesh.geometry.dispose();
                wireframeMesh.material.dispose();
            }
            
            const geoConfig = geometries[type];
            const geometry = geoConfig.create();
            
            // 主网格
            const material = new THREE.MeshStandardMaterial({
                color: 0x0088ff,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide,
                wireframe: wireframeMode
            });
            
            mainMesh = new THREE.Mesh(geometry, material);
            mainMesh.position.y = 2;
            mainMesh.castShadow = true;
            scene.add(mainMesh);
            
            // 顶点显示
            if (showPoints) {
                const pointsMaterial = new THREE.PointsMaterial({
                    color: 0xff0000,
                    size: 0.1,
                    sizeAttenuation: true
                });
                pointsMesh = new THREE.Points(geometry, pointsMaterial);
                pointsMesh.position.y = 2;
                scene.add(pointsMesh);
            }
            
            // 线框显示（非线框模式下）
            if (!wireframeMode) {
                const wireframeGeometry = new THREE.WireframeGeometry(geometry);
                const wireframeMaterial = new THREE.LineBasicMaterial({ 
                    color: 0x00ff00,
                    transparent: true,
                    opacity: 0.3
                });
                wireframeMesh = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
                wireframeMesh.position.y = 2;
                scene.add(wireframeMesh);
            }
            
            // 更新信息
            const positions = geometry.attributes.position;
            let faceCount = 0;
            if (geometry.index) {
                faceCount = geometry.index.count / 3;
            } else {
                faceCount = positions.count / 3;
            }
            document.getElementById('vertexInfo').textContent = 
                `${geoConfig.name} - 顶点数: ${positions.count} | 面数: ${Math.floor(faceCount)}`;
        }
        
        // 初始加载
        createGeometry('cube');
        
        // UI事件
        function setActiveButton(id) {
            document.querySelectorAll('#drawUI .btn').forEach(btn => {
                if (btn.id !== 'btnPoints' && btn.id !== 'btnWireframe') {
                    btn.classList.remove('active');
                }
            });
            document.getElementById(id).classList.add('active');
        }
        
        document.getElementById('btnCube').addEventListener('click', () => {
            currentGeometry = 'cube';
            setActiveButton('btnCube');
            createGeometry('cube');
        });
        
        document.getElementById('btnSphere').addEventListener('click', () => {
            currentGeometry = 'sphere';
            setActiveButton('btnSphere');
            createGeometry('sphere');
        });
        
        document.getElementById('btnCylinder').addEventListener('click', () => {
            currentGeometry = 'cylinder';
            setActiveButton('btnCylinder');
            createGeometry('cylinder');
        });
        
        document.getElementById('btnTorus').addEventListener('click', () => {
            currentGeometry = 'torus';
            setActiveButton('btnTorus');
            createGeometry('torus');
        });
        
        document.getElementById('btnIcosahedron').addEventListener('click', () => {
            currentGeometry = 'icosahedron';
            setActiveButton('btnIcosahedron');
            createGeometry('icosahedron');
        });
        
        document.getElementById('btnPoints').addEventListener('click', () => {
            showPoints = !showPoints;
            document.getElementById('btnPoints').classList.toggle('active');
            createGeometry(currentGeometry);
        });
        
        document.getElementById('btnWireframe').addEventListener('click', () => {
            wireframeMode = !wireframeMode;
            document.getElementById('btnWireframe').classList.toggle('active');
            createGeometry(currentGeometry);
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 缓慢旋转
            if (mainMesh) {
                mainMesh.rotation.y += 0.005;
                if (pointsMesh) pointsMesh.rotation.y += 0.005;
                if (wireframeMesh) wireframeMesh.rotation.y += 0.005;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
