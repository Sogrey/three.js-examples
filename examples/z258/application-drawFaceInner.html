<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="绘制面_内置点 - 在3D面上绘制内置点标记">
    <title>绘制面_内置点 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="color"], #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
        
        #info {
            position: absolute; bottom: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 4px;
            font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🎯 绘制面_内置点</h3>
        <div class="control-group">
            <label>点颜色</label>
            <input type="color" id="colorPicker" value="#ff4444">
        </div>
        <div class="control-group">
            <label>点大小 <span class="value" id="sizeValue">0.3</span></label>
            <input type="range" id="sizeRange" min="0.1" max="1" step="0.1" value="0.3">
        </div>
        <div class="control-group">
            <label>点数量 <span class="value" id="countValue">20</span></label>
            <input type="range" id="countRange" min="5" max="50" step="5" value="20">
        </div>
        <div class="control-group">
            <label>分布模式</label>
            <select id="modeSelect">
                <option value="grid">网格分布</option>
                <option value="random">随机分布</option>
                <option value="circle">圆形分布</option>
                <option value="spiral">螺旋分布</option>
            </select>
        </div>
        <button id="btnAdd">➕ 添加点</button>
        <button id="btnClear">🗑️ 清除所有</button>
    </div>
    
    <div id="info">
        <p>点击平面添加自定义点</p>
        <p>内置点会自动吸附到面上</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 创建主平面
        const planeGeometry = new THREE.PlaneGeometry(10, 10, 20, 20);
        const planeMaterial = new THREE.MeshStandardMaterial({
            color: 0x3a3a5a,
            side: THREE.DoubleSide,
            wireframe: false,
            transparent: true,
            opacity: 0.8
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        // 线框辅助
        const wireframeGeometry = new THREE.WireframeGeometry(planeGeometry);
        const wireframeMaterial = new THREE.LineBasicMaterial({ color: 0x6a6a8a });
        const wireframe = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
        wireframe.rotation.x = -Math.PI / 2;
        wireframe.position.y = 0.01;
        scene.add(wireframe);

        // 点组
        const pointsGroup = new THREE.Group();
        scene.add(pointsGroup);

        // 射线检测器
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // 配置
        const config = {
            color: '#ff4444',
            size: 0.3,
            count: 20,
            mode: 'grid'
        };

        // 创建点标记
        function createPointMarker(position, color, size) {
            const group = new THREE.Group();
            group.position.copy(position);

            // 点几何体
            const geometry = new THREE.SphereGeometry(size, 16, 16);
            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.9
            });
            const sphere = new THREE.Mesh(geometry, material);
            group.add(sphere);

            // 外圈光环
            const ringGeometry = new THREE.RingGeometry(size * 1.5, size * 2, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.4,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.01;
            group.add(ring);

            // 垂直指示线
            const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 2, 0)
            ]);
            const lineMaterial = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.5
            });
            const line = new THREE.Line(lineGeometry, lineMaterial);
            group.add(line);

            // 动画数据
            group.userData = {
                originalY: position.y,
                phase: Math.random() * Math.PI * 2,
                speed: 1 + Math.random()
            };

            return group;
        }

        // 生成内置点
        function generatePoints() {
            // 清除旧点
            while(pointsGroup.children.length > 0) {
                const child = pointsGroup.children[0];
                child.traverse((obj) => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                });
                pointsGroup.remove(child);
            }

            const color = new THREE.Color(config.color);

            for (let i = 0; i < config.count; i++) {
                let x, z;

                switch(config.mode) {
                    case 'grid':
                        // 网格分布
                        const cols = Math.ceil(Math.sqrt(config.count));
                        const row = Math.floor(i / cols);
                        const col = i % cols;
                        x = (col - cols/2) * (8 / cols);
                        z = (row - cols/2) * (8 / cols);
                        break;

                    case 'random':
                        // 随机分布
                        x = (Math.random() - 0.5) * 8;
                        z = (Math.random() - 0.5) * 8;
                        break;

                    case 'circle':
                        // 圆形分布
                        const angle = (i / config.count) * Math.PI * 2;
                        const radius = 3 + Math.random() * 1;
                        x = Math.cos(angle) * radius;
                        z = Math.sin(angle) * radius;
                        break;

                    case 'spiral':
                        // 螺旋分布
                        const spiralAngle = i * 0.5;
                        const spiralRadius = 0.5 + i * 0.15;
                        x = Math.cos(spiralAngle) * spiralRadius;
                        z = Math.sin(spiralAngle) * spiralRadius;
                        break;
                }

                const position = new THREE.Vector3(x, 0.1, z);
                const marker = createPointMarker(position, color, config.size);
                pointsGroup.add(marker);
            }
        }

        // 点击添加点
        container.addEventListener('click', (e) => {
            // 检查是否点击在控制面板上
            if (e.target.closest('#controls')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(plane);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                point.y = 0.1;
                const color = new THREE.Color(config.color);
                const marker = createPointMarker(point, color, config.size);
                pointsGroup.add(marker);
            }
        });

        // 初始化点
        generatePoints();

        // 动画
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // 点动画（上下浮动）
            pointsGroup.children.forEach((marker) => {
                const data = marker.userData;
                const y = data.originalY + Math.sin(time * data.speed + data.phase) * 0.2;
                marker.position.y = y;

                // 光环旋转
                const ring = marker.children[1];
                if (ring) {
                    ring.rotation.z += 0.02;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            config.color = e.target.value;
            generatePoints();
        });

        document.getElementById('sizeRange').addEventListener('input', (e) => {
            config.size = parseFloat(e.target.value);
            document.getElementById('sizeValue').textContent = config.size.toFixed(1);
            generatePoints();
        });

        document.getElementById('countRange').addEventListener('input', (e) => {
            config.count = parseInt(e.target.value);
            document.getElementById('countValue').textContent = config.count;
            generatePoints();
        });

        document.getElementById('modeSelect').addEventListener('change', (e) => {
            config.mode = e.target.value;
            generatePoints();
        });

        document.getElementById('btnAdd').addEventListener('click', () => {
            const x = (Math.random() - 0.5) * 8;
            const z = (Math.random() - 0.5) * 8;
            const position = new THREE.Vector3(x, 0.1, z);
            const color = new THREE.Color(config.color);
            const marker = createPointMarker(position, color, config.size);
            pointsGroup.add(marker);
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            while(pointsGroup.children.length > 0) {
                const child = pointsGroup.children[0];
                child.traverse((obj) => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                });
                pointsGroup.remove(child);
            }
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
