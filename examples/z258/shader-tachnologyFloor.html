<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技风地面 - Three.js r179</title>
    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #102736; font-family: 'Microsoft YaHei', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #controls {
            position: absolute;
            top: 50px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            min-width: 200px;
        }
        #controls h3 { margin-bottom: 10px; font-size: 14px; color: #2e8bd9; }
        #controls .slider-container {
            margin-bottom: 10px;
        }
        #controls label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        #controls input[type="range"] {
            width: 100%;
        }
        #controls select {
            width: 100%;
            padding: 5px;
            background: #333;
            color: white;
            border: 1px solid #555;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls">
        <h3>科技风地面</h3>
        <div class="slider-container">
            <label>扩散速度: <span id="speedValue">10</span></label>
            <input type="range" id="diffuseSpeed" min="1" max="30" step="1" value="10">
        </div>
        <div class="slider-container">
            <label>光环宽度: <span id="widthValue">10</span></label>
            <input type="range" id="diffuseWidth" min="2" max="20" step="1" value="10">
        </div>
        <div class="slider-container">
            <label>扩散方向:</label>
            <select id="diffuseDir">
                <option value="0">圆形扩散</option>
                <option value="1">横向扩散</option>
            </select>
        </div>
        <div class="slider-container">
            <label>扩散颜色:</label>
            <input type="color" id="diffuseColor" value="#2e8bd9" style="width: 100%;">
        </div>
    </div>
    <div id="info">科技风格 | 点阵扩散 | 网格辅助</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x102736);
        scene.fog = new THREE.Fog(0x102736, 1, 80);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        // 配置参数
        const opt = {
            gridSize: 50,
            gridDivision: 20,
            gridColor: 0x1b4b70,
            shapeSize: 0.5,
            shapeColor: 0x2a5f8a,
            pointSize: 0.15,
            pointColor: 0x154d7d,
            diffuse: true,
            diffuseSpeed: 10,
            diffuseWidth: 10,
            pointLayout: { row: 100, col: 100 },
            diffuseColor: 0x2e8bd9,
            diffuseDir: 0
        };

        // 创建程序化科技背景纹理
        function createTechTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 深蓝背景
            const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 400);
            gradient.addColorStop(0, '#1a3a5c');
            gradient.addColorStop(0.5, '#102736');
            gradient.addColorStop(1, '#0a1a25');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);

            // 绘制网格线
            ctx.strokeStyle = 'rgba(46, 139, 217, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 512; i += 32) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 512);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(512, i);
                ctx.stroke();
            }

            // 绘制科技感圆环
            ctx.strokeStyle = 'rgba(46, 139, 217, 0.3)';
            ctx.lineWidth = 2;
            for (let r = 50; r < 300; r += 50) {
                ctx.beginPath();
                ctx.arc(256, 256, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            return texture;
        }

        // 地面
        const floorGeometry = new THREE.PlaneGeometry(60, 60);
        const floorMaterial = new THREE.MeshBasicMaterial({
            map: createTechTexture(),
            transparent: true,
            opacity: 0.8
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        scene.add(floor);

        // 网格组
        const gridGroup = new THREE.Group();
        gridGroup.name = 'Grid';

        // 网格辅助线
        const gridHelper = new THREE.GridHelper(opt.gridSize, opt.gridDivision, opt.gridColor, opt.gridColor);
        gridHelper.position.y = 0;
        gridGroup.add(gridHelper);

        // 创建加号形状
        const cellSize = opt.gridSize / opt.gridDivision;
        const halfGridSize = opt.gridSize / 2;
        const shapeMaterial = new THREE.MeshBasicMaterial({
            color: opt.shapeColor,
            side: THREE.DoubleSide
        });

        const geometries = [];
        for (let row = 0; row < opt.gridDivision + 1; row++) {
            for (let col = 0; col < opt.gridDivision + 1; col++) {
                const lineWidth = opt.shapeSize / 18;
                const armLength = opt.shapeSize / 3;

                const vertices = [
                    new THREE.Vector2(-armLength, -lineWidth),
                    new THREE.Vector2(-lineWidth, -lineWidth),
                    new THREE.Vector2(-lineWidth, -armLength),
                    new THREE.Vector2(lineWidth, -armLength),
                    new THREE.Vector2(lineWidth, -lineWidth),
                    new THREE.Vector2(armLength, -lineWidth),
                    new THREE.Vector2(armLength, lineWidth),
                    new THREE.Vector2(lineWidth, lineWidth),
                    new THREE.Vector2(lineWidth, armLength),
                    new THREE.Vector2(-lineWidth, armLength),
                    new THREE.Vector2(-lineWidth, lineWidth),
                    new THREE.Vector2(-armLength, lineWidth)
                ];

                const shape = new THREE.Shape(vertices);
                const plusGeometry = new THREE.ShapeGeometry(shape, 12);
                plusGeometry.translate(
                    -halfGridSize + row * cellSize,
                    -halfGridSize + col * cellSize,
                    0
                );
                geometries.push(plusGeometry);
            }
        }

        const mergedGeometry = mergeGeometries(geometries);
        const shapeMesh = new THREE.Mesh(mergedGeometry, shapeMaterial);
        shapeMesh.rotation.x = -Math.PI / 2;
        shapeMesh.position.y = 0.01;
        gridGroup.add(shapeMesh);

        // 创建点阵
        const rows = opt.pointLayout.row;
        const cols = opt.pointLayout.col;
        const pointVertices = new Float32Array(rows * cols * 3);

        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const x = (row / (rows - 1)) * opt.gridSize - opt.gridSize / 2;
                const z = (col / (cols - 1)) * opt.gridSize - opt.gridSize / 2;

                const index = (row * cols + col) * 3;
                pointVertices[index] = x;
                pointVertices[index + 1] = 0;
                pointVertices[index + 2] = z;
            }
        }

        const pointGeometry = new THREE.BufferGeometry();
        pointGeometry.setAttribute('position', new THREE.BufferAttribute(pointVertices, 3));

        const pointMaterial = new THREE.PointsMaterial({
            color: opt.pointColor,
            size: opt.pointSize,
            sizeAttenuation: true
        });

        const points = new THREE.Points(pointGeometry, pointMaterial);

        // 扩散效果着色器
        let shaderProgram = null;
        if (opt.diffuse) {
            pointMaterial.onBeforeCompile = shader => {
                shaderProgram = shader;
                shader.uniforms = {
                    ...shader.uniforms,
                    uTime: { value: 0 },
                    uSpeed: { value: opt.diffuseSpeed },
                    uWidth: { value: opt.diffuseWidth },
                    uColor: { value: new THREE.Color(opt.diffuseColor) },
                    uDir: { value: opt.diffuseDir }
                };

                shader.vertexShader = shader.vertexShader.replace(
                    'void main() {',
                    `
                    varying vec3 vPosition;
                    void main() {
                        vPosition = position;
                    `
                );

                shader.fragmentShader = shader.fragmentShader.replace(
                    'void main() {',
                    `
                    uniform float uTime;
                    uniform float uSpeed;
                    uniform float uWidth;
                    uniform vec3 uColor;
                    uniform float uDir;
                    varying vec3 vPosition;

                    void main() {
                    `
                );

                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <opaque_fragment>',
                    `
                    #ifdef OPAQUE
                    diffuseColor.a = 1.0;
                    #endif

                    float radius = uTime * uSpeed;
                    float width = min(uWidth, uTime * 5.0);
                    vec2 center = vec2(0.0, 0.0);
                    float distanceFromCenter = 0.0;

                    if (uDir == 1.0) {
                        distanceFromCenter = abs(vPosition.x);
                    } else {
                        distanceFromCenter = distance(vPosition.xz, center);
                    }

                    if (distanceFromCenter > radius && distanceFromCenter < radius + 2.0 * width) {
                        float percentage = 0.0;
                        if (distanceFromCenter < radius + width) {
                            percentage = (distanceFromCenter - radius) / width;
                            outgoingLight = mix(outgoingLight, uColor, percentage);
                        } else {
                            percentage = (distanceFromCenter - radius - width) / width;
                            outgoingLight = mix(uColor, outgoingLight, percentage);
                        }
                        gl_FragColor = vec4(outgoingLight, diffuseColor.a);
                    } else {
                        gl_FragColor = vec4(outgoingLight, diffuseColor.a);
                    }
                    `
                );
            };

            const resetTime = opt.gridSize / opt.diffuseSpeed;
            const clock = new THREE.Clock();

            points.render = () => {
                if (shaderProgram) {
                    shaderProgram.uniforms.uTime.value += clock.getDelta();
                    if (shaderProgram.uniforms.uTime.value > resetTime) {
                        shaderProgram.uniforms.uTime.value = 0;
                    }
                }
            };
        }

        gridGroup.add(points);
        scene.add(gridGroup);

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            if (points.render) points.render();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 事件监听
        document.getElementById('diffuseSpeed').addEventListener('input', function() {
            const value = parseFloat(this.value);
            document.getElementById('speedValue').textContent = value;
            if (shaderProgram) {
                shaderProgram.uniforms.uSpeed.value = value;
            }
        });

        document.getElementById('diffuseWidth').addEventListener('input', function() {
            const value = parseFloat(this.value);
            document.getElementById('widthValue').textContent = value;
            if (shaderProgram) {
                shaderProgram.uniforms.uWidth.value = value;
            }
        });

        document.getElementById('diffuseDir').addEventListener('change', function() {
            const value = parseFloat(this.value);
            if (shaderProgram) {
                shaderProgram.uniforms.uDir.value = value;
            }
        });

        document.getElementById('diffuseColor').addEventListener('input', function() {
            const color = new THREE.Color(this.value);
            if (shaderProgram) {
                shaderProgram.uniforms.uColor.value = color;
            }
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window用于截图
        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
