<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js裁剪动画示例 - 使用裁剪平面实现物体剖切动画效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 裁剪动画</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // 场景设置
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(8, 6, 8);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.shadowMap.enabled = true;
        window.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        window.scene.add(directionalLight);

        // 创建裁剪平面
        const clipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        window.renderer.clippingPlanes = [clipPlane];
        window.renderer.localClippingEnabled = true;

        // 创建立方体阵列
        const boxGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const boxes = [];
        
        for (let x = -3; x <= 3; x++) {
            for (let z = -3; z <= 3; z++) {
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL((x + 3) / 6, 0.7, 0.5),
                    roughness: 0.3,
                    metalness: 0.6,
                    side: THREE.DoubleSide
                });
                
                const box = new THREE.Mesh(boxGeometry, material);
                box.position.set(x * 2, 0.75, z * 2);
                box.castShadow = true;
                box.receiveShadow = true;
                window.scene.add(box);
                boxes.push(box);
            }
        }

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        window.scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        window.scene.add(gridHelper);

        // 裁剪平面可视化
        const planeHelper = new THREE.PlaneHelper(clipPlane, 20, 0xff0000);
        window.scene.add(planeHelper);

        // GUI 控制
        const params = {
            clipY: 0,
            clipEnabled: true,
            showHelper: true,
            animate: () => {
                animateClip(2);
            },
            reset: () => {
                animateClip(-2);
            }
        };

        const gui = new GUI();
        gui.domElement.style.marginTop = '50px';

        gui.add(params, 'clipY', -5, 5).name('裁剪高度').onChange(value => {
            clipPlane.constant = -value;
        });

        gui.add(params, 'clipEnabled').name('启用裁剪').onChange(value => {
            window.renderer.localClippingEnabled = value;
            if (value) {
                window.renderer.clippingPlanes = [clipPlane];
            } else {
                window.renderer.clippingPlanes = [];
            }
        });

        gui.add(params, 'showHelper').name('显示辅助线').onChange(value => {
            planeHelper.visible = value;
        });

        gui.add(params, 'animate').name('向上裁剪');
        gui.add(params, 'reset').name('向下裁剪');

        // 动画函数
        function animateClip(targetY) {
            const startY = params.clipY;
            const duration = 1000;
            const startTime = Date.now();

            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                
                params.clipY = startY + (targetY - startY) * easeProgress;
                clipPlane.constant = -params.clipY;
                
                // 更新GUI显示
                gui.controllers.forEach(controller => {
                    if (controller.property === 'clipY') {
                        controller.updateDisplay();
                    }
                });

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            update();
        }

        // 窗口大小变化
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
