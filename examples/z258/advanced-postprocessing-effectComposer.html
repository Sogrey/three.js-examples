<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示EffectComposer的配置和渲染方式切换，支持多种色调映射模式。">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 渲染器配置</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;
        window.composer = null;
        let controls;
        let composer;

        function init() {
            window.scene = new THREE.Scene();

            window.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100000);
            window.camera.position.set(5, 2, 8);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            window.renderer.setClearColor(0x1a1a2e, 1);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;

            window.scene.environment = new THREE.PMREMGenerator(window.renderer).fromScene(new RoomEnvironment(), 0.04).texture;

            composer = new EffectComposer(window.renderer);
            window.composer = composer;

            const renderPass = new RenderPass(window.scene, window.camera);
            composer.addPass(renderPass);

            const outputPass = new OutputPass();
            composer.addPass(outputPass);

            const data = { renderType: 'effect' };

            const ToneMappingList = {
                No: THREE.NoToneMapping,
                Linear: THREE.LinearToneMapping,
                Reinhard: THREE.ReinhardToneMapping,
                Cineon: THREE.CineonToneMapping,
                ACESFilmic: THREE.ACESFilmicToneMapping,
                AgX: THREE.AgXToneMapping,
                Neutral: THREE.NeutralToneMapping,
                Custom: THREE.CustomToneMapping
            };

            const gui = new GUI();
            gui.domElement.style.position = 'relative';
            gui.domElement.style.top = '50px';
            gui.add(window.renderer, 'outputColorSpace', ['srgb', 'srgb-linear']);
            gui.add(window.renderer, 'toneMapping', Object.keys(ToneMappingList)).onChange(value => {
                window.renderer.toneMapping = ToneMappingList[value];
            });
            gui.add(window.renderer, 'toneMappingExposure', 0, 10);
            gui.add(data, 'renderType', ['effect', 'normal', 'both']);
            gui.add(outputPass, 'enabled').name('OutputPass_enabled');

            const geometry = new THREE.TorusKnotGeometry(1.5, 0.5, 200, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ff88,
                roughness: 0.5,
                metalness: 0.5
            });
            const torusKnot = new THREE.Mesh(geometry, material);
            window.scene.add(torusKnot);

            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(1, 32, 32),
                new THREE.MeshStandardMaterial({
                    color: 0xff4444,
                    roughness: 0.2,
                    metalness: 0.8
                })
            );
            sphere.position.set(3, 2, 0);
            window.scene.add(sphere);

            const cube = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 1.5, 1.5),
                new THREE.MeshStandardMaterial({
                    color: 0x4488ff,
                    roughness: 0.3,
                    metalness: 0.6
                })
            );
            cube.position.set(-3, 1, 0);
            window.scene.add(cube);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            window.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7);
            window.scene.add(directionalLight);

            animate(data, outputPass);
        }

        function animate(data, outputPass) {
            if (controls) controls.update();

            if (data.renderType === 'effect') {
                composer.render();
            } else if (data.renderType === 'normal') {
                window.renderer.render(window.scene, window.camera);
            } else {
                window.renderer.render(window.scene, window.camera);
                composer.render();
            }
        }

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) {
                            window.composer.render();
                        } else if (window.renderer) {
                            window.renderer.render(window.scene, window.camera);
                        }
                    }

                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
