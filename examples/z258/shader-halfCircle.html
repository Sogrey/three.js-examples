<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="半圆 - 展示半圆效果着色器">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 半圆</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(10, 10, 10);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const vs = `
            varying vec2 vUv;
            varying vec3 vPosition;

            void main() {
                vec4 modelPosition = modelMatrix * vec4(position, 1.0);
                vec4 viewPosition = viewMatrix * modelPosition;
                vec4 projectedPosition = projectionMatrix * viewPosition;
                gl_Position = projectedPosition;

                vUv = uv;
                vPosition = position;
            }
        `;

        const fs = `
            #define PI 3.1415926535897932384626433832795
            varying vec2 vUv;

            uniform float uTime;

            vec2 rotatePoint(vec2 center, float angle, vec2 p) {
                float s = sin(angle);
                float c = cos(angle);

                p.x -= center.x;
                p.y -= center.y;

                float xNew = p.x * c - p.y * s;
                float yNew = p.x * s + p.y * c;

                p.x = xNew + center.x;
                p.y = yNew + center.y;
                return p;
            }

            float angleVec(vec2 a_, vec2 b_) {
                vec3 a = vec3(a_, 0);
                vec3 b = vec3(b_, 0);
                float dotProd = dot(a, b);
                vec3 crossprod = cross(a, b);
                float crossprod_l = length(crossprod);
                float lenProd = length(a) * length(b);
                float cosa = dotProd / lenProd;
                float sina = crossprod_l / lenProd;
                float angle = atan(sina, cosa);

                if(dot(vec3(0, 0, 1), crossprod) < 0.0)
                    angle = 90.0;
                return (angle * (180.0 / PI));
            }

            void main() {
                vec2 center = vec2(0.5, 0.5);
                float angleStela = 180.0;
                float radius = 0.5;
                float startAlpha = 0.0;
                float endAlpha = 0.5;
                vec3 color = vec3(0.0, 1.0, 0.0);
                float alpha = 0.0;

                float angle = (-uTime * 2.0);

                vec2 lineEnd = vec2(center.x, center.y + radius);
                float distanceToCenter = distance(center, vUv.xy);
                lineEnd = rotatePoint(center, angle, lineEnd);
                float angleStelaToApply = angleVec(normalize(lineEnd - center), normalize(vUv - center));

                if (angleStelaToApply < angleStela && distanceToCenter < radius) {
                    float factorAngle = 1.0 - angleStelaToApply / angleStela;
                    float finalFactorAngle = factorAngle * endAlpha;
                    if (finalFactorAngle > startAlpha) {
                        alpha = finalFactorAngle;
                    }
                }

                gl_FragColor = vec4(color, alpha);
            }
        `;

        const geometry = new THREE.PlaneGeometry(5, 5);
        const shaderMaterial = new THREE.ShaderMaterial({
            transparent: true,
            vertexShader: vs,
            fragmentShader: fs,
            side: THREE.DoubleSide,
            uniforms: {
                uTime: { value: 0 }
            }
        });

        const plane = new THREE.Mesh(geometry, shaderMaterial);
        window.scene.add(plane);

        function animate(time) {
            shaderMaterial.uniforms.uTime.value = time / 1000;
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
