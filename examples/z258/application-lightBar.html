<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="光柱效果 - 创建带有纹理和发光效果的3D光柱"
    />
    <meta name="three-version" content="r179" />
    <title>Three.js 示例 - 光柱</title>
    <link rel="stylesheet" href="../../css/example-common.css" />
  </head>
  <body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../libs/three/r179/build/three.module.js",
          "three/addons/": "../../libs/three/r179/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const container = document.getElementById("threeContainer");

      window.scene = new THREE.Scene();
      window.scene.background = new THREE.Color(0x1a1a2e);

      window.camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      window.camera.position.set(0, 10, 15);

      window.renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(window.renderer.domElement);

      const controls = new OrbitControls(
        window.camera,
        window.renderer.domElement
      );
      controls.enableDamping = true;

      // 灯光
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      window.scene.add(ambientLight);

      // 网格地面
      const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
      window.scene.add(gridHelper);

      // 创建光柱纹理
      function createLightBarTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");

        // 创建渐变
        const gradient = ctx.createLinearGradient(0, 0, 0, 256);
        gradient.addColorStop(0, "rgba(255, 255, 255, 0)");
        gradient.addColorStop(0.2, "rgba(255, 255, 255, 0.8)");
        gradient.addColorStop(0.5, "rgba(255, 255, 255, 0.3)");
        gradient.addColorStop(0.8, "rgba(255, 255, 255, 0.8)");
        gradient.addColorStop(1, "rgba(255, 255, 255, 0)");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 256);

        // 添加条纹
        ctx.globalCompositeOperation = "overlay";
        for (let i = 0; i < 8; i++) {
          ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + Math.random() * 0.2})`;
          ctx.fillRect(i * 8, 0, 4, 256);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      // 创建光柱
      function createLightBar(color = 0xfcde8c) {
        const group = new THREE.Group();

        // 创建圆柱体
        const cylinderGeometry = new THREE.CylinderGeometry(0.3, 0.3, 8, 32);
        const cylinderMaterial = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: 0.3,
          side: THREE.DoubleSide,
        });
        cylinderMaterial.blending = THREE.AdditiveBlending;
        const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
        cylinder.position.y = 4;
        group.add(cylinder);

        // 创建纹理平面
        const texture = createLightBarTexture();
        const planeGeometry = new THREE.PlaneGeometry(1.5, 8);
        const planeMaterial = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.6,
          side: THREE.DoubleSide,
          map: texture,
        });
        planeMaterial.blending = THREE.AdditiveBlending;
        planeMaterial.depthTest = false;

        // 三个交叉的平面
        const plane1 = new THREE.Mesh(planeGeometry, planeMaterial);
        plane1.position.y = 4;

        const plane2 = plane1.clone();
        plane2.rotation.y = Math.PI / 3;

        const plane3 = plane1.clone();
        plane3.rotation.y = -Math.PI / 3;

        group.add(plane1);
        group.add(plane2);
        group.add(plane3);

        // 存储材质用于动画
        group.userData.materials = [cylinderMaterial, planeMaterial];
        group.userData.texture = texture;

        return group;
      }

      // 随机创建光柱（减少数量避免颜色过度重叠）
      const lightBars = [];
      for (let i = 0; i < 6; i++) {
        const hue = i / 6; // 均匀分布色相
        const color = new THREE.Color().setHSL(hue, 0.9, 0.5);
        const lightBar = createLightBar(color);

        // 均匀分布位置，增加间距
        const angle = (i / 6) * Math.PI * 2;
        const radius = 5 + Math.random() * 2;
        lightBar.position.set(
          Math.cos(angle) * radius,
          0,
          Math.sin(angle) * radius
        );

        // 随机高度缩放
        const scale = 0.8 + Math.random() * 0.4;
        lightBar.scale.set(scale, scale, scale);

        window.scene.add(lightBar);
        lightBars.push(lightBar);
      }

      window.addEventListener("resize", () => {
        window.camera.aspect = window.innerWidth / window.innerHeight;
        window.camera.updateProjectionMatrix();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);

        // 动画纹理滚动
        lightBars.forEach((lightBar, index) => {
          const texture = lightBar.userData.texture;
          if (texture) {
            texture.offset.y -= 0.005 * (1 + index * 0.1);
          }
        });

        controls.update();
        window.renderer.render(window.scene, window.camera);
      }
      animate();
    </script>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "take-screenshot") {
          try {
            if (window.scene && window.camera) {
              window.renderer.render(window.scene, window.camera);
            }
            const quality = event.data.quality || 0.8;
            const canvas = window.renderer.domElement;
            const tempCanvas = document.createElement("canvas");
            const maxSize = 600;
            const scale = Math.min(
              maxSize / canvas.width,
              maxSize / canvas.height
            );
            tempCanvas.width = Math.floor(canvas.width * scale);
            tempCanvas.height = Math.floor(canvas.height * scale);
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(
              canvas,
              0,
              0,
              tempCanvas.width,
              tempCanvas.height
            );
            const dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
            window.parent.postMessage(
              { type: "screenshot-data", dataUrl: dataUrl },
              "*"
            );
          } catch (error) {
            console.error("截图失败:", error);
            window.parent.postMessage(
              { type: "screenshot-error", error: error.message },
              "*"
            );
          }
        }
      });
    </script>
  </body>
</html>
