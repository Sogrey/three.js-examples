<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="使用Three.js展示骨骼动画和蒙皮网格，包含骨骼层级结构和动画控制">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 骨骼动画</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        window.camera.position.set(0, 30, 40);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(ambientLight);

        const lights = [];
        lights[0] = new THREE.DirectionalLight(0xffffff, 2);
        lights[1] = new THREE.DirectionalLight(0xffffff, 2);
        lights[2] = new THREE.DirectionalLight(0xffffff, 2);

        lights[0].position.set(0, 100, 0);
        lights[1].position.set(100, 100, 100);
        lights[2].position.set(-100, -100, -100);

        window.scene.add(lights[0]);
        window.scene.add(lights[1]);
        window.scene.add(lights[2]);

        // 添加网格辅助
        const gridHelper = new THREE.GridHelper(50, 20, 0x4a4a6e, 0x2a2a4e);
        window.scene.add(gridHelper);

        // 骨骼动画相关变量
        let mesh, skeletonHelper;
        const state = {
            animateBones: false
        };

        // 创建几何体
        function createGeometry(sizing) {
            const geometry = new THREE.BoxGeometry(5, sizing.height, 5, 1, sizing.segmentCount * 10);

            const position = geometry.attributes.position;
            const vertex = new THREE.Vector3();
            const skinIndices = [];
            const skinWeights = [];

            for (let i = 0; i < position.count; i++) {
                vertex.fromBufferAttribute(position, i);
                const y = vertex.y + sizing.halfHeight;
                const skinIndex = Math.floor(y / sizing.segmentHeight);
                const skinWeight = (y % sizing.segmentHeight) / sizing.segmentHeight;

                skinIndices.push(skinIndex, skinIndex + 1, 0, 0);
                skinWeights.push(1 - skinWeight, skinWeight, 0, 0);
            }

            geometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
            geometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

            return geometry;
        }

        // 创建骨骼
        function createBones(sizing) {
            const bones = [];
            let prevBone = new THREE.Bone();
            bones.push(prevBone);
            prevBone.position.y = -sizing.halfHeight;

            for (let i = 0; i < sizing.segmentCount; i++) {
                const bone = new THREE.Bone();
                bone.position.y = sizing.segmentHeight;
                bones.push(bone);
                prevBone.add(bone);
                prevBone = bone;
            }

            return bones;
        }

        // 创建网格
        function createMesh(geometry, bones) {
            const material = new THREE.MeshPhongMaterial({
                color: 0x3498db,
                emissive: 0x1a5276,
                side: THREE.DoubleSide,
                flatShading: true
            });

            const skinnedMesh = new THREE.SkinnedMesh(geometry, material);
            const skeleton = new THREE.Skeleton(bones);

            skinnedMesh.add(bones[0]);
            skinnedMesh.bind(skeleton);

            skeletonHelper = new THREE.SkeletonHelper(skinnedMesh);
            skeletonHelper.material.linewidth = 2;
            window.scene.add(skeletonHelper);

            return skinnedMesh;
        }

        // 初始化骨骼
        function initBones() {
            const segmentHeight = 8;
            const segmentCount = 4;
            const height = segmentHeight * segmentCount;
            const halfHeight = height * 0.5;

            const sizing = {
                segmentHeight,
                segmentCount,
                height,
                halfHeight
            };

            const geometry = createGeometry(sizing);
            const bones = createBones(sizing);
            mesh = createMesh(geometry, bones);

            window.scene.add(mesh);
        }

        // 设置GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';

        let folder = gui.addFolder('通用选项');
        folder.add(state, 'animateBones').name('自动动画');
        folder.add({ pose: () => mesh.pose() }, 'pose').name('重置姿势');

        // 初始化骨骼
        initBones();

        // 添加骨骼控制
        for (let i = 0; i < mesh.skeleton.bones.length; i++) {
            const bone = mesh.skeleton.bones[i];
            folder = gui.addFolder('骨骼 ' + i);

            folder.add(bone.position, 'x', -10 + bone.position.x, 10 + bone.position.x).name('position.x');
            folder.add(bone.position, 'y', -10 + bone.position.y, 10 + bone.position.y).name('position.y');
            folder.add(bone.position, 'z', -10 + bone.position.z, 10 + bone.position.z).name('position.z');

            folder.add(bone.rotation, 'x', -Math.PI * 0.5, Math.PI * 0.5).name('rotation.x');
            folder.add(bone.rotation, 'y', -Math.PI * 0.5, Math.PI * 0.5).name('rotation.y');
            folder.add(bone.rotation, 'z', -Math.PI * 0.5, Math.PI * 0.5).name('rotation.z');

            folder.add(bone.scale, 'x', 0, 2).name('scale.x');
            folder.add(bone.scale, 'y', 0, 2).name('scale.y');
            folder.add(bone.scale, 'z', 0, 2).name('scale.z');
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 骨骼摆动动画
            if (state.animateBones) {
                for (let i = 0; i < mesh.skeleton.bones.length; i++) {
                    mesh.skeleton.bones[i].rotation.z = (Math.sin(time) * 2) / mesh.skeleton.bones.length;
                }
            }

            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 截图支持
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
