<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="颗粒图像 - 展示图像粒子破碎效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 颗粒图像</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x347897);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500000);
        window.camera.position.set(0, 0, 300);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const point = new THREE.PointLight(0xffffff, 1);
        point.position.set(140, 200, 300);
        window.scene.add(point);

        const ambient = new THREE.AmbientLight(0xffffff, 2);
        window.scene.add(ambient);

        window.scene.add(new THREE.AxesHelper(500));

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const width = 200;
        const height = 100;
        const positionArr = [];
        const normalArr = [];
        const uvArr = [];
        const geometry = new THREE.PlaneGeometry(width, height, width, height);
        
        Array.from(geometry.index.array).forEach((vertexIndex) => {
            let tArr = geometry.attributes.position.array;
            let i = vertexIndex * 3;
            positionArr.push(tArr[i], tArr[i + 1], tArr[i + 2]);

            tArr = geometry.attributes.normal.array;
            i = vertexIndex * 3;
            normalArr.push(tArr[i], tArr[i + 1], tArr[i + 2]);

            tArr = geometry.attributes.uv.array;
            i = vertexIndex * 2;
            uvArr.push(tArr[i], tArr[i + 1]);
        });

        const bufferGeometry = new THREE.BufferGeometry();
        bufferGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positionArr), 3));
        bufferGeometry.setAttribute("originPosition", new THREE.BufferAttribute(new Float32Array(positionArr), 3));
        bufferGeometry.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(normalArr), 3));
        bufferGeometry.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(uvArr), 2));
        bufferGeometry.faceAnimateArr = [];

        for (let i = 0; i < bufferGeometry.attributes.position.count; i++) {
            if (i % 3 == 0) {
                const y = bufferGeometry.attributes.position.array[i * 3 + 1];
                const y_sign = Math.sign(y);
                const start = { x: 0, y: 0, z: 0 };
                const end = start;
                const control1 = { x: Math.random() * 50, y: y_sign * (Math.random() * 80), z: 0 };
                const control2 = { x: Math.random() * 50, y: -y_sign * 20, z: 0 };
                bufferGeometry.faceAnimateArr.push({
                    circle: 1500,
                    startTime: null,
                    progress: 0,
                    bezier: { start, control1, control2, end }
                });
            }
        }

        const texture = new THREE.TextureLoader().load('../../../images/textures/15-30-11-41_1280.jpg');
        texture.needsUpdate = true;

        const material = new THREE.MeshStandardMaterial({
            map: texture,
            side: THREE.DoubleSide,
        });

        const plane = new THREE.Mesh(bufferGeometry, material);
        window.scene.add(plane);

        function bezier(P0, P1, P2, P3, t) {
            const x = P0.x * (1 - t) * (1 - t) * (1 - t) + 3 * P1.x * t * (1 - t) * (1 - t) + 3 * P2.x * t * t * (1 - t) + P3.x * t * t * t;
            const y = P0.y * (1 - t) * (1 - t) * (1 - t) + 3 * P1.y * t * (1 - t) * (1 - t) + 3 * P2.y * t * t * (1 - t) + P3.y * t * t * t;
            const z = P0.z * (1 - t) * (1 - t) * (1 - t) + 3 * P1.z * t * (1 - t) * (1 - t) + 3 * P2.z * t * t * (1 - t) + P3.z * t * t * t;
            return { x, y, z };
        }

        let startTime = Date.now();
        const circle = 1500;
        let progress = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            progress = (Date.now() - startTime) / circle;
            if (progress > 1) progress = 1;
            const startX = -width / 2;
            const currX = startX + width * progress;

            bufferGeometry.faceAnimateArr.forEach((face, index) => {
                const tArr = bufferGeometry.attributes.originPosition.array;
                const face_firstVertex = { x: tArr[index * 3 * 3], y: tArr[index * 3 * 3 + 1], z: tArr[index * 3 * 3 + 2] };
                
                if (!face.startTime && face_firstVertex.x < currX) {
                    face.startTime = Date.now();
                }

                if (face.startTime && face.progress < 1) {
                    face.progress = (Date.now() - face.startTime) / face.circle;
                    if (face.progress > 1) face.progress = 1;
                    for (let i = 0; i < 3; i++) {
                        const currVertexIndex = index * 3 + i;
                        const originPos = { x: tArr[currVertexIndex * 3], y: tArr[currVertexIndex * 3 + 1], z: tArr[currVertexIndex * 3 + 2] };
                        const { start, control1, control2, end } = bufferGeometry.faceAnimateArr[index].bezier;
                        const bezierPos = bezier(start, control1, control2, end, face.progress);
                        const newPos = { x: originPos.x + bezierPos.x, y: originPos.y + bezierPos.y, z: originPos.z + bezierPos.z };
                        bufferGeometry.attributes.position.setXYZ(currVertexIndex, newPos.x, newPos.y, newPos.z);
                    }
                }
            });
            bufferGeometry.attributes.position.needsUpdate = true;

            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        setInterval(() => {
            startTime = Date.now();
            progress = 0;
            bufferGeometry.faceAnimateArr.forEach((face) => {
                face.startTime = null;
                face.progress = 0;
            });
            const posArr = bufferGeometry.attributes.originPosition.array.slice();
            bufferGeometry.attributes.position.array.set(posArr);
            bufferGeometry.attributes.position.needsUpdate = true;
        }, 4000);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
