<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Canvas贴图效果 - 使用echarts图表作为Three.js纹理">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - Canvas贴图</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = new THREE.Scene();

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        window.camera.position.set(0, 0, 3);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const w = 800, h = 600;
        const container = document.createElement('canvas');
        container.width = w;
        container.height = h;
        container.style.width = w + "px";
        container.style.height = h + "px";

        const myChart = echarts.init(container, null, {
            devicePixelRatio: window.devicePixelRatio
        });
        const texture = new THREE.CanvasTexture(container);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const aspectRatio = w / h;
        const planeWidth = 4;
        const planeHeight = planeWidth / aspectRatio;
        const planeGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const planeMaterial = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        window.scene.add(plane);

        const uniforms = {
            iResolution: {
                type: 'v2',
                value: new THREE.Vector2(window.innerWidth, window.innerHeight)
            },
            iTime: {
                type: 'f',
                value: 1.0
            }
        };

        planeMaterial.onBeforeCompile = shader => {
            shader.uniforms.iResolution = uniforms.iResolution;
            shader.uniforms.iTime = uniforms.iTime;
            shader.fragmentShader = shader.fragmentShader.replace(/#include <common>/, `
                uniform vec2 iResolution;
                uniform float iTime;
                #include <common>
            `);
            shader.fragmentShader = shader.fragmentShader.replace('vec4 diffuseColor = vec4( diffuse, opacity );', `
                vec3 c;
                float l,z=iTime;
                for(int i=0;i<3;i++) {
                    vec2 uv,p=gl_FragCoord.xy/iResolution;
                    uv=p +  2.0;
                    p-=.5;
                    p.x*=iResolution.x/iResolution.y;
                    z+=.07;
                    l=length(p);
                    uv+=p/l*(sin(z)+1.)*abs(sin(l*9.-z-z));
                    c[i]=.01/length(mod(uv,1.)-.5);
                }
                vec4 diffuseColor = vec4( diffuse * c  * vec3(8.,8.,8.), opacity );
            `);
        };

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
        });

        const data = [820, 932, 901, 934, 1290, 1330, 1320];
        const option = {
            xAxis: {
                type: 'category',
                data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    data,
                    type: 'line',
                    areaStyle: {}
                }
            ]
        };
        myChart.setOption(option);

        setInterval(() => {
            data.forEach((item, index) => {
                data[index] = Math.floor(Math.random() * 1000);
            });
            myChart.setOption({
                series: [{
                    data: data
                }]
            });
        }, 2000);

        function animate() {
            requestAnimationFrame(animate);
            texture.needsUpdate = true;
            uniforms.iTime.value += 0.05;
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
