<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D模型查看器，支持多种几何体预览和材质调节">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D模型查看器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
        }
        #viewerUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #viewerUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #viewerUI .model-btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            text-align: left;
        }
        #viewerUI .model-btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #viewerUI .model-btn.active {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
        }
        #viewerUI .control-group {
            margin: 10px 0;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 4px;
        }
        #viewerUI .control-group h4 {
            margin: 0 0 8px 0;
            color: #ffff00;
            font-size: 13px;
        }
        #viewerUI .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 11px;
        }
        #viewerUI input[type="range"] {
            width: 120px;
        }
        #viewerUI input[type="color"] {
            width: 50px;
            height: 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #viewerUI .value {
            color: #00ff00;
            min-width: 40px;
            text-align: right;
        }
        #viewerUI .checkbox-row {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 11px;
        }
        #viewerUI .checkbox-row input {
            margin-right: 8px;
        }
        #viewerUI .info {
            margin-top: 10px;
            font-size: 11px;
            color: #888;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 10px 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="viewerUI">
        <h3>3D模型查看器</h3>
        
        <button class="model-btn active" data-model="cube">立方体</button>
        <button class="model-btn" data-model="sphere">球体</button>
        <button class="model-btn" data-model="cylinder">圆柱体</button>
        <button class="model-btn" data-model="torus">圆环</button>
        <button class="model-btn" data-model="cone">圆锥</button>
        <button class="model-btn" data-model="knot">扭结</button>
        
        <div class="control-group">
            <h4>材质设置</h4>
            <div class="control-row">
                <span>颜色:</span>
                <input type="color" id="colorPicker" value="#0088ff">
            </div>
            <div class="control-row">
                <span>金属度:</span>
                <input type="range" id="metalness" min="0" max="1" step="0.1" value="0.5">
                <span class="value" id="valMetalness">0.5</span>
            </div>
            <div class="control-row">
                <span>粗糙度:</span>
                <input type="range" id="roughness" min="0" max="1" step="0.1" value="0.3">
                <span class="value" id="valRoughness">0.3</span>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="wireframe">
                <label for="wireframe">线框模式</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="autoRotate" checked>
                <label for="autoRotate">自动旋转</label>
            </div>
        </div>
        
        <div class="control-group">
            <h4>变换</h4>
            <div class="control-row">
                <span>缩放:</span>
                <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1">
                <span class="value" id="valScale">1.0</span>
            </div>
        </div>
        
        <div class="info">
            左键旋转 | 右键平移 | 滚轮缩放
        </div>
    </div>
    
    <div id="stats">
        顶点: <span id="vertexCount">0</span> | 面: <span id="faceCount">0</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        
        // 灯光系统
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-5, 0, -5);
        scene.add(fillLight);
        
        const rimLight = new THREE.SpotLight(0xff8800, 0.5);
        rimLight.position.set(0, 5, -10);
        rimLight.lookAt(0, 0, 0);
        scene.add(rimLight);
        
        // 网格地板
        const gridHelper = new THREE.GridHelper(20, 20, 0x333333, 0x222222);
        scene.add(gridHelper);
        
        // 当前模型
        let currentMesh = null;
        let currentModelType = 'cube';
        
        // 材质参数
        const materialParams = {
            color: 0x0088ff,
            metalness: 0.5,
            roughness: 0.3,
            wireframe: false
        };
        
        // 创建材质
        function createMaterial() {
            return new THREE.MeshStandardMaterial({
                color: materialParams.color,
                metalness: materialParams.metalness,
                roughness: materialParams.roughness,
                wireframe: materialParams.wireframe
            });
        }
        
        // 模型创建函数
        const modelCreators = {
            cube: () => new THREE.BoxGeometry(2, 2, 2),
            sphere: () => new THREE.SphereGeometry(1.5, 32, 32),
            cylinder: () => new THREE.CylinderGeometry(1, 1, 3, 32),
            torus: () => new THREE.TorusGeometry(1.5, 0.5, 16, 100),
            cone: () => new THREE.ConeGeometry(1.5, 3, 32),
            knot: () => new THREE.TorusKnotGeometry(1, 0.3, 100, 16)
        };
        
        // 创建模型
        function createModel(type) {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }
            
            const geometry = modelCreators[type]();
            const material = createMaterial();
            
            currentMesh = new THREE.Mesh(geometry, material);
            currentMesh.castShadow = true;
            currentMesh.receiveShadow = true;
            currentMesh.position.y = 1.5;
            
            scene.add(currentMesh);
            
            // 更新统计
            updateStats(geometry);
            
            return currentMesh;
        }
        
        // 更新统计信息
        function updateStats(geometry) {
            const positions = geometry.attributes.position;
            const index = geometry.index;
            
            document.getElementById('vertexCount').textContent = positions.count;
            document.getElementById('faceCount').textContent = index ? index.count / 3 : positions.count / 3;
        }
        
        // 初始化
        createModel('cube');
        
        // UI事件
        document.querySelectorAll('.model-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentModelType = btn.dataset.model;
                createModel(currentModelType);
            });
        });
        
        // 颜色选择
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            materialParams.color = new THREE.Color(e.target.value);
            if (currentMesh) {
                currentMesh.material.color = materialParams.color;
            }
        });
        
        // 金属度
        document.getElementById('metalness').addEventListener('input', (e) => {
            materialParams.metalness = parseFloat(e.target.value);
            document.getElementById('valMetalness').textContent = materialParams.metalness.toFixed(1);
            if (currentMesh) {
                currentMesh.material.metalness = materialParams.metalness;
            }
        });
        
        // 粗糙度
        document.getElementById('roughness').addEventListener('input', (e) => {
            materialParams.roughness = parseFloat(e.target.value);
            document.getElementById('valRoughness').textContent = materialParams.roughness.toFixed(1);
            if (currentMesh) {
                currentMesh.material.roughness = materialParams.roughness;
            }
        });
        
        // 线框模式
        document.getElementById('wireframe').addEventListener('change', (e) => {
            materialParams.wireframe = e.target.checked;
            if (currentMesh) {
                currentMesh.material.wireframe = materialParams.wireframe;
            }
        });
        
        // 自动旋转
        document.getElementById('autoRotate').addEventListener('change', (e) => {
            controls.autoRotate = e.target.checked;
        });
        
        // 缩放
        document.getElementById('scale').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            document.getElementById('valScale').textContent = scale.toFixed(1);
            if (currentMesh) {
                currentMesh.scale.setScalar(scale);
            }
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
