<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="模型视频材质效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 模型视频材质</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('threeContainer');

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const urls = [
            '../../images/textures/sky/skybox0/1.png',
            '../../images/textures/sky/skybox0/2.png',
            '../../images/textures/sky/skybox0/3.png',
            '../../images/textures/sky/skybox0/4.png',
            '../../images/textures/sky/skybox0/5.png',
            '../../images/textures/sky/skybox0/6.png'
        ];

        const textureCube = new THREE.CubeTextureLoader().load(urls);
        scene.background = textureCube;

        const video = document.createElement('video');
        video.crossOrigin = 'anonymous';
        video.src = '../../images/textures/test.mp4';
        video.loop = true;
        video.muted = true;
        video.play();

        const texture = await new Promise(r => video.onloadeddata = () => r(new THREE.VideoTexture(video)));

        new GLTFLoader().load('../../models/gltf/zhanguan.glb', (gltf) => {
            gltf.scene.traverse((child) => {
                if (child.isMesh) {
                    child.material.map = texture;
                    child.material.envMap = textureCube;
                }
            });
            scene.add(gltf.scene);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (scene && camera && renderer) {
                        renderer.render(scene, camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
