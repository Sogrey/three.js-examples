<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D热力图 - Heatmap 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a2e;
        }
        #threeContainer {
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }
    </style>
    <!-- heatmap.js -->
    <script src="https://unpkg.com/heatmap.js@2.0.5/build/heatmap.min.js"></script>
</head>
<body>
    <div id="threeContainer"></div>
    <div class="info">3D热力图 - 使用heatmap.js生成高度图</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.179.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.179.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');
        
        // Scene setup
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        // Camera
        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 40, 40);

        // Renderer
        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        // Controls
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 3);
        window.scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        window.scene.add(dirLight);

        // Axes helper
        window.scene.add(new THREE.AxesHelper(50));

        // Generate random data
        const getRandom = (max, min) => Math.round((Math.random() * (max - min + 1) + min) * 10) / 10;

        // Create heatmap
        const heatmapContainer = document.createElement('div');
        heatmapContainer.style.width = '256px';
        heatmapContainer.style.height = '256px';
        heatmapContainer.style.position = 'absolute';
        heatmapContainer.style.left = '-9999px';
        document.body.appendChild(heatmapContainer);

        const heatmap = h337.create({
            container: heatmapContainer,
            width: 256,
            height: 256,
            blur: '0.85',
            radius: 15,
            maxOpacity: 0.8,
            minOpacity: 0.1,
            gradient: {
                0.0: 'blue',
                0.25: 'cyan',
                0.5: 'lime',
                0.75: 'yellow',
                1.0: 'red'
            }
        });

        // Generate random heatmap data - 使用聚类分布
        let max = 100, data = [];
        
        // 创建几个热点中心
        const hotspots = [
            { x: 60, y: 60 },
            { x: 180, y: 80 },
            { x: 120, y: 180 },
            { x: 200, y: 200 },
            { x: 40, y: 150 }
        ];
        
        hotspots.forEach(center => {
            // 每个热点周围生成数据点
            for (let j = 0; j < 300; j++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40;
                data.push({
                    x: Math.max(0, Math.min(255, center.x + Math.cos(angle) * distance)),
                    y: Math.max(0, Math.min(255, center.y + Math.sin(angle) * distance)),
                    value: Math.max(1, 50 - distance) + Math.random() * 20
                });
            }
        });
        
        // 添加一些随机背景点
        for (let j = 0; j < 500; j++) {
            data.push({
                x: getRandom(1, 256),
                y: getRandom(1, 256),
                value: getRandom(1, 20)
            });
        }

        heatmap.setData({
            max: max,
            data: data
        });

        // Create texture from heatmap canvas
        const texture = new THREE.CanvasTexture(heatmap._renderer.canvas);
        
        // Create 3D mesh with shader material
        const geometry = new THREE.PlaneGeometry(50, 50, 200, 200);
        geometry.rotateX(-Math.PI * 0.5);

        const material = new THREE.ShaderMaterial({
            uniforms: {
                heightMap: { value: texture },
                heightRatio: { value: 5 }
            },
            vertexShader: `
                uniform sampler2D heightMap;
                uniform float heightRatio;
                varying vec2 vUv;
                varying float hValue;
                varying vec3 cl;
                
                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    cl = texture2D(heightMap, vUv).rgb;
                    hValue = texture2D(heightMap, vUv).r;
                    pos.y = hValue * heightRatio;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                varying float hValue;
                varying vec3 cl;
                
                void main() {
                    float v = abs(hValue - 1.0);
                    gl_FragColor = vec4(cl, 0.8 - v * v);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);
        window.scene.add(mesh);

        // GUI
        const gui = new GUI();
        gui.domElement.style.top='50px';
        gui.add(material.uniforms.heightRatio, 'value', 1, 15).name('高度比例');
        
        // Regenerate button
        const settings = {
            regenerate: () => {
                // Generate new data with hotspots
                data = [];
                const newHotspots = [
                    { x: getRandom(30, 220), y: getRandom(30, 220) },
                    { x: getRandom(30, 220), y: getRandom(30, 220) },
                    { x: getRandom(30, 220), y: getRandom(30, 220) },
                    { x: getRandom(30, 220), y: getRandom(30, 220) },
                    { x: getRandom(30, 220), y: getRandom(30, 220) }
                ];
                
                newHotspots.forEach(center => {
                    for (let j = 0; j < 300; j++) {
                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 40;
                        data.push({
                            x: Math.max(0, Math.min(255, center.x + Math.cos(angle) * distance)),
                            y: Math.max(0, Math.min(255, center.y + Math.sin(angle) * distance)),
                            value: Math.max(1, 50 - distance) + Math.random() * 20
                        });
                    }
                });
                
                for (let j = 0; j < 500; j++) {
                    data.push({
                        x: getRandom(1, 256),
                        y: getRandom(1, 256),
                        value: getRandom(1, 20)
                    });
                }
                
                heatmap.setData({
                    max: max,
                    data: data
                });
                // Update texture
                material.uniforms.heightMap.value = new THREE.CanvasTexture(heatmap._renderer.canvas);
            }
        };
        gui.add(settings, 'regenerate').name('重新生成');

        // Screenshot support
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    window.renderer.render(window.scene, window.camera);
                    const dataUrl = window.renderer.domElement.toDataURL('image/jpeg', event.data.quality || 0.8);
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('Screenshot failed:', error);
                }
            }
        });

        // Window resize
        window.addEventListener('resize', onWindowResize);

        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>
</body>
</html>
