<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="曲线动画，展示沿曲线运动的动画效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 曲线动画</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #curveUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #curveUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #curveUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #curveUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #curveUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #curveUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #curveInfo {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 100;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="curveUI">
        <h3>〰️ 曲线动画</h3>
        <button class="btn" id="btnBezier">贝塞尔曲线</button>
        <button class="btn" id="btnCatmull">Catmull-Rom曲线</button>
        <button class="btn" id="btnCircle">圆形轨道</button>
        <button class="btn" id="btnFigure8">8字形轨道</button>
        <button class="btn" id="btnMulti">多对象跟随</button>
        <button class="btn" id="btnPause">暂停/继续</button>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            查看沿曲线运动的动画效果
        </div>
    </div>
    
    <div id="curveInfo">
        选择曲线类型查看动画
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // 网格地面
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 当前曲线和动画对象
        let currentCurve = null;
        let curveLine = null;
        let movingObjects = [];
        let animationProgress = 0;
        let isPaused = false;
        let animationSpeed = 0.002;
        
        // 更新信息显示
        function updateInfo(text) {
            document.getElementById('curveInfo').textContent = text;
        }
        
        // 清除之前的曲线和对象
        function clearScene() {
            if (curveLine) {
                scene.remove(curveLine);
                curveLine.geometry.dispose();
                curveLine.material.dispose();
                curveLine = null;
            }
            movingObjects.forEach(obj => {
                scene.remove(obj.mesh);
                obj.mesh.geometry.dispose();
                obj.mesh.material.dispose();
            });
            movingObjects = [];
            currentCurve = null;
            animationProgress = 0;
            isPaused = false;
        }
        
        // 创建曲线可视化
        function createCurveLine(curve, color = 0x00ff00) {
            const points = curve.getPoints(100);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            return line;
        }
        
        // 创建运动对象
        function createMovingObject(color = 0xff8800, size = 0.5) {
            const geometry = new THREE.SphereGeometry(size, 16, 16);
            const material = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.3,
                metalness: 0.7,
                emissive: color,
                emissiveIntensity: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            scene.add(mesh);
            return { mesh, progress: 0, speed: animationSpeed };
        }
        
        // 贝塞尔曲线动画
        function bezierCurveAnimation() {
            clearScene();
            
            // 创建3D贝塞尔曲线
            const curve = new THREE.CubicBezierCurve3(
                new THREE.Vector3(-5, 0, -5),
                new THREE.Vector3(-5, 8, 5),
                new THREE.Vector3(5, 8, -5),
                new THREE.Vector3(5, 0, 5)
            );
            
            currentCurve = curve;
            curveLine = createCurveLine(curve, 0x00ff00);
            
            const obj = createMovingObject(0xff8800, 0.4);
            movingObjects.push(obj);
            
            updateInfo('贝塞尔曲线 - 3D空间运动');
        }
        
        // Catmull-Rom曲线动画
        function catmullRomCurveAnimation() {
            clearScene();
            
            // 创建通过多个点的平滑曲线
            const points = [
                new THREE.Vector3(-8, 0, -8),
                new THREE.Vector3(-4, 5, -4),
                new THREE.Vector3(0, 2, 0),
                new THREE.Vector3(4, 6, 4),
                new THREE.Vector3(8, 0, 8),
                new THREE.Vector3(4, 3, -4),
                new THREE.Vector3(-4, 4, 4),
                new THREE.Vector3(-8, 0, -8)
            ];
            
            const curve = new THREE.CatmullRomCurve3(points, true);
            currentCurve = curve;
            curveLine = createCurveLine(curve, 0x0088ff);
            
            const obj = createMovingObject(0xff0088, 0.4);
            movingObjects.push(obj);
            
            updateInfo('Catmull-Rom曲线 - 平滑插值');
        }
        
        // 圆形轨道动画
        function circleOrbitAnimation() {
            clearScene();
            
            // 创建圆形曲线
            const curve = new THREE.EllipseCurve(
                0, 0,            // ax, aY
                6, 6,            // xRadius, yRadius
                0, 2 * Math.PI,  // aStartAngle, aEndAngle
                false,           // aClockwise
                0                // aRotation
            );
            
            // 将2D曲线转换为3D
            const points3D = curve.getPoints(100).map(p => 
                new THREE.Vector3(p.x, 2, p.y)
            );
            const curve3D = new THREE.CatmullRomCurve3(points3D, true);
            
            currentCurve = curve3D;
            curveLine = createCurveLine(curve3D, 0xffff00);
            
            const obj = createMovingObject(0x00ffff, 0.5);
            movingObjects.push(obj);
            
            updateInfo('圆形轨道 - 匀速圆周运动');
        }
        
        // 8字形轨道动画
        function figure8Animation() {
            clearScene();
            
            // 创建8字形曲线
            const points = [];
            for (let i = 0; i <= 100; i++) {
                const t = (i / 100) * Math.PI * 2;
                const x = Math.sin(t) * 6;
                const z = Math.sin(t * 2) * 3;
                const y = Math.cos(t) * 2 + 3;
                points.push(new THREE.Vector3(x, y, z));
            }
            
            const curve = new THREE.CatmullRomCurve3(points, true);
            currentCurve = curve;
            curveLine = createCurveLine(curve, 0xff00ff);
            
            const obj = createMovingObject(0x88ff00, 0.4);
            movingObjects.push(obj);
            
            updateInfo('8字形轨道 - 复杂轨迹');
        }
        
        // 多对象跟随动画
        function multiObjectAnimation() {
            clearScene();
            
            // 创建螺旋曲线
            const points = [];
            for (let i = 0; i <= 100; i++) {
                const t = (i / 100) * Math.PI * 4;
                const radius = 2 + (i / 100) * 4;
                const x = Math.cos(t) * radius;
                const z = Math.sin(t) * radius;
                const y = (i / 100) * 8;
                points.push(new THREE.Vector3(x, y, z));
            }
            
            const curve = new THREE.CatmullRomCurve3(points);
            currentCurve = curve;
            curveLine = createCurveLine(curve, 0x00ff88);
            
            // 创建多个跟随的对象
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
            for (let i = 0; i < 5; i++) {
                const obj = createMovingObject(colors[i], 0.3);
                obj.progress = i * 0.2;
                obj.speed = animationSpeed * (1 + i * 0.1);
                movingObjects.push(obj);
            }
            
            updateInfo('多对象跟随 - 螺旋上升');
        }
        
        // 暂停/继续
        function togglePause() {
            isPaused = !isPaused;
            updateInfo(isPaused ? '动画已暂停' : '动画继续');
        }
        
        // UI事件
        document.getElementById('btnBezier').addEventListener('click', bezierCurveAnimation);
        document.getElementById('btnCatmull').addEventListener('click', catmullRomCurveAnimation);
        document.getElementById('btnCircle').addEventListener('click', circleOrbitAnimation);
        document.getElementById('btnFigure8').addEventListener('click', figure8Animation);
        document.getElementById('btnMulti').addEventListener('click', multiObjectAnimation);
        document.getElementById('btnPause').addEventListener('click', togglePause);
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新运动对象位置
            if (!isPaused && currentCurve && movingObjects.length > 0) {
                movingObjects.forEach(obj => {
                    obj.progress += obj.speed;
                    if (obj.progress > 1) obj.progress = 0;
                    
                    const position = currentCurve.getPointAt(obj.progress);
                    obj.mesh.position.copy(position);
                    
                    // 计算切线方向用于旋转
                    const tangent = currentCurve.getTangentAt(obj.progress);
                    const lookAtPos = position.clone().add(tangent);
                    obj.mesh.lookAt(lookAtPos);
                });
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // 默认启动贝塞尔曲线动画
        bezierCurveAnimation();
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
