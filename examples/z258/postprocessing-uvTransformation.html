<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UV图像变换，展示UV坐标变换效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - UV图像变换</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #uvUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #uvUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #uvUI .control {
            margin: 10px 0;
        }
        #uvUI label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #uvUI input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #uvUI .value {
            font-size: 10px;
            color: #00ff00;
            text-align: right;
        }
        #uvUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #uvUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #uvUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #uvUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="uvUI">
        <h3>🔄 UV图像变换</h3>
        <div class="control">
            <label>UV缩放</label>
            <input type="range" id="uvScale" min="0.5" max="3" value="1" step="0.1">
            <div class="value" id="scaleValue">1.0</div>
        </div>
        <div class="control">
            <label>UV旋转</label>
            <input type="range" id="uvRotation" min="0" max="6.28" value="0" step="0.1">
            <div class="value" id="rotationValue">0.00</div>
        </div>
        <div class="control">
            <label>UV偏移 X</label>
            <input type="range" id="uvOffsetX" min="-1" max="1" value="0" step="0.05">
            <div class="value" id="offsetXValue">0.00</div>
        </div>
        <div class="control">
            <label>UV偏移 Y</label>
            <input type="range" id="uvOffsetY" min="-1" max="1" value="0" step="0.05">
            <div class="value" id="offsetYValue">0.00</div>
        </div>
        <button class="btn active" id="btnOriginal">原始</button>
        <button class="btn" id="btnWave">波浪</button>
        <button class="btn" id="btnPinch">挤压</button>
        <button class="btn" id="btnTwist">扭曲</button>
        <button class="btn" id="btnAnimate">自动动画</button>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            选择变换模式并调整参数
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);
        
        // 创建程序化纹理
        function createCheckerboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const size = 64;
            for (let y = 0; y < 512; y += size) {
                for (let x = 0; x < 512; x += size) {
                    const isEven = ((x / size) + (y / size)) % 2 === 0;
                    ctx.fillStyle = isEven ? '#ff0088' : '#00ff88';
                    ctx.fillRect(x, y, size, size);
                }
            }
            
            // 添加UV坐标标记
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 512, 512);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 40px Arial';
            ctx.fillText('(0,0)', 10, 45);
            ctx.fillText('(1,0)', 420, 45);
            ctx.fillText('(0,1)', 10, 500);
            ctx.fillText('(1,1)', 420, 500);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }
        
        const texture = createCheckerboardTexture();
        
        // 创建带UV变换的着色器材质
        const UVTransformShader = {
            uniforms: {
                tDiffuse: { value: texture },
                uvScale: { value: 1.0 },
                uvRotation: { value: 0.0 },
                uvOffset: { value: new THREE.Vector2(0, 0) },
                transformMode: { value: 0 }, // 0: original, 1: wave, 2: pinch, 3: twist
                time: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uvScale;
                uniform float uvRotation;
                uniform vec2 uvOffset;
                uniform int transformMode;
                uniform float time;
                varying vec2 vUv;
                
                vec2 transformUV(vec2 uv) {
                    vec2 center = vec2(0.5, 0.5);
                    vec2 delta = uv - center;
                    
                    // 应用缩放
                    delta /= uvScale;
                    
                    // 应用旋转
                    float cosR = cos(uvRotation);
                    float sinR = sin(uvRotation);
                    vec2 rotated = vec2(
                        delta.x * cosR - delta.y * sinR,
                        delta.x * sinR + delta.y * cosR
                    );
                    
                    vec2 result = rotated + center + uvOffset;
                    
                    // 应用变换模式
                    if (transformMode == 1) {
                        // 波浪效果
                        result.x += sin(result.y * 10.0 + time) * 0.05;
                        result.y += cos(result.x * 10.0 + time) * 0.05;
                    } else if (transformMode == 2) {
                        // 挤压效果
                        vec2 dir = result - center;
                        float dist = length(dir);
                        float strength = 1.0 - smoothstep(0.0, 0.5, dist);
                        result -= dir * strength * 0.3;
                    } else if (transformMode == 3) {
                        // 扭曲效果
                        vec2 dir = result - center;
                        float angle = atan(dir.y, dir.x);
                        float dist = length(dir);
                        float twist = dist * 3.0;
                        float newAngle = angle + twist;
                        result = center + vec2(cos(newAngle), sin(newAngle)) * dist;
                    }
                    
                    return result;
                }
                
                void main() {
                    vec2 transformedUV = transformUV(vUv);
                    vec4 color = texture2D(tDiffuse, transformedUV);
                    gl_FragColor = color;
                }
            `
        };
        
        // 创建平面
        const planeGeometry = new THREE.PlaneGeometry(4, 4, 64, 64);
        const planeMaterial = new THREE.ShaderMaterial({
            uniforms: UVTransformShader.uniforms,
            vertexShader: UVTransformShader.vertexShader,
            fragmentShader: UVTransformShader.fragmentShader,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);
        
        // 创建边框
        const borderGeometry = new THREE.BoxGeometry(4.1, 0.05, 4.1);
        const borderMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const border = new THREE.Mesh(borderGeometry, borderMaterial);
        border.position.y = 0.025;
        scene.add(border);
        
        // 创建参考网格
        const gridHelper = new THREE.GridHelper(10, 10, 0x333333, 0x222222);
        scene.add(gridHelper);
        
        // 动画变量
        let time = 0;
        let isAnimating = false;
        let transformMode = 0;
        
        // UI控制
        const uvScaleSlider = document.getElementById('uvScale');
        const scaleValueDisplay = document.getElementById('scaleValue');
        const uvRotationSlider = document.getElementById('uvRotation');
        const rotationValueDisplay = document.getElementById('rotationValue');
        const uvOffsetXSlider = document.getElementById('uvOffsetX');
        const offsetXValueDisplay = document.getElementById('offsetXValue');
        const uvOffsetYSlider = document.getElementById('uvOffsetY');
        const offsetYValueDisplay = document.getElementById('offsetYValue');
        
        uvScaleSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            scaleValueDisplay.textContent = value.toFixed(1);
            planeMaterial.uniforms.uvScale.value = value;
        });
        
        uvRotationSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            rotationValueDisplay.textContent = value.toFixed(2);
            planeMaterial.uniforms.uvRotation.value = value;
        });
        
        uvOffsetXSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            offsetXValueDisplay.textContent = value.toFixed(2);
            planeMaterial.uniforms.uvOffset.value.x = value;
        });
        
        uvOffsetYSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            offsetYValueDisplay.textContent = value.toFixed(2);
            planeMaterial.uniforms.uvOffset.value.y = value;
        });
        
        function setTransformMode(mode, btnId) {
            transformMode = mode;
            planeMaterial.uniforms.transformMode.value = mode;
            document.querySelectorAll('#uvUI .btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
        }
        
        document.getElementById('btnOriginal').addEventListener('click', () => setTransformMode(0, 'btnOriginal'));
        document.getElementById('btnWave').addEventListener('click', () => setTransformMode(1, 'btnWave'));
        document.getElementById('btnPinch').addEventListener('click', () => setTransformMode(2, 'btnPinch'));
        document.getElementById('btnTwist').addEventListener('click', () => setTransformMode(3, 'btnTwist'));
        
        document.getElementById('btnAnimate').addEventListener('click', () => {
            isAnimating = !isAnimating;
            document.getElementById('btnAnimate').textContent = isAnimating ? '停止动画' : '自动动画';
            document.getElementById('btnAnimate').classList.toggle('active');
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            planeMaterial.uniforms.time.value = time;
            
            if (isAnimating) {
                // 自动动画：旋转UV
                const rotation = time * 0.5;
                uvRotationSlider.value = rotation % 6.28;
                rotationValueDisplay.textContent = (rotation % 6.28).toFixed(2);
                planeMaterial.uniforms.uvRotation.value = rotation;
                
                // 动态缩放
                const scale = 1 + Math.sin(time) * 0.5;
                uvScaleSlider.value = scale;
                scaleValueDisplay.textContent = scale.toFixed(1);
                planeMaterial.uniforms.uvScale.value = scale;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
