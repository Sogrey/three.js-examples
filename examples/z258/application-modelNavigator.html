<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D模型导航系统，支持多种几何体预览和相机导航">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D模型导航</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #navUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 250px;
        }
        #navUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #navUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        #navUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #navUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #navUI .info {
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
        }
        #modelInfo {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 100;
            text-align: center;
        }
        #modelInfo .name {
            font-size: 24px;
            margin-bottom: 5px;
        }
        #modelInfo .stats {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="navUI">
        <h3>3D模型导航</h3>
        <button class="btn" id="btnPrev">← 上一个模型</button>
        <button class="btn" id="btnNext">下一个模型 →</button>
        <button class="btn" id="btnAuto">自动轮播</button>
        <button class="btn" id="btnWireframe">线框模式</button>
        <div class="info">
            左键拖拽旋转<br>
            滚轮缩放<br>
            右键平移
        </div>
    </div>
    
    <div id="modelInfo">
        <div class="name" id="modelName">Cube</div>
        <div class="stats" id="modelStats">顶点: 8 | 面: 12</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        const pointLight = new THREE.PointLight(0x00ff00, 0.5, 20);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);
        
        // 网格地面
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 模型数据
        const models = [
            {
                name: '立方体',
                create: () => new THREE.BoxGeometry(2, 2, 2),
                color: 0x00ff00
            },
            {
                name: '球体',
                create: () => new THREE.SphereGeometry(1.5, 32, 32),
                color: 0x0088ff
            },
            {
                name: '圆柱体',
                create: () => new THREE.CylinderGeometry(1, 1, 3, 32),
                color: 0xff8800
            },
            {
                name: '圆锥体',
                create: () => new THREE.ConeGeometry(1.5, 3, 32),
                color: 0xff0088
            },
            {
                name: '圆环体',
                create: () => new THREE.TorusGeometry(1.5, 0.5, 16, 100),
                color: 0x8800ff
            },
            {
                name: '扭结',
                create: () => new THREE.TorusKnotGeometry(1, 0.3, 100, 16),
                color: 0xffff00
            },
            {
                name: '二十面体',
                create: () => new THREE.IcosahedronGeometry(1.5, 0),
                color: 0x00ffff
            },
            {
                name: '八面体',
                create: () => new THREE.OctahedronGeometry(1.5, 0),
                color: 0xff8800
            }
        ];
        
        let currentIndex = 0;
        let currentMesh = null;
        let wireframeMode = false;
        
        // 创建材质
        function createMaterial(color) {
            return new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.7,
                wireframe: wireframeMode
            });
        }
        
        // 加载模型
        function loadModel(index) {
            // 移除旧模型
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }
            
            const modelData = models[index];
            const geometry = modelData.create();
            const material = createMaterial(modelData.color);
            
            currentMesh = new THREE.Mesh(geometry, material);
            currentMesh.castShadow = true;
            currentMesh.receiveShadow = true;
            currentMesh.position.y = 1.5;
            
            scene.add(currentMesh);
            
            // 更新UI
            document.getElementById('modelName').textContent = modelData.name;
            
            // 计算统计信息
            const positions = geometry.attributes.position;
            const vertices = positions.count;
            let faces = 0;
            if (geometry.index) {
                faces = geometry.index.count / 3;
            } else {
                faces = vertices / 3;
            }
            document.getElementById('modelStats').textContent = `顶点: ${vertices} | 面: ${Math.floor(faces)}`;
            
            // 重置相机
            controls.reset();
            camera.position.set(5, 5, 5);
            controls.target.set(0, 1.5, 0);
            
            // 更新点光源颜色
            pointLight.color.setHex(modelData.color);
        }
        
        // 初始加载
        loadModel(0);
        
        // 自动轮播
        let autoPlay = false;
        let autoInterval;
        
        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            document.getElementById('btnAuto').classList.toggle('active');
            controls.autoRotate = !autoPlay; // 自动播放时停止旋转
            
            if (autoPlay) {
                autoInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % models.length;
                    loadModel(currentIndex);
                }, 3000);
            } else {
                clearInterval(autoInterval);
                controls.autoRotate = true;
            }
        }
        
        // UI事件
        document.getElementById('btnPrev').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + models.length) % models.length;
            loadModel(currentIndex);
        });
        
        document.getElementById('btnNext').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % models.length;
            loadModel(currentIndex);
        });
        
        document.getElementById('btnAuto').addEventListener('click', toggleAutoPlay);
        
        document.getElementById('btnWireframe').addEventListener('click', () => {
            wireframeMode = !wireframeMode;
            document.getElementById('btnWireframe').classList.toggle('active');
            if (currentMesh) {
                currentMesh.material.wireframe = wireframeMode;
            }
        });
        
        // 键盘导航
        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'ArrowLeft':
                    currentIndex = (currentIndex - 1 + models.length) % models.length;
                    loadModel(currentIndex);
                    break;
                case 'ArrowRight':
                    currentIndex = (currentIndex + 1) % models.length;
                    loadModel(currentIndex);
                    break;
                case 'Space':
                    toggleAutoPlay();
                    break;
            }
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
