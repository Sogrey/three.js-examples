<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="模型天空 - Three.js程序化天空盒">
    <title>模型天空 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 12px;
        }
        #controls h3 { color: #87CEEB; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls select { width: 100%; padding: 5px; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #87CEEB; float: right; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>☁️ 模型天空</h3>
        <div class="control-group">
            <label>时间 <span class="value" id="timeValue">12:00</span></label>
            <input type="range" id="timeRange" min="0" max="24" step="0.1" value="12">
        </div>
        <div class="control-group">
            <label>云量 <span class="value" id="cloudValue">0.5</span></label>
            <input type="range" id="cloudRange" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>太阳强度 <span class="value" id="sunValue">1.0</span></label>
            <input type="range" id="sunRange" min="0" max="2" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>天空类型</label>
            <select id="skyType">
                <option value="day">白天</option>
                <option value="sunset">日落</option>
                <option value="night">夜晚</option>
            </select>
        </div>
        <button id="btnToggleAuto">⏯️ 自动时间</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 防止穿过地面

        // 创建程序化天空盒
        function createSkyBox() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 绘制天空渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, 1024);
            gradient.addColorStop(0, '#1e3c72');   // 深蓝
            gradient.addColorStop(0.5, '#2a5298'); // 中蓝
            gradient.addColorStop(1, '#87CEEB');   // 天蓝
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1024);

            // 绘制云朵
            function drawCloud(x, y, size) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.arc(x + size * 0.5, y - size * 0.2, size * 0.8, 0, Math.PI * 2);
                ctx.arc(x - size * 0.5, y - size * 0.2, size * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 15; i++) {
                drawCloud(
                    Math.random() * 1024,
                    Math.random() * 512 + 256,
                    30 + Math.random() * 50
                );
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // 创建天空球
        const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
        const skyMaterial = new THREE.MeshBasicMaterial({
            map: createSkyBox(),
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
        scene.add(sky);

        // 创建地面
        const groundGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x3a5f3a,
            roughness: 0.8,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 添加地形起伏
        const positions = groundGeometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const z = positions[i + 2];
            positions[i + 1] = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2;
        }
        groundGeometry.computeVertexNormals();

        // 添加树木
        function createTree(x, z) {
            const group = new THREE.Group();

            // 树干
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.5, 2, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1;
            trunk.castShadow = true;
            group.add(trunk);

            // 树叶
            const leavesGeometry = new THREE.ConeGeometry(2, 4, 8);
            const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 3;
            leaves.castShadow = true;
            group.add(leaves);

            group.position.set(x, 0, z);
            return group;
        }

        for (let i = 0; i < 20; i++) {
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80;
            scene.add(createTree(x, z));
        }

        // 添加建筑物
        function createBuilding(x, z, height) {
            const geometry = new THREE.BoxGeometry(4, height, 4);
            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(Math.random() * 0.1 + 0.05, 0.3, 0.5)
            });
            const building = new THREE.Mesh(geometry, material);
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            return building;
        }

        for (let i = 0; i < 5; i++) {
            const x = (Math.random() - 0.5) * 60;
            const z = (Math.random() - 0.5) * 60;
            const height = 5 + Math.random() * 15;
            scene.add(createBuilding(x, z, height));
        }

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // 配置
        const config = {
            time: 12,
            cloudiness: 0.5,
            sunIntensity: 1,
            autoTime: false
        };

        // 更新天空
        function updateSky() {
            const hour = config.time;
            let skyColor, sunColor, intensity;

            if (hour >= 6 && hour < 18) {
                // 白天
                const t = Math.sin((hour - 6) / 12 * Math.PI);
                skyColor = new THREE.Color().lerpColors(
                    new THREE.Color(0xff6b35), // 日出/日落
                    new THREE.Color(0x87CEEB), // 正午
                    t
                );
                sunColor = new THREE.Color(0xffffff);
                intensity = config.sunIntensity;
            } else {
                // 夜晚
                skyColor = new THREE.Color(0x0a0a2e);
                sunColor = new THREE.Color(0x4444ff);
                intensity = 0.2;
            }

            scene.background = skyColor;
            scene.fog = new THREE.Fog(skyColor, 20, 150);
            sunLight.color = sunColor;
            sunLight.intensity = intensity;
            ambientLight.intensity = 0.2 + intensity * 0.3;

            // 更新太阳位置
            const angle = (hour - 6) / 12 * Math.PI;
            sunLight.position.set(
                Math.cos(angle) * 100,
                Math.sin(angle) * 100,
                50
            );
        }

        // 动画
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // 自动时间
            if (config.autoTime) {
                config.time += delta * 0.5;
                if (config.time >= 24) config.time = 0;
                document.getElementById('timeRange').value = config.time;
                updateTimeDisplay();
                updateSky();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 更新时间显示
        function updateTimeDisplay() {
            const hour = Math.floor(config.time);
            const minute = Math.floor((config.time - hour) * 60);
            document.getElementById('timeValue').textContent = 
                `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
        }

        // 控制面板事件
        document.getElementById('timeRange').addEventListener('input', (e) => {
            config.time = parseFloat(e.target.value);
            updateTimeDisplay();
            updateSky();
        });

        document.getElementById('cloudRange').addEventListener('input', (e) => {
            config.cloudiness = parseFloat(e.target.value);
            document.getElementById('cloudValue').textContent = config.cloudiness.toFixed(1);
        });

        document.getElementById('sunRange').addEventListener('input', (e) => {
            config.sunIntensity = parseFloat(e.target.value);
            document.getElementById('sunValue').textContent = config.sunIntensity.toFixed(1);
            updateSky();
        });

        document.getElementById('skyType').addEventListener('change', (e) => {
            switch(e.target.value) {
                case 'day': config.time = 12; break;
                case 'sunset': config.time = 18; break;
                case 'night': config.time = 0; break;
            }
            document.getElementById('timeRange').value = config.time;
            updateTimeDisplay();
            updateSky();
        });

        document.getElementById('btnToggleAuto').addEventListener('click', () => {
            config.autoTime = !config.autoTime;
            document.getElementById('btnToggleAuto').textContent = 
                config.autoTime ? '⏸️ 停止自动' : '⏯️ 自动时间';
        });

        // 初始化
        updateTimeDisplay();
        updateSky();
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
