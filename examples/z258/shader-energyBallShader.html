<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示能量球效果，使用着色器实现动态能量球脉冲动画" />
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 能量球</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 5, 5);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.renderer.setSize(w, h);
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
        });

        const params = {
            color: '#ff8800',
            pulseSpeed: 2.0,
            intensity: 1.0
        };

        const energyBallShader = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0.0 },
                color: { value: new THREE.Color(params.color) },
                intensity: { value: params.intensity }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vPosition;
                void main() {
                    vUv = uv;
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 color;
                uniform float intensity;
                varying vec2 vUv;
                varying vec3 vPosition;

                void main() {
                    vec2 center = vec2(0.5, 0.5);
                    float dist = length(vUv - center);
                    float pulse = sin(time * 2.0) * 0.5 + 0.5;
                    float alpha = smoothstep(0.5, 0.0, dist) * pulse * intensity;
                    vec3 finalColor = mix(color, vec3(1.0), 1.0 - dist);
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const energyBall = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), energyBallShader);
        energyBall.rotation.x = -Math.PI / 2;
        energyBall.position.y = 0.1;
        window.scene.add(energyBall);

        const buildings = new THREE.Group();
        const buildingCount = 50;

        for (let i = 0; i < buildingCount; i++) {
            const height = Math.random() * 5 + 1;
            const geometry = new THREE.BoxGeometry(1, height, 1);
            const material = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });

            const building = new THREE.Mesh(geometry, material);
            building.position.set((Math.random() - 0.5) * 20, height / 2, (Math.random() - 0.5) * 20);
            buildings.add(building);
        }
        window.scene.add(buildings);

        window.scene.add(new THREE.AmbientLight(0x333333));
        const pointLight = new THREE.PointLight(0xff9900, 2, 20);
        pointLight.position.set(0, 5, 0);
        window.scene.add(pointLight);

        const gui = new GUI();
        gui.domElement.style.position = 'absolute';
        gui.domElement.style.top = '50px';
        gui.domElement.style.right = '10px';
        gui.domElement.style.zIndex = '1000';
        gui.addColor(params, 'color').name('能量球颜色').onChange(value => {
            energyBallShader.uniforms.color.value.set(value);
        });
        gui.add(params, 'pulseSpeed', 0.1, 5.0).name('脉冲速度').onChange(value => {
            energyBallShader.uniforms.time.value = value * 0.01;
        });
        gui.add(params, 'intensity', 0.1, 2.0).name('强度').onChange(value => {
            energyBallShader.uniforms.intensity.value = value;
        });

        function animate() {
            energyBallShader.uniforms.time.value += 0.016;
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) {
                            window.composer.render();
                        } else if (window.renderer) {
                            window.renderer.render(window.scene, window.camera);
                        }
                    }

                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
