<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="人物虚化效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 人物虚化</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body { margin: 0; overflow: hidden; }
        #threeContainer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const modelUrl = 'https://ylfq.github.io/model/walk.fbx';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a1a);

        window.camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 140);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0x1a1a1a);
        window.renderer.shadowMap.enabled = true;
        window.renderer.shadowMap.type = THREE.PCFShadowMap;
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        const light_ambient = new THREE.AmbientLight(0xffffff, 0.7);
        window.scene.add(light_ambient);

        const light_directional = new THREE.DirectionalLight(0xffffff, 0.8);
        light_directional.position.set(200, 200, 200);
        light_directional.castShadow = true;
        light_directional.shadow.camera.left = -100;
        light_directional.shadow.camera.right = 100;
        light_directional.shadow.camera.top = 100;
        light_directional.shadow.camera.bottom = -100;
        light_directional.shadow.camera.near = 1;
        light_directional.shadow.camera.far = 1000;
        light_directional.shadow.mapSize.width = 1024;
        light_directional.shadow.mapSize.height = 1024;
        window.scene.add(light_directional);

        const modelMaterialUniforms = {
            blur: 0.85,
            blockSize: 12.0,
        };

        let mixer;
        let model;

        const loader_fbx = new FBXLoader();
        try {
            model = await loader_fbx.loadAsync(modelUrl);
            model.traverse((obj) => {
                if (obj instanceof THREE.Mesh) {
                    obj.castShadow = true;
                    obj.receiveShadow = true;

                    const m = obj.material;
                    m.onBeforeCompile = (shader) => {
                        shader.uniforms.blur = {
                            get value() {
                                return modelMaterialUniforms.blur;
                            },
                        };
                        shader.uniforms.blockSize = {
                            get value() {
                                return modelMaterialUniforms.blockSize;
                            },
                        };

                        shader.fragmentShader = shader.fragmentShader.replace(
                            `void main() {`,
                            `
                          uniform float blur;
                          uniform float blockSize;

                          const mat4 blurMatrix = mat4(
                            0.1, 0.5, 0.7, 0.3,
                            0.6, 0.6, 0.9, 0.8,
                            0.8, 1.0, 0.2, 0.6,
                            0.3, 0.7, 0.5, 0.4
                          );

                          void main() {
                            ivec2 xyInBlur = ivec2(fract(gl_FragCoord.xy / blockSize) * 4.0);
                            if (blurMatrix[xyInBlur.y][xyInBlur.x] <= blur) discard;
                        `
                        );
                    };
                }
            });

            mixer = new THREE.AnimationMixer(model);
            const action = mixer.clipAction(model.animations[0]);
            action.setLoop(THREE.LoopRepeat);
            action.play();

            if (model.children[2] && model.children[2].children[0]) {
                model.children[2].children[0].position.set(0, 0, 0);
            }

            window.scene.add(model);
        } catch (error) {
            console.error('模型加载失败:', error);
        }

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const timer = new THREE.Timer();

        function animate() {
            requestAnimationFrame(animate);
            const delta = timer.getDelta();
            const elapsed = timer.getElapsed();

            timer.update();

            controls.update(delta);

            if (mixer) {
                mixer.update(delta * 0.9);
            }

            if (model && model.children[2] && model.children[2].children[0]) {
                model.children[2].children[0].position.set(0, 0, 0);
            }

            window.renderer.render(window.scene, window.camera);
        }

        animate();

        const data = {
            blur: 0.85,
            blockSize: 12.0,
        };

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.title('人物虚化参数调节');
        gui.add(data, 'blur', 0, 1, 0.001).name('虚化强度').onChange(v => {
            modelMaterialUniforms.blur = v;
        });
        gui.add(data, 'blockSize', 2.0, 20.0, 1).name('虚化区块大小').onChange(v => {
            modelMaterialUniforms.blockSize = v;
        });

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
