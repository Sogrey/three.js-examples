<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="数学公式应用 - 使用数学函数生成3D曲面">
    <title>数学公式应用 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls select, #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
        #formula {
            background: rgba(255,255,255,0.1);
            padding: 8px; border-radius: 4px;
            font-family: monospace; font-size: 11px;
            margin-top: 10px; word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>📐 数学公式应用</h3>
        <div class="control-group">
            <label>选择曲面</label>
            <select id="surfaceSelect">
                <option value="sine">正弦波曲面</option>
                <option value="ripple">涟漪效果</option>
                <option value="saddle">马鞍面</option>
                <option value="torus">环面</option>
                <option value="klein">克莱因瓶</option>
                <option value="mobius">莫比乌斯环</option>
            </select>
        </div>
        <div class="control-group">
            <label>缩放 <span class="value" id="scaleValue">1.0</span></label>
            <input type="range" id="scaleRange" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>动画速度 <span class="value" id="speedValue">1.0</span></label>
            <input type="range" id="speedRange" min="0" max="3" step="0.1" value="1">
        </div>
        <button id="btnWireframe">🔲 切换线框</button>
        <div id="formula">z = sin(x) * cos(y)</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        
        const pointLight = new THREE.PointLight(0x4a9eff, 0.5);
        pointLight.position.set(-10, 10, -10);
        scene.add(pointLight);

        // 当前曲面和参数
        let currentMesh = null;
        let currentSurface = 'sine';
        let scale = 1.0;
        let animationSpeed = 1.0;
        let isWireframe = false;
        let time = 0;

        // 数学曲面函数
        const surfaces = {
            sine: {
                formula: 'z = sin(x) * cos(y)',
                func: (x, y, t) => {
                    return Math.sin(x * scale + t) * Math.cos(y * scale);
                }
            },
            ripple: {
                formula: 'z = sin(√(x²+y²) - t) / (√(x²+y²) + 0.1)',
                func: (x, y, t) => {
                    const r = Math.sqrt(x*x + y*y);
                    return Math.sin(r * scale - t * 2) / (r + 0.1);
                }
            },
            saddle: {
                formula: 'z = x² - y²',
                func: (x, y, t) => {
                    return (x * x - y * y) * scale * 0.1;
                }
            },
            torus: {
                formula: '环面参数方程',
                func: null // 特殊处理
            },
            klein: {
                formula: '克莱因瓶参数方程',
                func: null // 特殊处理
            },
            mobius: {
                formula: '莫比乌斯环参数方程',
                func: null // 特殊处理
            }
        };

        // 创建参数化曲面
        function createParametricSurface(type) {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }

            let geometry;
            
            if (type === 'torus') {
                geometry = new THREE.TorusGeometry(5 * scale, 2 * scale, 32, 100);
            } else if (type === 'klein') {
                // 克莱因瓶参数方程
                geometry = new THREE.ParametricGeometry((u, v, target) => {
                    u *= Math.PI * 2;
                    v *= Math.PI * 2;
                    const R = 5 * scale;
                    const r = 2 * scale;
                    const x = (R + r * Math.cos(v/2) * Math.sin(u) - r * Math.sin(v/2) * Math.sin(2*u)) * Math.cos(v);
                    const y = (R + r * Math.cos(v/2) * Math.sin(u) - r * Math.sin(v/2) * Math.sin(2*u)) * Math.sin(v);
                    const z = r * Math.sin(v/2) * Math.sin(u) + r * Math.cos(v/2) * Math.sin(2*u);
                    target.set(x, y, z);
                }, 50, 50);
            } else if (type === 'mobius') {
                // 莫比乌斯环参数方程
                geometry = new THREE.ParametricGeometry((u, v, target) => {
                    u = u * 2 * Math.PI;
                    v = (v - 0.5) * 2;
                    const R = 5 * scale;
                    const x = (R + v * Math.cos(u/2)) * Math.cos(u);
                    const y = (R + v * Math.cos(u/2)) * Math.sin(u);
                    const z = v * Math.sin(u/2);
                    target.set(x, y, z);
                }, 100, 20);
            } else {
                // 函数曲面
                geometry = new THREE.PlaneGeometry(20, 20, 64, 64);
                const positions = geometry.attributes.position.array;
                
                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i];
                    const y = positions[i + 1];
                    const z = surfaces[type].func(x, y, time);
                    positions[i + 2] = z;
                }
                
                geometry.computeVertexNormals();
            }

            const material = new THREE.MeshStandardMaterial({
                color: 0x4a9eff,
                wireframe: isWireframe,
                side: THREE.DoubleSide,
                roughness: 0.3,
                metalness: 0.7
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
            
            // 更新公式显示
            document.getElementById('formula').textContent = surfaces[type].formula;
        }

        // 更新函数曲面
        function updateFunctionSurface() {
            if (!currentMesh || !surfaces[currentSurface].func) return;
            
            const positions = currentMesh.geometry.attributes.position.array;
            
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                const z = surfaces[currentSurface].func(x, y, time);
                positions[i + 2] = z;
            }
            
            currentMesh.geometry.attributes.position.needsUpdate = true;
            currentMesh.geometry.computeVertexNormals();
        }

        // 初始化
        createParametricSurface('sine');

        // 动画
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            time += delta * animationSpeed;
            
            // 更新函数曲面
            if (surfaces[currentSurface].func) {
                updateFunctionSurface();
            }
            
            // 旋转效果
            if (currentMesh) {
                currentMesh.rotation.y += delta * 0.1 * animationSpeed;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('surfaceSelect').addEventListener('change', (e) => {
            currentSurface = e.target.value;
            createParametricSurface(currentSurface);
        });

        document.getElementById('scaleRange').addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
            document.getElementById('scaleValue').textContent = scale.toFixed(1);
            createParametricSurface(currentSurface);
        });

        document.getElementById('speedRange').addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = animationSpeed.toFixed(1);
        });

        document.getElementById('btnWireframe').addEventListener('click', () => {
            isWireframe = !isWireframe;
            if (currentMesh) {
                currentMesh.material.wireframe = isWireframe;
            }
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
