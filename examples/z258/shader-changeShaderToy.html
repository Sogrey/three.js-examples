<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="切换ShaderToy - 展示多个ShaderToy效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 切换ShaderToy</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 10, 10);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            if (shaderMaterial) {
                shaderMaterial.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            }
        });

        window.scene.add(new THREE.AmbientLight(0xffffff, 8));

        const mesh = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        window.scene.add(mesh);

        const shaderEffects = {
            '波纹': `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                varying vec2 vUv;

                void main() {
                    vec2 st = vUv * u_resolution.xy;
                    vec2 center = u_resolution.xy * 0.5;
                    float dist = length(st - center);
                    float wave = sin(dist * 0.02 - u_time * 3.0) * 0.1 + 0.5;
                    vec3 color = vec3(wave, wave * 0.5, 1.0 - wave);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            '火焰': `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                varying vec2 vUv;

                void main() {
                    vec2 st = vUv;
                    float noise = sin(st.x * 10.0 + u_time) * 0.5 + 0.5;
                    noise += sin(st.y * 10.0 + u_time * 0.7) * 0.3;
                    float gradient = 1.0 - st.y;
                    float fire = smoothstep(0.3, 0.8, noise + gradient - u_time * 0.2);
                    vec3 color = mix(vec3(0.1, 0.05, 0.0), vec3(1.0, 0.5, 0.0), fire);
                    color = mix(color, vec3(1.0, 1.0, 0.5), smoothstep(0.8, 1.0, fire));
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            '星空': `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                varying vec2 vUv;

                float rand(vec2 co) {
                    return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
                }

                void main() {
                    vec2 st = vUv;
                    float stars = 0.0;
                    for(int i=0; i<5; i++) {
                        float x = rand(vec2(float(i), st.y + u_time * 0.1));
                        float y = rand(vec2(st.x + u_time * 0.1, float(i)));
                        stars += smoothstep(0.95, 1.0, rand(st + vec2(x, y) + u_time * 0.01));
                    }
                    vec3 color = vec3(stars);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            '网格': `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                varying vec2 vUv;

                void main() {
                    vec2 st = vUv * 20.0;
                    vec2 grid = abs(fract(st - 0.5) - 0.5) / fwidth(st);
                    float line = min(grid.x, grid.y);
                    float animate = sin(u_time) * 0.5 + 0.5;
                    vec3 color = mix(vec3(0.1), vec3(0.8), smoothstep(0.0, 1.5, line));
                    color = mix(color, vec3(0.0, 0.5, 1.0), animate);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            '漩涡': `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                varying vec2 vUv;

                void main() {
                    vec2 st = vUv - 0.5;
                    float angle = atan(st.y, st.x);
                    float radius = length(st);
                    float spiral = angle + radius * 8.0 + u_time * 2.0;
                    float color = sin(spiral * 4.0) * 0.5 + 0.5;
                    vec3 col = vec3(color, color * 0.5, 1.0 - color);
                    gl_FragColor = vec4(col, 1.0);
                }
            `,
            '脉冲': `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                varying vec2 vUv;

                void main() {
                    vec2 st = vUv - 0.5;
                    float dist = length(st);
                    float pulse = sin(dist * 15.0 - u_time * 3.0) * 0.5 + 0.5;
                    float ring = smoothstep(0.2, 0.3, dist) - smoothstep(0.3, 0.4, dist);
                    vec3 color = vec3(pulse * ring * 2.0);
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        };

        let shaderMaterial = null;

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        const selectedEffect = { name: '波纹' };
        gui.add(selectedEffect, 'name', Object.keys(shaderEffects)).name('效果').onChange((name) => {
            changeShader(shaderEffects[name]);
        });

        function changeShader(fragmentShader) {
            const uniforms = THREE.UniformsUtils.merge([
                THREE.ShaderLib['phong'].uniforms,
                {
                    u_resolution: {
                        type: 'v2',
                        value: new THREE.Vector2(window.innerWidth, window.innerHeight)
                    },
                    u_time: {
                        type: 'f',
                        value: 0.0
                    },
                    u_mouse: {
                        type: 'v2',
                        value: new THREE.Vector2(0, 0)
                    }
                }
            ]);

            shaderMaterial = new THREE.ShaderMaterial({
                uniforms: uniforms,
                side: THREE.DoubleSide,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: fragmentShader
            });

            if (mesh.material) {
                mesh.material.dispose();
            }
            mesh.material = shaderMaterial;
        }

        changeShader(shaderEffects['波纹']);

        function animate() {
            if (shaderMaterial) {
                shaderMaterial.uniforms.u_time.value += 0.02;
            }
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
