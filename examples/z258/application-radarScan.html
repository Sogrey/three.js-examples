<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="使用Three.js创建雷达扫描效果，通过自定义着色器实现雷达扫描动画和尾迹效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 雷达扫描</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 配置与常量
        const CONFIG = {
            grid: { size: 1000, divisions: 20, color1: 0x345678, color2: 0x123456 },
            radar: {
                position: { x: 0, y: 20, z: 0 },
                radius: 240,
                color: '#2288ff',
                scanColor: '#00ffaa',
                opacity: 0.5,
                speed: 300,
                followWidth: 220,
                rings: 3
            },
            markers: {
                ringColor: 0x3399aa,
                lineColor: 0x3399aa,
                opacity: 0.3,
                angleCount: 12
            }
        };

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10000);
        window.camera.position.set(0, 800, 1000);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 辅助网格
        const gridHelper = new THREE.GridHelper(
            CONFIG.grid.size,
            CONFIG.grid.divisions,
            CONFIG.grid.color1,
            CONFIG.grid.color2
        );
        window.scene.add(gridHelper);

        // 颜色转换工具函数
        const hexToRgb = hex => {
            hex = hex.replace('#', '');
            return {
                r: parseInt(hex.substring(0, 2), 16) / 255,
                g: parseInt(hex.substring(2, 4), 16) / 255,
                b: parseInt(hex.substring(4, 6), 16) / 255
            };
        };

        // 添加圆形雷达范围标记
        function createRadarMarkers(radius, count) {
            const { ringColor, lineColor, opacity, angleCount } = CONFIG.markers;
            const markers = new THREE.Group();

            // 创建同心圆
            const ringMaterial = new THREE.LineBasicMaterial({
                color: ringColor,
                opacity,
                transparent: true
            });

            for (let i = 1; i <= count; i++) {
                const circle = new THREE.RingGeometry(
                    radius * i / count,
                    radius * i / count + 1,
                    100
                );
                const line = new THREE.LineSegments(
                    new THREE.EdgesGeometry(circle),
                    ringMaterial
                );
                line.rotation.x = Math.PI / 2;
                markers.add(line);
            }

            // 添加角度标记线
            const angleMaterial = new THREE.LineBasicMaterial({
                color: lineColor,
                opacity: opacity - 0.1,
                transparent: true
            });

            for (let i = 0; i < angleCount; i++) {
                const angle = (i * (360 / angleCount)) * Math.PI / 180;
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius)
                ]);
                markers.add(new THREE.Line(lineGeometry, angleMaterial));
            }

            return markers;
        }

        // 创建并添加雷达标记
        const radarMarkers = createRadarMarkers(CONFIG.radar.radius, CONFIG.radar.rings);
        window.scene.add(radarMarkers);

        // 雷达扫描区域
        const { position, radius, opacity } = CONFIG.radar;
        const radarColor = hexToRgb(CONFIG.radar.color);
        const scanColor = hexToRgb(CONFIG.radar.scanColor);

        // 创建雷达圆盘
        const circleGeometry = new THREE.CircleGeometry(radius, 1000);
        circleGeometry.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI / 2));

        const material = new THREE.MeshBasicMaterial({
            color: new THREE.Color(radarColor.r, radarColor.g, radarColor.b),
            opacity,
            transparent: true
        });

        const radar = new THREE.Mesh(circleGeometry, material);
        radar.position.set(position.x, position.y, position.z);
        window.scene.add(radar);

        // 添加雷达中心点
        const centerGeometry = new THREE.SphereGeometry(5, 16, 16);
        const centerMaterial = new THREE.MeshBasicMaterial({
            color: new THREE.Color(scanColor.r, scanColor.g, scanColor.b)
        });
        const radarCenter = new THREE.Mesh(centerGeometry, centerMaterial);
        radarCenter.position.set(position.x, position.y + 5, position.z);
        window.scene.add(radarCenter);

        // 设置雷达着色器
        material.onBeforeCompile = (shader) => {
            // 设置着色器uniforms
            Object.assign(shader.uniforms, {
                uSpeed: { value: CONFIG.radar.speed },
                uRadius: { value: radius },
                uTime: { value: 0 },
                uFollowWidth: { value: CONFIG.radar.followWidth },
                uRadarColor: { value: new THREE.Color(radarColor.r, radarColor.g, radarColor.b) },
                uScanColor: { value: new THREE.Color(scanColor.r, scanColor.g, scanColor.b) }
            });

            // 更新时间
            requestAnimationFrame(function update(time) {
                shader.uniforms.uTime.value = time / 1000;
                requestAnimationFrame(update);
            });

            // 顶点着色器
            const vertex = `
                varying vec3 vPosition;
                void main() {
                    vPosition = position;
            `;
            shader.vertexShader = shader.vertexShader.replace('void main() {', vertex);

            // 片段着色器
            const fragment = `
                uniform float uRadius;
                uniform float uTime;
                uniform float uSpeed;
                uniform float uFollowWidth;
                uniform vec3 uRadarColor;
                uniform vec3 uScanColor;
                varying vec3 vPosition;

                // 计算角度
                float calcAngle(vec3 oFrag) {
                    float fragAngle;
                    const vec3 ox = vec3(1,0,0);

                    float dianji = oFrag.x * ox.x + oFrag.z * ox.z;
                    float oFrag_length = length(oFrag);
                    float ox_length = length(ox);
                    float yuxian = dianji / (oFrag_length * ox_length);

                    fragAngle = degrees(acos(yuxian));
                    if(oFrag.z > 0.0) {
                        fragAngle = -fragAngle + 360.0;
                    }

                    float scanAngle = uTime * uSpeed - floor(uTime * uSpeed / 360.0) * 360.0;
                    float angle = scanAngle - fragAngle;

                    return (angle < 0.0) ? angle + 360.0 : angle;
                }

                // 距离衰减
                float distanceAttenuation(float distance) {
                    return 1.0 - smoothstep(0.0, uRadius, distance);
                }

                void main() {
            `;

            const fragmentColor = `
                #include <opaque_fragment>

                float dist = length(vPosition);

                if(dist > uRadius - 2.0) {
                    // 雷达边缘
                    gl_FragColor = vec4(uRadarColor, 0.8);
                }
                else if(dist < 5.0) {
                    // 雷达中心
                    gl_FragColor = vec4(uScanColor, 1.0);
                }
                else {
                    float angle = calcAngle(vPosition);
                    float attenuation = distanceAttenuation(dist);

                    if(angle < uFollowWidth) {
                        // 扫描尾迹 - 颜色渐变
                        float trailFactor = 1.0 - angle / uFollowWidth;
                        vec3 color = mix(uRadarColor, uScanColor, trailFactor * 0.8);
                        gl_FragColor = vec4(color, attenuation * (0.3 + trailFactor * 0.7));
                    }
                    else {
                        // 雷达基础颜色
                        gl_FragColor = vec4(uRadarColor, attenuation * 0.2);
                    }
                }
            `;

            shader.fragmentShader = shader.fragmentShader.replace('void main() {', fragment);
            shader.fragmentShader = shader.fragmentShader.replace('#include <opaque_fragment>', fragmentColor);
        };

        // 创建GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';

        const params = {
            speed: CONFIG.radar.speed,
            followWidth: CONFIG.radar.followWidth,
            radius: CONFIG.radar.radius
        };

        const folder = gui.addFolder('雷达参数');
        folder.add(params, 'speed', 100, 500, 10).name('扫描速度').onChange((v) => {
            material.uniforms.uSpeed.value = v;
        });
        folder.add(params, 'followWidth', 100, 300, 10).name('尾迹宽度').onChange((v) => {
            material.uniforms.uFollowWidth.value = v;
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }
        animate();

        // 响应式调整
        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        // 截图支持
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
