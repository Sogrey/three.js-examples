<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示粒子线条效果，粒子间根据距离连线，支持鼠标交互和后处理效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 粒子线条</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { DotScreenPass } from 'three/addons/postprocessing/DotScreenPass.js';
        import { GlitchPass } from 'three/addons/postprocessing/GlitchPass.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        const params = {
            particleCount: 1000,
            lineDistance: 1000,
            repulsionStrength: 5,
            bloomStrength: 1.5,
            bloomThreshold: 0,
            bloomRadius: 0,
            pixelSize: 1.0,
            activateGlitch: false,
            dotScale: 0.5,
            activateDotScreen: false
        };

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x000000);
        window.scene.fog = new THREE.Fog(0x000000, 10, 2000);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.z = 1200;

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(params.particleCount * 3);
        for (let i = 0; i < positions.length; i++) {
            positions[i] = (Math.random() * 2 - 1) * 500;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        function getRandomColor() {
            return `hsl(${Math.random() * 360}, 100%, 80%)`;
        }

        const material = new THREE.PointsMaterial({ color: getRandomColor(), size: 10, fog: true });
        const particles = new THREE.Points(geometry, material);
        window.scene.add(particles);

        const lineMaterial = new THREE.LineBasicMaterial({ color: getRandomColor(), linewidth: 0.25, fog: true });
        const lines = new THREE.LineSegments(new THREE.BufferGeometry(), lineMaterial);
        window.scene.add(lines);

        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('dblclick', () => {
            material.color.set(getRandomColor());
            lineMaterial.color.set(getRandomColor());
        });

        const renderScene = new RenderPass(window.scene, window.camera);
        window.composer = new EffectComposer(window.renderer);
        window.composer.addPass(renderScene);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            params.bloomStrength,
            params.bloomRadius,
            params.bloomThreshold
        );
        window.composer.addPass(bloomPass);

        const pixelationShader = {
            uniforms: {
                'tDiffuse': { value: null },
                'resolution': { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                'pixelSize': { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform vec2 resolution;
                uniform float pixelSize;
                varying vec2 vUv;
                void main() {
                    vec2 dxy = pixelSize / resolution;
                    vec2 coord = dxy * floor(vUv / dxy);
                    gl_FragColor = texture2D(tDiffuse, coord);
                }
            `
        };

        const pixelPass = new ShaderPass(pixelationShader);
        window.composer.addPass(pixelPass);

        const glitchPass = new GlitchPass();
        glitchPass.enabled = false;
        window.composer.addPass(glitchPass);

        const dotScreenPass = new DotScreenPass(new THREE.Vector2(0.5, 0.5), 0.5, 0.8);
        dotScreenPass.enabled = false;
        window.composer.addPass(dotScreenPass);

        const gui = new GUI();
        gui.domElement.style.position = 'absolute';
        gui.domElement.style.top = '50px';
        gui.domElement.style.right = '10px';
        gui.domElement.style.zIndex = '1000';

        gui.add(params, 'lineDistance', 500, 1000);
        gui.add(params, 'repulsionStrength', 1, 10);
        gui.add(params, 'bloomStrength', 0, 3).name('Bloom Strength').onChange(updateBloom);
        gui.add(params, 'bloomRadius', 0, 1).name('Bloom Radius').onChange(updateBloom);
        gui.add(params, 'bloomThreshold', 0, 1).name('Bloom Threshold').onChange(updateBloom);
        gui.add(params, 'pixelSize', 1.0, 30.0).name('Pixel Size').onChange((value) => {
            pixelPass.uniforms.pixelSize.value = value;
        });
        gui.add(params, 'activateDotScreen').name('Activate Dot Screen').onChange((value) => {
            dotScreenPass.enabled = value;
        });
        gui.add(params, 'dotScale', 0.1, 1.5).name('Dot Scale').onChange((value) => {
            if (dotScreenPass) {
                dotScreenPass.uniforms['scale'].value = value;
            }
        });
        gui.add(params, 'activateGlitch').name('Activate Glitch').onChange((value) => {
            glitchPass.enabled = value;
        });

        function updateBloom() {
            bloomPass.strength = params.bloomStrength;
            bloomPass.threshold = params.bloomThreshold;
            bloomPass.radius = params.bloomRadius;
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(w, h);
            window.composer.setSize(w, h);
            pixelPass.uniforms.resolution.value.set(w, h);
        });

        function animate() {
            const positions = particles.geometry.attributes.position.array;
            const linePositions = [];
            for (let i = 0; i < positions.length; i += 3) {
                const dx = positions[i] - mouse.x * 500;
                const dy = positions[i + 1] - mouse.y * 500;
                const dz = positions[i + 2];
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
                if (distance < params.lineDistance) {
                    linePositions.push(positions[i], positions[i + 1], positions[i + 2]);
                    linePositions.push(mouse.x * 500, mouse.y * 500, 0);
                }
                if (distance < 50) {
                    positions[i] += dx / distance * params.repulsionStrength;
                    positions[i + 1] += dy / distance * params.repulsionStrength;
                }
            }
            lines.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            lines.geometry.computeBoundingSphere();
            particles.geometry.attributes.position.needsUpdate = true;

            particles.rotation.x += 0.01;
            lines.rotation.x += 0.01;

            controls.update();
            window.composer.render();
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) {
                            window.composer.render();
                        } else if (window.renderer) {
                            window.renderer.render(window.scene, window.camera);
                        }
                    }

                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
