<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="测量 - 使用Three.js创建测量尺子和箭头测量线"
    />
    <meta name="three-version" content="r179" />
    <title>Three.js 示例 - 测量</title>
    <link rel="stylesheet" href="../../css/example-common.css" />
  </head>
  <body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../libs/three/r179/build/three.module.js",
          "three/addons/": "../../libs/three/r179/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const container = document.getElementById("threeContainer");

      window.scene = new THREE.Scene();
      window.scene.background = new THREE.Color(0x1a1a2e);

      window.camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        100000,
      );
      window.camera.position.set(0, 0, 15);

      window.renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        logarithmicDepthBuffer: true,
      });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      window.renderer.setPixelRatio(Math.min(window.devicePixelRatio * 1.6, 2));
      container.appendChild(window.renderer.domElement);

      const controls = new OrbitControls(
        window.camera,
        window.renderer.domElement,
      );
      controls.enableDamping = true;

      function createRuler() {
        const start = new THREE.Vector3(-10, 0, 0);
        const end = new THREE.Vector3(10, 0, 0);

        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
          start,
          end,
        ]);
        const line = new THREE.Line(
          lineGeometry,
          new THREE.LineBasicMaterial({ color: 0xffffff }),
        );
        window.scene.add(line);

        for (let i = 0; i <= 20; i++) {
          const t = i / 20;
          const pos = new THREE.Vector3().lerpVectors(start, end, t);
          const height = i % 5 === 0 ? 1 : 0.5;

          const tickGeometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(pos.x, 0, 0),
            new THREE.Vector3(pos.x, height, 0),
          ]);
          const tick = new THREE.Line(
            tickGeometry,
            new THREE.LineBasicMaterial({ color: 0xffffff }),
          );
          window.scene.add(tick);

          if (i % 5 === 0) {
            const text = i + "cm";
            createText(text, pos.x, height + 1, 0);
          }
        }
      }

      function createText(text, x, y, z) {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 128;
        canvas.height = 64;

        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, 64, 40);

        const texture = new THREE.CanvasTexture(canvas);
        const sprite = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: texture }),
        );
        sprite.position.set(x, y, z);
        sprite.scale.set(2, 1, 1);
        window.scene.add(sprite);
      }

      function createArrowMeasure() {
        const start = new THREE.Vector3(-10, 3, 0);
        const end = new THREE.Vector3(10, 3, 0);

        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
          start,
          end,
        ]);
        const lineMaterial = new THREE.LineDashedMaterial({
          color: 0xff0000,
          dashSize: 0.5,
          gapSize: 0.3,
        });
        const line = new THREE.Line(lineGeometry, lineMaterial);
        line.computeLineDistances();
        window.scene.add(line);

        const leftArrowGeometry = new THREE.BufferGeometry();
        const leftVertices = new Float32Array([
          start.x,
          start.y,
          start.z,
          start.x + 0.5,
          start.y - 0.3,
          start.z,
          start.x + 0.5,
          start.y + 0.3,
          start.z,
        ]);
        leftArrowGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(leftVertices, 3),
        );
        const leftArrowMaterial = new THREE.MeshBasicMaterial({
          color: 0xff0000,
          side: THREE.DoubleSide,
        });
        const leftArrowMesh = new THREE.Mesh(
          leftArrowGeometry,
          leftArrowMaterial,
        );
        window.scene.add(leftArrowMesh);

        const rightArrowGeometry = new THREE.BufferGeometry();
        const rightVertices = new Float32Array([
          end.x,
          end.y,
          end.z,
          end.x - 0.5,
          end.y + 0.3,
          end.z,
          end.x - 0.5,
          end.y - 0.3,
          end.z,
        ]);
        rightArrowGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(rightVertices, 3),
        );
        const rightArrowMaterial = new THREE.MeshBasicMaterial({
          color: 0xff0000,
          side: THREE.DoubleSide,
        });
        const rightArrowMesh = new THREE.Mesh(
          rightArrowGeometry,
          rightArrowMaterial,
        );
        window.scene.add(rightArrowMesh);

        const center = new THREE.Vector3().lerpVectors(start, end, 0.5);
        createText("20cm", center.x, center.y + 1, center.z);
      }

      createRuler();
      createArrowMeasure();

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        window.renderer.render(window.scene, window.camera);
      }
      animate();

      window.addEventListener("resize", () => {
        window.camera.aspect = window.innerWidth / window.innerHeight;
        window.camera.updateProjectionMatrix();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "take-screenshot") {
          try {
            if (window.scene && window.camera) {
              window.renderer.render(window.scene, window.camera);
            }
            const quality = event.data.quality || 0.8;
            const canvas = window.renderer.domElement;
            const tempCanvas = document.createElement("canvas");
            const maxSize = 600;
            const scale = Math.min(
              maxSize / canvas.width,
              maxSize / canvas.height,
            );
            tempCanvas.width = Math.floor(canvas.width * scale);
            tempCanvas.height = Math.floor(canvas.height * scale);
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            const dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
            window.parent.postMessage(
              { type: "screenshot-data", dataUrl: dataUrl },
              "*",
            );
          } catch (error) {
            console.error("截图失败:", error);
            window.parent.postMessage(
              { type: "screenshot-error", error: error.message },
              "*",
            );
          }
        }
      });
    </script>
  </body>
</html>
