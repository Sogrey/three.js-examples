<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="animejs使用 - 使用animejs库实现Three.js动画效果"
    />
    <meta name="three-version" content="r179" />
    <title>Three.js 示例 - animejs使用</title>
    <link rel="stylesheet" href="../../css/example-common.css" />
  </head>
  <body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../libs/three/r179/build/three.module.js",
          "three/addons/": "../../libs/three/r179/jsm/",
          "animejs": "https://cdn.jsdelivr.net/npm/animejs/+esm"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { animate } from "animejs";

      const container = document.getElementById("threeContainer");

      window.scene = new THREE.Scene();
      window.scene.background = new THREE.Color(0x1a1a2e);

      window.camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        100000,
      );
      window.camera.position.set(50, 50, 50);

      window.renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        logarithmicDepthBuffer: true,
      });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      window.renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(window.renderer.domElement);

      const controls = new OrbitControls(
        window.camera,
        window.renderer.domElement,
      );
      controls.enableDamping = true;

      window.scene.add(
        new THREE.AxesHelper(100),
        new THREE.GridHelper(100, 10),
      );

      function loop() {
        requestAnimationFrame(loop);
        controls.update();
        window.renderer.render(window.scene, window.camera);
      }
      window.render = loop;

      window.addEventListener("resize", () => {
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.camera.aspect = window.innerWidth / window.innerHeight;
        window.camera.updateProjectionMatrix();
      });

      const geometry = new THREE.BoxGeometry(10, 10, 10);
      const material = new THREE.MeshBasicMaterial({
        color: 0x00ff00,
        wireframe: true,
      });
      const cube = new THREE.Mesh(geometry, material);
      window.scene.add(cube);
      animate(cube.rotation, {
        x: Math.PI,
        y: Math.PI,
        z: Math.PI,
        duration: 2000,
        loop: true,
      });

      const sphereGeometry = new THREE.SphereGeometry(5, 32, 32);
      const sphereMaterial = new THREE.MeshPhongMaterial({
        color: 0x1e90ff,
        shininess: 100,
        specular: 0xffffff,
      });
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
      sphere.position.set(-20, 10, 0);
      window.scene.add(sphere);

      const light = new THREE.DirectionalLight(0xffffff, 1.0);
      light.position.set(10, 20, 30);
      window.scene.add(light);
      window.scene.add(new THREE.AmbientLight(0x404040));

      animate(sphere.position, {
        y: [10, 20, 10],
        easing: "easeInOutQuad",
        duration: 3000,
        loop: true,
      });

      const torusGeometry = new THREE.TorusGeometry(7, 2, 16, 100);
      const torusMaterial = new THREE.MeshNormalMaterial();
      const torus = new THREE.Mesh(torusGeometry, torusMaterial);
      torus.position.set(20, 5, -10);
      window.scene.add(torus);

      animate(torus.scale, {
        x: [1, 1.5, 1],
        y: [1, 1.5, 1],
        z: [1, 1.5, 1],
        duration: 2500,
        loop: true,
      });
      animate(torus.rotation, {
        x: Math.PI * 2,
        z: Math.PI * 2,
        duration: 5000,
        loop: true,
      });

      const planeGeometry = new THREE.PlaneGeometry(50, 50);
      const planeMaterial = new THREE.MeshBasicMaterial({
        color: 0xff6347,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7,
      });
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = Math.PI / 2;
      window.scene.add(plane);

      animate(plane.material.color, {
        r: [1, 0, 1],
        g: [0.5, 0, 0.5],
        b: [0.5, 1, 0.5],
        duration: 4000,
        loop: true,
      });

      loop();
    </script>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "take-screenshot") {
          try {
            if (window.scene && window.camera) {
              if (window.composer) window.composer.render();
              else window.renderer.render(window.scene, window.camera);
            }
            const quality = event.data.quality || 0.8;
            const canvas = window.composer
              ? window.composer.renderer.domElement
              : window.renderer.domElement;
            const tempCanvas = document.createElement("canvas");
            const maxSize = 600;
            const scale = Math.min(
              maxSize / canvas.width,
              maxSize / canvas.height,
            );
            tempCanvas.width = Math.floor(canvas.width * scale);
            tempCanvas.height = Math.floor(canvas.height * scale);
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            const dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
            window.parent.postMessage(
              { type: "screenshot-data", dataUrl: dataUrl },
              "*",
            );
          } catch (error) {
            console.error("截图失败:", error);
            window.parent.postMessage(
              { type: "screenshot-error", error: error.message },
              "*",
            );
          }
        }
      });
    </script>
  </body>
</html>
