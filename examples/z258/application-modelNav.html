<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="模型导航 - 3D场景中的模型导航和路径规划">
    <title>模型导航 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
        
        #info {
            position: absolute; bottom: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 4px;
            font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🧭 模型导航</h3>
        <div class="control-group">
            <label>移动速度 <span class="value" id="speedValue">2</span></label>
            <input type="range" id="speedRange" min="0.5" max="5" step="0.5" value="2">
        </div>
        <div class="control-group">
            <label>路径宽度 <span class="value" id="widthValue">0.3</span></label>
            <input type="range" id="widthRange" min="0.1" max="1" step="0.1" value="0.3">
        </div>
        <button id="btnSetStart">📍 设置起点</button>
        <button id="btnSetEnd">🎯 设置终点</button>
        <button id="btnNavigate">🚀 开始导航</button>
        <button id="btnClear">🗑️ 清除路径</button>
    </div>
    
    <div id="info">
        <p>点击地面设置起点和终点</p>
        <p>绿色球 = 起点 | 红色球 = 终点</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(30, 30, 30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4a,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(30, 30, 0x4a4a6a, 0x3a3a5a);
        scene.add(gridHelper);

        // 障碍物
        const obstacles = [];
        function createObstacles() {
            const geometries = [
                new THREE.BoxGeometry(2, 4, 2),
                new THREE.CylinderGeometry(1, 1, 3, 16),
                new THREE.ConeGeometry(1.5, 4, 16)
            ];

            for (let i = 0; i < 8; i++) {
                const geometry = geometries[i % geometries.length];
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.6, 0.5, 0.4 + Math.random() * 0.2)
                });
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.set(
                    (Math.random() - 0.5) * 20,
                    geometry.parameters.height ? geometry.parameters.height / 2 : 2,
                    (Math.random() - 0.5) * 20
                );
                
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                obstacles.push(mesh);
            }
        }
        createObstacles();

        // 导航点
        let startPoint = null;
        let endPoint = null;
        let startMarker = null;
        let endMarker = null;
        let pathLine = null;
        let navMesh = null;

        // 配置
        const config = {
            speed: 2,
            pathWidth: 0.3,
            isNavigating: false
        };

        // 创建标记
        function createMarker(position, color) {
            const geometry = new THREE.SphereGeometry(0.5, 16, 16);
            const material = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            mesh.position.y = 0.5;
            
            // 添加光环
            const ringGeometry = new THREE.RingGeometry(0.6, 0.8, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.4;
            mesh.add(ring);
            
            return mesh;
        }

        // 简单的路径规划（A*简化版）
        function findPath(start, end) {
            // 这里使用简单的直线路径，实际应用中使用A*算法
            const path = [];
            const steps = 50;
            
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = start.x + (end.x - start.x) * t;
                const z = start.z + (end.z - start.z) * t;
                
                // 简单的障碍物避让
                let y = 0.1;
                let adjustedX = x;
                let adjustedZ = z;
                
                // 检查是否与障碍物碰撞
                obstacles.forEach((obstacle) => {
                    const dx = x - obstacle.position.x;
                    const dz = z - obstacle.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    const minDist = 2.5;
                    
                    if (dist < minDist) {
                        const angle = Math.atan2(dz, dx);
                        adjustedX = obstacle.position.x + Math.cos(angle) * minDist;
                        adjustedZ = obstacle.position.z + Math.sin(angle) * minDist;
                    }
                });
                
                path.push(new THREE.Vector3(adjustedX, y, adjustedZ));
            }
            
            return path;
        }

        // 绘制路径
        function drawPath(path) {
            if (pathLine) {
                scene.remove(pathLine);
                pathLine.geometry.dispose();
                pathLine.material.dispose();
            }

            const curve = new THREE.CatmullRomCurve3(path);
            const points = curve.getPoints(100);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x4a9eff,
                linewidth: 3
            });
            
            pathLine = new THREE.Line(geometry, material);
            scene.add(pathLine);

            // 创建路径管道
            const tubeGeometry = new THREE.TubeGeometry(curve, 100, config.pathWidth, 8, false);
            const tubeMaterial = new THREE.MeshBasicMaterial({
                color: 0x4a9eff,
                transparent: true,
                opacity: 0.3
            });
            
            if (navMesh) {
                scene.remove(navMesh);
                navMesh.geometry.dispose();
                navMesh.material.dispose();
            }
            
            navMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
            scene.add(navMesh);
        }

        // 射线检测
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isSettingStart = false;
        let isSettingEnd = false;

        container.addEventListener('click', (e) => {
            if (!isSettingStart && !isSettingEnd) return;
            if (e.target.closest('#controls')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                point.y = 0.5;

                if (isSettingStart) {
                    if (startMarker) scene.remove(startMarker);
                    startPoint = point.clone();
                    startMarker = createMarker(point, 0x44ff44);
                    scene.add(startMarker);
                    isSettingStart = false;
                    document.getElementById('btnSetStart').textContent = '📍 设置起点';
                } else if (isSettingEnd) {
                    if (endMarker) scene.remove(endMarker);
                    endPoint = point.clone();
                    endMarker = createMarker(point, 0xff4444);
                    scene.add(endMarker);
                    isSettingEnd = false;
                    document.getElementById('btnSetEnd').textContent = '🎯 设置终点';
                }
            }
        });

        // 导航动画
        let navAnimation = null;
        function startNavigation() {
            if (!startPoint || !endPoint) {
                alert('请先设置起点和终点');
                return;
            }

            const path = findPath(startPoint, endPoint);
            drawPath(path);

            // 创建导航物体
            if (navAnimation) {
                scene.remove(navAnimation.mesh);
            }

            const navGeometry = new THREE.ConeGeometry(0.5, 1, 16);
            const navMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const navMesh = new THREE.Mesh(navGeometry, navMaterial);
            navMesh.position.copy(startPoint);
            navMesh.position.y = 1;
            scene.add(navMesh);

            config.isNavigating = true;
            let pathIndex = 0;

            function animateNav() {
                if (!config.isNavigating) return;

                pathIndex += config.speed * 0.01;
                
                if (pathIndex >= path.length - 1) {
                    config.isNavigating = false;
                    return;
                }

                const currentPos = path[Math.floor(pathIndex)];
                const nextPos = path[Math.floor(pathIndex) + 1];
                
                navMesh.position.copy(currentPos);
                navMesh.position.y = 1;
                navMesh.lookAt(nextPos);

                requestAnimationFrame(animateNav);
            }

            animateNav();
            navAnimation = { mesh: navMesh };
        }

        // 动画
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('speedRange').addEventListener('input', (e) => {
            config.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = config.speed;
        });

        document.getElementById('widthRange').addEventListener('input', (e) => {
            config.pathWidth = parseFloat(e.target.value);
            document.getElementById('widthValue').textContent = config.pathWidth.toFixed(1);
        });

        document.getElementById('btnSetStart').addEventListener('click', () => {
            isSettingStart = true;
            isSettingEnd = false;
            document.getElementById('btnSetStart').textContent = '👆 点击地面';
            document.getElementById('btnSetEnd').textContent = '🎯 设置终点';
        });

        document.getElementById('btnSetEnd').addEventListener('click', () => {
            isSettingEnd = true;
            isSettingStart = false;
            document.getElementById('btnSetEnd').textContent = '👆 点击地面';
            document.getElementById('btnSetStart').textContent = '📍 设置起点';
        });

        document.getElementById('btnNavigate').addEventListener('click', startNavigation);

        document.getElementById('btnClear').addEventListener('click', () => {
            if (pathLine) {
                scene.remove(pathLine);
                pathLine.geometry.dispose();
                pathLine.material.dispose();
                pathLine = null;
            }
            if (navMesh) {
                scene.remove(navMesh);
                navMesh.geometry.dispose();
                navMesh.material.dispose();
                navMesh = null;
            }
            if (navAnimation) {
                scene.remove(navAnimation.mesh);
                navAnimation = null;
            }
            config.isNavigating = false;
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
