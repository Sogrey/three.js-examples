<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="自动寻路 - 3D场景中的模型导航和路径规划">
    <title>自动寻路 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
        
        #info {
            position: absolute; bottom: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 4px;
            font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🧭 自动寻路</h3>
        <div class="control-group">
            <label>移动速度 <span class="value" id="speedValue">2</span></label>
            <input type="range" id="speedRange" min="0.5" max="5" step="0.5" value="2">
        </div>
        <div class="control-group">
            <label>路径宽度 <span class="value" id="widthValue">0.3</span></label>
            <input type="range" id="widthRange" min="0.1" max="1" step="0.1" value="0.3">
        </div>
        <button id="btnSetStart">📍 设置起点</button>
        <button id="btnSetEnd">🎯 设置终点</button>
        <button id="btnNavigate">🚀 开始导航</button>
        <button id="btnClear">🗑️ 清除路径</button>
    </div>
    
    <div id="info">
        <p>点击地面设置起点和终点</p>
        <p>绿色球 = 起点 | 红色球 = 终点</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(30, 30, 30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4a,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(30, 30, 0x4a4a6a, 0x3a3a5a);
        scene.add(gridHelper);

        // 障碍物
        const obstacles = [];
        function createObstacles() {
            const geometries = [
                new THREE.BoxGeometry(2, 4, 2),
                new THREE.CylinderGeometry(1, 1, 3, 16),
                new THREE.ConeGeometry(1.5, 4, 16)
            ];

            for (let i = 0; i < 8; i++) {
                const geometry = geometries[i % geometries.length];
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.6, 0.5, 0.4 + Math.random() * 0.2)
                });
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.set(
                    (Math.random() - 0.5) * 20,
                    geometry.parameters.height ? geometry.parameters.height / 2 : 2,
                    (Math.random() - 0.5) * 20
                );
                
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                obstacles.push(mesh);
            }
        }
        createObstacles();

        // 导航点
        let startPoint = null;
        let endPoint = null;
        let startMarker = null;
        let endMarker = null;
        let pathLine = null;
        let navMesh = null;

        // 配置
        const config = {
            speed: 2,
            pathWidth: 0.3,
            isNavigating: false
        };

        // 创建标记
        function createMarker(position, color) {
            const geometry = new THREE.SphereGeometry(0.5, 16, 16);
            const material = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            mesh.position.y = 0.5;
            
            // 添加光环
            const ringGeometry = new THREE.RingGeometry(0.6, 0.8, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.4;
            mesh.add(ring);
            
            return mesh;
        }

        // A*寻路算法
        function findPath(start, end) {
            const gridSize = 0.5; // 网格大小
            const gridRange = 15; // 网格范围
            
            // 将世界坐标转换为网格坐标
            function worldToGrid(pos) {
                return {
                    x: Math.round(pos.x / gridSize),
                    z: Math.round(pos.z / gridSize)
                };
            }
            
            // 将网格坐标转换为世界坐标
            function gridToWorld(gx, gz) {
                return new THREE.Vector3(gx * gridSize, 0.1, gz * gridSize);
            }
            
            // 检查位置是否在障碍物内
            function isObstacle(gx, gz) {
                const worldPos = gridToWorld(gx, gz);
                for (let obstacle of obstacles) {
                    const dx = worldPos.x - obstacle.position.x;
                    const dz = worldPos.z - obstacle.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    // 障碍物半径 + 安全距离
                    const obstacleRadius = 2.0;
                    if (dist < obstacleRadius) {
                        return true;
                    }
                }
                return false;
            }
            
            const startGrid = worldToGrid(start);
            const endGrid = worldToGrid(end);
            
            // A*算法
            const openSet = [];
            const closedSet = new Set();
            const cameFrom = new Map();
            const gScore = new Map();
            const fScore = new Map();
            
            const startKey = `${startGrid.x},${startGrid.z}`;
            const endKey = `${endGrid.x},${endGrid.z}`;
            
            openSet.push({ x: startGrid.x, z: startGrid.z });
            gScore.set(startKey, 0);
            fScore.set(startKey, Math.abs(startGrid.x - endGrid.x) + Math.abs(startGrid.z - endGrid.z));
            
            const directions = [
                { dx: 0, dz: 1 }, { dx: 0, dz: -1 },
                { dx: 1, dz: 0 }, { dx: -1, dz: 0 },
                { dx: 1, dz: 1 }, { dx: 1, dz: -1 },
                { dx: -1, dz: 1 }, { dx: -1, dz: -1 }
            ];
            
            while (openSet.length > 0) {
                // 找到fScore最小的节点
                let current = openSet[0];
                let currentIndex = 0;
                let minF = fScore.get(`${current.x},${current.z}`) || Infinity;
                
                for (let i = 1; i < openSet.length; i++) {
                    const node = openSet[i];
                    const f = fScore.get(`${node.x},${node.z}`) || Infinity;
                    if (f < minF) {
                        minF = f;
                        current = node;
                        currentIndex = i;
                    }
                }
                
                const currentKey = `${current.x},${current.z}`;
                
                // 到达终点
                if (current.x === endGrid.x && current.z === endGrid.z) {
                    // 重建路径
                    const path = [];
                    let curr = current;
                    while (curr) {
                        path.unshift(gridToWorld(curr.x, curr.z));
                        const prevKey = cameFrom.get(`${curr.x},${curr.z}`);
                        if (!prevKey) break;
                        const [px, pz] = prevKey.split(',').map(Number);
                        curr = { x: px, z: pz };
                    }
                    return path;
                }
                
                openSet.splice(currentIndex, 1);
                closedSet.add(currentKey);
                
                // 检查邻居
                for (let dir of directions) {
                    const neighbor = {
                        x: current.x + dir.dx,
                        z: current.z + dir.dz
                    };
                    const neighborKey = `${neighbor.x},${neighbor.z}`;
                    
                    // 检查范围
                    if (Math.abs(neighbor.x * gridSize) > gridRange ||
                        Math.abs(neighbor.z * gridSize) > gridRange) {
                        continue;
                    }
                    
                    // 检查是否已访问或是障碍物
                    if (closedSet.has(neighborKey) || isObstacle(neighbor.x, neighbor.z)) {
                        continue;
                    }
                    
                    // 计算代价
                    const moveCost = (dir.dx !== 0 && dir.dz !== 0) ? 1.414 : 1;
                    const tentativeG = (gScore.get(currentKey) || 0) + moveCost;
                    
                    const existingG = gScore.get(neighborKey);
                    if (existingG === undefined || tentativeG < existingG) {
                        cameFrom.set(neighborKey, currentKey);
                        gScore.set(neighborKey, tentativeG);
                        fScore.set(neighborKey, tentativeG + Math.abs(neighbor.x - endGrid.x) + Math.abs(neighbor.z - endGrid.z));
                        
                        // 检查是否已在openSet
                        const exists = openSet.some(n => n.x === neighbor.x && n.z === neighbor.z);
                        if (!exists) {
                            openSet.push(neighbor);
                        }
                    }
                }
            }
            
            // 没有找到路径，返回直线路径
            const path = [];
            const steps = 50;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                path.push(new THREE.Vector3(
                    start.x + (end.x - start.x) * t,
                    0.1,
                    start.z + (end.z - start.z) * t
                ));
            }
            return path;
        }

        // 绘制路径
        function drawPath(path) {
            if (pathLine) {
                scene.remove(pathLine);
                pathLine.geometry.dispose();
                pathLine.material.dispose();
            }

            const curve = new THREE.CatmullRomCurve3(path);
            const points = curve.getPoints(100);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x4a9eff,
                linewidth: 3
            });
            
            pathLine = new THREE.Line(geometry, material);
            scene.add(pathLine);

            // 创建路径管道
            const tubeGeometry = new THREE.TubeGeometry(curve, 100, config.pathWidth, 8, false);
            const tubeMaterial = new THREE.MeshBasicMaterial({
                color: 0x4a9eff,
                transparent: true,
                opacity: 0.3
            });
            
            if (navMesh) {
                scene.remove(navMesh);
                navMesh.geometry.dispose();
                navMesh.material.dispose();
            }
            
            navMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
            scene.add(navMesh);
        }

        // 射线检测
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isSettingStart = false;
        let isSettingEnd = false;

        container.addEventListener('click', (e) => {
            if (!isSettingStart && !isSettingEnd) return;
            if (e.target.closest('#controls')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                point.y = 0.5;

                if (isSettingStart) {
                    if (startMarker) scene.remove(startMarker);
                    startPoint = point.clone();
                    startMarker = createMarker(point, 0x44ff44);
                    scene.add(startMarker);
                    isSettingStart = false;
                    document.getElementById('btnSetStart').textContent = '📍 设置起点';
                } else if (isSettingEnd) {
                    if (endMarker) scene.remove(endMarker);
                    endPoint = point.clone();
                    endMarker = createMarker(point, 0xff4444);
                    scene.add(endMarker);
                    isSettingEnd = false;
                    document.getElementById('btnSetEnd').textContent = '🎯 设置终点';
                }
            }
        });

        // 导航动画
        let navAnimation = null;
        function startNavigation() {
            if (!startPoint || !endPoint) {
                alert('请先设置起点和终点');
                return;
            }

            const path = findPath(startPoint, endPoint);
            drawPath(path);

            // 创建导航物体
            if (navAnimation) {
                scene.remove(navAnimation.mesh);
            }

            const navGeometry = new THREE.ConeGeometry(0.5, 1, 16);
            const navMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const navMesh = new THREE.Mesh(navGeometry, navMaterial);
            navMesh.position.copy(startPoint);
            navMesh.position.y = 1;
            scene.add(navMesh);

            config.isNavigating = true;
            let pathIndex = 0;

            function animateNav() {
                if (!config.isNavigating) return;

                pathIndex += config.speed * 0.01;
                
                if (pathIndex >= path.length - 1) {
                    config.isNavigating = false;
                    return;
                }

                const currentPos = path[Math.floor(pathIndex)];
                const nextPos = path[Math.floor(pathIndex) + 1];
                
                navMesh.position.copy(currentPos);
                navMesh.position.y = 1;
                navMesh.lookAt(nextPos);

                requestAnimationFrame(animateNav);
            }

            animateNav();
            navAnimation = { mesh: navMesh };
        }

        // 动画
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('speedRange').addEventListener('input', (e) => {
            config.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = config.speed;
        });

        document.getElementById('widthRange').addEventListener('input', (e) => {
            config.pathWidth = parseFloat(e.target.value);
            document.getElementById('widthValue').textContent = config.pathWidth.toFixed(1);
        });

        document.getElementById('btnSetStart').addEventListener('click', () => {
            isSettingStart = true;
            isSettingEnd = false;
            document.getElementById('btnSetStart').textContent = '👆 点击地面';
            document.getElementById('btnSetEnd').textContent = '🎯 设置终点';
        });

        document.getElementById('btnSetEnd').addEventListener('click', () => {
            isSettingEnd = true;
            isSettingStart = false;
            document.getElementById('btnSetEnd').textContent = '👆 点击地面';
            document.getElementById('btnSetStart').textContent = '📍 设置起点';
        });

        document.getElementById('btnNavigate').addEventListener('click', startNavigation);

        document.getElementById('btnClear').addEventListener('click', () => {
            if (pathLine) {
                scene.remove(pathLine);
                pathLine.geometry.dispose();
                pathLine.material.dispose();
                pathLine = null;
            }
            if (navMesh) {
                scene.remove(navMesh);
                navMesh.geometry.dispose();
                navMesh.material.dispose();
                navMesh = null;
            }
            if (navAnimation) {
                scene.remove(navAnimation.mesh);
                navAnimation = null;
            }
            config.isNavigating = false;
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
