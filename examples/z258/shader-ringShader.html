<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="环形着色器 - 展示环形火焰效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 环形着色器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 15);

        window.renderer = new THREE.WebGLRenderer();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        window.scene.add(new THREE.AxesHelper(50000));

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector2(1900, 1900) }
        };

        const geometry = new THREE.PlaneGeometry(20, 20);
        const material = new THREE.ShaderMaterial({
            uniforms,
            side: 2,
            depthWrite: false,
            transparent: true,
            vertexShader: `
                varying vec3 vPosition;
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform float ratio;
                float M_PI = 3.1415926;
                float M_TWO_PI = 6.28318530718;
                vec3 iMouse = vec3(0.0, 0.0, 0.0);
                uniform float iTime;
                uniform vec2 iResolution;
                varying vec2 vUv;

                float rand(vec2 n) {
                    return fract(sin(dot(n, vec2(12.9898, 12.1414))) * 83758.5453);
                }

                float noise(vec2 n) {
                    const vec2 d = vec2(0.0, 1.0);
                    vec2 b = floor(n);
                    vec2 f = smoothstep(vec2(0.0), vec2(1.0), fract(n));
                    return mix(mix(rand(b), rand(b + d.yx), f.x), mix(rand(b + d.xy), rand(b + d.yy), f.x), f.y);
                }

                vec3 ramp(float t) {
                    return t <= 0.5 ? vec3(1.0 - t * 1.4, 0.2, 1.05) / t : vec3(0.3 * (1.0 - t) * 2.0, 0.2, 1.05) / t;
                }

                vec2 polarMap(vec2 uv, float shift, float inner) {
                    uv = vec2(0.5) - uv;
                    float px = 1.0 - fract(atan(uv.y, uv.x) / 6.28 + 0.25) + shift;
                    float py = (sqrt(uv.x * uv.x + uv.y * uv.y) * (1.0 + inner * 2.0) - inner) * 2.0;
                    return vec2(px, py);
                }

                float fire(vec2 n) {
                    return noise(n) + noise(n * 2.1) * 0.6 + noise(n * 5.4) * 0.42;
                }

                float shade(vec2 uv, float t) {
                    uv.x += uv.y < 0.5 ? 23.0 + t * 0.035 : -11.0 + t * 0.03;
                    uv.y = abs(uv.y - 0.5);
                    uv.x *= 35.0;
                    float q = fire(uv - t * 0.013) / 2.0;
                    vec2 r = vec2(fire(uv + q / 2.0 + t - uv.x - uv.y), fire(uv + q - t));
                    return pow((r.y + r.y) * max(0.0, uv.y) + 0.1, 4.0);
                }

                vec3 color(float grad) {
                    float m2 = iMouse.z < 0.0001 ? 1.15 : iMouse.y * 3.0 / iResolution.y;
                    grad = sqrt(grad);
                    vec3 color = vec3(1.0 / (pow(vec3(0.5, 0.0, 0.1) + 2.61, vec3(2.0))));
                    vec3 color2 = color;
                    color = ramp(grad);
                    color /= (m2 + max(vec3(0), color));
                    return color;
                }

                float distanceTo(vec2 src, vec2 dst) {
                    float dx = src.x - dst.x;
                    float dy = src.y - dst.y;
                    float dv = dx * dx + dy * dy;
                    return sqrt(dv);
                }

                void main() {
                    float m1 = iMouse.z < 0.0001 ? 3.6 : iMouse.x * 5.0 / iResolution.x;
                    float t = iTime;
                    vec2 uv = vUv;
                    float ff = 1.0 - uv.y;
                    uv.x -= (iResolution.x / iResolution.y - 1.0) / 2.0;
                    vec2 uv2 = uv;
                    uv2.y = 1.0 - uv2.y;
                    uv = polarMap(uv, 1.3, m1);
                    uv2 = polarMap(uv2, 1.9, m1);

                    vec3 c1 = color(shade(uv, t)) * ff;
                    vec3 c2 = color(shade(uv2, t)) * (1.0 - ff);

                    gl_FragColor = vec4(c1 + c2, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        window.scene.add(mesh);

        function animate() {
            uniforms.iTime.value += 0.01;
            window.renderer.render(window.scene, window.camera);
        }
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
