<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="天空盒与环境贴图示例，展示CubeTexture和PMREM效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 天空盒与环境</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #000;
            margin: 0;
            overflow: hidden;
        }
        #skyUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #skyUI h3 {
            margin: 0 0 10px 0;
            color: #00ff88;
            font-size: 16px;
        }
        #skyUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #skyUI .btn:hover {
            background: #444;
            border-color: #00ff88;
        }
        #skyUI .btn.active {
            background: #00ff88;
            color: #000;
        }
        #skyUI .control {
            margin: 10px 0;
        }
        #skyUI label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #skyUI input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #skyUI .value {
            font-size: 10px;
            color: #00ff88;
            text-align: right;
        }
        #skyUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="skyUI">
        <h3>🌌 天空盒与环境</h3>
        <button class="btn active" id="btnSky1">天空盒 1</button>
        <button class="btn" id="btnSky2">天空盒 2</button>
        <button class="btn" id="btnSky3">天空盒 3</button>
        <div class="control">
            <label>金属度</label>
            <input type="range" id="metalness" min="0" max="1" value="1" step="0.1">
            <div class="value" id="metalnessValue">1.0</div>
        </div>
        <div class="control">
            <label>粗糙度</label>
            <input type="range" id="roughness" min="0" max="1" value="0" step="0.1">
            <div class="value" id="roughnessValue">0.0</div>
        </div>
        <button class="btn" id="btnReset">重置视角</button>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            展示天空盒和环境反射效果
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 创建程序化天空盒
        function createProceduralSkybox(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // 创建渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, 512);
            gradient.addColorStop(0, color1);
            gradient.addColorStop(1, color2);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // 添加星星/云朵效果
            for (let i = 0; i < 100; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            return new THREE.CanvasTexture(canvas);
        }
        
        // 创建六面天空盒
        function createCubeSkybox(type) {
            const textures = [];
            let color1, color2;
            
            switch(type) {
                case 1: // 日落
                    color1 = '#ff6b35';
                    color2 = '#4a148c';
                    break;
                case 2: // 海洋
                    color1 = '#00bcd4';
                    color2 = '#006064';
                    break;
                case 3: // 森林
                    color1 = '#4caf50';
                    color2 = '#1b5e20';
                    break;
                default:
                    color1 = '#2196f3';
                    color2 = '#0d47a1';
            }
            
            // 为六个面创建纹理
            for (let i = 0; i < 6; i++) {
                textures.push(createProceduralSkybox(color1, color2));
            }
            
            return new THREE.CubeTextureLoader().load([
                textures[0].image.toDataURL(),
                textures[1].image.toDataURL(),
                textures[2].image.toDataURL(),
                textures[3].image.toDataURL(),
                textures[4].image.toDataURL(),
                textures[5].image.toDataURL()
            ]);
        }
        
        // 使用 RoomEnvironment 作为环境贴图
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        
        // 创建程序化天空盒
        function setSkybox(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            let colors;
            switch(type) {
                case 1: // 日落
                    colors = ['#ff6b35', '#f7931e', '#ffd700', '#4a148c'];
                    break;
                case 2: // 海洋
                    colors = ['#00bcd4', '#26c6da', '#80deea', '#006064'];
                    break;
                case 3: // 森林
                    colors = ['#81c784', '#66bb6a', '#4caf50', '#1b5e20'];
                    break;
                default:
                    colors = ['#64b5f6', '#42a5f5', '#2196f3', '#0d47a1'];
            }
            
            // 创建渐变背景
            const gradient = ctx.createLinearGradient(0, 0, 0, 1024);
            colors.forEach((color, i) => {
                gradient.addColorStop(i / (colors.length - 1), color);
            });
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1024);
            
            // 添加星星
            if (type === 1) {
                for (let i = 0; i < 200; i++) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 添加云朵
            for (let i = 0; i < 20; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + Math.random() * 0.2})`;
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const size = 50 + Math.random() * 100;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.arc(x + size * 0.5, y, size * 0.8, 0, Math.PI * 2);
                ctx.arc(x - size * 0.5, y, size * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = texture;
            scene.environment = texture;
        }
        
        // 初始天空盒
        setSkybox(1);
        
        // 创建展示物体
        const objects = [];
        
        // 球体
        const sphereGeometry = new THREE.SphereGeometry(1.5, 64, 64);
        const sphereMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 1,
            roughness: 0,
            envMapIntensity: 1
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(-3, 1.5, 0);
        sphere.castShadow = true;
        scene.add(sphere);
        objects.push(sphere);
        
        // 立方体
        const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
        const boxMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 1,
            roughness: 0,
            envMapIntensity: 1
        });
        const box = new THREE.Mesh(boxGeometry, boxMaterial);
        box.position.set(0, 1, 0);
        box.castShadow = true;
        scene.add(box);
        objects.push(box);
        
        // 圆环
        const torusGeometry = new THREE.TorusKnotGeometry(1, 0.3, 128, 32);
        const torusMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 1,
            roughness: 0,
            envMapIntensity: 1
        });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.position.set(3, 1.5, 0);
        torus.castShadow = true;
        scene.add(torus);
        objects.push(torus);
        
        // 地面
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x222222,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // 网格辅助
        const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // UI控制
        document.getElementById('btnSky1').addEventListener('click', function() {
            setSkybox(1);
            document.querySelectorAll('#skyUI .btn').forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
        });
        
        document.getElementById('btnSky2').addEventListener('click', function() {
            setSkybox(2);
            document.querySelectorAll('#skyUI .btn').forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
        });
        
        document.getElementById('btnSky3').addEventListener('click', function() {
            setSkybox(3);
            document.querySelectorAll('#skyUI .btn').forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
        });
        
        document.getElementById('metalness').addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            document.getElementById('metalnessValue').textContent = value.toFixed(1);
            objects.forEach(obj => {
                obj.material.metalness = value;
            });
        });
        
        document.getElementById('roughness').addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            document.getElementById('roughnessValue').textContent = value.toFixed(1);
            objects.forEach(obj => {
                obj.material.roughness = value;
            });
        });
        
        document.getElementById('btnReset').addEventListener('click', () => {
            camera.position.set(0, 5, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 旋转物体展示反射效果
            sphere.rotation.y += 0.005;
            box.rotation.x += 0.003;
            box.rotation.y += 0.005;
            torus.rotation.x += 0.005;
            torus.rotation.y += 0.003;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
