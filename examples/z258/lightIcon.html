<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="亮光标记效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 亮光标记</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/",
            "gsap": "../../libs/gsap/index.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import gsap from 'gsap';

        class LightPillar {
            constructor(position = new THREE.Vector3(0, 0, 0), options = {}) {
                this.position = position.clone();

                this.params = {
                    color: options.color || '#00ffff',
                    emissive: options.emissive || '#00aaaa',
                    opacity: options.opacity ?? 0.8,
                    height: options.height || 20,
                    radius: options.radius || 0.8,
                    glowIntensity: options.glowIntensity ?? 1.5,
                    animateSpeed: options.animateSpeed ?? 1.0
                };

                this.group = null;
                this.coneMesh = null;
                this.circleMesh = null;
                this.circleAnimation = null;

                this._create();
            }

            _createTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                const color = this.params.color;
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);

                ctx.clearRect(0, 0, 256, 256);

                const centerX = 128;
                const centerY = 128;

                for (let i = 3; i >= 0; i--) {
                    const radius = 60 + i * 15;
                    const alpha = (1 - i * 0.2) * 0.8;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    ctx.lineWidth = 8 - i * 1.5;
                    ctx.stroke();
                }

                const innerRadius = 30;
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, innerRadius);
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.6)`);
                gradient.addColorStop(0.7, `rgba(${r}, ${Math.floor(g * 0.8)}, ${Math.floor(b * 1)}, 0.3)`);
                gradient.addColorStop(1, `rgba(${Math.floor(r * 0.6)}, ${Math.floor(g * 0.6)}, ${Math.floor(b * 1)}, 0)`);

                ctx.beginPath();
                ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                return new THREE.CanvasTexture(canvas);
            }

            _create() {
                if (this.group) {
                    this._cleanup();
                }

                this.group = new THREE.Group();

                const coneGeometry = new THREE.ConeGeometry(this.params.radius, this.params.height, 32);

                const material = new THREE.MeshPhongMaterial({
                    color: new THREE.Color(this.params.color),
                    emissive: new THREE.Color(this.params.emissive),
                    emissiveIntensity: this.params.glowIntensity,
                    transparent: true,
                    opacity: this.params.opacity,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    shininess: 100
                });

                this.coneMesh = new THREE.Mesh(coneGeometry, material);
                this.group.add(this.coneMesh);

                const texture = this._createTexture();
                const circlePlane = new THREE.PlaneGeometry(6, 6);
                const circleMaterial = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    map: texture,
                    transparent: true,
                    opacity: this.params.opacity,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                this.circleMesh = new THREE.Mesh(circlePlane, circleMaterial);
                this.circleMesh.rotation.x = -Math.PI / 2;
                this.circleMesh.position.set(0, -this.params.height / 2, 0);
                this.coneMesh.add(this.circleMesh);

                this._startCircleAnimation();

                this.group.position.set(
                    this.position.x,
                    this.position.y + this.params.height / 2,
                    this.position.z
                );
            }

            _cleanup() {
                if (this.circleAnimation) {
                    this.circleAnimation.kill();
                    this.circleAnimation = null;
                }

                if (this.group) {
                    this.group.traverse((child) => {
                        if (child.geometry) {
                            child.geometry.dispose();
                        }
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                    this.group = null;
                }
            }

            _startCircleAnimation() {
                if (this.circleAnimation) {
                    this.circleAnimation.kill();
                }
                if (this.circleMesh) {
                    this.circleMesh.scale.set(1, 1, 1);
                    this.circleAnimation = gsap.to(this.circleMesh.scale, {
                        duration: 1.5 / this.params.animateSpeed,
                        x: 1.5,
                        y: 1.5,
                        repeat: -1,
                        yoyo: true,
                        ease: 'power1.inOut'
                    });
                }
            }

            getMesh() {
                return this.group;
            }

            setPosition(x, y, z) {
                this.position.set(x, y, z);
                if (this.group) {
                    this.group.position.set(x, y + this.params.height / 2, z);
                }
            }

            setColor(color) {
                this.params.color = color;
                this.params.emissive = color;
                if (this.coneMesh) {
                    this.coneMesh.material.color.set(color);
                    this.coneMesh.material.emissive.set(color);
                }
                if (this.circleMesh) {
                    const oldMap = this.circleMesh.material.map;
                    const newTexture = this._createTexture();
                    this.circleMesh.material.map = newTexture;
                    this.circleMesh.material.needsUpdate = true;
                    if (oldMap) oldMap.dispose();
                }
            }

            setEmissive(emissive) {
                this.params.emissive = emissive;
                if (this.coneMesh) {
                    this.coneMesh.material.emissive.set(emissive);
                }
            }

            setOpacity(opacity) {
                this.params.opacity = opacity;
                if (this.coneMesh) {
                    this.coneMesh.material.opacity = opacity;
                }
                if (this.circleMesh) {
                    this.circleMesh.material.opacity = opacity;
                }
            }

            setHeight(height) {
                if (this.params.height === height) return;
                this.params.height = height;
                if (this.coneMesh) {
                    this.coneMesh.geometry.dispose();
                    this.coneMesh.geometry = new THREE.ConeGeometry(this.params.radius, this.params.height, 32);
                }
                if (this.circleMesh) {
                    this.circleMesh.position.set(0, -this.params.height / 2, 0);
                }
                this.setPosition(this.position.x, this.position.y, this.position.z);
            }

            setRadius(radius) {
                if (this.params.radius === radius) return;
                this.params.radius = radius;
                if (this.coneMesh) {
                    this.coneMesh.geometry.dispose();
                    this.coneMesh.geometry = new THREE.ConeGeometry(this.params.radius, this.params.height, 32);
                }
            }

            setGlowIntensity(intensity) {
                this.params.glowIntensity = intensity;
                if (this.coneMesh) {
                    this.coneMesh.material.emissiveIntensity = intensity;
                }
            }

            setAnimateSpeed(speed) {
                this.params.animateSpeed = speed;
                this._startCircleAnimation();
            }

            dispose() {
                this._cleanup();
            }
        }

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(30, 30, 30);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.scene.add(new THREE.AxesHelper(20));

        const gridHelper = new THREE.GridHelper(40, 40, 0x4a4a6e, 0x3a3a5e);
        window.scene.add(gridHelper);

        const lightPillar1 = new LightPillar(new THREE.Vector3(0, 0, 0), {
            color: '#00ffff',
            height: 15,
            radius: 0.6
        });
        window.scene.add(lightPillar1.getMesh());

        const lightPillar2 = new LightPillar(new THREE.Vector3(10, 0, 10), {
            color: '#ff6600',
            height: 20,
            radius: 0.8
        });
        window.scene.add(lightPillar2.getMesh());

        const lightPillar3 = new LightPillar(new THREE.Vector3(-10, 0, -10), {
            color: '#ff00ff',
            height: 25,
            radius: 1.0
        });
        window.scene.add(lightPillar3.getMesh());

        const params = {
            pillarColor: '#00ffff',
            pillarEmissive: '#00aaaa',
            pillarOpacity: 0.8,
            pillarHeight: 20,
            pillarRadius: 0.8,
            glowIntensity: 1.5,
            animateSpeed: 1.0,
            selectedPillar: 'Pillar 1'
        };

        const pillars = {
            'Pillar 1': lightPillar1,
            'Pillar 2': lightPillar2,
            'Pillar 3': lightPillar3
        };

        let currentPillar = lightPillar1;

        const gui = new GUI();
        gui.domElement.style.top = '50px';

        gui.title('光柱参数');

        gui.add(params, 'selectedPillar', Object.keys(pillars)).name('选择光柱').onChange((value) => {
            currentPillar = pillars[value];
        });

        gui.addColor(params, 'pillarColor').name('光柱颜色').onChange((value) => {
            currentPillar.setColor(value);
        });

        gui.addColor(params, 'pillarEmissive').name('自发光颜色').onChange((value) => {
            currentPillar.setEmissive(value);
        });

        gui.add(params, 'pillarOpacity', 0.1, 1.0, 0.1).name('透明度').onChange((value) => {
            currentPillar.setOpacity(value);
        });

        gui.add(params, 'pillarHeight', 10, 30, 1).name('高度').onChange((value) => {
            currentPillar.setHeight(value);
        });

        gui.add(params, 'pillarRadius', 0.3, 1.5, 0.1).name('半径').onChange((value) => {
            currentPillar.setRadius(value);
        });

        gui.add(params, 'glowIntensity', 0.5, 3, 0.1).name('发光强度').onChange((value) => {
            currentPillar.setGlowIntensity(value);
        });

        gui.add(params, 'animateSpeed', 0.5, 3, 0.1).name('动画速度').onChange((value) => {
            currentPillar.setAnimateSpeed(value);
        });

        gui.close();

        const guiContainer = document.createElement('div');
        guiContainer.appendChild(gui.domElement);
        guiContainer.style.position = 'absolute';
        guiContainer.style.top = '50px';
        guiContainer.style.right = '20px';
        guiContainer.style.zIndex = '100';
        document.body.appendChild(guiContainer);

        function animate() {
            requestAnimationFrame(animate);
            window.renderer.render(window.scene, window.camera);
        }

        animate();

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        window.scene = window.scene;
        window.camera = window.camera;
        window.renderer = window.renderer;

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
