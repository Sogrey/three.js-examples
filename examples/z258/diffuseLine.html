<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="发散飞线效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 发散飞线</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 30, 50);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(window.camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        window.scene.add(directionalLight);

        window.scene.add(new THREE.AxesHelper(30));

        const lineCount = 100;
        const lines = [];
        const lineData = [];

        for (let i = 0; i < lineCount; i++) {
            const geometry = new THREE.BufferGeometry();
            
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const length = 20 + Math.random() * 30;
            
            const start = new THREE.Vector3(0, 0, 0);
            const end = new THREE.Vector3(
                Math.sin(phi) * Math.cos(theta) * length,
                Math.sin(phi) * Math.sin(theta) * length,
                Math.cos(phi) * length
            );

            const positions = new Float32Array([
                start.x, start.y, start.z,
                end.x, end.y, end.z
            ]);

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                transparent: true,
                opacity: 1
            });

            const line = new THREE.Line(geometry, material);
            window.scene.add(line);

            lines.push(line);
            lineData.push({
                start: start.clone(),
                end: end.clone(),
                progress: 0,
                speed: 0.01 + Math.random() * 0.02,
                delay: Math.random() * 2
            });
        }

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            lines.forEach((line, index) => {
                const data = lineData[index];
                
                if (time > data.delay) {
                    data.progress += data.speed;
                    
                    if (data.progress > 1) {
                        data.progress = 0;
                        data.delay = time + Math.random() * 0.5;
                        
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const length = 20 + Math.random() * 30;
                        
                        data.end.set(
                            Math.sin(phi) * Math.cos(theta) * length,
                            Math.sin(phi) * Math.sin(theta) * length,
                            Math.cos(phi) * length
                        );
                        
                        line.material.color.setHSL(Math.random(), 1, 0.5);
                    }

                    const alpha = Math.sin(data.progress * Math.PI);
                    line.material.opacity = alpha;

                    const positions = line.geometry.attributes.position.array;
                    positions[0] = data.start.x;
                    positions[1] = data.start.y;
                    positions[2] = data.start.z;
                    positions[3] = data.start.x + (data.end.x - data.start.x) * data.progress;
                    positions[4] = data.start.y + (data.end.y - data.start.y) * data.progress;
                    positions[5] = data.start.z + (data.end.z - data.start.z) * data.progress;
                    
                    line.geometry.attributes.position.needsUpdate = true;
                }
            });

            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        window.scene = window.scene;
        window.camera = window.camera;
        window.renderer = window.renderer;

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
