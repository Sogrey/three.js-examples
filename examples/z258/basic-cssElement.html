<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS元素 - Three.js r179</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #css-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* CSS3D元素样式 */
        .css3d-element {
            pointer-events: auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .css3d-element:hover {
            transform: scale(1.1);
        }
        
        /* 卡片样式 */
        .info-card {
            width: 200px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,240,255,0.9));
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .info-card:hover {
            border-color: #4a9eff;
            box-shadow: 0 12px 40px rgba(74,158,255,0.4);
        }
        .info-card h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .info-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        .info-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        /* 标签样式 */
        .label-tag {
            padding: 8px 16px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .label-tag:hover {
            background: rgba(74,158,255,0.9);
            border-color: #4a9eff;
        }
        
        /* 图片框样式 */
        .image-frame {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.2);
        }
        .image-frame:hover {
            border-color: #4a9eff;
            transform: scale(1.05);
        }
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 按钮样式 */
        .action-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.6);
        }
        
        /* 标题样式 */
        .title-banner {
            padding: 20px 40px;
            background: linear-gradient(135deg, rgba(255,107,107,0.95), rgba(255,142,83,0.95));
            color: white;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255,107,107,0.4);
            cursor: pointer;
        }
        .title-banner:hover {
            transform: scale(1.05);
        }
        
        /* 加载提示 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 100;
        }
        
        /* 说明面板 */
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }
        #info h4 {
            margin-bottom: 10px;
            color: #4a9eff;
        }
        #info p {
            margin: 5px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">加载中...</div>
        <div id="info">
            <h4>CSS3D元素示例</h4>
            <p>• 鼠标左键：旋转视角</p>
            <p>• 鼠标右键：平移</p>
            <p>• 滚轮：缩放</p>
            <p>• 点击HTML元素交互</p>
        </div>
        <div id="css-container"></div>
        <div id="webgl-container"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS3DRenderer, CSS3DObject, CSS3DSprite } from 'three/addons/renderers/CSS3DRenderer.js';

        // 隐藏加载提示
        document.getElementById('loading').style.display = 'none';

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.set(0, 0, 800);

        // WebGL渲染器
        const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        webglRenderer.setSize(window.innerWidth, window.innerHeight);
        webglRenderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('webgl-container').appendChild(webglRenderer.domElement);

        // CSS3D渲染器
        const css3dRenderer = new CSS3DRenderer();
        css3dRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css-container').appendChild(css3dRenderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, css3dRenderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 200;
        controls.maxDistance = 1500;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 200, 100);
        scene.add(directionalLight);

        // 创建3D背景网格
        const gridHelper = new THREE.GridHelper(1000, 20, 0x444444, 0x222222);
        gridHelper.position.y = -200;
        scene.add(gridHelper);

        // 创建3D几何体作为参考
        function create3DObjects() {
            // 中心立方体
            const cubeGeometry = new THREE.BoxGeometry(100, 100, 100);
            const cubeMaterial = new THREE.MeshPhongMaterial({
                color: 0x4a9eff,
                transparent: true,
                opacity: 0.3,
                wireframe: true
            });
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            scene.add(cube);

            // 围绕的球体
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const radius = 250;
                const sphereGeometry = new THREE.SphereGeometry(30, 32, 32);
                const sphereMaterial = new THREE.MeshPhongMaterial({
                    color: new THREE.Color().setHSL(i / 6, 0.8, 0.6),
                    transparent: true,
                    opacity: 0.4
                });
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                sphere.position.set(
                    Math.cos(angle) * radius,
                    Math.sin(angle * 0.5) * 100,
                    Math.sin(angle) * radius
                );
                scene.add(sphere);
            }
        }
        create3DObjects();

        // 创建CSS3D元素
        function createCSS3DElements() {
            // 1. 中心标题 - CSS3DObject
            const titleDiv = document.createElement('div');
            titleDiv.className = 'title-banner css3d-element';
            titleDiv.innerHTML = '🎨 CSS3D元素示例';
            titleDiv.addEventListener('click', () => {
                titleDiv.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    titleDiv.style.transform = '';
                }, 300);
            });
            
            const titleObject = new CSS3DObject(titleDiv);
            titleObject.position.set(0, 150, 0);
            titleObject.scale.set(0.5, 0.5, 0.5);
            scene.add(titleObject);

            // 2. 信息卡片 - 围绕中心分布
            const cardData = [
                { icon: '🚀', title: '高性能', desc: 'CSS3D渲染器' },
                { icon: '💡', title: '交互性', desc: '原生DOM事件' },
                { icon: '🎭', title: '灵活性', desc: '任意HTML内容' },
                { icon: '📱', title: '响应式', desc: '自适应布局' }
            ];

            cardData.forEach((data, i) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'info-card css3d-element';
                cardDiv.innerHTML = `
                    <div class="icon">${data.icon}</div>
                    <h3>${data.title}</h3>
                    <p>${data.desc}</p>
                `;
                cardDiv.addEventListener('click', () => {
                    cardDiv.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
                    cardDiv.querySelector('h3').style.color = '#fff';
                    cardDiv.querySelector('p').style.color = '#eee';
                    setTimeout(() => {
                        cardDiv.style.background = '';
                        cardDiv.querySelector('h3').style.color = '';
                        cardDiv.querySelector('p').style.color = '';
                    }, 1000);
                });

                const cardObject = new CSS3DObject(cardDiv);
                const angle = (i / cardData.length) * Math.PI * 2;
                const radius = 300;
                cardObject.position.set(
                    Math.cos(angle) * radius,
                    -50,
                    Math.sin(angle) * radius
                );
                cardObject.lookAt(0, -50, 0);
                scene.add(cardObject);
            });

            // 3. 标签 - CSS3DSprite（始终面向相机）
            const labelTexts = ['Three.js', 'CSS3D', 'WebGL', 'HTML5', 'JavaScript'];
            labelTexts.forEach((text, i) => {
                const labelDiv = document.createElement('div');
                labelDiv.className = 'label-tag css3d-element';
                labelDiv.textContent = text;
                labelDiv.addEventListener('click', () => {
                    labelDiv.style.background = '#4a9eff';
                    setTimeout(() => {
                        labelDiv.style.background = '';
                    }, 500);
                });

                const labelSprite = new CSS3DSprite(labelDiv);
                const angle = (i / labelTexts.length) * Math.PI * 2 + Math.PI / 5;
                const radius = 400;
                labelSprite.position.set(
                    Math.cos(angle) * radius,
                    100 + Math.sin(i * 2) * 50,
                    Math.sin(angle) * radius
                );
                labelSprite.scale.set(0.8, 0.8, 0.8);
                scene.add(labelSprite);
            });

            // 4. 图片框
            const imageDiv = document.createElement('div');
            imageDiv.className = 'image-frame css3d-element';
            imageDiv.innerHTML = '<img src="../../images/textures/test.jpg" alt="示例图片">';
            imageDiv.addEventListener('click', () => {
                imageDiv.style.transform = 'scale(1.5) rotateY(180deg)';
                setTimeout(() => {
                    imageDiv.style.transform = '';
                }, 1000);
            });

            const imageObject = new CSS3DObject(imageDiv);
            imageObject.position.set(-250, 100, -200);
            imageObject.rotation.y = Math.PI / 6;
            scene.add(imageObject);

            // 5. 操作按钮
            const btnDiv = document.createElement('div');
            btnDiv.className = 'action-btn css3d-element';
            btnDiv.textContent = '点击交互';
            btnDiv.addEventListener('click', () => {
                // 随机改变背景色
                const hue = Math.random() * 360;
                scene.background = new THREE.Color(`hsl(${hue}, 50%, 15%)`);
                btnDiv.textContent = '颜色已改变!';
                setTimeout(() => {
                    btnDiv.textContent = '点击交互';
                }, 1000);
            });

            const btnObject = new CSS3DObject(btnDiv);
            btnObject.position.set(250, 100, -200);
            btnObject.rotation.y = -Math.PI / 6;
            scene.add(btnObject);
        }
        createCSS3DElements();

        // 动画循环
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            controls.update();

            // 渲染
            webglRenderer.render(scene, camera);
            css3dRenderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            webglRenderer.setSize(window.innerWidth, window.innerHeight);
            css3dRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到 window 供截图使用
        window.renderer = webglRenderer;
        window.camera = camera;
        window.scene = scene;
    </script>
</body>
</html>
