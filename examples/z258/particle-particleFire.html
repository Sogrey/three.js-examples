<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="粒子烟花">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 粒子烟花</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/",
            "gsap": "../../libs/gsap/index.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import gsap from 'gsap';

        const container = document.getElementById('threeContainer');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const sizes = {
            width: window.innerWidth,
            height: window.innerHeight,
            pixelRatio: Math.min(window.devicePixelRatio, 2),
        };

        const camera = new THREE.PerspectiveCamera(
            75,
            sizes.width / sizes.height,
            0.1,
            100
        );
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(sizes.pixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const helperGrid = new THREE.GridHelper(10, 10, 0x4a4a6e, 0x3a3a5e);
        scene.add(helperGrid);

        const helperAxes = new THREE.AxesHelper(5);
        scene.add(helperAxes);

        const createCircleTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 128, 128);

            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.6, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(64, 64, 60, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        };

        const createStarTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 128, 128);

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            const cx = 64;
            const cy = 64;
            const outerRadius = 50;
            const innerRadius = 20;
            const spikes = 6;

            for (let i = 0; i < spikes * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                const x = cx + radius * Math.cos(angle);
                const y = cy + radius * Math.sin(angle);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();

            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        };

        const createSparkleTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 128, 128);

            ctx.strokeStyle = 'rgba(255, 255, 255, 1)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(64, 64);
                ctx.lineTo(
                    64 + 50 * Math.cos(angle),
                    64 + 50 * Math.sin(angle)
                );
                ctx.stroke();
            }

            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        };

        const textures = [
            createCircleTexture(),
            createStarTexture(),
            createSparkleTexture(),
        ];

        const createFireWork = (
            count,
            position,
            size,
            texture,
            radius = 1,
            color
        ) => {
            const positionsArray = new Float32Array(count * 3);
            const sizeArray = new Float32Array(count);
            const lifeArray = new Float32Array(count);

            for (let index = 0; index < count; index++) {
                const spherical = new THREE.Spherical(
                    radius * (0.75 + (Math.random() - 0.5) * 0.25),
                    Math.random() * Math.PI,
                    Math.random() * Math.PI * 2
                );
                const pos = new THREE.Vector3();
                pos.setFromSpherical(spherical);

                positionsArray[index * 3] = pos.x;
                positionsArray[index * 3 + 1] = pos.y;
                positionsArray[index * 3 + 2] = pos.z;

                sizeArray[index] = Math.random();
                lifeArray[index] = Math.random() + 1;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
                'position',
                new THREE.Float32BufferAttribute(positionsArray, 3)
            );
            geometry.setAttribute(
                'aSize',
                new THREE.Float32BufferAttribute(sizeArray, 1)
            );
            geometry.setAttribute(
                'aLife',
                new THREE.Float32BufferAttribute(lifeArray, 1)
            );

            const material = new THREE.ShaderMaterial({
                fragmentShader: `
                precision mediump float;
                
                uniform sampler2D uTexture;
                uniform vec3 uColor;
                
                varying vec2 vUv;
                
                void main(){
                  float textureAlpha = texture(uTexture, gl_PointCoord).r;
                  gl_FragColor = vec4(uColor, textureAlpha);
                  #include <tonemapping_fragment>
                  #include <colorspace_fragment>
                }`,
                vertexShader: `#include <common>
                precision mediump float;
                
                attribute float aSize;
                attribute float aLife;
                
                uniform float uTime;
                uniform float uSize;
                uniform vec2 uResolution;
                uniform float uProgress;
                
                varying vec3 vPosition;
                
                float linearFunction (float x, float x1, float y1, float x2, float y2) {
                    return x * ((y2 - y1) / (x2 - x1)) + (y2 - ((y2 - y1) / (x2 - x1)) * x2);
                }
                
                void main(){
                    vec3 newPosition = position;
                
                    float vProgress = uProgress;
                    vProgress *= aLife;
                
                    float explodingProgress = vProgress * 10.0;
                    explodingProgress = clamp(explodingProgress, 0.0, 1.0);
                    explodingProgress = 1.0 - pow(1.0 - explodingProgress, 3.0);
                    newPosition *= explodingProgress;
                
                    float fallingProgress = linearFunction(vProgress, 0.1, 0.0, 1.0, 1.0);
                    fallingProgress = clamp(fallingProgress, 0.0, 1.0);
                    fallingProgress = (1.0 - pow(1.0 - fallingProgress, 3.0)) * 0.2;
                    newPosition.y -= fallingProgress;
                
                    float sizeOpenProgress = linearFunction(vProgress, 0.0, 0.0, 0.125, 1.0);
                    float sizecCloseProgress = linearFunction(vProgress, 0.125, 1.0, 1.0, 0.0);
                    float scallingProcess = min(sizecCloseProgress, sizecCloseProgress);
                    scallingProcess = clamp(scallingProcess, 0.0, 1.0);
                
                    float twinkProgreess = linearFunction(vProgress, 0.2, 0.0, 0.8, 1.0);
                    twinkProgreess = clamp(twinkProgreess, 0.0, 1.0);
                    float twinkSize = sin(vProgress * 30.0) * 0.5 + 0.5;
                    twinkSize = 1.0 - twinkProgreess * twinkSize;
                
                    vec4 modelPosition = modelMatrix * vec4(newPosition, 1.0);
                    vec4 viewPosition = viewMatrix * modelPosition;
                    vec4 projectedPosition = projectionMatrix * viewPosition;
                    gl_Position = projectedPosition;
                
                    gl_PointSize = uSize * uResolution.y;
                    gl_PointSize *= aSize;
                    gl_PointSize *= scallingProcess;
                    gl_PointSize *= twinkSize;
                    gl_PointSize *= (1.0 / -viewPosition.z);
                
                    if(gl_PointSize < 1.0)
                        gl_Position = vec4(9999.9);
                }`,
                uniforms: {
                    uSize: { value: size },
                    uResolution: {
                        value: new THREE.Vector2(sizes.width, sizes.height)
                    },
                    uTexture: { value: texture },
                    uColor: { value: color },
                    uProgress: { value: 0 },
                },
                transparent: true,
                depthTest: false,
                blending: THREE.AdditiveBlending,
            });

            const fireWork = new THREE.Points(geometry, material);
            fireWork.position.copy(position);
            scene.add(fireWork);

            const destory = () => {
                scene.remove(fireWork);
                geometry.dispose();
                material.dispose();
            };

            gsap.to(material.uniforms.uProgress, {
                value: 1,
                duration: 3,
                ease: 'linear',
                onComplete: destory,
            });
        };

        const randomCreateFireWork = () => {
            const count = Math.round(400 + Math.random() * 1000);
            const position = new THREE.Vector3(
                (Math.random() - 0.5) * 3,
                Math.random() * 2,
                (Math.random() - 0.5) * 3
            );
            const size = 0.1 + Math.random() * 0.1;
            const texture = textures[Math.floor(Math.random() * textures.length)];
            const radius = 1 + Math.random();
            const color = new THREE.Color();
            color.setHSL(Math.random(), 1, 0.7);
            createFireWork(count, position, size, texture, radius, color);
        };

        setInterval(randomCreateFireWork, 800);

        const animate = () => {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        };
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;

        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
