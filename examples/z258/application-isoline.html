<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="使用Three.js创建等值线地形效果，通过SimplexNoise生成地形高度，使用CanvasTexture绘制等值线纹理">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 等值线</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        window.camera.position.set(0, 8, 12);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 10, 5);
        window.scene.add(directionalLight);

        // 参数
        const params = {
            noiseScale: 0.5,
            heightScale: 1.5,
            isolineCount: 10,
            autoRotate: true
        };

        let terrain;
        const simplex = new SimplexNoise();

        // 创建等值线纹理
        function createIsolineTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 128;

            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a3a5c';
            ctx.fillRect(0, 0, 16, 128);
            ctx.fillStyle = '#4a9eff';
            ctx.fillRect(0, 0, 16, 8);

            const texture = new THREE.CanvasTexture(canvas);
            texture.repeat.set(1, params.isolineCount);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;

            return texture;
        }

        // 创建地形
        function createTerrain() {
            if (terrain) {
                window.scene.remove(terrain);
                terrain.geometry.dispose();
                terrain.material.dispose();
            }

            const geometry = new THREE.PlaneGeometry(12, 8, 150, 100);
            const pos = geometry.getAttribute('position');
            const uv = geometry.getAttribute('uv');

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = params.heightScale * simplex.noise(x * params.noiseScale, y * params.noiseScale);

                pos.setZ(i, z);
                uv.setXY(i, 0, z + params.heightScale);
            }

            geometry.computeVertexNormals();

            const isoTexture = createIsolineTexture();

            const material = new THREE.MeshPhysicalMaterial({
                color: 0x2a4a6e,
                roughness: 0.6,
                metalness: 0.3,
                side: THREE.DoubleSide,
                map: isoTexture,
                clearcoat: 0.3,
                clearcoatRoughness: 0.4
            });

            terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            window.scene.add(terrain);
        }

        // 初始化地形
        createTerrain();

        // 创建GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';

        const folder = gui.addFolder('地形参数');
        folder.add(params, 'noiseScale', 0.1, 1.0, 0.1).name('噪声缩放').onChange(createTerrain);
        folder.add(params, 'heightScale', 0.5, 3.0, 0.1).name('高度缩放').onChange(createTerrain);
        folder.add(params, 'isolineCount', 5, 30, 1).name('等值线数量').onChange(createTerrain);
        folder.add(params, 'autoRotate').name('自动旋转').onChange((v) => {
            controls.autoRotate = v;
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            directionalLight.position.copy(window.camera.position);
            window.renderer.render(window.scene, window.camera);
        }

        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 截图支持
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
