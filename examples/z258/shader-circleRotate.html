<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示旋转的圆着色器效果，使用同心圆和三角形噪声创建动态视觉效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 旋转的圆</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a0a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 1.5);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const geometry = new THREE.PlaneGeometry(1, 1);

        const material = new THREE.ShaderMaterial({
            uniforms,
            transparent: true,
            side: THREE.DoubleSide,
            vertexShader: `
                varying vec3 vPosition;
                varying vec2 vUv;
                void main() { 
                    vUv = uv; 
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform float iTime;
                uniform vec2 iResolution; 
                varying vec2 iMouse;
                varying vec2 vUv;

                #define PI 3.1415926
                #define NUM 20.
                #define PALETTE vec3(.0, 1.4, 2.)+1.5

                #define COLORED
                #define MIRROR
                #define ROT_OFST
                #define TRIANGLE_NOISE

                mat2 mm2(in float a){float c = cos(a), s = sin(a);return mat2(c,-s,s,c);}
                float tri(in float x){return abs(fract(x)-.5);}
                vec2 tri2(in vec2 p){return vec2(tri(p.x+tri(p.y*2.)),tri(p.y+tri(p.x*2.)));}
                mat2 m2 = mat2( 0.970,  0.242, -0.242,  0.970 );

                float triangleNoise(in vec2 p)
                {
                    float z=1.5;
                    float z2=1.5;
                    float rz = 0.;
                    vec2 bp = p;
                    for (float i=0.; i<=3.; i++ )
                    {
                        vec2 dg = tri2(bp*2.)*.8;
                        dg *= mm2(iTime*.3);
                        p += dg/z2;

                        bp *= 1.6;
                        z2 *= .6;
                        z *= 1.8;
                        p *= 1.2;
                        p*= m2;
                        
                        rz+= (tri(p.x+tri(p.y)))/z;
                    }
                    return rz;
                }
                        
                void main(void) {
                    float time = iTime * 1.2;
                    float aspect = iResolution.x / iResolution.y;
                    float w = 50. / sqrt(iResolution.x * aspect + iResolution.y);

                    vec2 p = (vUv - 0.5) * 2.0;
                    p.x *= aspect;
                    p *= 1.05;
                    vec2 bp = p;
                    
                    #ifdef ROTATE
                    p *= mm2(time * .25);
                    #endif
                    
                    float lp = length(p);
                    float id = floor(lp * NUM + .5) / NUM;
                    
                    #ifdef ROT_OFST
                    p *= mm2(id * 11.);
                    #endif
                    
                    #ifdef MIRROR
                    p.y = abs(p.y); 
                    #endif
                    
                    vec2 plr = vec2(lp, atan(p.y, p.x));
                    
                    float rz = 1. - pow(abs(sin(plr.x * PI * NUM)) * 1.25 / pow(w, 0.25), 2.5);
                    
                    float enp = plr.y + sin((time + id * 5.5)) * 1.52 - 1.5;
                    rz *= smoothstep(0., 0.05, enp);
                    
                    rz *= smoothstep(0., .022 * w / plr.x, enp) * step(id, 1.);
                    #ifndef MIRROR
                    rz *= smoothstep(-0.01, .02 * w / plr.x, PI - plr.y);
                    #endif
                    
                    #ifdef TRIANGLE_NOISE
                    rz *= (triangleNoise(p / (w * w)) * 0.9 + 0.4);
                    vec3 col = (sin(PALETTE + id * 5. + time) * 0.5 + 0.5) * rz;
                    col += smoothstep(.4, 1., rz) * 0.15;
                    col *= smoothstep(.2, 1., rz) + 1.;
                    
                    #else
                    vec3 col = (sin(PALETTE + id * 5. + time) * 0.5 + 0.5) * rz;
                    col *= smoothstep(.8, 1.15, rz) * .7 + .8;
                    #endif
                    
                    #ifndef COLORED
                    col = vec3(dot(col, vec3(.7)));
                    #endif
                    
                    if (col.r < 0.1 && col.g < 0.1 && col.b < 0.1) {
                        discard;
                    }
                    
                    gl_FragColor = vec4(col, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        window.scene.add(mesh);

        function animate() {
            uniforms.iTime.value += 0.01;
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.renderer.setSize(w, h);
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
            uniforms.iResolution.value.set(w, h);
        });

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
