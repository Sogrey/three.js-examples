<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示波浪粒子效果，使用着色器实现动态波浪粒子动画">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 波浪粒子</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        const sizes = {
            width: window.innerWidth,
            height: window.innerHeight
        };

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
        window.camera.position.z = 10;
        window.camera.position.y = 1.1;
        window.camera.position.x = 0;

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(sizes.width, sizes.height);
        window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
        container.appendChild(window.renderer.domElement);

        const planeGeometry = new THREE.PlaneGeometry(20, 20, 150, 150);
        const planeMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uElevation: { value: 0.482 },
                ucolor: { value: new THREE.Color(0x9ab0f4) },
                bsize: { value: 3 }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uElevation;

                attribute float aSize;
                uniform float bsize;

                varying float vPositionY;
                varying float vPositionZ;

                void main() {
                    vec4 modelPosition = modelMatrix * vec4(position, 1.0);
                    modelPosition.y = sin(modelPosition.x - uTime) * sin(modelPosition.z * 0.6 + uTime) * uElevation;

                    vec4 viewPosition = viewMatrix * modelPosition;
                    gl_Position = projectionMatrix * viewPosition;

                    gl_PointSize = 2.0 * aSize;
                    gl_PointSize *= ( 1.0 / - viewPosition.z ) * bsize;

                    vPositionY = modelPosition.y;
                    vPositionZ = modelPosition.z;
                }
            `,
            fragmentShader: `
                varying float vPositionY;
                varying float vPositionZ;
                uniform vec3 ucolor;

                void main() {
                    float strength = (vPositionY + 0.25) * 0.3;
                    gl_FragColor = vec4(ucolor, strength);
                }
            `,
            transparent: true,
        });

        const planeSizesArray = new Float32Array(planeGeometry.attributes.position.count);
        for (let i = 0; i < planeSizesArray.length; i++) {
            planeSizesArray[i] = Math.random() * 4.0;
        }
        planeGeometry.setAttribute('aSize', new THREE.BufferAttribute(planeSizesArray, 1));

        const plane = new THREE.Points(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI * 0.4;
        window.scene.add(plane);

        const gui = new GUI();
        gui.domElement.style.position = 'absolute';
        gui.domElement.style.top = '50px';
        gui.domElement.style.right = '10px';
        gui.domElement.style.zIndex = '1000';

        const planeFolder = gui.addFolder('Plane');
        planeFolder.addColor(planeMaterial.uniforms.ucolor, 'value').name('Color');
        planeFolder.add(planeMaterial.uniforms.bsize, 'value').min(0).max(10).step(0.001).name('Size');

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            window.camera.aspect = sizes.width / sizes.height;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(sizes.width, sizes.height);
            window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
        });

        const clock = new THREE.Clock();

        function animate() {
            const elapsedTime = clock.getElapsedTime();
            planeMaterial.uniforms.uTime.value = elapsedTime;
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) {
                            window.composer.render();
                        } else if (window.renderer) {
                            window.renderer.render(window.scene, window.camera);
                        }
                    }

                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
