<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示OrbitControls的各种控制参数，包括旋转、缩放、平移、阻尼、角度限制等。">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 轨道控制器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;
        let controls;
        let gui;

        const params = {
            reset: function() {
                gui.reset();
            }
        };

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x1a1a2e);

            window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            window.camera.position.set(0, 1, 4);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);

            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const texture = new THREE.TextureLoader().load('../../images/textures/earth.jpg');
            const material = new THREE.MeshBasicMaterial({ map: texture });
            const sphere = new THREE.Mesh(geometry, material);
            window.scene.add(sphere);

            const torus = new THREE.Mesh(
                new THREE.TorusGeometry(2, 0.1, 16, 100),
                new THREE.MeshNormalMaterial()
            );
            window.scene.add(torus);

            window.scene.add(new THREE.AxesHelper(5));
            window.scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x222222));

            initGUI();
            animate();
        }

        function initGUI() {
            gui = new GUI();
            gui.title('轨道控制器参数');

            const rotationFolder = gui.addFolder('旋转设置');
            rotationFolder.add(controls, 'autoRotate').name('自动旋转');
            rotationFolder.add(controls, 'autoRotateSpeed').min(0).max(10).name('自动旋转速度');
            rotationFolder.add(controls, 'enableRotate').name('启用旋转');
            rotationFolder.add(controls, 'rotateSpeed').min(0.1).max(2).step(0.1).name('旋转速度');

            const zoomFolder = gui.addFolder('缩放设置');
            zoomFolder.add(controls, 'enableZoom').name('启用缩放');
            zoomFolder.add(controls, 'zoomSpeed').min(0.1).max(2).step(0.1).name('缩放速度');
            zoomFolder.add(controls, 'zoomToCursor').name('光标为缩放中心');
            zoomFolder.add(controls, 'minDistance').min(0).max(20).name('最小距离');
            zoomFolder.add(controls, 'maxDistance').min(1).max(50).name('最大距离');

            const panFolder = gui.addFolder('平移设置');
            panFolder.add(controls, 'enablePan').name('启用平移');
            panFolder.add(controls, 'panSpeed').min(0.1).max(2).step(0.1).name('平移速度');

            const angleFolder = gui.addFolder('角度限制');
            angleFolder.add(controls, 'maxAzimuthAngle', -Math.PI * 2, Math.PI * 2).name('水平旋转上限');
            angleFolder.add(controls, 'minAzimuthAngle', -Math.PI * 2, Math.PI * 2).name('水平旋转下限');
            angleFolder.add(controls, 'maxPolarAngle', 0, Math.PI).name('垂直旋转上限');
            angleFolder.add(controls, 'minPolarAngle', 0, Math.PI).name('垂直旋转下限');

            const dampingFolder = gui.addFolder('阻尼设置');
            dampingFolder.add(controls, 'enableDamping').name('启用阻尼');
            dampingFolder.add(controls, 'dampingFactor').min(0).max(1).step(0.01).name('阻尼系数');

            const targetFolder = gui.addFolder('目标位置');
            targetFolder.add(controls.target, 'x').min(-5).max(5).step(0.1).name('X').listen();
            targetFolder.add(controls.target, 'y').min(-5).max(5).step(0.1).name('Y').listen();
            targetFolder.add(controls.target, 'z').min(-5).max(5).step(0.1).name('Z').listen();

            gui.add(params, 'reset').name('重置参数');
        }

        function animate() {
            if (controls) controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
