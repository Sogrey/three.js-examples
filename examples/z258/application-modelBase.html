<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="自动生成模型底座，根据模型边界框计算底座大小">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 模型底座</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0xdcdcdc);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 4, 4);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;

        // 添加灯光
        const light = new THREE.DirectionalLight(0xffffff, 3);
        light.position.set(1, 1, 1);
        window.scene.add(light);
        window.scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // 创建GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';
        
        const guiParams = {
            baseColor: '#ff0000',
            baseOpacity: 1.0,
            showBase: true,
            autoRotate: true
        };

        gui.addColor(guiParams, 'baseColor').name('底座颜色').onChange(updateBaseMaterial);
        gui.add(guiParams, 'baseOpacity', 0, 1).name('底座透明度').onChange(updateBaseMaterial);
        gui.add(guiParams, 'showBase').name('显示底座').onChange(updateBaseVisibility);
        gui.add(guiParams, 'autoRotate').name('自动旋转').onChange((v) => {
            controls.autoRotate = v;
        });

        let baseMesh = null;
        let loadedModel = null;

        // 更新底座材质
        function updateBaseMaterial() {
            if (baseMesh) {
                baseMesh.material.color.set(guiParams.baseColor);
                baseMesh.material.opacity = guiParams.baseOpacity;
            }
        }

        // 更新底座可见性
        function updateBaseVisibility() {
            if (baseMesh) {
                baseMesh.visible = guiParams.showBase;
            }
        }

        // 添加模型底座
        function addModelBase(model) {
            // 计算模型边界框
            const box = new THREE.Box3();
            box.setFromObject(model);
            
            // 获取中心点和尺寸
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            // 创建圆形底座
            const shape = new THREE.Shape();
            const radius = Math.max(size.x, size.z) / 2 * Math.sqrt(2);
            
            shape.moveTo(0, 0);
            shape.absarc(0, 0, radius, 0, Math.PI * 2, false);
            
            const geometry = new THREE.ShapeGeometry(shape, 32);
            const material = new THREE.MeshBasicMaterial({
                color: guiParams.baseColor,
                opacity: guiParams.baseOpacity,
                transparent: true,
                side: THREE.DoubleSide
            });
            
            baseMesh = new THREE.Mesh(geometry, material);
            baseMesh.rotation.x = -Math.PI / 2;
            baseMesh.position.set(center.x, 0, center.z);
            
            window.scene.add(baseMesh);
        }

        // 加载模型
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('../../libs/three/r179/jsm/libs/draco/');
        loader.setDRACOLoader(dracoLoader);

        loader.load(
            '../../models/gltf/car.glb',
            (gltf) => {
                loadedModel = gltf.scene;
                window.scene.add(loadedModel);
                addModelBase(loadedModel);
            },
            undefined,
            (error) => {
                console.error('模型加载失败:', error);
            }
        );

        // 动画循环
        function animate() {
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }
        
        window.renderer.setAnimationLoop(animate);

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
