<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="围墙着色器 - 展示动态波浪围墙效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 围墙着色器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10000);
        window.camera.position.set(0, 40, 40);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const clock = new THREE.Clock();
        const deltaTime = { value: 0 };

        const grid = new THREE.GridHelper(100);
        window.scene.add(grid);

        const light = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(light);

        const geometry = new THREE.CylinderGeometry(30, 30, 20, 4, 64, true);
        const material = new THREE.ShaderMaterial({
            side: THREE.DoubleSide,
            transparent: true,
            depthWrite: false,
            uniforms: {
                uTime: deltaTime,
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;
                #define PI 3.14159265

                void main() {
                    vec4 baseColor = vec4(0.0, 1.0, 0.5, 1.0);
                    vec4 finalColor;
                    float amplitude = 1.0;
                    float frequency = 10.0;
                    float x = vUv.x;
                    float y = sin(x * frequency);
                    float t = 0.01 * (-uTime * 130.0);
                    y += sin(x * frequency * 2.1 + t) * 4.5;
                    y += sin(x * frequency * 1.72 + t * 1.121) * 4.0;
                    y += sin(x * frequency * 2.221 + t * 0.437) * 5.0;
                    y += sin(x * frequency * 3.1122 + t * 4.269) * 2.5;
                    y *= amplitude * 0.06;
                    y /= 3.0;
                    y += 0.55;
                    vec4 color = gl_FragColor.rgba;
                    float r = step(0.5, fract(vUv.y - uTime));
                    baseColor.a = step(vUv.y, y) * (y - vUv.y) / y;
                    gl_FragColor = baseColor;
                }
            `,
        });

        const cylinder = new THREE.Mesh(geometry, material);
        cylinder.position.y += 10;
        window.scene.add(cylinder);

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            controls.update();
            deltaTime.value = clock.getElapsedTime();
            window.renderer.render(window.scene, window.camera);
        }
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
