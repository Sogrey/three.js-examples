<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠标轨迹粒子 - Three.js r179</title>
    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Microsoft YaHei', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; cursor: crosshair; }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            min-width: 200px;
        }
        #controls h3 { margin-bottom: 10px; font-size: 14px; color: #00d4ff; }
        #controls button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: none;
            border-radius: 4px;
            background: #00d4ff;
            color: #000;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        #controls button:hover { background: #00a8cc; }
        #controls .slider-container {
            margin-bottom: 10px;
        }
        #controls label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        #controls input[type="range"] {
            width: 100%;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls">
        <h3>鼠标轨迹粒子</h3>
        <button id="btnClear">清除轨迹</button>
        <button id="btnAuto">自动演示: 关</button>
        <div class="slider-container">
            <label>粒子大小: <span id="sizeValue">4</span></label>
            <input type="range" id="particleSize" min="1" max="15" value="4">
        </div>
        <div class="slider-container">
            <label>粒子数量: <span id="countValue">5</span></label>
            <input type="range" id="particleCount" min="1" max="20" value="5">
        </div>
        <div class="slider-container">
            <label>消散速度: <span id="fadeValue">0.98</span></label>
            <input type="range" id="fadeSpeed" min="90" max="99" value="98">
        </div>
        <button id="btnColor">切换颜色</button>
        <button id="btnGlow">发光效果: 开</button>
    </div>
    <div id="info">移动鼠标产生粒子轨迹 | 点击并拖动绘制</div>

    <script type="module">
        import * as THREE from 'three';

        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 粒子系统
        const maxParticles = 3000;
        const particles = [];
        let particleIndex = 0;

        // 粒子几何体
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(maxParticles * 3);
        const colors = new Float32Array(maxParticles * 3);
        const sizes = new Float32Array(maxParticles);
        const opacities = new Float32Array(maxParticles);
        const lifes = new Float32Array(maxParticles);

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
        geometry.setAttribute('life', new THREE.BufferAttribute(lifes, 1));

        // 创建粒子纹理
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            // 创建发光圆形
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.6, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            return new THREE.CanvasTexture(canvas);
        }

        // 着色器材质
        const material = new THREE.ShaderMaterial({
            uniforms: {
                pointTexture: { value: createParticleTexture() },
                glow: { value: 1.0 }
            },
            vertexShader: `
                attribute float size;
                attribute float opacity;
                attribute float life;
                varying vec3 vColor;
                varying float vOpacity;
                void main() {
                    vColor = color;
                    vOpacity = opacity * life;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D pointTexture;
                uniform float glow;
                varying vec3 vColor;
                varying float vOpacity;
                void main() {
                    vec4 texColor = texture2D(pointTexture, gl_PointCoord);
                    gl_FragColor = vec4(vColor, texColor.a * vOpacity);
                    if (glow > 0.5) {
                        gl_FragColor.rgb *= 1.5;
                    }
                }
            `,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            vertexColors: true
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // 颜色主题
        const colorThemes = [
            { name: '青色', primary: new THREE.Color(0x00d4ff), secondary: new THREE.Color(0x0099cc) },
            { name: '紫色', primary: new THREE.Color(0xff00ff), secondary: new THREE.Color(0x9900cc) },
            { name: '金色', primary: new THREE.Color(0xffd700), secondary: new THREE.Color(0xff8c00) },
            { name: '绿色', primary: new THREE.Color(0x00ff88), secondary: new THREE.Color(0x00cc66) },
            { name: '彩虹', primary: null, secondary: null }
        ];
        let currentTheme = 0;
        let glowEnabled = true;

        // 鼠标状态
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let isMouseDown = false;
        let lastMousePos = new THREE.Vector3();

        // 自动演示
        let autoDemo = false;
        let autoTime = 0;

        // 添加粒子
        function addParticle(x, y, z) {
            const i = particleIndex;
            const i3 = i * 3;

            // 位置
            positions[i3] = x + (Math.random() - 0.5) * 3;
            positions[i3 + 1] = y + (Math.random() - 0.5) * 3;
            positions[i3 + 2] = z;

            // 颜色
            const theme = colorThemes[currentTheme];
            let color;
            if (theme.name === '彩虹') {
                const hue = (particleIndex / maxParticles + Date.now() * 0.0001) % 1;
                color = new THREE.Color().setHSL(hue, 1, 0.5);
            } else {
                color = Math.random() > 0.5 ? theme.primary : theme.secondary;
            }
            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;

            // 大小
            const baseSize = parseInt(document.getElementById('particleSize').value);
            sizes[i] = baseSize + Math.random() * baseSize;

            // 透明度
            opacities[i] = 0.8 + Math.random() * 0.2;

            // 生命周期
            lifes[i] = 1.0;

            particleIndex = (particleIndex + 1) % maxParticles;
        }

        // 鼠标移动
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.at(100, intersectPoint);

            const count = parseInt(document.getElementById('particleCount').value);

            if (isMouseDown || lastMousePos.distanceTo(intersectPoint) > 2) {
                for (let i = 0; i < count; i++) {
                    addParticle(
                        intersectPoint.x + (Math.random() - 0.5) * 5,
                        intersectPoint.y + (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 10
                    );
                }
                lastMousePos.copy(intersectPoint);
            }
        }

        // 事件监听
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mousedown', () => { isMouseDown = true; });
        document.addEventListener('mouseup', () => { isMouseDown = false; });

        // 触摸支持
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
        }, { passive: false });
        document.addEventListener('touchstart', () => { isMouseDown = true; });
        document.addEventListener('touchend', () => { isMouseDown = false; });

        // 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 自动演示
            if (autoDemo) {
                autoTime += delta * 2;
                const radius = 30;
                const x = Math.cos(autoTime) * radius + Math.cos(autoTime * 3) * 10;
                const y = Math.sin(autoTime * 1.5) * radius * 0.6 + Math.sin(autoTime * 2) * 10;

                for (let i = 0; i < 3; i++) {
                    addParticle(
                        x + (Math.random() - 0.5) * 8,
                        y + (Math.random() - 0.5) * 8,
                        (Math.random() - 0.5) * 15
                    );
                }
            }

            // 更新粒子
            const fadeSpeed = parseInt(document.getElementById('fadeSpeed').value) / 100;

            for (let i = 0; i < maxParticles; i++) {
                if (lifes[i] > 0) {
                    lifes[i] -= (1 - fadeSpeed) * 0.5;

                    // 添加重力效果
                    positions[i * 3 + 1] -= delta * 5;

                    // 添加漂移
                    positions[i * 3] += Math.sin(time + i) * delta * 2;
                    positions[i * 3 + 2] += Math.cos(time + i * 0.5) * delta * 2;

                    if (lifes[i] < 0) lifes[i] = 0;
                }
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.life.needsUpdate = true;

            // 更新发光效果
            material.uniforms.glow.value = glowEnabled ? 1.0 : 0.0;

            renderer.render(scene, camera);
        }

        animate();

        // UI控制
        document.getElementById('btnClear').addEventListener('click', () => {
            for (let i = 0; i < maxParticles; i++) {
                lifes[i] = 0;
            }
            geometry.attributes.life.needsUpdate = true;
        });

        document.getElementById('btnAuto').addEventListener('click', function() {
            autoDemo = !autoDemo;
            this.textContent = `自动演示: ${autoDemo ? '开' : '关'}`;
        });

        document.getElementById('particleSize').addEventListener('input', function() {
            document.getElementById('sizeValue').textContent = this.value;
        });

        document.getElementById('particleCount').addEventListener('input', function() {
            document.getElementById('countValue').textContent = this.value;
        });

        document.getElementById('fadeSpeed').addEventListener('input', function() {
            document.getElementById('fadeValue').textContent = (this.value / 100).toFixed(2);
        });

        document.getElementById('btnColor').addEventListener('click', () => {
            currentTheme = (currentTheme + 1) % colorThemes.length;
        });

        document.getElementById('btnGlow').addEventListener('click', function() {
            glowEnabled = !glowEnabled;
            this.textContent = `发光效果: ${glowEnabled ? '开' : '关'}`;
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window用于截图
        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;
    </script>
</body>
</html>
