<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="雷达着色器 - 展示雷达扫描效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 雷达着色器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 10, 10);

        window.renderer = new THREE.WebGLRenderer();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        window.scene.add(new THREE.AxesHelper(50000));

        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector2(1900, 1900) },
            ratio: { value: 1.0 }
        };

        const geometry = new THREE.PlaneGeometry(20, 20);
        const material = new THREE.ShaderMaterial({
            uniforms,
            side: 2,
            depthWrite: false,
            transparent: true,
            vertexShader: `
                varying vec3 vPosition;
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                #define SMOOTH(r,R) (1.0-smoothstep(R-1.0,R+1.0, r))
                #define RANGE(a,b,x) ( step(a,x)*(1.0-step(b,x)) )
                #define RS(a,b,x) ( smoothstep(a-1.0,a+1.0,x)*(1.0-smoothstep(b-1.0,b+1.0,x)) )
                #define M_PI 3.1415926535897932384626433832795

                #define blue1 vec3(0.74,0.95,1.00)
                #define blue2 vec3(0.87,0.98,1.00)
                #define blue3 vec3(0.35,0.76,0.83)
                #define blue4 vec3(0.953,0.969,0.89)
                #define red   vec3(1.00,0.38,0.227)

                #define MOV(a,b,c,d,t) (vec2(a*cos(t)+b*cos(0.1*(t)), c*sin(t)+d*cos(0.1*(t))))

                uniform float ratio;
                uniform float iTime;
                uniform vec2 iResolution;
                varying vec2 vUv;

                float movingLine(vec2 uv, vec2 center, float radius) {
                    float theta0 = 90.0 * iTime;
                    vec2 d = uv - center;
                    float r = sqrt(dot(d, d));
                    if(r < radius) {
                        vec2 p = radius * vec2(cos(theta0 * M_PI / 180.0), -sin(theta0 * M_PI / 180.0));
                        float l = length(d - p * clamp(dot(d, p) / dot(p, p), 0.0, 1.0));
                        d = normalize(d);
                        float theta = mod(180.0 * atan(d.y, d.x) / M_PI + theta0, 360.0);
                        float gradient = clamp(1.0 - theta / 90.0, 0.0, 1.0);
                        return SMOOTH(l, 1.0) + 0.5 * gradient;
                    }
                    else return 0.0;
                }

                float circle(vec2 uv, vec2 center, float radius, float width) {
                    float r = length(uv - center);
                    return SMOOTH(r - width / 2.0, radius) - SMOOTH(r + width / 2.0, radius);
                }

                float circle2(vec2 uv, vec2 center, float radius, float width, float opening) {
                    vec2 d = uv - center;
                    float r = sqrt(dot(d, d));
                    d = normalize(d);
                    if(abs(d.y) > opening)
                        return SMOOTH(r - width / 2.0, radius) - SMOOTH(r + width / 2.0, radius);
                    else
                        return 0.0;
                }

                float circle3(vec2 uv, vec2 center, float radius, float width) {
                    vec2 d = uv - center;
                    float r = sqrt(dot(d, d));
                    d = normalize(d);
                    float theta = 180.0 * (atan(d.y, d.x) / M_PI);
                    return smoothstep(2.0, 2.1, abs(mod(theta + 2.0, 45.0) - 2.0)) *
                        mix(0.5, 1.0, step(45.0, abs(mod(theta, 180.0) - 90.0))) *
                        (SMOOTH(r - width / 2.0, radius) - SMOOTH(r + width / 2.0, radius));
                }

                float triangles(vec2 uv, vec2 center, float radius) {
                    vec2 d = uv - center;
                    return RS(-8.0, 0.0, d.x - radius) * (1.0 - smoothstep(7.0 + d.x - radius, 9.0 + d.x - radius, abs(d.y)))
                        + RS(0.0, 8.0, d.x + radius) * (1.0 - smoothstep(7.0 - d.x - radius, 9.0 - d.x - radius, abs(d.y)))
                        + RS(-8.0, 0.0, d.y - radius) * (1.0 - smoothstep(7.0 + d.y - radius, 9.0 + d.y - radius, abs(d.x)))
                        + RS(0.0, 8.0, d.y + radius) * (1.0 - smoothstep(7.0 - d.y - radius, 9.0 - d.y - radius, abs(d.x)));
                }

                float _cross(vec2 uv, vec2 center, float radius) {
                    vec2 d = uv - center;
                    int x = int(d.x);
                    int y = int(d.y);
                    float r = sqrt(dot(d, d));
                    if((r < radius) && ((x == y) || (x == -y)))
                        return 1.0;
                    else return 0.0;
                }

                float dots(vec2 uv, vec2 center, float radius) {
                    vec2 d = uv - center;
                    float r = sqrt(dot(d, d));
                    if(r <= 2.5)
                        return 1.0;
                    if((r <= radius) && ((abs(d.y + 0.5) <= 1.0) && (mod(d.x + 1.0, 50.0) < 2.0)))
                        return 1.0;
                    else if((abs(d.y + 0.5) <= 1.0) && (r >= 50.0) && (r < 115.0))
                        return 0.5;
                    else
                        return 0.0;
                }

                float bip1(vec2 uv, vec2 center) {
                    return SMOOTH(length(uv - center), 3.0);
                }

                float bip2(vec2 uv, vec2 center) {
                    float r = length(uv - center);
                    float R = 8.0 + mod(87.0 * iTime, 80.0);
                    return (0.5 - 0.5 * cos(30.0 * iTime)) * SMOOTH(r, 5.0)
                        + SMOOTH(6.0, r) - SMOOTH(8.0, r)
                        + smoothstep(max(8.0, R - 20.0), R, r) - SMOOTH(R, r);
                }

                void main() {
                    vec2 _uv = vec2(vUv.x * iResolution.x, vUv.y * iResolution.y);
                    vec3 finalColor;
                    vec2 uv = _uv;
                    vec2 c = vec2(iResolution.x / 2.0, iResolution.y / 2.0);
                    finalColor = vec3(0.3 * _cross(uv, c, 240.0));
                    finalColor += (circle(uv, c, 100.0, 1.0) + circle(uv, c, 165.0, 1.0)) * blue1;
                    finalColor += circle(uv, c, 240.0, 2.0);
                    finalColor += circle3(uv, c, 313.0, 4.0) * blue1;
                    finalColor += triangles(uv, c, 315.0 + 30.0 * sin(iTime)) * blue2;
                    finalColor += movingLine(uv, c, 240.0) * blue3;
                    finalColor += circle(uv, c, 10.0, 1.0) * blue3;
                    finalColor += 0.7 * circle2(uv, c, 262.0, 1.0, 0.5 + 0.2 * cos(iTime)) * blue3;
                    if(length(uv - c) < 240.0) {
                        vec2 p = 130.0 * MOV(1.3, 1.0, 1.0, 1.4, 3.0 + 0.1 * iTime);
                        finalColor += bip1(uv, c + p) * vec3(1, 1, 1);
                        p = 130.0 * MOV(0.9, -1.1, 1.7, 0.8, -2.0 + sin(0.1 * iTime) + 0.15 * iTime);
                        finalColor += bip1(uv, c + p) * vec3(1, 1, 1);
                        p = 50.0 * MOV(1.54, 1.7, 1.37, 1.8, sin(0.1 * iTime + 7.0) + 0.2 * iTime);
                        finalColor += bip2(uv, c + p) * red;
                    }
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        window.scene.add(mesh);

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            uniforms.iTime.value += 0.01;
            window.renderer.render(window.scene, window.camera);
        }
        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
