<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="咖啡杯模型展示，带蒸汽粒子效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 咖啡蒸汽</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');
        
        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(12, 6, 12);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.target.y = 3;

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        window.scene.add(directionalLight);

        // 创建GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';
        
        const guiParams = {
            smokeSpeed: 1.0,
            smokeIntensity: 1.0,
            smokeColor: '#ffcc99'
        };

        gui.add(guiParams, 'smokeSpeed', 0, 3).name('蒸汽速度');
        gui.add(guiParams, 'smokeIntensity', 0, 2).name('蒸汽浓度');
        gui.addColor(guiParams, 'smokeColor').name('蒸汽颜色');

        // 加载咖啡杯模型
        const gltfLoader = new GLTFLoader();
        gltfLoader.load('../../models/gltf/coffeeMug.glb', (gltf) => {
            const bakedObject = gltf.scene.getObjectByName('baked');
            if (bakedObject && bakedObject.material.map) {
                bakedObject.material.map.anisotropy = 8;
            }
            window.scene.add(gltf.scene);
        }, undefined, (error) => {
            console.error('模型加载失败:', error);
        });

        // 加载柏林噪声纹理
        const textureLoader = new THREE.TextureLoader();
        const perlinTexture = textureLoader.load('../../textures/images/perlin.png');
        perlinTexture.wrapS = THREE.RepeatWrapping;
        perlinTexture.wrapT = THREE.RepeatWrapping;

        // 创建蒸汽几何体
        const smokeGeometry = new THREE.PlaneGeometry(1, 1, 16, 64);
        smokeGeometry.translate(0, 0.5, 0);
        smokeGeometry.scale(1.5, 6, 1.5);

        // 创建蒸汽材质
        const smokeMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                #define M_PI 3.1415926535897932384626433832795

                varying vec2 vUv;
                
                uniform float uTime;
                uniform float uSpeed;
                uniform sampler2D uPerlinTexture;
                
                vec2 rotate2D(vec2 value, float angle) {
                    float s = sin(angle);
                    float c = cos(angle);
                    mat2 m = mat2(c, s, -s, c);
                    return m * value;
                }

                void main() {
                    vUv = uv;
                    
                    vec3 newPosition = position;
                    float angle = texture(
                        uPerlinTexture,
                        vec2(0.5, uv.y * 0.3 + uTime * 0.02 * uSpeed)
                    ).x * 7.0;
                    newPosition.xz = rotate2D(position.xz, angle);
                    
                    vec2 windOffset = vec2(
                        texture(uPerlinTexture, vec2(0.2, uTime * 0.02 * uSpeed)).x - 0.5,
                        texture(uPerlinTexture, vec2(0.7, uTime * 0.02 * uSpeed)).x - 0.5
                    );
                    
                    newPosition.xz += windOffset * pow(uv.y, 2.0) * 8.0;
                    
                    gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;

                uniform float uTime;
                uniform float uIntensity;
                uniform vec3 uColor;
                uniform sampler2D uPerlinTexture;
                
                void main() {
                    vec2 uv = vec2(vUv.x * 0.5, vUv.y * 0.3 - uTime / 15.0);
                    
                    float intensity = texture2D(uPerlinTexture, uv).x;
                    intensity = smoothstep(0.4, 1.0, intensity);
                    
                    intensity *= smoothstep(0.0, 0.1, vUv.x);
                    intensity *= smoothstep(1.0, 0.9, vUv.x);
                    
                    intensity *= smoothstep(0.0, 0.1, vUv.y);
                    intensity *= smoothstep(1.0, 0.4, vUv.y);
                    
                    intensity *= uIntensity;
                    
                    gl_FragColor = vec4(uColor, intensity);
                    
                    #include <tonemapping_fragment>
                    #include <colorspace_fragment>
                }
            `,
            uniforms: {
                uTime: { value: 0 },
                uSpeed: { value: 1.0 },
                uIntensity: { value: 1.0 },
                uColor: { value: new THREE.Color(0xffcc99) },
                uPerlinTexture: { value: perlinTexture }
            },
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // 创建蒸汽网格
        const smoke = new THREE.Mesh(smokeGeometry, smokeMaterial);
        smoke.position.y = 1.83;
        window.scene.add(smoke);

        // 时钟
        const clock = new THREE.Clock();

        // 颜色转换函数
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16) / 255,
                g: parseInt(result[2], 16) / 255,
                b: parseInt(result[3], 16) / 255
            } : { r: 1, g: 0.8, b: 0.6 };
        }

        // 动画循环
        function animate() {
            const elapsedTime = clock.getElapsedTime();
            
            controls.update();
            
            // 更新蒸汽uniforms
            smokeMaterial.uniforms.uTime.value = elapsedTime;
            smokeMaterial.uniforms.uSpeed.value = guiParams.smokeSpeed;
            smokeMaterial.uniforms.uIntensity.value = guiParams.smokeIntensity;
            
            const color = hexToRgb(guiParams.smokeColor);
            smokeMaterial.uniforms.uColor.value.set(color.r, color.g, color.b);
            
            window.renderer.render(window.scene, window.camera);
        }
        
        window.renderer.setAnimationLoop(animate);

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
