<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="程序化地形生成示例，使用GLSL着色器在GPU上生成噪声地形">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 程序化地形生成</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x87CEEB);
        window.scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
        window.camera.position.set(0, 15, 30);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 3, 0);
        controls.minPolarAngle = Math.PI * 0.4;
        controls.maxPolarAngle = Math.PI * 0.5;
        controls.minDistance = 10;
        controls.maxDistance = 50;
        controls.enablePan = false;

        // 添加光照
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(1, 1, 1);
        window.scene.add(dirLight, new THREE.AmbientLight(0xffffff, 0.75));

        // 添加网格辅助
        const grid = new THREE.GridHelper(50, 50);
        window.scene.add(grid);

        // GUI 参数
        const guiParams = {
            heightScale: 35,
            maxHeight: 15,
            power: 3,
            speed: 0.001,
            wireframe: false,
            color1: '#1a5276',
            color2: '#2874a6',
            color3: '#f9e79f',
            color4: '#58d68d',
            color5: '#7f8c8d',
            color6: '#ecf0f1'
        };

        // 创建GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';
        const terrainFolder = gui.addFolder('地形参数');
        terrainFolder.add(guiParams, 'heightScale', 10, 100).name('高度缩放').onChange(updateUniforms);
        terrainFolder.add(guiParams, 'maxHeight', 5, 50).name('最大高度').onChange(updateUniforms);
        terrainFolder.add(guiParams, 'power', 1, 5).name('幂次').onChange(updateUniforms);
        terrainFolder.add(guiParams, 'speed', 0, 0.01).name('旋转速度');
        terrainFolder.add(guiParams, 'wireframe').name('线框模式').onChange(updateWireframe);
        
        const colorFolder = gui.addFolder('颜色');
        colorFolder.addColor(guiParams, 'color1').name('深海').onChange(updateUniforms);
        colorFolder.addColor(guiParams, 'color2').name('浅海').onChange(updateUniforms);
        colorFolder.addColor(guiParams, 'color3').name('沙滩').onChange(updateUniforms);
        colorFolder.addColor(guiParams, 'color4').name('草地').onChange(updateUniforms);
        colorFolder.addColor(guiParams, 'color5').name('岩石').onChange(updateUniforms);
        colorFolder.addColor(guiParams, 'color6').name('雪地').onChange(updateUniforms);

        let terrainMesh = null;

        // 顶点着色器
        const vertexShader = `
            uniform float uTime;
            uniform float uHeightScale;
            uniform float uMaxHeight;
            uniform float uPower;
            
            varying vec2 vUv;
            varying float vHeight;
            
            // 哈希函数
            vec3 hash(vec3 p) {
                p = vec3(
                    dot(p, vec3(127.1, 311.7, 74.7)),
                    dot(p, vec3(269.5, 183.3, 246.1)),
                    dot(p, vec3(113.5, 271.9, 124.6))
                );
                return fract(sin(p) * 43758.5453123);
            }
            
            // 3D值噪声
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 w = fract(x);
                
                // 五次插值
                vec3 u = w * w * w * (w * (w * 6.0 - 15.0) + 10.0);
                
                // 梯度
                vec3 ga = hash(p + vec3(0.0, 0.0, 0.0));
                vec3 gb = hash(p + vec3(1.0, 0.0, 0.0));
                vec3 gc = hash(p + vec3(0.0, 1.0, 0.0));
                vec3 gd = hash(p + vec3(1.0, 1.0, 0.0));
                vec3 ge = hash(p + vec3(0.0, 0.0, 1.0));
                vec3 gf = hash(p + vec3(1.0, 0.0, 1.0));
                vec3 gg = hash(p + vec3(0.0, 1.0, 1.0));
                vec3 gh = hash(p + vec3(1.0, 1.0, 1.0));
                
                // 投影
                float va = dot(ga, w - vec3(0.0, 0.0, 0.0));
                float vb = dot(gb, w - vec3(1.0, 0.0, 0.0));
                float vc = dot(gc, w - vec3(0.0, 1.0, 0.0));
                float vd = dot(gd, w - vec3(1.0, 1.0, 0.0));
                float ve = dot(ge, w - vec3(0.0, 0.0, 1.0));
                float vf = dot(gf, w - vec3(1.0, 0.0, 1.0));
                float vg = dot(gg, w - vec3(0.0, 1.0, 1.0));
                float vh = dot(gh, w - vec3(1.0, 1.0, 1.0));
                
                // 插值
                return va +
                    u.x * (vb - va) +
                    u.y * (vc - va) +
                    u.z * (ve - va) +
                    u.x * u.y * (va - vb - vc + vd) +
                    u.y * u.z * (va - vc - ve + vg) +
                    u.z * u.x * (va - vb - ve + vf) +
                    u.x * u.y * u.z * (-va + vb + vc - vd + ve - vf - vg + vh);
            }
            
            void main() {
                vUv = uv;
                
                vec3 pos = position;
                
                // 计算噪声
                float noiseValue = noise(pos * 0.1);
                float y = abs(noiseValue);
                y = pow(y, uPower);
                
                // 限制最大高度
                pos.y = min(y * uHeightScale, uMaxHeight);
                vHeight = pos.y / uMaxHeight;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        // 片段着色器
        const fragmentShader = `
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uColor5;
            uniform vec3 uColor6;
            
            varying vec2 vUv;
            varying float vHeight;
            
            void main() {
                vec3 color;
                
                // 根据高度选择颜色
                if (vHeight < 0.15) {
                    color = uColor1;
                } else if (vHeight < 0.25) {
                    color = mix(uColor1, uColor2, (vHeight - 0.15) / 0.1);
                } else if (vHeight < 0.35) {
                    color = mix(uColor2, uColor3, (vHeight - 0.25) / 0.1);
                } else if (vHeight < 0.55) {
                    color = mix(uColor3, uColor4, (vHeight - 0.35) / 0.2);
                } else if (vHeight < 0.75) {
                    color = mix(uColor4, uColor5, (vHeight - 0.55) / 0.2);
                } else if (vHeight < 0.9) {
                    color = mix(uColor5, uColor6, (vHeight - 0.75) / 0.15);
                } else {
                    color = uColor6;
                }
                
                // 添加简单的光照效果
                vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                vec3 normal = normalize(cross(dFdx(vec3(vUv, vHeight)), dFdy(vec3(vUv, vHeight))));
                float diff = max(dot(normal, lightDir), 0.0);
                
                color = color * (0.6 + 0.4 * diff);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16) / 255,
                g: parseInt(result[2], 16) / 255,
                b: parseInt(result[3], 16) / 255
            } : { r: 0, g: 0, b: 0 };
        }

        function generateTerrain() {
            if (terrainMesh) {
                window.scene.remove(terrainMesh);
                terrainMesh.geometry.dispose();
                terrainMesh.material.dispose();
            }

            const planeGeo = new THREE.PlaneGeometry(50, 50, 500, 500);
            planeGeo.rotateX(-Math.PI / 2);

            const c1 = hexToRgb(guiParams.color1);
            const c2 = hexToRgb(guiParams.color2);
            const c3 = hexToRgb(guiParams.color3);
            const c4 = hexToRgb(guiParams.color4);
            const c5 = hexToRgb(guiParams.color5);
            const c6 = hexToRgb(guiParams.color6);

            const material = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                side: THREE.DoubleSide,
                uniforms: {
                    uTime: { value: 0 },
                    uHeightScale: { value: guiParams.heightScale },
                    uMaxHeight: { value: guiParams.maxHeight },
                    uPower: { value: guiParams.power },
                    uColor1: { value: new THREE.Vector3(c1.r, c1.g, c1.b) },
                    uColor2: { value: new THREE.Vector3(c2.r, c2.g, c2.b) },
                    uColor3: { value: new THREE.Vector3(c3.r, c3.g, c3.b) },
                    uColor4: { value: new THREE.Vector3(c4.r, c4.g, c4.b) },
                    uColor5: { value: new THREE.Vector3(c5.r, c5.g, c5.b) },
                    uColor6: { value: new THREE.Vector3(c6.r, c6.g, c6.b) }
                },
                wireframe: guiParams.wireframe
            });

            terrainMesh = new THREE.Mesh(planeGeo, material);
            window.scene.add(terrainMesh);
        }

        function updateUniforms() {
            if (terrainMesh) {
                terrainMesh.material.uniforms.uHeightScale.value = guiParams.heightScale;
                terrainMesh.material.uniforms.uMaxHeight.value = guiParams.maxHeight;
                terrainMesh.material.uniforms.uPower.value = guiParams.power;
                
                const c1 = hexToRgb(guiParams.color1);
                const c2 = hexToRgb(guiParams.color2);
                const c3 = hexToRgb(guiParams.color3);
                const c4 = hexToRgb(guiParams.color4);
                const c5 = hexToRgb(guiParams.color5);
                const c6 = hexToRgb(guiParams.color6);
                
                terrainMesh.material.uniforms.uColor1.value.set(c1.r, c1.g, c1.b);
                terrainMesh.material.uniforms.uColor2.value.set(c2.r, c2.g, c2.b);
                terrainMesh.material.uniforms.uColor3.value.set(c3.r, c3.g, c3.b);
                terrainMesh.material.uniforms.uColor4.value.set(c4.r, c4.g, c4.b);
                terrainMesh.material.uniforms.uColor5.value.set(c5.r, c5.g, c5.b);
                terrainMesh.material.uniforms.uColor6.value.set(c6.r, c6.g, c6.b);
            }
        }

        function updateWireframe() {
            if (terrainMesh) {
                terrainMesh.material.wireframe = guiParams.wireframe;
            }
        }

        // 初始化地形
        generateTerrain();

        // 动画循环
        function animate() {
            controls.update();
            
            if (terrainMesh) {
                terrainMesh.rotation.y += guiParams.speed;
                terrainMesh.material.uniforms.uTime.value += 0.01;
            }
            
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
