<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="程序化地形生成示例，使用噪声函数生成起伏地形">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 程序化地形生成</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x87CEEB);
        window.scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 30, 50);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        window.renderer.shadowMap.enabled = true;
        window.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        // 添加光照
        window.scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        window.scene.add(dirLight);

        // GUI 参数
        const guiParams = {
            seed: 12345,
            scale: 30,
            height: 10,
            octaves: 4,
            persistence: 0.5,
            lacunarity: 2,
            wireframe: false,
            regenerate: () => regenerateTerrain()
        };

        // 创建GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.add(guiParams, 'seed', 1, 99999).name('随机种子');
        gui.add(guiParams, 'scale', 10, 100).name('噪声缩放');
        gui.add(guiParams, 'height', 1, 30).name('高度倍数');
        gui.add(guiParams, 'octaves', 1, 8, 1).name('八度数');
        gui.add(guiParams, 'persistence', 0.1, 1).name('持续度');
        gui.add(guiParams, 'lacunarity', 1, 4).name('隙度');
        gui.add(guiParams, 'wireframe').name('线框模式').onChange(updateWireframe);
        gui.add(guiParams, 'regenerate').name('重新生成');

        let terrainMesh = null;

        // 简单的伪随机数生成器
        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        // 2D 噪声函数
        function noise2D(x, y, seed) {
            const n = Math.floor(x) + Math.floor(y) * 57 + seed;
            return seededRandom(n);
        }

        // 平滑噪声
        function smoothNoise(x, y, seed) {
            const corners = (noise2D(x - 1, y - 1, seed) + noise2D(x + 1, y - 1, seed) +
                           noise2D(x - 1, y + 1, seed) + noise2D(x + 1, y + 1, seed)) / 16;
            const sides = (noise2D(x - 1, y, seed) + noise2D(x + 1, y, seed) +
                          noise2D(x, y - 1, seed) + noise2D(x, y + 1, seed)) / 8;
            const center = noise2D(x, y, seed) / 4;
            return corners + sides + center;
        }

        // 余弦插值
        function cosineInterpolate(a, b, x) {
            const ft = x * Math.PI;
            const f = (1 - Math.cos(ft)) * 0.5;
            return a * (1 - f) + b * f;
        }

        // 插值噪声
        function interpolatedNoise(x, y, seed) {
            const integerX = Math.floor(x);
            const fractionalX = x - integerX;
            const integerY = Math.floor(y);
            const fractionalY = y - integerY;

            const v1 = smoothNoise(integerX, integerY, seed);
            const v2 = smoothNoise(integerX + 1, integerY, seed);
            const v3 = smoothNoise(integerX, integerY + 1, seed);
            const v4 = smoothNoise(integerX + 1, integerY + 1, seed);

            const i1 = cosineInterpolate(v1, v2, fractionalX);
            const i2 = cosineInterpolate(v3, v4, fractionalX);

            return cosineInterpolate(i1, i2, fractionalY);
        }

        // 分形布朗运动
        function fbm(x, y, seed, octaves, persistence, lacunarity) {
            let total = 0;
            let frequency = 1;
            let amplitude = 1;
            let maxValue = 0;

            for (let i = 0; i < octaves; i++) {
                total += interpolatedNoise(x * frequency, y * frequency, seed + i) * amplitude;
                maxValue += amplitude;
                amplitude *= persistence;
                frequency *= lacunarity;
            }

            return total / maxValue;
        }

        // 根据高度获取颜色
        function getColorForHeight(height, maxHeight) {
            const normalizedHeight = height / maxHeight;
            
            if (normalizedHeight < 0.2) {
                // 深海蓝色
                return new THREE.Color(0x1a5276);
            } else if (normalizedHeight < 0.3) {
                // 浅海蓝色
                return new THREE.Color(0x2874a6);
            } else if (normalizedHeight < 0.35) {
                // 沙滩黄色
                return new THREE.Color(0xf9e79f);
            } else if (normalizedHeight < 0.6) {
                // 草地绿色
                const t = (normalizedHeight - 0.35) / 0.25;
                return new THREE.Color(0x58d68d).lerp(new THREE.Color(0x27ae60), t);
            } else if (normalizedHeight < 0.8) {
                // 岩石灰色
                const t = (normalizedHeight - 0.6) / 0.2;
                return new THREE.Color(0x7f8c8d).lerp(new THREE.Color(0x5d6d7e), t);
            } else {
                // 雪白色
                const t = (normalizedHeight - 0.8) / 0.2;
                return new THREE.Color(0xecf0f1).lerp(new THREE.Color(0xffffff), t);
            }
        }

        function regenerateTerrain() {
            if (terrainMesh) {
                window.scene.remove(terrainMesh);
                terrainMesh.geometry.dispose();
                terrainMesh.material.dispose();
            }

            const size = 100;
            const segments = 128;
            const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
            geometry.rotateX(-Math.PI / 2);

            const positions = geometry.attributes.position;
            const colors = [];
            const seed = guiParams.seed;
            const scale = guiParams.scale;
            const heightMultiplier = guiParams.height;

            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const z = positions.getZ(i);
                
                const noiseValue = fbm(
                    x / scale, 
                    z / scale, 
                    seed, 
                    guiParams.octaves, 
                    guiParams.persistence, 
                    guiParams.lacunarity
                );
                
                const height = Math.max(0, noiseValue * heightMultiplier);
                positions.setY(i, height);

                const color = getColorForHeight(height, heightMultiplier);
                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.8,
                metalness: 0.1,
                wireframe: guiParams.wireframe,
                side: THREE.DoubleSide
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.receiveShadow = true;
            terrainMesh.castShadow = true;
            window.scene.add(terrainMesh);
        }

        function updateWireframe() {
            if (terrainMesh) {
                terrainMesh.material.wireframe = guiParams.wireframe;
            }
        }

        // 初始化地形
        regenerateTerrain();

        // 添加水面
        const waterGeometry = new THREE.PlaneGeometry(200, 200);
        waterGeometry.rotateX(-Math.PI / 2);
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x2874a6,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1,
            metalness: 0.8
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.position.y = guiParams.height * 0.25;
        window.scene.add(water);

        // 动画循环
        function animate() {
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
