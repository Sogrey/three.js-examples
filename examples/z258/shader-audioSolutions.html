<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="音乐可视化 - 音频驱动的3D球体变形效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 音乐可视化</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        .audio-controls {
            position: absolute;
            top: 50px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .audio-btn {
            padding: 10px 20px;
            background: rgba(0, 150, 255, 0.8);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .audio-btn:hover {
            background: rgba(0, 180, 255, 1);
            transform: scale(1.05);
        }
        .audio-btn:disabled {
            background: rgba(100, 100, 100, 0.5);
            cursor: not-allowed;
        }
        .audio-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div class="audio-controls">
        <button class="audio-btn" id="playBtn">播放</button>
        <button class="audio-btn" id="pauseBtn">暂停</button>
    </div>
    
    <div class="audio-info">
        音频: 桥边姑娘.mp3 | 点击播放开始音乐可视化
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');
        
        // Scene setup
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        // Camera
        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        window.camera.position.set(4, 4, 6);

        // Renderer
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        window.renderer.shadowMap.enabled = true;
        container.appendChild(window.renderer.domElement);

        // Controls
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // Audio variables
        let mediaElement;
        let analyser;
        const fftSize = 2048;
        const clock = new THREE.Clock();

        // Uniforms
        const uniform = {
            uTime: { value: 0 },
            uStrength: { value: 0 },
            uColor1: { value: new THREE.Color(0x0088ff) },
            uColor2: { value: new THREE.Color(0xff0088) }
        };

        // Simplex 4D Noise functions
        const simplexNoise4D = `
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            float permute(float x){return floor(mod(((x*34.0)+1.0)*x, 289.0));}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float taylorInvSqrt(float r){return 1.79284291400159 - 0.85373472095314 * r;}

            vec4 grad4(float j, vec4 ip) {
                const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
                vec4 p,s;
                p.xyz = floor( fract (vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
                p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
                s = vec4(lessThan(p, vec4(0.0)));
                p.xyz = p.xyz + (s.xyz*2.0 - 1.0) * s.www;
                return p;
            }

            float simplexNoise4d(vec4 v) {
                const vec2 C = vec2( 0.138196601125010504, 0.309016994374947451);
                vec4 i  = floor(v + dot(v, C.yyyy) );
                vec4 x0 = v - i + dot(i, C.xxxx);
                vec3 isX = step( x0.yzw, x0.xxx );
                vec3 isYZ = step( x0.zww, x0.yyz );
                vec4 i0;
                i0.x = isX.x + isX.y + isX.z;
                i0.yzw = 1.0 - isX;
                i0.y += isYZ.x + isYZ.y;
                i0.zw += 1.0 - isYZ.xy;
                i0.z += isYZ.z;
                i0.w += 1.0 - isYZ.z;
                vec4 i3 = clamp( i0, 0.0, 1.0 );
                vec4 i2 = clamp( i0-1.0, 0.0, 1.0 );
                vec4 i1 = clamp( i0-2.0, 0.0, 1.0 );
                vec4 x1 = x0 - i1 + 1.0 * C.xxxx;
                vec4 x2 = x0 - i2 + 2.0 * C.xxxx;
                vec4 x3 = x0 - i3 + 3.0 * C.xxxx;
                vec4 x4 = x0 - 1.0 + 4.0 * C.xxxx;
                i = mod(i, 289.0);
                float j0 = permute( permute( permute( permute(i.w) + i.z) + i.y) + i.x);
                vec4 j1 = permute( permute( permute( permute (
                    i.w + vec4(i1.w, i2.w, i3.w, 1.0 ))
                    + i.z + vec4(i1.z, i2.z, i3.z, 1.0 ))
                    + i.y + vec4(i1.y, i2.y, i3.y, 1.0 ))
                    + i.x + vec4(i1.x, i2.x, i3.x, 1.0 ));
                vec4 ip = vec4(1.0/294.0, 1.0/49.0, 1.0/7.0, 0.0);
                vec4 p0 = grad4(j0, ip);
                vec4 p1 = grad4(j1.x, ip);
                vec4 p2 = grad4(j1.y, ip);
                vec4 p3 = grad4(j1.z, ip);
                vec4 p4 = grad4(j1.w, ip);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                p4 *= taylorInvSqrt(dot(p4,p4));
                vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
                vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)), 0.0);
                m0 = m0 * m0; m1 = m1 * m1;
                return 49.0 * ( dot(m0*m0, vec3( dot( p0, x0 ), dot( p1, x1 ), dot( p2, x2 )))
                    + dot(m1*m1, vec2( dot( p3, x3 ), dot( p4, x4 ) ) ) );
            }
        `;

        // Create mesh with custom shader
        const material = new THREE.MeshStandardMaterial({
            roughness: 0.4,
            metalness: 0.6,
            color: 0x444444
        });

        const depthMaterial = new THREE.MeshDepthMaterial({
            depthPacking: THREE.RGBADepthPacking
        });

        // Modify material with custom shader
        material.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = uniform.uTime;
            shader.uniforms.uStrength = uniform.uStrength;
            shader.uniforms.uColor1 = uniform.uColor1;
            shader.uniforms.uColor2 = uniform.uColor2;

            // Add uniforms and noise function to vertex shader
            shader.vertexShader = shader.vertexShader.replace(
                '#include <common>',
                `#include <common>
                uniform float uTime;
                uniform float uStrength;
                ${simplexNoise4D}
                `
            );

            // Modify vertex position with noise
            shader.vertexShader = shader.vertexShader.replace(
                '#include <begin_vertex>',
                `#include <begin_vertex>
                float noise = simplexNoise4d(vec4(position * 0.5, uTime * 0.5));
                transformed += normal * noise * uStrength * 2.0;
                `
            );

            // Add uniforms to fragment shader
            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <common>',
                `#include <common>
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                `
            );

            // Use normal from varying (already defined by MeshStandardMaterial)
            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <color_fragment>',
                `#include <color_fragment>
                float mixFactor = (normalize(vNormal).y + 1.0) * 0.5;
                diffuseColor.rgb = mix(uColor1, uColor2, mixFactor);
                `
            );
        };

        depthMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = uniform.uTime;
            shader.uniforms.uStrength = uniform.uStrength;

            shader.vertexShader = shader.vertexShader.replace(
                '#include <common>',
                `#include <common>
                uniform float uTime;
                uniform float uStrength;
                ${simplexNoise4D}
                `
            );

            shader.vertexShader = shader.vertexShader.replace(
                '#include <begin_vertex>',
                `#include <begin_vertex>
                float noise = simplexNoise4d(vec4(position * 0.5, uTime * 0.5));
                transformed += normal * noise * uStrength * 2.0;
                `
            );
        };

        // Create icosahedron geometry
        const geometry = new THREE.IcosahedronGeometry(2, 40);
        const mesh = new THREE.Mesh(geometry, material);
        mesh.customDepthMaterial = depthMaterial;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        window.scene.add(mesh);

        // Ground plane
        const planeGeometry = new THREE.PlaneGeometry(50, 50);
        const planeMaterial = new THREE.MeshStandardMaterial({
            color: 0x111122,
            roughness: 0.8,
            metalness: 0.2
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI * 0.5;
        plane.position.y = -4;
        plane.receiveShadow = true;
        window.scene.add(plane);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.set(2048, 2048);
        window.scene.add(directionalLight);

        const pointLight1 = new THREE.PointLight(0x0088ff, 2, 20);
        pointLight1.position.set(-5, 3, -5);
        window.scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff0088, 2, 20);
        pointLight2.position.set(5, 3, 5);
        window.scene.add(pointLight2);

        // GUI
        const gui = new GUI();
        gui.domElement.style.top = '100px';
        const params = {
            color1: '#0088ff',
            color2: '#ff0088',
            sensitivity: 1.0
        };

        gui.addColor(params, 'color1').name('主色调').onChange((v) => {
            uniform.uColor1.value.set(v);
        });
        gui.addColor(params, 'color2').name('副色调').onChange((v) => {
            uniform.uColor2.value.set(v);
        });
        gui.add(params, 'sensitivity', 0.1, 3.0).name('灵敏度');

        // Audio functions
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        function playAudio() {
            if (!mediaElement) {
                const listener = new THREE.AudioListener();
                window.camera.add(listener);
                const audio = new THREE.Audio(listener);
                
                mediaElement = new Audio('../../mp3/桥边姑娘.mp3');
                mediaElement.crossOrigin = 'anonymous';
                mediaElement.loop = true;
                audio.setMediaElementSource(mediaElement);
                analyser = new THREE.AudioAnalyser(audio, fftSize);
            }
            mediaElement.play();
            playBtn.disabled = true;
            pauseBtn.disabled = false;
        }

        function pauseAudio() {
            if (mediaElement) {
                mediaElement.pause();
                playBtn.disabled = false;
                pauseBtn.disabled = true;
            }
        }

        playBtn.addEventListener('click', playAudio);
        pauseBtn.addEventListener('click', pauseAudio);
        pauseBtn.disabled = true;

        // Animation
        function updateAudioData() {
            if (analyser) {
                const data = analyser.getFrequencyData();
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                }
                const average = sum / data.length;
                uniform.uStrength.value = (average / 255) * params.sensitivity;
            }
        }

        function animate() {
            const elapsedTime = clock.getElapsedTime();
            uniform.uTime.value = elapsedTime;
            
            updateAudioData();
            controls.update();
            
            // Rotate mesh slowly
            mesh.rotation.y = elapsedTime * 0.1;
            mesh.rotation.z = Math.sin(elapsedTime * 0.2) * 0.1;
            
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        // Resize
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Screenshot support
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
