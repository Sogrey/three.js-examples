<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="使用Three.js创建网格材质效果，通过自定义着色器实现程序化网格线">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 网格材质</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        window.camera.position.set(50, 50, 50);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 添加辅助网格
        const gridHelper = new THREE.GridHelper(100, 10, 0x444444, 0x222222);
        window.scene.add(gridHelper);

        // 通用网格材质
        const gridMaterial = new THREE.ShaderMaterial({
            transparent: true,
            side: THREE.DoubleSide,
            uniforms: {
                color: { value: new THREE.Color(0x00caea) },
                gridX: { value: 40.0 },
                gridY: { value: 20.0 },
                lineWidth: { value: 0.6 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                uniform float gridX;
                uniform float gridY;
                uniform float lineWidth;
                varying vec2 vUv;
                
                void main() {
                    vec2 grid = vec2(gridX, gridY);
                    vec2 f = fract(vUv * grid);
                    vec2 df = fwidth(vUv * grid);
                    vec2 line = smoothstep(df * lineWidth, df * lineWidth * 2.0, f) * 
                                smoothstep(df * lineWidth, df * lineWidth * 2.0, 1.0 - f);
                    float alpha = 1.0 - min(line.x, line.y);
                    if (alpha < 0.1) discard;
                    gl_FragColor = vec4(color, alpha);
                }
            `
        });

        // 几何体列表
        const geometries = {
            'TorusKnot': new THREE.TorusKnotGeometry(15, 4, 100, 16),
            'Cylinder': new THREE.CylinderGeometry(15, 15, 40, 64),
            'Sphere': new THREE.SphereGeometry(20, 64, 32),
            'Torus': new THREE.TorusGeometry(15, 5, 32, 64),
            'Box': new THREE.BoxGeometry(30, 30, 30),
            'Cone': new THREE.ConeGeometry(15, 40, 64),
            'Capsule': new THREE.CapsuleGeometry(10, 20, 16, 32)
        };

        const mesh = new THREE.Mesh(geometries['TorusKnot'], gridMaterial);
        window.scene.add(mesh);

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        window.scene.add(directionalLight);

        // GUI 控制
        const gui = new GUI();
        gui.domElement.style.top = '50px';

        const params = { 
            geometry: 'TorusKnot', 
            color: '#00caea',
            autoRotate: true
        };

        gui.add(params, 'geometry', Object.keys(geometries)).name('几何体').onChange(v => {
            mesh.geometry.dispose();
            mesh.geometry = geometries[v];
        });
        gui.add(gridMaterial.uniforms.gridX, 'value', 1, 100).name('横向网格');
        gui.add(gridMaterial.uniforms.gridY, 'value', 1, 100).name('纵向网格');
        gui.add(gridMaterial.uniforms.lineWidth, 'value', 0.1, 5).name('线条粗细');
        gui.addColor(params, 'color').name('颜色').onChange(v => {
            gridMaterial.uniforms.color.value.set(v);
        });
        gui.add(params, 'autoRotate').name('自动旋转');

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            if (params.autoRotate) {
                mesh.rotation.y += 0.005;
                mesh.rotation.x += 0.002;
            }

            controls.update();
            window.renderer.render(window.scene, window.camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 截图支持
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
