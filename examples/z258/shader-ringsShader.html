<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="环彩虹着色器 - 展示环形彩虹效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 环彩虹着色器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 10);

        window.renderer = new THREE.WebGLRenderer();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector2(1900, 1900) }
        };

        const geometry = new THREE.PlaneGeometry(20, 20);
        const material = new THREE.ShaderMaterial({
            uniforms,
            side: THREE.DoubleSide,
            depthWrite: false,
            transparent: true,
            vertexShader: `
                varying vec3 vPosition;
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                float PI = 3.1415926;
                uniform float iTime;
                uniform vec2 iResolution;
                varying vec2 vUv;

                void main() {
                    vec2 p = (vUv - 0.5) * 2.0;
                    float tau = PI * 2.0;
                    float a = atan(p.x, p.y);
                    float r = length(p) * 0.75;
                    vec2 uv = vec2(a / tau, r);

                    float xCol = (uv.x - (iTime / 3.0)) * 3.0;
                    xCol = mod(xCol, 3.0);
                    vec3 horColour = vec3(0.25, 0.25, 0.25);

                    if (xCol < 1.0) {
                        horColour.r += 1.0 - xCol;
                        horColour.g += xCol;
                    }
                    else if (xCol < 2.0) {
                        xCol -= 1.0;
                        horColour.g += 1.0 - xCol;
                        horColour.b += xCol;
                    }
                    else {
                        xCol -= 2.0;
                        horColour.b += 1.0 - xCol;
                        horColour.r += xCol;
                    }

                    uv = (2.0 * uv) - 1.0;
                    float beamWidth = (0.7 + 0.5 * cos(uv.x * 10.0 * tau * 0.15 * clamp(floor(5.0 + 10.0 * cos(iTime)), 0.0, 10.0))) * abs(1.0 / (30.0 * uv.y));
                    vec3 horBeam = vec3(beamWidth);
                    gl_FragColor = vec4((horBeam * horColour), 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        window.scene.add(mesh);

        function animate(time) {
            uniforms.iTime.value = time / 1000;
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
