<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="饱和度 - 使用后期处理调整场景饱和度和亮度"
    />
    <meta name="three-version" content="r179" />
    <title>Three.js 示例 - 饱和度</title>
    <link rel="stylesheet" href="../../css/example-common.css" />
  </head>
  <body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../libs/three/r179/build/three.module.js",
          "three/addons/": "../../libs/three/r179/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { GUI } from "three/addons/libs/lil-gui.module.min.js";

      const container = document.getElementById("threeContainer");

      window.scene = new THREE.Scene();
      window.scene.background = new THREE.Color(0x0a0a1a);

      window.camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        2000,
      );
      window.camera.add(new THREE.PointLight(0xffffff, 1, 1000, 0.01));
      window.camera.position.set(10, 10, 10);
      window.scene.add(window.camera);

      window.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(window.renderer.domElement);

      const orbit = new OrbitControls(window.camera, window.renderer.domElement);
      orbit.enableDamping = true;

      window.scene.add(new THREE.GridHelper(10, 10));

      window.composer = new EffectComposer(window.renderer);
      const renderPass = new RenderPass(window.scene, window.camera);
      const outputPass = new OutputPass();
      window.composer.addPass(renderPass);
      window.composer.addPass(outputPass);

      const finalMaterial = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: null },
          saturation: { value: 1.0 },
          brightness: { value: 1.0 },
        },
        vertexShader: `
            varying vec2 vUv;
            void main(){
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
            }
        `,
        fragmentShader: `
            vec3 hsv2rgb( in vec3 c ){
                vec3 rgb = clamp( abs(mod(c.x*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0, 0.0, 1.0 );
                return c.z * mix( vec3(1.0), rgb, c.y);
            }

            vec3 rgbToHsv(vec3 rgb){
                vec3 hsv = vec3(0);
                float maxC = max(max(rgb.r,rgb.g),rgb.b);
                float minC = min(min(rgb.r,rgb.g),rgb.b);
                float delta = maxC - minC;
                if (maxC == rgb.r) hsv.x = mod((rgb.g - rgb.b)/delta,6.0)/6.0;
                if (maxC == rgb.g) hsv.x = (rgb.b - rgb.r)/(delta*6.0) + 1.0/3.0;
                if (maxC == rgb.b) hsv.x = (rgb.r - rgb.g)/(delta*6.0) + 2.0/3.0;
                hsv.y = delta/maxC;
                hsv.z = maxC;
                return hsv;
            }

            varying vec2 vUv;
            uniform sampler2D tDiffuse;
            uniform float saturation;
            uniform float brightness;
            void main(){
                vec4 col = texture2D(tDiffuse,vUv);

                vec3 hsvCol = rgbToHsv(col.rgb);
                hsvCol.y *= saturation;
                hsvCol.z *= brightness;
                vec3 col2 = hsv2rgb(hsvCol);
                gl_FragColor = vec4(col2,col.a);

                #include <tonemapping_fragment>
                #include <colorspace_fragment>
            }
        `,
      });

      const finalPass = new ShaderPass(finalMaterial);
      window.composer.addPass(finalPass);

      const gui = new GUI();
      gui.domElement.style.marginTop = "50px";
      gui
        .add(finalMaterial.uniforms.saturation, "value", 0, 2, 0.01)
        .name("饱和度");
      gui
        .add(finalMaterial.uniforms.brightness, "value", 0, 2, 0.01)
        .name("亮度");

      const geometry = new THREE.BoxGeometry(1, 1, 1);
      for (let i = 0; i < 100; i++) {
        const material = new THREE.MeshStandardMaterial({
          color: 0xffffff * Math.random(),
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.x = Math.random() * 10 - 5;
        mesh.position.y = Math.random() * 10 - 5;
        mesh.position.z = Math.random() * 10 - 5;
        mesh.rotation.x = Math.random() * Math.PI;
        mesh.rotation.y = Math.random() * Math.PI;
        window.scene.add(mesh);
      }

      function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        window.composer.render();
      }
      animate();

      window.addEventListener("resize", () => {
        window.camera.aspect = window.innerWidth / window.innerHeight;
        window.camera.updateProjectionMatrix();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.composer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "take-screenshot") {
          try {
            if (window.scene && window.camera) {
              window.composer.render();
            }
            const quality = event.data.quality || 0.8;
            const canvas = window.renderer.domElement;
            const tempCanvas = document.createElement("canvas");
            const maxSize = 600;
            const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
            tempCanvas.width = Math.floor(canvas.width * scale);
            tempCanvas.height = Math.floor(canvas.height * scale);
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            const dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
            window.parent.postMessage(
              { type: "screenshot-data", dataUrl: dataUrl },
              "*",
            );
          } catch (error) {
            console.error("截图失败:", error);
            window.parent.postMessage(
              { type: "screenshot-error", error: error.message },
              "*",
            );
          }
        }
      });
    </script>
  </body>
</html>
