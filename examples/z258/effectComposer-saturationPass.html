<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js饱和度后期处理示例 - 使用ShaderPass实现饱和度和亮度调节效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 饱和度后期处理</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // 场景设置
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        window.camera.position.set(15, 15, 15);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.shadowMap.enabled = true;
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        window.scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1, 1000, 0.01);
        window.camera.add(pointLight);
        window.scene.add(window.camera);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        window.scene.add(gridHelper);

        // 创建彩色立方体阵列
        const boxGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const boxes = [];

        for (let i = 0; i < 100; i++) {
            const hue = i / 100;
            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(hue, 0.8, 0.5),
                roughness: 0.3,
                metalness: 0.6
            });
            const mesh = new THREE.Mesh(boxGeometry, material);
            mesh.position.x = (Math.random() - 0.5) * 20;
            mesh.position.y = Math.random() * 10;
            mesh.position.z = (Math.random() - 0.5) * 20;
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            window.scene.add(mesh);
            boxes.push({ mesh, speed: (Math.random() - 0.5) * 0.02 });
        }

        // 后期处理
        const composer = new EffectComposer(window.renderer);
        const renderPass = new RenderPass(window.scene, window.camera);
        composer.addPass(renderPass);

        // 自定义饱和度/亮度Shader
        const saturationMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tDiffuse: { value: null },
                saturation: { value: 1.0 },
                brightness: { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                uniform sampler2D tDiffuse;
                uniform float saturation;
                uniform float brightness;

                vec3 rgbToHsv(vec3 rgb) {
                    vec3 hsv = vec3(0.0);
                    float maxC = max(max(rgb.r, rgb.g), rgb.b);
                    float minC = min(min(rgb.r, rgb.g), rgb.b);
                    float delta = maxC - minC;
                    
                    if (delta > 0.0) {
                        if (maxC == rgb.r) {
                            hsv.x = mod((rgb.g - rgb.b) / delta, 6.0) / 6.0;
                        } else if (maxC == rgb.g) {
                            hsv.x = (rgb.b - rgb.r) / (delta * 6.0) + 1.0 / 3.0;
                        } else {
                            hsv.x = (rgb.r - rgb.g) / (delta * 6.0) + 2.0 / 3.0;
                        }
                        hsv.y = delta / maxC;
                    }
                    hsv.z = maxC;
                    return hsv;
                }

                vec3 hsvToRgb(vec3 hsv) {
                    vec3 rgb = clamp(abs(mod(hsv.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
                    return hsv.z * mix(vec3(1.0), rgb, hsv.y);
                }

                void main() {
                    vec4 col = texture2D(tDiffuse, vUv);
                    vec3 hsvCol = rgbToHsv(col.rgb);
                    hsvCol.y *= saturation;
                    hsvCol.z *= brightness;
                    vec3 col2 = hsvToRgb(hsvCol);
                    gl_FragColor = vec4(col2, col.a);
                }
            `
        });

        const saturationPass = new ShaderPass(saturationMaterial);
        composer.addPass(saturationPass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // GUI 控制
        const params = {
            saturation: 1.0,
            brightness: 1.0,
            enableEffect: true
        };

        const gui = new GUI();
        gui.domElement.style.marginTop = '50px';

        gui.add(params, 'saturation', 0, 2, 0.01).name('饱和度').onChange(value => {
            saturationMaterial.uniforms.saturation.value = value;
        });

        gui.add(params, 'brightness', 0, 2, 0.01).name('亮度').onChange(value => {
            saturationMaterial.uniforms.brightness.value = value;
        });

        gui.add(params, 'enableEffect').name('启用效果').onChange(value => {
            saturationPass.enabled = value;
        });

        // 窗口大小变化
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 旋转立方体
            boxes.forEach(item => {
                item.mesh.rotation.x += item.speed;
                item.mesh.rotation.y += item.speed;
            });

            controls.update();
            composer.render();
        }

        animate();
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
