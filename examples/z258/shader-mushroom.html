<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示蘑菇效果，使用光线追踪技术渲染动态的蘑菇" />
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 蘑菇</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();

        window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100000);
        window.camera.position.set(10, 10, 10);
        window.scene.add(window.camera);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.setClearColor(0x000000);
        container.appendChild(window.renderer.domElement);

        new OrbitControls(window.camera, window.renderer.domElement);

        const uniforms = {
            Mouse: {
                type: 'v2',
                value: new THREE.Vector2(0, 0)
            },
            Resolution: {
                type: 'v2',
                value: new THREE.Vector2(window.innerWidth, window.innerHeight)
            },
            Time: {
                type: 'f',
                value: 1.0
            }
        };

        container.addEventListener('mousemove', (event) => {
            uniforms.Mouse.value = new THREE.Vector2(
                (event.offsetX / event.target.clientWidth) * 2 - 1,
                -(event.offsetY / event.target.clientHeight) * 2 + 1
            );
        });

        const geometry = new THREE.BoxGeometry(10, 10, 10);

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main(){
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.);
                    vUv = uv;
                }
            `,
            fragmentShader: `
                #ifdef GL_ES
                precision mediump float;
                #endif
                uniform vec2 Resolution;
                uniform vec3 Mouse;
                uniform float Time;
                varying vec2 vUv;
                
                mat2 rot2D(float angle){
                    float s = sin(angle);
                    float c = cos(angle);
                    return mat2(c, -s, s, c);
                }
                
                float sdCutHollowSphere(vec3 p, float r, float h, float t) {
                    float w = sqrt(r * r - h * h);
                    vec2 q = vec2(length(p.xz), p.y);
                    return ((h * q.x < w * q.y) ? length(q - vec2(w, h)) : abs(length(q) - r)) - t;
                }
                
                vec4 sdstripe(vec3 p, vec3 color) {
                    p.xz = abs(p.xz);
                    float d1 = sdCutHollowSphere(p - vec3(.0, -3.3, 0.), .8, .01, .01);
                    float d2 = sdCutHollowSphere(p - vec3(.9, -3.3, .9), .5, .005, .01);
                    float d = min(d1, d2);
                    return vec4(d, color);
                }
                
                vec4 sdCutSphere(vec3 p, float r, float h, vec3 color) {
                    float w = sqrt(r * r - h * h);
                    vec2 q = vec2(length(p.xz), p.y);
                    float s = max((h - r) * q.x * q.x + w * w * (h + r - 2. * q.y), h * q.x - w * q.y);
                    float d = (s < 0.) ? length(q) - r : (q.x < w) ? h - q.y : length(q - vec2(w, h));
                    return vec4(d, color);
                }
                
                vec4 sdPlane(vec3 p, vec3 color) {
                    return vec4(-p.y + .2, color);
                }
                
                vec4 sdCappedCone(vec3 p, vec3 a, vec3 b, float ra, float rb, vec3 color) {
                    float rba = rb - ra;
                    float baba = dot(b - a, b - a);
                    float papa = dot(p - a, p - a);
                    float paba = dot(p - a, b - a) / baba;
                    float x = sqrt(papa - paba * paba * baba);
                    float cax = max(0., x - ((paba < .5) ? ra : rb));
                    float cay = abs(paba - .5) - .5;
                    float k = rba * rba + baba;
                    float f = clamp((rba * (x - ra) + paba * baba) / k, 0., 1.);
                    float cbx = x - ra - f * rba;
                    float cby = paba - f;
                    float s = (cbx < 0. && cay < 0.) ? -1. : 1.;
                    return vec4(s * sqrt(min(cax * cax + cay * cay * baba, cbx * cbx + cby * cby * baba)), color);
                }
                
                float smin(float d1, float d2, float k) {
                    float h = clamp(.5 + .5 * (d2 - d1) / k, 0., 1.);
                    return mix(d2, d1, h) - k * h * (1. - h);
                }
                
                vec4 colorMin(vec4 a, vec4 b) {
                    if(a.x < b.x) {
                        return a;
                    } else {
                        return b;
                    }
                }
                
                vec3 bendPoint(vec3 p, float k) {
                    float c = cos(k * p.y);
                    float s = sin(k * p.y);
                    mat2 m = mat2(c, -s, s, c);
                    vec3 q = vec3(m * p.xy, p.z);
                    return q;
                }
                
                vec4 map(vec3 p) {
                    vec3 q = p;
                    p = bendPoint(p, sin(Time * 5.));
                    vec3 pp2 = vec3(0., .8, 0.);
                    vec3 pp1 = vec3(0., -.2, 0.);
                    vec4 CappedConesdf = sdCappedCone(-p, pp1, pp2, .2, .1, vec3(.8667, .8667, .7216));
                    vec4 CutSpheresdf = sdCutSphere(-p - vec3(0., .4, 0.), .5, .2, vec3(.9608, .4667, .4)) - .1;
                    vec4 entity = colorMin(CappedConesdf, CutSpheresdf);
                    entity = colorMin(entity, sdstripe(p * 4., vec3(3.5)) / 4.);
                    entity = colorMin(entity, sdPlane(q, vec3(.4196, .5529, .3647)));
                    return entity;
                }
                
                void main() {
                    vec3 ro = vec3(0., 0., -8.);
                    vec3 rd = normalize(vec3(vUv - .5, 1.));
                    ro.xz *= rot2D(-Time);
                    rd.xz *= rot2D(-Time);
                    ro.y -= 4.;
                    rd.y += .5;
                    float t = 0.;
                    vec4 color = vec4(0.);
                    for(int i = 0; i < 80; i++) {
                        vec3 p = ro + rd * t;
                        vec4 d = map(p) / 1.8;
                        t += d.x;
                        if(t > 100. || d.x < .001) {
                            break;
                        }
                        color = vec4(t * d.yzw * .13, 1.);
                    }
                    gl_FragColor = color;
                }
            `
        });

        material.side = THREE.DoubleSide;

        const mesh = new THREE.Mesh(geometry, material);
        mesh.scale.set(1, -1, 1);
        window.scene.add(mesh);

        function render() {
            uniforms.Time.value += 0.005;
            window.renderer.render(window.scene, window.camera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.renderer.setSize(w, h);
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
            uniforms.Resolution.value.set(w, h);
        });

        window.renderer.setAnimationLoop(render);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
