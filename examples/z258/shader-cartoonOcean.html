<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="卡通风格海面效果，使用自定义着色器实现波浪动画">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 卡通海面</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        controls.target.set(0, 0, 0);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 卡通海面着色器
        const vertexShader = `
            uniform float uTime;
            uniform float uWaveHeight;
            uniform float uWaveSpeed;
            uniform float uWaveFrequency;
            
            varying vec2 vUv;
            varying float vElevation;
            varying vec3 vNormal;
            
            // 简单噪声函数
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }
            
            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }
            
            void main() {
                vUv = uv;
                
                vec3 pos = position;
                
                // 多层波浪叠加
                float elevation = 0.0;
                
                // 大波浪
                elevation += sin(pos.x * uWaveFrequency + uTime * uWaveSpeed) * uWaveHeight;
                elevation += sin(pos.z * uWaveFrequency * 0.8 + uTime * uWaveSpeed * 1.2) * uWaveHeight * 0.8;
                
                // 中波浪
                elevation += sin(pos.x * uWaveFrequency * 2.0 + uTime * uWaveSpeed * 2.0) * uWaveHeight * 0.3;
                elevation += sin(pos.z * uWaveFrequency * 1.5 + uTime * uWaveSpeed * 1.8) * uWaveHeight * 0.25;
                
                // 小波浪（噪声）
                elevation += noise(pos.xz * uWaveFrequency * 0.5 + uTime * uWaveSpeed * 0.5) * uWaveHeight * 0.2;
                
                pos.y += elevation;
                vElevation = elevation;
                
                // 计算法线
                float delta = 0.1;
                float hL = sin((pos.x - delta) * uWaveFrequency + uTime * uWaveSpeed) * uWaveHeight;
                float hR = sin((pos.x + delta) * uWaveFrequency + uTime * uWaveSpeed) * uWaveHeight;
                float hD = sin((pos.z - delta) * uWaveFrequency * 0.8 + uTime * uWaveSpeed * 1.2) * uWaveHeight * 0.8;
                float hU = sin((pos.z + delta) * uWaveFrequency * 0.8 + uTime * uWaveSpeed * 1.2) * uWaveHeight * 0.8;
                
                vec3 normal = normalize(vec3(hL - hR, 2.0 * delta, hD - hU));
                vNormal = normal;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec3 uColorDeep;
            uniform vec3 uColorShallow;
            uniform vec3 uColorFoam;
            uniform float uFoamThreshold;
            
            varying vec2 vUv;
            varying float vElevation;
            varying vec3 vNormal;
            
            void main() {
                // 基于高度的颜色混合
                float mixStrength = (vElevation + 1.0) * 0.5;
                vec3 color = mix(uColorDeep, uColorShallow, mixStrength);
                
                // 泡沫效果
                if (vElevation > uFoamThreshold) {
                    float foamStrength = (vElevation - uFoamThreshold) / (1.0 - uFoamThreshold);
                    color = mix(color, uColorFoam, foamStrength * 0.7);
                }
                
                // 简单的光照计算
                vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                float diff = max(dot(vNormal, lightDir), 0.0);
                color = color * (0.6 + 0.4 * diff);
                
                gl_FragColor = vec4(color, 0.9);
            }
        `;

        // 配置参数
        const config = {
            waveHeight: 1.5,
            waveSpeed: 1.0,
            waveFrequency: 0.2,
            foamThreshold: 0.8,
            colorDeep: '#006994',
            colorShallow: '#0099cc',
            colorFoam: '#ffffff'
        };

        // Uniforms
        const uniforms = {
            uTime: { value: 0 },
            uWaveHeight: { value: config.waveHeight },
            uWaveSpeed: { value: config.waveSpeed },
            uWaveFrequency: { value: config.waveFrequency },
            uColorDeep: { value: new THREE.Color(config.colorDeep) },
            uColorShallow: { value: new THREE.Color(config.colorShallow) },
            uColorFoam: { value: new THREE.Color(config.colorFoam) },
            uFoamThreshold: { value: config.foamThreshold }
        };

        // 创建海面
        const oceanGeometry = new THREE.PlaneGeometry(100, 100, 128, 128);
        oceanGeometry.rotateX(-Math.PI / 2);
        
        const oceanMaterial = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            transparent: true,
            side: THREE.DoubleSide
        });
        
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        ocean.receiveShadow = true;
        scene.add(ocean);

        // 添加一些浮标
        const buoyGeometry = new THREE.SphereGeometry(0.5, 16, 16);
        const buoyMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff0000,
            roughness: 0.3,
            metalness: 0.5
        });
        
        const buoys = [];
        for (let i = 0; i < 5; i++) {
            const buoy = new THREE.Mesh(buoyGeometry, buoyMaterial);
            const x = (Math.random() - 0.5) * 40;
            const z = (Math.random() - 0.5) * 40;
            buoy.position.set(x, 0, z);
            buoy.castShadow = true;
            scene.add(buoy);
            buoys.push({ mesh: buoy, baseX: x, baseZ: z, offset: Math.random() * Math.PI * 2 });
        }

        // GUI
        const gui = new GUI({ title: '卡通海面控制' });
        gui.domElement.style.top = '50px';
        
        const waveFolder = gui.addFolder('波浪设置');
        waveFolder.add(config, 'waveHeight', 0, 3, 0.1).name('波浪高度').onChange(v => uniforms.uWaveHeight.value = v);
        waveFolder.add(config, 'waveSpeed', 0, 3, 0.1).name('波浪速度').onChange(v => uniforms.uWaveSpeed.value = v);
        waveFolder.add(config, 'waveFrequency', 0.05, 0.5, 0.01).name('波浪频率').onChange(v => uniforms.uWaveFrequency.value = v);
        
        const colorFolder = gui.addFolder('颜色设置');
        colorFolder.addColor(config, 'colorDeep').name('深海颜色').onChange(v => uniforms.uColorDeep.value.set(v));
        colorFolder.addColor(config, 'colorShallow').name('浅海颜色').onChange(v => uniforms.uColorShallow.value.set(v));
        colorFolder.addColor(config, 'colorFoam').name('泡沫颜色').onChange(v => uniforms.uColorFoam.value.set(v));
        colorFolder.add(config, 'foamThreshold', 0, 1, 0.05).name('泡沫阈值').onChange(v => uniforms.uFoamThreshold.value = v);

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            uniforms.uTime.value = elapsedTime;
            
            // 浮标动画
            buoys.forEach(buoy => {
                const y = Math.sin(elapsedTime * config.waveSpeed + buoy.offset) * config.waveHeight * 0.5;
                buoy.mesh.position.y = y;
                buoy.mesh.rotation.x = Math.sin(elapsedTime * config.waveSpeed * 0.5 + buoy.offset) * 0.1;
                buoy.mesh.rotation.z = Math.cos(elapsedTime * config.waveSpeed * 0.5 + buoy.offset) * 0.1;
            });
            
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
