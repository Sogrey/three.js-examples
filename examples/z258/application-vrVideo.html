<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VR 全景视频 - 360度全景视频播放">
    <title>VR 全景视频 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 200px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
        
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 18px;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px; border-radius: 8px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">加载视频中...</div>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🎬 VR 全景视频</h3>
        <div class="control-group">
            <label>视野缩放 <span class="value" id="fovValue">75</span></label>
            <input type="range" id="fovRange" min="30" max="120" step="1" value="75">
        </div>
        <div class="control-group">
            <label>播放速度 <span class="value" id="speedValue">1.0</span></label>
            <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1">
        </div>
        <button id="btnPlay">⏸️ 暂停</button>
        <button id="btnReset">🔄 重置视角</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();

        // 相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 视频元素
        const video = document.createElement('video');
        video.crossOrigin = 'anonymous';
        video.src = '../../images/textures/test.mp4';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;

        // 视频纹理
        let videoTexture = null;
        let sphere = null;

        // 初始化视频
        async function initVideo() {
            await new Promise((resolve, reject) => {
                video.onloadeddata = () => {
                    videoTexture = new THREE.VideoTexture(video);
                    videoTexture.minFilter = THREE.LinearFilter;
                    videoTexture.magFilter = THREE.LinearFilter;
                    videoTexture.colorSpace = THREE.SRGBColorSpace;
                    
                    // 创建全景球体
                    const geometry = new THREE.SphereGeometry(500, 60, 40);
                    // 翻转球体内部可见
                    geometry.scale(-1, 1, 1);
                    
                    const material = new THREE.MeshBasicMaterial({
                        map: videoTexture
                    });
                    
                    sphere = new THREE.Mesh(geometry, material);
                    scene.add(sphere);
                    
                    document.getElementById('loading').style.display = 'none';
                    video.play().catch(e => console.log('自动播放被阻止:', e));
                    resolve();
                };
                video.onerror = reject;
            });
        }

        initVideo();

        // 鼠标控制
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };
            
            targetRotation.y -= deltaMove.x * 0.005;
            targetRotation.x -= deltaMove.y * 0.005;
            
            // 限制垂直旋转角度
            targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));
            
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mouseup', () => {
            isDragging = false;
        });

        container.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // 触摸控制
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            
            const deltaMove = {
                x: e.touches[0].clientX - previousMousePosition.x,
                y: e.touches[0].clientY - previousMousePosition.y
            };
            
            targetRotation.y -= deltaMove.x * 0.005;
            targetRotation.x -= deltaMove.y * 0.005;
            targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));
            
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        container.addEventListener('touchend', () => {
            isDragging = false;
        });

        // 动画
        let isPlaying = true;
        let playbackSpeed = 1.0;

        function animate() {
            requestAnimationFrame(animate);
            
            // 平滑旋转
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;
            
            // 应用旋转到相机
            const radius = 0.1;
            camera.position.x = radius * Math.sin(currentRotation.y) * Math.cos(currentRotation.x);
            camera.position.y = radius * Math.sin(currentRotation.x);
            camera.position.z = radius * Math.cos(currentRotation.y) * Math.cos(currentRotation.x);
            camera.lookAt(0, 0, 0);
            
            // 更新播放速度
            if (video) {
                video.playbackRate = playbackSpeed;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('fovRange').addEventListener('input', (e) => {
            const fov = parseInt(e.target.value);
            document.getElementById('fovValue').textContent = fov;
            camera.fov = fov;
            camera.updateProjectionMatrix();
        });

        document.getElementById('speedRange').addEventListener('input', (e) => {
            playbackSpeed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = playbackSpeed.toFixed(1);
        });

        document.getElementById('btnPlay').addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                video.play();
                document.getElementById('btnPlay').textContent = '⏸️ 暂停';
            } else {
                video.pause();
                document.getElementById('btnPlay').textContent = '▶️ 播放';
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            targetRotation = { x: 0, y: 0 };
            camera.fov = 75;
            document.getElementById('fovRange').value = 75;
            document.getElementById('fovValue').textContent = '75';
            camera.updateProjectionMatrix();
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
