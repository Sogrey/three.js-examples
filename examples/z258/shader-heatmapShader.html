<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="使用Three.js创建热力图着色器效果，通过自定义着色器实现动态热力图">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 热力图着色器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 20);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 2);
        window.scene.add(ambientLight);

        // 添加辅助轴
        const axesHelper = new THREE.AxesHelper(1000);
        axesHelper.visible = false;
        window.scene.add(axesHelper);

        /* 热力图实现 */
        const arr = [
            [0., 0., 10.], [.2, .6, 5.], [.25, .7, 8.], [.33, .9, 5.], [.35, .8, 6.],
            [0.017, 5.311, 6.000], [-.45, .8, 4.], [-.2, -.6, 5.], [-.25, -.7, 8.],
            [-.33, -.9, 8.], [.35, -.45, 10.], [-.1, -.8, 10.], [.33, -.3, 5.],
            [-.35, .75, 6.], [.6, .4, 10.], [-.4, -.8, 4.], [.7, -.3, 6.], [.3, -.8, 8.]
        ].map(i => new THREE.Vector3(...i));

        const uniforms1 = {
            HEAT_MAX: { value: 10, type: 'number', unit: 'float' },
            PointRadius: { value: 0.42, type: 'number', unit: 'float' },
            PointsCount: { value: arr.length, type: 'number-array', unit: 'int' },
            c1: { value: new THREE.Color(0x000000), type: 'color', unit: 'vec3' },
            c2: { value: new THREE.Color(0x000000), type: 'color', unit: 'vec3' },
            uvY: { value: 1, type: 'number', unit: 'float' },
            uvX: { value: 1, type: 'number', unit: 'float' },
            opacity: { value: 1, type: 'number', unit: 'float' }
        };

        const uniforms2 = {
            Points: { value: arr, type: 'vec3-array', unit: 'vec3' }
        };

        const uniforms = {
            ...uniforms1,
            ...uniforms2
        };

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const getFragmentShader = () => 'precision highp float;\n' + 'varying vec2 vUv; \n' +
            Object.keys(uniforms1).map(i => 'uniform ' + uniforms1[i].unit + ' ' + i + ';')
                .join('\n')
            + '\nuniform vec3 Points['
            + uniforms1.PointsCount.value + '];'
            +
            `
            vec3 gradient(float w, vec2 uv) {
                w = pow(clamp(w, 0., 1.) * 3.14159 * .5, .9);
                return vec3(sin(w), sin(w * 2.), cos(w))* 1.1 + mix(c1, c2, w) * 1.1; 
            }
            void main()
            {
                vec2 uv = vUv;
                uv.xy *= vec2(uvX, uvY);
                float d = 0.;
                for (int i = 0; i < PointsCount; i++) {
                    vec3 v = Points[i];
                    float intensity = v.z / HEAT_MAX;
                    float pd = (1. - length(uv - v.xy) / PointRadius) * intensity;
                    d += pow(max(0., pd), 2.);
                }
                gl_FragColor = vec4(gradient(d, uv), opacity);
            } `;

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms,
            vertexShader,
            fragmentShader: getFragmentShader(),
            transparent: true
        });

        const plane = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), shaderMaterial);
        window.scene.add(plane);

        // GUI 控制
        const gui = new GUI();
        gui.domElement.style.top = '50px';

        gui.add(uniforms1.HEAT_MAX, 'value', 0, 10).name('最大热度');
        gui.add(uniforms1.PointRadius, 'value', 0, 1).name('点半径');
        gui.add(uniforms1.uvY, 'value', 0, 1).name('UV Y');
        gui.add(uniforms1.uvX, 'value', 0, 1).name('UV X');
        gui.add(uniforms1.opacity, 'value', 0, 1).name('透明度');
        gui.addColor(uniforms1.c1, 'value').name('颜色1');
        gui.addColor(uniforms1.c2, 'value').name('颜色2');

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }
        animate();

        // 动态更新热力点
        setInterval(() => {
            arr.pop();
            arr.unshift(new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 10));
            uniforms.PointsCount.value = arr.length;
            shaderMaterial.fragmentShader = getFragmentShader();
            shaderMaterial.needsUpdate = true;
        }, 200);

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 截图支持
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
