<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D矩阵变换可视化，展示平移、旋转、缩放等变换效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D矩阵变换可视化</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #matrixUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #matrixUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #matrixUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        #matrixUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #matrixUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #matrixUI .slider-container {
            margin: 10px 0;
        }
        #matrixUI .slider-container label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #matrixUI input[type="range"] {
            width: 100%;
            accent-color: #00ff00;
        }
        #matrixUI .value {
            font-size: 11px;
            color: #ffff00;
            text-align: right;
        }
        #matrixUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #transformInfo {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 100;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="matrixUI">
        <h3>🔢 矩阵变换可视化</h3>
        <button class="btn active" id="btnTranslate">平移 (Translate)</button>
        <button class="btn" id="btnRotate">旋转 (Rotate)</button>
        <button class="btn" id="btnScale">缩放 (Scale)</button>
        <button class="btn" id="btnCombine">组合变换</button>
        <button class="btn" id="btnReset">重置</button>
        
        <div class="slider-container">
            <label>X 轴</label>
            <input type="range" id="sliderX" min="-5" max="5" step="0.1" value="0">
            <div class="value" id="valueX">0</div>
        </div>
        <div class="slider-container">
            <label>Y 轴</label>
            <input type="range" id="sliderY" min="-5" max="5" step="0.1" value="0">
            <div class="value" id="valueY">0</div>
        </div>
        <div class="slider-container">
            <label>Z 轴</label>
            <input type="range" id="sliderZ" min="-5" max="5" step="0.1" value="0">
            <div class="value" id="valueZ">0</div>
        </div>
        
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放
        </div>
    </div>
    
    <div id="transformInfo">
        当前变换: 平移
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // 坐标轴
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // 网格地面
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 原始对象（半透明参考）
        const originalGeometry = new THREE.BoxGeometry(2, 2, 2);
        const originalMaterial = new THREE.MeshBasicMaterial({
            color: 0x444444,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const originalMesh = new THREE.Mesh(originalGeometry, originalMaterial);
        originalMesh.position.set(0, 1, 0);
        scene.add(originalMesh);
        
        // 变换对象
        const transformGeometry = new THREE.BoxGeometry(2, 2, 2);
        const transformMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ff00,
            roughness: 0.3,
            metalness: 0.7
        });
        const transformMesh = new THREE.Mesh(transformGeometry, transformMaterial);
        transformMesh.position.set(0, 1, 0);
        transformMesh.castShadow = true;
        scene.add(transformMesh);
        
        // 变换状态
        let transformMode = 'translate';
        let transformValues = { x: 0, y: 0, z: 0 };
        
        // 更新变换
        function updateTransform() {
            const x = parseFloat(document.getElementById('sliderX').value);
            const y = parseFloat(document.getElementById('sliderY').value);
            const z = parseFloat(document.getElementById('sliderZ').value);
            
            document.getElementById('valueX').textContent = x.toFixed(1);
            document.getElementById('valueY').textContent = y.toFixed(1);
            document.getElementById('valueZ').textContent = z.toFixed(1);
            
            transformMesh.position.set(0, 1, 0);
            transformMesh.rotation.set(0, 0, 0);
            transformMesh.scale.set(1, 1, 1);
            
            switch (transformMode) {
                case 'translate':
                    transformMesh.position.set(x, 1 + y, z);
                    break;
                case 'rotate':
                    transformMesh.rotation.set(
                        x * Math.PI / 180,
                        y * Math.PI / 180,
                        z * Math.PI / 180
                    );
                    break;
                case 'scale':
                    const sx = Math.max(0.1, 1 + x * 0.2);
                    const sy = Math.max(0.1, 1 + y * 0.2);
                    const sz = Math.max(0.1, 1 + z * 0.2);
                    transformMesh.scale.set(sx, sy, sz);
                    break;
                case 'combine':
                    transformMesh.position.set(x * 0.5, 1 + y * 0.5, z * 0.5);
                    transformMesh.rotation.set(
                        x * Math.PI / 360,
                        y * Math.PI / 360,
                        z * Math.PI / 360
                    );
                    const s = Math.max(0.5, 1 + (x + y + z) * 0.05);
                    transformMesh.scale.set(s, s, s);
                    break;
            }
        }
        
        // 设置变换模式
        function setTransformMode(mode) {
            transformMode = mode;
            
            // 更新按钮状态
            document.querySelectorAll('#matrixUI .btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
            
            // 更新滑块范围
            const sliderX = document.getElementById('sliderX');
            const sliderY = document.getElementById('sliderY');
            const sliderZ = document.getElementById('sliderZ');
            
            switch (mode) {
                case 'translate':
                    sliderX.min = -5; sliderX.max = 5; sliderX.step = 0.1;
                    sliderY.min = -5; sliderY.max = 5; sliderY.step = 0.1;
                    sliderZ.min = -5; sliderZ.max = 5; sliderZ.step = 0.1;
                    document.getElementById('transformInfo').textContent = '当前变换: 平移 (Translate)';
                    break;
                case 'rotate':
                    sliderX.min = -180; sliderX.max = 180; sliderX.step = 1;
                    sliderY.min = -180; sliderY.max = 180; sliderY.step = 1;
                    sliderZ.min = -180; sliderZ.max = 180; sliderZ.step = 1;
                    document.getElementById('transformInfo').textContent = '当前变换: 旋转 (Rotate)';
                    break;
                case 'scale':
                    sliderX.min = -5; sliderX.max = 5; sliderX.step = 0.1;
                    sliderY.min = -5; sliderY.max = 5; sliderY.step = 0.1;
                    sliderZ.min = -5; sliderZ.max = 5; sliderZ.step = 0.1;
                    document.getElementById('transformInfo').textContent = '当前变换: 缩放 (Scale)';
                    break;
                case 'combine':
                    sliderX.min = -5; sliderX.max = 5; sliderX.step = 0.1;
                    sliderY.min = -5; sliderY.max = 5; sliderY.step = 0.1;
                    sliderZ.min = -5; sliderZ.max = 5; sliderZ.step = 0.1;
                    document.getElementById('transformInfo').textContent = '当前变换: 组合变换 (Combine)';
                    break;
            }
            
            // 重置滑块
            sliderX.value = 0;
            sliderY.value = 0;
            sliderZ.value = 0;
            
            updateTransform();
        }
        
        // UI事件
        document.getElementById('btnTranslate').addEventListener('click', () => setTransformMode('translate'));
        document.getElementById('btnRotate').addEventListener('click', () => setTransformMode('rotate'));
        document.getElementById('btnScale').addEventListener('click', () => setTransformMode('scale'));
        document.getElementById('btnCombine').addEventListener('click', () => setTransformMode('combine'));
        
        document.getElementById('btnReset').addEventListener('click', () => {
            document.getElementById('sliderX').value = 0;
            document.getElementById('sliderY').value = 0;
            document.getElementById('sliderZ').value = 0;
            updateTransform();
        });
        
        document.getElementById('sliderX').addEventListener('input', updateTransform);
        document.getElementById('sliderY').addEventListener('input', updateTransform);
        document.getElementById('sliderZ').addEventListener('input', updateTransform);
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
