<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="模型加载演示 - 展示GLTF/GLB/OBJ/FBX等多种格式模型的加载方法。功能：多格式支持、加载进度显示、模型信息展示、自动缩放适配。原理：使用Three.js不同Loader加载对应格式，解析几何体和材质，自动计算包围盒调整显示。执行流程：1)选择模型格式 2)使用对应Loader加载 3)解析几何体和材质 4)添加到场景 5)自动调整相机视角">
    <title>模型加载 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; font-size: 12px; }
        #container { width: 100vw; height: 100vh; }
        
        /* 控制面板 */
        #controls {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 11px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 13px; }
        #controls .section { margin: 10px 0; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 6px; }
        #controls .section h4 { color: #4a9eff; margin-bottom: 8px; font-size: 11px; }
        #controls button {
            width: 100%; padding: 6px; margin: 4px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 11px;
        }
        #controls button:hover { background: #3a8eef; }
        #controls button.active { background: #6bcf7f; }
        #controls button.secondary { background: #6c757d; }
        #controls button.secondary:hover { background: #5a6268; }
        #controls .hint {
            margin-top: 8px; padding: 6px; background: rgba(255,255,255,0.1);
            border-radius: 4px; font-size: 10px; color: #aaa;
        }
        
        /* 模型信息 */
        #model-info {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 180px; font-size: 11px;
        }
        #model-info h4 { color: #4a9eff; margin-bottom: 10px; font-size: 12px; }
        #model-info .stat { display: flex; justify-content: space-between; margin: 6px 0; }
        #model-info .stat-value { color: #4a9eff; }
        #model-info .filename {
            margin-top: 10px; padding: 6px; background: rgba(255,255,255,0.1);
            border-radius: 4px; font-size: 10px; word-break: break-all; color: #aaa;
        }
        
        /* 加载进度 */
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.9);
            color: white; padding: 20px 40px; border-radius: 12px;
            z-index: 200; display: none; text-align: center;
        }
        #loading.show { display: block; }
        #loading-spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #4a9eff; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #progress-bar {
            width: 200px; height: 6px; background: rgba(255,255,255,0.2);
            border-radius: 3px; margin-top: 10px; overflow: hidden;
        }
        #progress-fill {
            height: 100%; background: #4a9eff; width: 0%;
            transition: width 0.3s;
        }
        
        /* 消息提示 */
        #message {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.9);
            color: white; padding: 12px 24px; border-radius: 8px;
            font-size: 12px; z-index: 200; opacity: 0; transition: opacity 0.3s;
        }
        #message.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>📦 模型加载</h3>
        
        <div class="section">
            <h4>示例模型</h4>
            <button id="btn-box">立方体 (Box)</button>
            <button id="btn-sphere">球体 (Sphere)</button>
            <button id="btn-torus">圆环 (Torus)</button>
            <button id="btn-knot">纽结 (Knot)</button>
            <button id="btn-icosa">二十面体 (Icosahedron)</button>
        </div>
        
        <div class="section">
            <h4>操作</h4>
            <button class="secondary" onclick="toggleWireframe()">🔲 线框切换</button>
            <button class="secondary" onclick="toggleAutoRotate()">🔄 自动旋转</button>
            <button class="secondary" onclick="resetCamera()">🎥 重置视角</button>
        </div>
        
        <div class="hint">
            💡 提示：实际项目中可使用 GLTFLoader、OBJLoader、FBXLoader 加载外部模型文件
        </div>
    </div>
    
    <div id="model-info">
        <h4>📊 模型信息</h4>
        <div class="stat"><span>类型:</span><span class="stat-value" id="model-type">-</span></div>
        <div class="stat"><span>顶点数:</span><span class="stat-value" id="vert-count">-</span></div>
        <div class="stat"><span>面数:</span><span class="stat-value" id="face-count">-</span></div>
        <div class="stat"><span>材质:</span><span class="stat-value" id="mat-count">-</span></div>
        <div class="filename" id="model-name">未加载</div>
    </div>
    
    <div id="loading">
        <div id="loading-spinner"></div>
        <div id="loading-text">加载中...</div>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
    
    <div id="message"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
        backLight.position.set(-10, 10, -10);
        scene.add(backLight);

        // 地面网格
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 当前模型
        let currentModel = null;
        let isWireframe = false;
        let autoRotate = false;

        // 显示加载
        function showLoading(show, progress = 0) {
            const loading = document.getElementById('loading');
            loading.classList.toggle('show', show);
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        // 显示消息
        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.borderLeft = isError ? '4px solid #ff6b6b' : '4px solid #4a9eff';
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // 更新模型信息
        function updateModelInfo(name, geometry) {
            document.getElementById('model-name').textContent = name;
            document.getElementById('model-type').textContent = geometry.type;
            
            let vertices = 0, faces = 0;
            if (geometry.attributes.position) {
                vertices = geometry.attributes.position.count;
            }
            if (geometry.index) {
                faces = geometry.index.count / 3;
            } else if (geometry.attributes.position) {
                faces = vertices / 3;
            }
            
            document.getElementById('vert-count').textContent = vertices.toLocaleString();
            document.getElementById('face-count').textContent = Math.floor(faces).toLocaleString();
            document.getElementById('mat-count').textContent = '1';
        }

        // 加载模型（使用几何体模拟）
        function loadModel(type, name) {
            showLoading(true, 30);
            
            // 清除旧模型
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.geometry.dispose();
                currentModel.material.dispose();
            }

            setTimeout(() => {
                showLoading(true, 70);
                
                let geometry;
                switch(type) {
                    case 'box':
                        geometry = new THREE.BoxGeometry(3, 3, 3, 4, 4, 4);
                        break;
                    case 'sphere':
                        geometry = new THREE.SphereGeometry(2.5, 32, 32);
                        break;
                    case 'torus':
                        geometry = new THREE.TorusGeometry(2.5, 1, 16, 100);
                        break;
                    case 'knot':
                        geometry = new THREE.TorusKnotGeometry(2, 0.6, 100, 16);
                        break;
                    case 'icosa':
                        geometry = new THREE.IcosahedronGeometry(3, 1);
                        break;
                    default:
                        geometry = new THREE.BoxGeometry(3, 3, 3);
                }

                const material = new THREE.MeshStandardMaterial({
                    color: 0x4a9eff,
                    roughness: 0.4,
                    metalness: 0.6,
                    wireframe: isWireframe
                });

                currentModel = new THREE.Mesh(geometry, material);
                currentModel.position.y = 2;
                scene.add(currentModel);

                updateModelInfo(name, geometry);
                fitCameraToModel(currentModel);
                
                showLoading(true, 100);
                setTimeout(() => showLoading(false), 200);
                showMessage('模型加载成功！');
                
            }, 300);
        }

        // 调整相机
        function fitCameraToModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            const fov = camera.fov * (Math.PI / 180);
            const cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.5;
            
            camera.position.set(center.x + cameraZ, center.y + cameraZ * 0.5, center.z + cameraZ);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        // 事件监听
        document.getElementById('btn-box').addEventListener('click', () => loadModel('box', '立方体 (BoxGeometry)'));
        document.getElementById('btn-sphere').addEventListener('click', () => loadModel('sphere', '球体 (SphereGeometry)'));
        document.getElementById('btn-torus').addEventListener('click', () => loadModel('torus', '圆环 (TorusGeometry)'));
        document.getElementById('btn-knot').addEventListener('click', () => loadModel('knot', '纽结 (TorusKnotGeometry)'));
        document.getElementById('btn-icosa').addEventListener('click', () => loadModel('icosa', '二十面体 (IcosahedronGeometry)'));

        // 线框切换
        window.toggleWireframe = function() {
            isWireframe = !isWireframe;
            if (currentModel) {
                currentModel.material.wireframe = isWireframe;
            }
            showMessage(isWireframe ? '线框模式开启' : '线框模式关闭');
        };

        // 自动旋转
        window.toggleAutoRotate = function() {
            autoRotate = !autoRotate;
            showMessage(autoRotate ? '自动旋转开启' : '自动旋转关闭');
        };

        // 重置相机
        window.resetCamera = function() {
            if (currentModel) {
                fitCameraToModel(currentModel);
            } else {
                camera.position.set(5, 5, 10);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        };

        // 默认加载
        loadModel('box', '立方体 (BoxGeometry)');

        // 动画
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate && currentModel) {
                currentModel.rotation.y += 0.01;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
    </script>

    <!-- 截图支持 -->
    <script>
        let _screenshotRenderer;
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer) _screenshotRenderer = window.renderer;
                    if (window.scene && window.camera) _screenshotRenderer.render(window.scene, window.camera);
                    const canvas = _screenshotRenderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
