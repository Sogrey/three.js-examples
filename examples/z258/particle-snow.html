<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="雪花粒子效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 雪花</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');
        
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 5);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const snowCount = 2000;
        const positions = new Float32Array(snowCount * 3);
        const velocities = new Float32Array(snowCount * 3);
        const sizes = new Float32Array(snowCount);
        const opacities = new Float32Array(snowCount);

        for (let i = 0; i < snowCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 1] = Math.random() * 10 - 5;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 10;

            velocities[i * 3] = (Math.random() - 0.5) * 0.02;
            velocities[i * 3 + 1] = -Math.random() * 0.03 - 0.01;
            velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;

            sizes[i] = Math.random() * 0.03 + 0.01;
            opacities[i] = Math.random() * 0.5 + 0.5;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                attribute float size;
                attribute float opacity;
                varying float vOpacity;
                
                void main() {
                    vOpacity = opacity;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vOpacity;
                
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float alpha = (1.0 - dist * 2.0) * vOpacity;
                    gl_FragColor = vec4(1.0, 1.0, 1.0, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const snow = new THREE.Points(geometry, material);
        window.scene.add(snow);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(ambientLight);

        const params = {
            snowCount: 2000,
            fallSpeed: 1,
            swayAmount: 1,
            rotationSpeed: 0.001,
            pointSize: 0.03,
            areaWidth: 10,
            areaHeight: 10
        };

        function animate() {
            const positions = snow.geometry.attributes.position.array;
            const time = material.uniforms.uTime.value += 0.01;

            for (let i = 0; i < snowCount; i++) {
                positions[i * 3] += velocities[i * 3] * params.swayAmount + Math.sin(time + i * 0.1) * 0.005 * params.swayAmount;
                positions[i * 3 + 1] += velocities[i * 3 + 1] * params.fallSpeed;
                positions[i * 3 + 2] += velocities[i * 3 + 2] * params.swayAmount + Math.cos(time + i * 0.1) * 0.005 * params.swayAmount;

                if (positions[i * 3 + 1] < -params.areaHeight / 2) {
                    positions[i * 3 + 1] = params.areaHeight / 2;
                    positions[i * 3] = (Math.random() - 0.5) * params.areaWidth;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * params.areaWidth;
                }
            }

            snow.geometry.attributes.position.needsUpdate = true;
            snow.rotation.y += params.rotationSpeed;

            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const gui = new GUI();
        gui.title('雪花参数调节');
        gui.add(params, 'snowCount', 100, 5000, 100).name('雪花数量').onChange(v => {
            snowCount = v;
        });
        gui.add(params, 'fallSpeed', 0.1, 5, 0.1).name('下落速度');
        gui.add(params, 'swayAmount', 0, 3, 0.1).name('摇摆幅度');
        gui.add(params, 'rotationSpeed', 0, 0.01, 0.001).name('旋转速度');
        gui.add(params, 'pointSize', 0.01, 0.1, 0.01).name('雪花大小');
        gui.add(params, 'areaWidth', 5, 20, 1).name('区域宽度');
        gui.add(params, 'areaHeight', 5, 20, 1).name('区域高度');
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
