<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="材质修改动画 - Three.js材质过渡动画">
    <title>材质修改动画 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="color"], #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🎨 材质修改动画</h3>
        <div class="control-group">
            <label>目标颜色</label>
            <input type="color" id="targetColor" value="#ff4444">
        </div>
        <div class="control-group">
            <label>过渡时间 <span class="value" id="durationValue">1.0</span>s</label>
            <input type="range" id="durationRange" min="0.1" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>粗糙度 <span class="value" id="roughnessValue">0.5</span></label>
            <input type="range" id="roughnessRange" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>金属度 <span class="value" id="metalnessValue">0.5</span></label>
            <input type="range" id="metalnessRange" min="0" max="1" step="0.1" value="0.5">
        </div>
        <button id="btnAnimate">🎬 播放动画</button>
        <button id="btnRandom">🎲 随机材质</button>
        <button id="btnWireframe">🔲 切换线框</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x4a9eff, 0.5);
        pointLight.position.set(-5, 5, -5);
        scene.add(pointLight);

        // 创建多个物体
        const objects = [];
        const geometries = [
            new THREE.BoxGeometry(1.5, 1.5, 1.5),
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.ConeGeometry(1, 2, 32),
            new THREE.CylinderGeometry(0.8, 0.8, 2, 32),
            new THREE.TorusGeometry(1, 0.4, 16, 100),
            new THREE.DodecahedronGeometry(1)
        ];

        geometries.forEach((geometry, i) => {
            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(i / geometries.length, 0.7, 0.5),
                roughness: 0.5,
                metalness: 0.5
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            const angle = (i / geometries.length) * Math.PI * 2;
            mesh.position.set(
                Math.cos(angle) * 4,
                0,
                Math.sin(angle) * 4
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // 保存初始数据
            mesh.userData = {
                originalColor: material.color.clone(),
                originalPosition: mesh.position.clone()
            };
            
            scene.add(mesh);
            objects.push(mesh);
        });

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a4a,
            roughness: 0.8 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(20, 20, 0x4a4a6a, 0x3a3a5a);
        gridHelper.position.y = -1.49;
        scene.add(gridHelper);

        // 配置
        const config = {
            duration: 1.0,
            targetColor: '#ff4444',
            roughness: 0.5,
            metalness: 0.5
        };

        // 动画函数
        function animateMaterial(targetColor, duration) {
            const color = new THREE.Color(targetColor);
            
            objects.forEach((obj, i) => {
                const startColor = obj.material.color.clone();
                const startRoughness = obj.material.roughness;
                const startMetalness = obj.material.metalness;
                const delay = i * 100; // 错开动画
                
                setTimeout(() => {
                    let startTime = null;
                    
                    function updateMaterial(time) {
                        if (!startTime) startTime = time;
                        const elapsed = (time - startTime) / 1000;
                        const progress = Math.min(elapsed / duration, 1);
                        
                        // 使用缓动函数
                        const easeProgress = 1 - Math.pow(1 - progress, 3);
                        
                        // 插值颜色
                        obj.material.color.lerpColors(startColor, color, easeProgress);
                        
                        // 插值粗糙度和金属度
                        obj.material.roughness = startRoughness + 
                            (config.roughness - startRoughness) * easeProgress;
                        obj.material.metalness = startMetalness + 
                            (config.metalness - startMetalness) * easeProgress;
                        
                        if (progress < 1) {
                            requestAnimationFrame(updateMaterial);
                        }
                    }
                    
                    requestAnimationFrame(updateMaterial);
                }, delay);
            });
        }

        // 随机材质
        function randomizeMaterial() {
            objects.forEach(obj => {
                obj.material.color.setHSL(Math.random(), 0.7, 0.5);
                obj.material.roughness = Math.random();
                obj.material.metalness = Math.random();
            });
        }

        // 切换线框
        let isWireframe = false;
        function toggleWireframe() {
            isWireframe = !isWireframe;
            objects.forEach(obj => {
                obj.material.wireframe = isWireframe;
            });
        }

        // 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            
            // 物体浮动动画
            objects.forEach((obj, i) => {
                obj.position.y = Math.sin(time + i) * 0.3;
                obj.rotation.x += 0.005;
                obj.rotation.y += 0.01;
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('targetColor').addEventListener('input', (e) => {
            config.targetColor = e.target.value;
        });

        document.getElementById('durationRange').addEventListener('input', (e) => {
            config.duration = parseFloat(e.target.value);
            document.getElementById('durationValue').textContent = config.duration.toFixed(1);
        });

        document.getElementById('roughnessRange').addEventListener('input', (e) => {
            config.roughness = parseFloat(e.target.value);
            document.getElementById('roughnessValue').textContent = config.roughness.toFixed(1);
        });

        document.getElementById('metalnessRange').addEventListener('input', (e) => {
            config.metalness = parseFloat(e.target.value);
            document.getElementById('metalnessValue').textContent = config.metalness.toFixed(1);
        });

        document.getElementById('btnAnimate').addEventListener('click', () => {
            animateMaterial(config.targetColor, config.duration);
        });

        document.getElementById('btnRandom').addEventListener('click', randomizeMaterial);
        document.getElementById('btnWireframe').addEventListener('click', toggleWireframe);
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
