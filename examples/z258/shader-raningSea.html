<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="波涛海浪 - 使用Perlin噪声实现逼真的海浪效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 波涛海浪</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const vertexShader = `
            #include <fog_pars_vertex>

            uniform float uTime;

            uniform float uBigWavesElevation;
            uniform vec2 uBigWavesFrequency;
            uniform float uBigWaveSpeed;

            uniform float uSmallWavesElevation;
            uniform float uSmallWavesFrequency;
            uniform float uSmallWavesSpeed;
            uniform float uSmallWavesIterations;

            varying float vElevation;

            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            vec3 fade(vec3 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}

            float cnoise(vec3 P){
                vec3 Pi0 = floor(P);
                vec3 Pi1 = Pi0 + vec3(1.0);
                Pi0 = mod(Pi0, 289.0);
                Pi1 = mod(Pi1, 289.0);
                vec3 Pf0 = fract(P);
                vec3 Pf1 = Pf0 - vec3(1.0);
                vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
                vec4 iy = vec4(Pi0.yy, Pi1.yy);
                vec4 iz0 = Pi0.zzzz;
                vec4 iz1 = Pi1.zzzz;

                vec4 ixy = permute(permute(ix) + iy);
                vec4 ixy0 = permute(ixy + iz0);
                vec4 ixy1 = permute(ixy + iz1);

                vec4 gx0 = ixy0 / 7.0;
                vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
                gx0 = fract(gx0);
                vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
                vec4 sz0 = step(gz0, vec4(0.0));
                gx0 -= sz0 * (step(0.0, gx0) - 0.5);
                gy0 -= sz0 * (step(0.0, gy0) - 0.5);

                vec4 gx1 = ixy1 / 7.0;
                vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
                gx1 = fract(gx1);
                vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
                vec4 sz1 = step(gz1, vec4(0.0));
                gx1 -= sz1 * (step(0.0, gx1) - 0.5);
                gy1 -= sz1 * (step(0.0, gy1) - 0.5);

                vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
                vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
                vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
                vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
                vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
                vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
                vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
                vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

                vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
                g000 *= norm0.x;
                g010 *= norm0.y;
                g100 *= norm0.z;
                g110 *= norm0.w;
                vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
                g001 *= norm1.x;
                g011 *= norm1.y;
                g101 *= norm1.z;
                g111 *= norm1.w;

                float n000 = dot(g000, Pf0);
                float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
                float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
                float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
                float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
                float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
                float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
                float n111 = dot(g111, Pf1);

                vec3 fade_xyz = fade(Pf0);
                vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
                vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
                float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x); 
                return 2.2 * n_xyz;
            }

            void main() {
                #include <begin_vertex>
                #include <project_vertex>
                #include <fog_vertex>
                
                vec4 modelPosition = modelMatrix * vec4(position, 1.0);
                float elevation = 
                    sin(modelPosition.x * uBigWavesFrequency.x + uTime * uBigWaveSpeed) 
                    * sin(modelPosition.z * uBigWavesFrequency.y + uTime * uBigWaveSpeed) 
                    * uBigWavesElevation;

                for(float i = 1.0; i <= 10.0; i++) {
                    elevation -= abs(
                        cnoise(
                            vec3(modelPosition.xz * uSmallWavesFrequency * i, uTime * uSmallWavesSpeed)
                        ) 
                        * uSmallWavesElevation / i
                    );
                    if(i >= uSmallWavesIterations) {
                        break;
                    }
                }

                modelPosition.y += elevation;
                vec4 viewPosition = viewMatrix * modelPosition;
                vec4 projectedPosition = projectionMatrix * viewPosition;
                gl_Position = projectedPosition;

                vElevation = elevation;
            }
        `;

        const fragmentShader = `
            #include <fog_pars_fragment>
            precision mediump float;
            
            uniform vec3 uDepthColor;
            uniform vec3 uSurfaceColor;

            uniform float uColorOffset;
            uniform float uColorMultiplier;

            varying float vElevation;

            void main() {
                float mixStrength = (vElevation + uColorOffset) * uColorMultiplier;
                vec3 color = mix(uDepthColor, uSurfaceColor, mixStrength);
                gl_FragColor = vec4(color, 1.0);
                #include <fog_fragment>
            }
        `;

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        
        const debugObject = {
            waveDepthColor: "#b5e4e4",
            waveSurfaceColor: "#4d9aaa",
            fogNear: 1,
            fogFar: 8,
            fogColor: "#8e99a2"
        };

        window.scene = new THREE.Scene();
        window.scene.fog = new THREE.Fog(debugObject.fogColor, debugObject.fogNear, debugObject.fogFar);
        window.scene.background = new THREE.Color(debugObject.fogColor);

        const waterGeometry = new THREE.PlaneGeometry(12, 12, 256, 256);
        const waterMaterial = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            transparent: true,
            fog: true,
            uniforms: {
                uTime: { value: 0 },
                uMouse: { value: new THREE.Vector2() },
                uBigWavesElevation: { value: 0.2 },
                uBigWavesFrequency: { value: new THREE.Vector2(4, 2) },
                uBigWaveSpeed: { value: 0.75 },
                uSmallWavesElevation: { value: 0.15 },
                uSmallWavesFrequency: { value: 3 },
                uSmallWavesSpeed: { value: 0.2 },
                uSmallWavesIterations: { value: 4 },
                uDepthColor: { value: new THREE.Color(debugObject.waveDepthColor) },
                uSurfaceColor: { value: new THREE.Color(debugObject.waveSurfaceColor) },
                uColorOffset: { value: 0.08 },
                uColorMultiplier: { value: 5 },
                ...THREE.UniformsLib["fog"]
            }
        });

        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.rotation.x = -Math.PI * 0.5;
        window.scene.add(water);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        window.camera.position.set(2, 2, 3);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        const bigWavesFolder = gui.addFolder("Large Waves");
        bigWavesFolder.add(waterMaterial.uniforms.uBigWavesElevation, 'value', 0, 1).name('Elevation');
        bigWavesFolder.add(waterMaterial.uniforms.uBigWavesFrequency.value, 'x', 0, 10).name('Frequency X');
        bigWavesFolder.add(waterMaterial.uniforms.uBigWavesFrequency.value, 'y', 0, 10).name('Frequency Y');
        bigWavesFolder.add(waterMaterial.uniforms.uBigWaveSpeed, 'value', 0, 2).name('Speed');

        const smallWavesFolder = gui.addFolder("Small Waves");
        smallWavesFolder.add(waterMaterial.uniforms.uSmallWavesElevation, 'value', 0, 0.5).name('Elevation');
        smallWavesFolder.add(waterMaterial.uniforms.uSmallWavesFrequency, 'value', 0, 10).name('Frequency');
        smallWavesFolder.add(waterMaterial.uniforms.uSmallWavesSpeed, 'value', 0, 1).name('Speed');
        smallWavesFolder.add(waterMaterial.uniforms.uSmallWavesIterations, 'value', 1, 10, 1).name('Iterations');

        const colorFolder = gui.addFolder("Colors");
        colorFolder.addColor(debugObject, 'waveDepthColor').name('Depth Color').onChange((val) => {
            waterMaterial.uniforms.uDepthColor.value.set(val);
        });
        colorFolder.addColor(debugObject, 'waveSurfaceColor').name('Surface Color').onChange((val) => {
            waterMaterial.uniforms.uSurfaceColor.value.set(val);
        });
        colorFolder.add(waterMaterial.uniforms.uColorOffset, 'value', -0.5, 0.5).name('Color Offset');
        colorFolder.add(waterMaterial.uniforms.uColorMultiplier, 'value', 0, 10).name('Color Multiplier');

        window.addEventListener("resize", () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        function animate() {
            waterMaterial.uniforms.uTime.value += 0.01;
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
