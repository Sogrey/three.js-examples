<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="喷泉粒子效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 喷泉水流</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 5, 12);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        window.scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        window.scene.add(new THREE.AxesHelper(10));

        const params = {
            count: 3000,
            nozzleX: 0,
            nozzleY: 6,
            velocityX: 1.5,
            velocityY: 2.0,
            spread: 1.5,
            gravity: 10,
            particleSize: 0.15,
            lifeTime: 2.0,
        };

        const uniforms = {
            time: { value: 0 },
            nozzlePos: { value: new THREE.Vector3(params.nozzleX, params.nozzleY, 0) },
            velocity: { value: new THREE.Vector2(params.velocityX, params.velocityY) },
            spread: { value: params.spread },
            gravity: { value: params.gravity },
            lifeTime: { value: params.lifeTime },
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                attribute float size;
                attribute float phase;
                attribute vec3 randomVel;
                uniform float time;
                uniform vec3 nozzlePos;
                uniform vec2 velocity;
                uniform float spread;
                uniform float gravity;
                uniform float lifeTime;
                varying float vAlpha;

                void main() {
                    float age = mod(time + phase, lifeTime);
                    float ageRatio = age / lifeTime;

                    vec3 pos = nozzlePos;
                    pos.x += randomVel.x * 0.2;
                    pos.y += randomVel.y * 0.2;
                    pos.z += randomVel.z * 0.3;

                    vec3 vel = vec3(velocity.x, velocity.y, 0.0);
                    vel += randomVel * spread;

                    pos += vel * age;
                    pos.y -= 0.5 * gravity * age * age;

                    vAlpha = smoothstep(0.0, 0.05, ageRatio) * (1.0 - smoothstep(0.85, 1.0, ageRatio));

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = size * (250.0 / -mvPosition.z);
                }
            `,
            fragmentShader: `
                uniform sampler2D map;
                varying float vAlpha;

                void main() {
                    vec4 texColor = texture2D(map, gl_PointCoord);
                    gl_FragColor = vec4(texColor.rgb, texColor.a * vAlpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        g.addColorStop(0, 'rgba(200,235,255,1)');
        g.addColorStop(1, 'rgba(120,190,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 32, 32);
        uniforms.map = { value: new THREE.CanvasTexture(c) };

        function buildGeometry() {
            const geo = new THREE.BufferGeometry();
            const positions = [], sizes = [], phases = [], randomVels = [];

            for (let i = 0; i < params.count; i++) {
                positions.push(0, 0, 0);
                sizes.push(params.particleSize * (0.8 + Math.random() * 0.4));
                phases.push(Math.random() * params.lifeTime);
                randomVels.push(
                    (Math.random() - 0.5),
                    (Math.random() - 0.5) * 0.6,
                    (Math.random() - 0.5) * 0.8
                );
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geo.setAttribute('phase', new THREE.Float32BufferAttribute(phases, 1));
            geo.setAttribute('randomVel', new THREE.Float32BufferAttribute(randomVels, 3));
            return geo;
        }

        const particles = new THREE.Points(buildGeometry(), material);
        window.scene.add(particles);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            uniforms.time.value = clock.getElapsedTime();
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.title('喷泉水流参数调节');
        gui.add(params, 'nozzleX', -5, 5, 0.1).name('喷嘴X').onChange(v => uniforms.nozzlePos.value.x = v);
        gui.add(params, 'nozzleY', 0, 10, 0.1).name('喷嘴高度').onChange(v => uniforms.nozzlePos.value.y = v);
        gui.add(params, 'velocityX', -5, 5, 0.1).name('水平速度').onChange(v => uniforms.velocity.value.x = v);
        gui.add(params, 'velocityY', 0, 5, 0.1).name('上升速度').onChange(v => uniforms.velocity.value.y = v);
        gui.add(params, 'spread', 0, 3, 0.1).name('扩散').onChange(v => uniforms.spread.value = v);
        gui.add(params, 'gravity', 0, 20, 0.5).name('重力').onChange(v => uniforms.gravity.value = v);
        gui.add(params, 'lifeTime', 0.5, 5, 0.1).name('生命周期').onChange(v => uniforms.lifeTime.value = v);
        gui.add(params, 'count', 500, 8000, 100).name('粒子数').onChange(() => {
            particles.geometry.dispose();
            particles.geometry = buildGeometry();
        });
        gui.add(params, 'particleSize', 0.05, 0.5, 0.01).name('粒子大小').onChange(() => {
            particles.geometry.dispose();
            particles.geometry = buildGeometry();
        });

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
