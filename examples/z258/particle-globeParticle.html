<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="地球粒子效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 地球粒子</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x020209);
        window.scene.fog = new THREE.Fog(0x020209, 15, 60);

        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.z = 6;

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        window.renderer.toneMappingExposure = 1.2;
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x333366, 0.8);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffcc, 1.2);
        directionalLight.position.set(1, 3, 2);
        window.scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0x3366ff, 2, 10);
        pointLight.position.set(0, 0, 0);
        window.scene.add(pointLight);

        const composer = new EffectComposer(window.renderer);
        const renderPass = new RenderPass(window.scene, window.camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.2,
            0.7,
            0.5
        );
        composer.addPass(bloomPass);

        const gammaCorrectionPass = new ShaderPass(GammaCorrectionShader);
        composer.addPass(gammaCorrectionPass);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.rotateSpeed = 0.5;
        controls.minDistance = 3;
        controls.maxDistance = 15;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        controls.addEventListener('start', () => {
            document.body.style.cursor = 'grabbing';
            controls.autoRotate = false;
        });

        controls.addEventListener('end', () => {
            document.body.style.cursor = 'grab';
            setTimeout(() => { controls.autoRotate = true; }, 3000);
        });

        const params = {
            particleCount: 30000,
            bloomStrength: 1.2,
            bloomRadius: 0.7,
            bloomThreshold: 0.5,
            rotationSpeed: 0.05,
            autoRotateSpeed: 0.5,
            pulseIntensity: 0.2
        };

        const numParticles = params.particleCount;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(numParticles * 3);
        const colors = new Float32Array(numParticles * 3);
        const sizes = new Float32Array(numParticles);
        const speeds = new Float32Array(numParticles);

        for (let i = 0; i < numParticles; i++) {
            if (i < numParticles * 0.8) {
                const phi = Math.acos(-1 + (2 * i) / (numParticles * 0.8));
                const theta = Math.sqrt(numParticles * Math.PI) * phi;
                const radius = 1.8 + Math.random() * 0.4;
                const x = Math.sin(phi) * Math.cos(theta) * radius;
                const y = Math.sin(phi) * Math.sin(theta) * radius;
                const z = Math.cos(phi) * radius;
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            } else {
                const angle = Math.random() * Math.PI * 2;
                const radius = 2 + Math.random() * 3;
                const height = (Math.random() - 0.5) * 2;
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = height;
                positions[i * 3 + 2] = Math.sin(angle) * radius;
            }

            const distance = Math.sqrt(
                positions[i * 3] ** 2 +
                positions[i * 3 + 1] ** 2 +
                positions[i * 3 + 2] ** 2
            );

            let color;
            if (distance < 1.5) {
                color = new THREE.Color(0x4466ff);
            } else if (distance < 2.5) {
                color = new THREE.Color(0x9944ff);
            } else {
                color = new THREE.Color(0xff44aa);
            }

            color.offsetHSL(0, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.2);
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;

            sizes[i] = distance < 2 ? 0.05 + Math.random() * 0.04 : 0.03 + Math.random() * 0.03;
            speeds[i] = 0.4 + Math.random() * 0.6;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                pixelRatio: { value: window.devicePixelRatio }
            },
            vertexShader: `
                attribute float size;
                uniform float time;
                uniform float pixelRatio;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    float pulse = 1.0 + 0.2 * sin(time + position.x + position.z);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * pulse * pixelRatio * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    float distanceToCenter = length(gl_PointCoord - vec2(0.5));
                    if (distanceToCenter > 0.5) discard;
                    float alpha = 1.0 - smoothstep(0.4, 0.5, distanceToCenter);
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            vertexColors: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, particleMaterial);
        window.scene.add(particleSystem);

        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            particleMaterial.uniforms.pixelRatio.value = window.devicePixelRatio;
        });

        window.renderer.domElement.addEventListener('dblclick', () => {
            window.camera.position.set(0, 0, 6);
            window.camera.lookAt(0, 0, 0);
            controls.reset();
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            particleSystem.rotation.y += delta * params.rotationSpeed;
            particleMaterial.uniforms.time.value = elapsedTime;
            particleSystem.scale.x = 1 + Math.sin(elapsedTime * 0.3) * params.pulseIntensity * 0.25;
            particleSystem.scale.y = 1 + Math.sin(elapsedTime * 0.4) * params.pulseIntensity * 0.25;
            particleSystem.scale.z = 1 + Math.sin(elapsedTime * 0.5) * params.pulseIntensity * 0.25;
            controls.update();
            composer.render();
        }

        window.renderer.setAnimationLoop(animate);

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.title('地球粒子参数调节');
        gui.add(params, 'particleCount', 5000, 60000, 1000).name('粒子数量').onChange(() => {
            location.reload();
        });
        gui.add(params, 'bloomStrength', 0.1, 3, 0.1).name('Bloom强度').onChange(v => {
            bloomPass.strength = v;
        });
        gui.add(params, 'bloomRadius', 0.1, 1, 0.05).name('Bloom半径').onChange(v => {
            bloomPass.radius = v;
        });
        gui.add(params, 'bloomThreshold', 0, 1, 0.05).name('Bloom阈值').onChange(v => {
            bloomPass.threshold = v;
        });
        gui.add(params, 'rotationSpeed', 0, 0.2, 0.01).name('旋转速度');
        gui.add(params, 'autoRotateSpeed', 0, 2, 0.1).name('自动旋转速度').onChange(v => {
            controls.autoRotateSpeed = v;
        });
        gui.add(params, 'pulseIntensity', 0, 1, 0.05).name('脉冲强度');

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
