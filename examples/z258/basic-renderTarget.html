<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js渲染目标示例 - 使用WebGLRenderTarget实现动态反射和纹理投影效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 渲染目标</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // 场景设置
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 5, 15);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 10);
        window.scene.add(directionalLight);

        // 创建渲染目标
        const renderTarget = new THREE.WebGLRenderTarget(1024, 1024);

        // 创建被渲染的独立场景
        const sourceScene = new THREE.Scene();
        sourceScene.background = new THREE.Color(0x1a1a2e);

        // 为源场景添加灯光
        const sourceAmbientLight = new THREE.AmbientLight(0xffffff, 0.6);
        sourceScene.add(sourceAmbientLight);

        const sourceDirectionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sourceDirectionalLight.position.set(5, 10, 5);
        sourceScene.add(sourceDirectionalLight);

        const sourcePointLight = new THREE.PointLight(0x4488ff, 0.8, 20);
        sourcePointLight.position.set(-3, 3, 3);
        sourceScene.add(sourcePointLight);

        // 旋转的彩色立方体
        const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
        const boxMaterials = [
            new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3, metalness: 0.6 }),
            new THREE.MeshStandardMaterial({ color: 0x33ff33, roughness: 0.3, metalness: 0.6 }),
            new THREE.MeshStandardMaterial({ color: 0x3333ff, roughness: 0.3, metalness: 0.6 }),
            new THREE.MeshStandardMaterial({ color: 0xffff33, roughness: 0.3, metalness: 0.6 }),
            new THREE.MeshStandardMaterial({ color: 0xff33ff, roughness: 0.3, metalness: 0.6 }),
            new THREE.MeshStandardMaterial({ color: 0x33ffff, roughness: 0.3, metalness: 0.6 })
        ];
        const rotatingBox = new THREE.Mesh(boxGeometry, boxMaterials);
        sourceScene.add(rotatingBox);

        // 内部旋转的小立方体
        const innerBox = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                emissive: 0x666666,
                roughness: 0.2, 
                metalness: 0.8 
            })
        );
        sourceScene.add(innerBox);

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(10, 10);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222,
            roughness: 0.9,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2;
        sourceScene.add(ground);

        // 左侧 - 原始渲染的立方体（直接添加到主场景）
        const originalGroup = new THREE.Group();
        originalGroup.position.set(-5, 0, 0);
        window.scene.add(originalGroup);

        // 原始立方体（与sourceScene中的相同）
        const originalBox = new THREE.Mesh(boxGeometry, boxMaterials.map(m => m.clone()));
        originalGroup.add(originalBox);

        // 地面
        const originalGround = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 10),
            new THREE.MeshStandardMaterial({ 
                color: 0x222222,
                roughness: 0.9,
                metalness: 0.1
            })
        );
        originalGround.rotation.x = -Math.PI / 2;
        originalGround.position.y = -2;
        originalGroup.add(originalGround);

        // 左侧灯光
        const originalAmbientLight = new THREE.AmbientLight(0xffffff, 0.6);
        originalGroup.add(originalAmbientLight);

        const originalDirectionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        originalDirectionalLight.position.set(5, 10, 5);
        originalGroup.add(originalDirectionalLight);

        const originalPointLight = new THREE.PointLight(0x4488ff, 0.8, 20);
        originalPointLight.position.set(-3, 3, 3);
        originalGroup.add(originalPointLight);

        // 使用渲染目标的物体（右侧）
        const targetGroup = new THREE.Group();
        targetGroup.position.set(5, 0, 0);
        window.scene.add(targetGroup);

        // 主显示平面 - 显示渲染目标内容
        const displayGeometry = new THREE.PlaneGeometry(4, 4);
        const displayMaterial = new THREE.MeshBasicMaterial({ 
            map: renderTarget.texture
        });
        const displayPlane = new THREE.Mesh(displayGeometry, displayMaterial);
        targetGroup.add(displayPlane);

        // 边框
        const borderGeometry = new THREE.BoxGeometry(4.2, 4.2, 0.1);
        const borderMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x666666,
            roughness: 0.5,
            metalness: 0.8
        });
        const border = new THREE.Mesh(borderGeometry, borderMaterial);
        border.position.z = -0.1;
        targetGroup.add(border);

        // 下方的小立方体也使用渲染目标
        const smallBox = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 2),
            new THREE.MeshStandardMaterial({ 
                map: renderTarget.texture,
                roughness: 0.3,
                metalness: 0.7
            })
        );
        smallBox.position.set(5, -3.5, 0);
        window.scene.add(smallBox);

        // 辅助相机用于渲染目标
        const sourceCamera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
        sourceCamera.position.set(0, 2, 10);
        sourceCamera.lookAt(0, 0, 0);

        // GUI 控制
        const params = {
            boxRotationSpeed: 1,
            innerBoxRotationSpeed: 2,
            showBorder: true,
            wireframe: false
        };

        const gui = new GUI();
        gui.domElement.style.marginTop = '50px';
        gui.add(params, 'boxRotationSpeed', 0, 5).name('主立方体转速');
        gui.add(params, 'innerBoxRotationSpeed', 0, 5).name('内部立方体转速');
        gui.add(params, 'showBorder').name('显示边框').onChange(v => {
            border.visible = v;
        });
        gui.add(params, 'wireframe').name('线框模式').onChange(v => {
            displayMaterial.wireframe = v;
        });

        // 窗口大小变化
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 旋转源场景中的物体（用于渲染目标）
            rotatingBox.rotation.x += 0.01 * params.boxRotationSpeed;
            rotatingBox.rotation.y += 0.02 * params.boxRotationSpeed;

            innerBox.rotation.x -= 0.02 * params.innerBoxRotationSpeed;
            innerBox.rotation.y -= 0.01 * params.innerBoxRotationSpeed;
            innerBox.position.y = Math.sin(time * 2) * 0.5;

            // 同步旋转左侧原始立方体
            originalBox.rotation.copy(rotatingBox.rotation);

            // 小立方体旋转
            smallBox.rotation.x += 0.005;
            smallBox.rotation.y += 0.01;

            controls.update();

            // 渲染到目标 - 使用独立的sourceScene
            window.renderer.setRenderTarget(renderTarget);
            window.renderer.render(sourceScene, sourceCamera);

            // 渲染主场景
            window.renderer.setRenderTarget(null);
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
