<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="罗盘 - 展示罗盘效果着色器">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 罗盘</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 0.6);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
        });

        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const geometry = new THREE.PlaneGeometry(2, 2);

        const material = new THREE.ShaderMaterial({
            uniforms,
            transparent: true,
            side: THREE.DoubleSide,
            vertexShader: `
                varying vec3 vPosition;
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                float PI = 3.1415926;
                uniform float iTime;
                uniform vec2 iResolution;
                varying vec2 vUv;

                vec2 rotate(vec2 p, float rad) {
                    mat2 m = mat2(cos(rad), sin(rad), -sin(rad), cos(rad));
                    return m * p;
                }

                vec2 scale(vec2 p, float r) {
                    return p * r;
                }

                float circle(float pre, vec2 p, float r1, float r2, float power) {
                    float leng = length(p);
                    float d = min(abs(leng - r1), abs(leng - r2));
                    if (r1 < leng && leng < r2) pre /= exp(d) / r2;
                    float res = power / d;
                    return clamp(pre + res, 0.0, 1.0);
                }

                float rectangle(float pre, vec2 p, vec2 half1, vec2 half2, float power) {
                    p = abs(p);
                    if ((half1.x < p.x || half1.y < p.y) && (p.x < half2.x && p.y < half2.y)) {
                        pre = max(0.01, pre);
                    }
                    float dx1 = (p.y < half1.y) ? abs(half1.x - p.x) : length(p - half1);
                    float dx2 = (p.y < half2.y) ? abs(half2.x - p.x) : length(p - half2);
                    float dy1 = (p.x < half1.x) ? abs(half1.y - p.y) : length(p - half1);
                    float dy2 = (p.x < half2.x) ? abs(half2.y - p.y) : length(p - half2);
                    float d = min(min(dx1, dx2), min(dy1, dy2));
                    float res = power / d;
                    return clamp(pre + res, 0.0, 1.0);
                }

                float radiation(float pre, vec2 p, float r1, float r2, int num, float power) {
                    float angle = 2.0 * PI / float(num);
                    float d = 1e10;
                    for(int i = 0; i < 360; i++) {
                        if (i >= num) break;
                        float _d = (r1 < p.y && p.y < r2) ? abs(p.x) : min(length(p - vec2(0.0, r1)), length(p - vec2(0.0, r2)));
                        d = min(d, _d);
                        p = rotate(p, angle);
                    }
                    float res = power / d;
                    return clamp(pre + res, 0.0, 1.0);
                }

                void main() {
                    vec2 p = vUv - 0.5;
                    p.y *= iResolution.y / iResolution.x;

                    float dst = 0.0;
                    p = scale(p, sin(PI * iTime / 1.0) * 0.02 + 1.1);

                    {
                        vec2 q = p;
                        q = rotate(q, iTime * PI / 6.0);
                        dst = circle(dst, q, 0.85, 0.9, 0.006);
                        dst = radiation(dst, q, 0.87, 0.88, 36, 0.0008);
                    }

                    {
                        vec2 q = p;
                        q = rotate(q, iTime * PI / 6.0);
                        const int n = 6;
                        float angle = PI / float(n);
                        q = rotate(q, floor(atan(q.x, q.y) / angle + 0.5) * angle);
                        for(int i = 0; i < n; i++) {
                            dst = rectangle(dst, q, vec2(0.85 / sqrt(2.0)), vec2(0.85 / sqrt(2.0)), 0.0015);
                            q = rotate(q, angle);
                        }
                    }

                    {
                        vec2 q = p;
                        q = rotate(q, iTime * PI / 6.0);
                        const int n = 12;
                        q = rotate(q, 2.0 * PI / float(n) / 2.0);
                        float angle = 2.0 * PI / float(n);
                        for(int i = 0; i < n; i++) {
                            dst = circle(dst, q - vec2(0.0, 0.875), 0.001, 0.05, 0.004);
                            dst = circle(dst, q - vec2(0.0, 0.875), 0.001, 0.001, 0.008);
                            q = rotate(q, angle);
                        }
                    }

                    {
                        vec2 q = p;
                        dst = circle(dst, q, 0.5, 0.55, 0.002);
                    }

                    {
                        vec2 q = p;
                        q = rotate(q, -iTime * PI / 6.0);
                        const int n = 3;
                        float angle = PI / float(n);
                        q = rotate(q, floor(atan(q.x, q.y) / angle + 0.5) * angle);
                        for(int i = 0; i < n; i++) {
                            dst = rectangle(dst, q, vec2(0.36, 0.36), vec2(0.36, 0.36), 0.0015);
                            q = rotate(q, angle);
                        }
                    }

                    {
                        vec2 q = p;
                        q = rotate(q, -iTime * PI / 6.0);
                        const int n = 12;
                        q = rotate(q, 2.0 * PI / float(n) / 2.0);
                        float angle = 2.0 * PI / float(n);
                        for(int i = 0; i < n; i++) {
                            dst = circle(dst, q - vec2(0.0, 0.53), 0.001, 0.035, 0.004);
                            dst = circle(dst, q - vec2(0.0, 0.53), 0.001, 0.001, 0.001);
                            q = rotate(q, angle);
                        }
                    }

                    {
                        vec2 q = p;
                        dst = circle(dst, q, 0.15, 0.2, 0.0015);
                    }

                    {
                        vec2 q = p;
                        q = rotate(q, -iTime * PI / 6.0);
                        const int n = 3;
                        float angle = PI / float(n);
                        q = rotate(q, floor(atan(q.x, q.y) / angle + 0.5) * angle);
                        for(int i = 0; i < n; i++) {
                            dst = rectangle(dst, q, vec2(0.08, 0.08), vec2(0.08, 0.08), 0.002);
                            q = rotate(q, angle);
                        }
                    }

                    gl_FragColor = vec4(vec3(dst), 1.0);
                }
            `
        });

        const plane = new THREE.Mesh(geometry, material);
        window.scene.add(plane);

        function animate(time) {
            uniforms.iTime.value = time / 1000;
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
