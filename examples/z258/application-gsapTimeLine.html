<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="时间轴动画 - 使用GSAP时间线创建花园动画场景"
    />
    <meta name="three-version" content="r179" />
    <title>Three.js 示例 - 时间轴动画</title>
    <link rel="stylesheet" href="../../css/example-common.css" />
  </head>
  <body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../libs/three/r179/build/three.module.js",
          "three/addons/": "../../libs/three/r179/jsm/",
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import gsap from "gsap";

      const container = document.getElementById("threeContainer");

      window.scene = new THREE.Scene();
      window.scene.background = new THREE.Color(0x87ceeb);

      window.camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        100000,
      );
      window.camera.position.set(0, 10, 20);

      window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      window.renderer.shadowMap.enabled = true;
      container.appendChild(window.renderer.domElement);

      const controls = new OrbitControls(
        window.camera,
        window.renderer.domElement,
      );
      controls.enableDamping = true;

      window.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 2);
      light.position.set(10, 20, 5);
      light.castShadow = true;
      window.scene.add(light);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 30),
        new THREE.MeshLambertMaterial({ color: 0x228b22 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      window.scene.add(ground);

      const flower = new THREE.Group();
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.1, 3),
        new THREE.MeshPhongMaterial({ color: 0x228b22 }),
      );
      stem.position.y = 1.5;
      stem.castShadow = true;

      const petals = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 12, 12),
        new THREE.MeshPhongMaterial({ color: 0xff69b4, shininess: 100 }),
      );
      petals.position.y = 3;
      petals.scale.set(1, 0.5, 1);
      petals.castShadow = true;

      flower.add(stem, petals);
      window.scene.add(flower);

      const butterfly = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 1),
        new THREE.MeshPhongMaterial({ color: 0x8b4513 }),
      );
      const wing1 = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 8, 8),
        new THREE.MeshPhongMaterial({
          color: 0xff6347,
          transparent: true,
          opacity: 0.8,
        }),
      );
      wing1.scale.set(1.5, 0.1, 1);
      wing1.position.set(0.3, 0, 0);

      const wing2 = wing1.clone();
      wing2.position.set(-0.3, 0, 0);

      butterfly.add(body, wing1, wing2);
      butterfly.position.set(5, 4, 0);
      window.scene.add(butterfly);

      const tl = gsap.timeline({ repeat: -1, yoyo: true });

      tl.from(flower.scale, {
        x: 0,
        y: 0,
        z: 0,
        duration: 2,
        ease: "back.out(1.7)",
      })
        .to(
          petals.material.color,
          { r: 1, g: 0.8, b: 0.2, duration: 1 },
          "-=0.5",
        )
        .to(
          butterfly.position,
          { x: 0, y: 5, z: 2, duration: 3, ease: "power1.inOut" },
          "-=0.5",
        )
        .to(butterfly.rotation, { z: Math.PI / 4, duration: 0.5 }, "-=1")
        .to(petals.scale, { x: 1.3, y: 0.6, z: 1.3, duration: 1 })
        .to(butterfly.position, { x: -3, y: 3, z: -2, duration: 2 });

      function animate() {
        requestAnimationFrame(animate);

        wing1.rotation.z = Math.sin(Date.now() * 0.02) * 0.3;
        wing2.rotation.z = -Math.sin(Date.now() * 0.02) * 0.3;

        petals.rotation.y += 0.005;
        controls.update();

        window.renderer.render(window.scene, window.camera);
      }
      animate();

      window.addEventListener("resize", () => {
        window.camera.aspect = window.innerWidth / window.innerHeight;
        window.camera.updateProjectionMatrix();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "take-screenshot") {
          try {
            if (window.scene && window.camera) {
              window.renderer.render(window.scene, window.camera);
            }
            const quality = event.data.quality || 0.8;
            const canvas = window.renderer.domElement;
            const tempCanvas = document.createElement("canvas");
            const maxSize = 600;
            const scale = Math.min(
              maxSize / canvas.width,
              maxSize / canvas.height,
            );
            tempCanvas.width = Math.floor(canvas.width * scale);
            tempCanvas.height = Math.floor(canvas.height * scale);
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            const dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
            window.parent.postMessage(
              { type: "screenshot-data", dataUrl: dataUrl },
              "*",
            );
          } catch (error) {
            console.error("截图失败:", error);
            window.parent.postMessage(
              { type: "screenshot-error", error: error.message },
              "*",
            );
          }
        }
      });
    </script>
  </body>
</html>
