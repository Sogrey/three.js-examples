<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示燃烧烟雾效果，使用实例化渲染大量粒子实现烟雾粒子系统" />
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 燃烧烟雾</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100000);
        window.camera.position.set(5, 0.5, 0);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.target.set(0, 0.5, 0);
        controls.enableDamping = true;

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.renderer.setSize(w, h);
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
        });

        const clock = new THREE.Clock();
        let particles = [];
        let delta = 0;
        let emitTime = 0;

        const config = {
            wind: [0.001, 0, 0],
            emit: { pos: [0, 0, 0], r1: 0.1, r2: 0.8, height: 8, rate: 0.05, maxPerFrame: 3 },
            particle: {
                life: [4, 5],
                rot: [0.2, 0.4],
                speed: [0.008, 0.012],
                scale: 0.3,
                growth: 0.006,
                fade: 0.006,
                opacity: 0.8,
                blend: 0.95,
                color: { start: [0.8, 0.8, 0.8], end: [0.2, 0.2, 0.2], speed: [0.3, 0.4] },
                brightness: [0.8, 1]
            }
        };

        const params = {
            windX: 0.001,
            windY: 0,
            windZ: 0,
            emitRate: 0.05,
            maxPerFrame: 3,
            particleLife: [4, 5],
            particleScale: 0.3,
            growth: 0.006,
            fade: 0.006,
            opacity: 0.8
        };

        const rand = (a, b) => a + Math.random() * (b - a);

        const randCircle = (r) => {
            const rad = r * Math.sqrt(Math.random());
            const ang = Math.PI * 2 * Math.random();
            return [rad * Math.cos(ang), rad * Math.sin(ang)];
        };

        const circleTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        })();

        const geo = new THREE.InstancedBufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute([-0.5, 0.5, 0, -0.5, -0.5, 0, 0.5, 0.5, 0, 0.5, -0.5, 0, 0.5, 0.5, 0, -0.5, -0.5, 0], 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 1, 1, 0, 1, 1, 0, 0], 2));

        const attrDefs = [['offset', 3], ['scale', 2], ['quaternion', 3], ['rotation', 1], ['color', 4], ['blend', 1], ['texture', 1]];
        const attrs = {};
        attrDefs.forEach(([name, size]) => {
            attrs[name] = new Float32Array(100 * size);
            geo.setAttribute(name, new THREE.InstancedBufferAttribute(attrs[name], size));
        });

        const material = new THREE.ShaderMaterial({
            uniforms: {
                map: { value: circleTexture },
                time: { value: 0 }
            },
            vertexShader: `
                attribute vec3 offset;
                attribute vec2 scale;
                attribute vec3 quaternion;
                attribute float rotation;
                attribute vec4 color;
                attribute float blend;
                uniform float time;
                varying vec2 vUv;
                varying vec4 vColor;
                varying float vBlend;

                void main() {
                    float a = time * rotation;
                    float c = cos(a);
                    float s = sin(a);
                    vec3 vR = vec3(position.x * scale.x * c - position.y * scale.y * s, position.y * scale.y * c + position.x * scale.x * s, 0.0);
                    vec3 vL = offset - cameraPosition;
                    vec3 up = vec3(0, 1, 0);
                    vec3 right = normalize(cross(vL, up));
                    vec3 vP = vR.x * right + vR.y * up + offset;
                    vUv = uv;
                    vColor = color;
                    vBlend = blend;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(vP, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D map;
                varying vec2 vUv;
                varying vec4 vColor;
                varying float vBlend;

                void main() {
                    vec4 c = texture2D(map, vUv) * vColor;
                    gl_FragColor = c;
                    gl_FragColor.rgb *= gl_FragColor.a;
                    gl_FragColor.a *= vBlend;
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.CustomBlending,
            blendSrc: THREE.OneFactor,
            blendDst: THREE.OneMinusSrcAlphaFactor
        });

        const mesh = new THREE.Mesh(geo, material);
        mesh.frustumCulled = false;
        window.scene.add(mesh);

        const gui = new GUI();
        gui.domElement.style.position = 'absolute';
        gui.domElement.style.top = '50px';
        gui.domElement.style.right = '10px';
        gui.domElement.style.zIndex = '1000';

        gui.add(params, 'windX', -0.01, 0.01).name('风向 X').onChange(value => {
            config.wind[0] = value;
        });
        gui.add(params, 'windZ', -0.01, 0.01).name('风向 Z').onChange(value => {
            config.wind[2] = value;
        });
        gui.add(params, 'maxPerFrame', 1, 10, 1).name('每帧数量').onChange(value => {
            config.emit.maxPerFrame = value;
        });
        gui.add(params, 'opacity', 0.1, 1).name('不透明度').onChange(value => {
            config.particle.opacity = value;
        });

        function animate() {
            requestAnimationFrame(animate);
            delta = clock.getDelta();

            emitTime += delta;
            let emitCount = Math.min(Math.floor(emitTime / config.emit.rate), config.emit.maxPerFrame);
            emitTime -= emitCount * config.emit.rate;

            while (emitCount-- > 0) {
                const [x1, z1] = randCircle(config.emit.r1);
                const [dx, dz] = randCircle(config.emit.r2);
                const dir = [dx, config.emit.height, dz];
                const len = Math.hypot(...dir);
                const speed = rand(...config.particle.speed);
                const bright = rand(...config.particle.brightness);

                particles.push({
                    p: [x1, 0, z1],
                    v: dir.map(v => v * speed / len),
                    s: config.particle.scale,
                    r: rand(...config.particle.rot),
                    c: [...config.particle.color.start.map(c => c * bright), config.particle.opacity],
                    ce: config.particle.color.end.map(c => c * bright),
                    ct: 0,
                    cs: rand(...config.particle.color.speed),
                    l: rand(...config.particle.life),
                    b: config.particle.blend
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];

                for (let j = 0; j < 3; j++) {
                    p.p[j] += p.v[j] + config.wind[j];
                }

                p.s += config.particle.growth;

                if (p.ct < 1) {
                    p.ct = Math.min(1, p.ct + delta * p.cs);
                    for (let j = 0; j < 3; j++) {
                        p.c[j] = (1 - p.ct) * p.c[j] + p.ct * p.ce[j];
                    }
                }

                p.l -= delta;
                if (p.l <= 0) {
                    p.c[3] -= config.particle.fade;
                }

                if (p.c[3] <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (particles.length === 0) {
                window.renderer.render(window.scene, window.camera);
                return;
            }

            particles.sort((a, b) => {
                return Math.hypot(window.camera.position.x - b.p[0], window.camera.position.y - b.p[1], window.camera.position.z - b.p[2]) -
                       Math.hypot(window.camera.position.x - a.p[0], window.camera.position.y - a.p[1], window.camera.position.z - a.p[2]);
            });

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                attrs.rotation[i] = p.r;
                attrs.blend[i] = p.b;
                attrs.texture[i] = 0;

                attrs.scale[i * 2] = attrs.scale[i * 2 + 1] = p.s;

                for (let j = 0; j < 3; j++) {
                    attrs.offset[i * 3 + j] = p.p[j];
                    attrs.quaternion[i * 3 + j] = p.v[j];
                }

                for (let j = 0; j < 4; j++) {
                    attrs.color[i * 4 + j] = p.c[j];
                }
            }

            Object.entries(attrs).forEach(([name, array]) => {
                geo.attributes[name].needsUpdate = true;
            });
            geo.instanceCount = particles.length;

            material.uniforms.time.value = clock.elapsedTime;
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) {
                            window.composer.render();
                        } else if (window.renderer) {
                            window.renderer.render(window.scene, window.camera);
                        }
                    }

                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
