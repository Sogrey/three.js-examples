<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="点星感谢 - 文字粒子动画效果，展示感谢信息">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 点星感谢</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        let mesh, uniforms, renderer, scene, camera, controls;

        const text = `Thanks for your star`;

        const loader = new FontLoader();
        loader.load('../../libs/three/r179/examples/fonts/helvetiker_regular.typeface.json', font => init(font));

        function init(font) {
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(100, 200, 400);

            window.scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            let geometry = new TextGeometry(text, {
                font: font,
                size: 30,
                depth: 5,
                curveSegments: 3,
                bevelThickness: 2,
                bevelSize: 1,
                bevelEnabled: true
            });

            geometry.center();

            const numFaces = geometry.attributes.position.count / 3;
            const colors = new Float32Array(numFaces * 3 * 3);
            const displacement = new Float32Array(numFaces * 3 * 3);
            const color = new THREE.Color();

            for (let f = 0; f < numFaces; f++) {
                const index = 9 * f;
                if (Math.random() > 0.5) {
                    const h = 0.2 * Math.random();
                    const s = 0.5 + 0.5 * Math.random();
                    const l = 0.5 + 0.5 * Math.random();
                    color.setHSL(h, s, l);
                } else {
                    color.set(0xa58fb5);
                }
                const d = 60 * (0.5 - Math.random());
                for (let i = 0; i < 3; i++) {
                    colors[index + (3 * i)] = color.r;
                    colors[index + (3 * i) + 1] = color.g;
                    colors[index + (3 * i) + 2] = color.b;
                    displacement[index + (3 * i)] = d;
                    displacement[index + (3 * i) + 1] = d;
                    displacement[index + (3 * i) + 2] = d;
                }
            }

            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('displacement', new THREE.BufferAttribute(displacement, 3));

            uniforms = { 
                amplitude: { value: 0.0 }, 
                opacityf: { value: 0.8 } 
            };

            const shaderMaterial = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: `
                    uniform float amplitude;
                    attribute vec3 customColor;
                    attribute vec3 displacement;
                    varying vec3 vNormal;
                    varying vec3 vColor;
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vNormal = normal;
                        vColor = customColor;
                        vec3 newPosition = position + normal * amplitude * displacement;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    varying vec3 vColor;
                    varying vec2 vUv;
                    uniform float opacityf;
                    uniform float amplitude;
                    void main() {
                        vec2 uv = vUv;
                        float iTime = amplitude;
                        vec3 wave_color = vec3(0.0);
                        float wave_width = 0.0;
                        for(float i = 0.0; i <= 28.0; i++) {
                            uv.y += (0.2 + (0.9 * sin(iTime * 0.4) * sin(uv.x + i / 3.0 + 3.0 * iTime)));
                            uv.x += 1.7 * sin(iTime * 0.4);
                            wave_width = abs(1.0 / (200.0 * abs(cos(iTime)) * uv.y));
                            wave_color += vec3(wave_width * (0.4 + ((i + 1.0) / 18.0)), wave_width * (i / 9.0), wave_width * ((i + 1.0) / 8.0) * 1.9);
                        }
                        
                        const float ambient = 0.4;
                        vec3 light = vec3(1.0);
                        light = normalize(light);
                        float directional = max(dot(vNormal, light), 0.0);
                        gl_FragColor = vec4(mix((directional + ambient) * vColor, wave_color, 0.6), opacityf);
                    }
                `,
                transparent: true,
                wireframe: true,
                wireframeLinewidth: 4
            });

            mesh = new THREE.Mesh(geometry, shaderMaterial);
            scene.add(mesh);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(render);
            document.getElementById('threeContainer').appendChild(renderer.domElement);

            controls = new TrackballControls(camera, renderer.domElement);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            uniforms.amplitude.value = Math.sin(Date.now() * 0.001);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
