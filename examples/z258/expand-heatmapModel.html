<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="模型热力图可视化，展示3D模型上的数据热力分布">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 模型热力图</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a1a;
            margin: 0;
            overflow: hidden;
        }
        #heatmapUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #heatmapUI h3 {
            margin: 0 0 10px 0;
            color: #ff4444;
            font-size: 16px;
        }
        #heatmapUI .control {
            margin: 10px 0;
        }
        #heatmapUI label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #heatmapUI input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #heatmapUI .value {
            font-size: 10px;
            color: #ff4444;
            text-align: right;
        }
        #heatmapUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #heatmapUI .btn:hover {
            background: #444;
            border-color: #ff4444;
        }
        #heatmapUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 200;
        }
        .legend {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        .legend-bar {
            height: 12px;
            background: linear-gradient(to right, #0000ff, #00ff00, #ffff00, #ff0000);
            border-radius: 2px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    <div id="loading">加载模型中...</div>
    
    <div id="heatmapUI">
        <h3>🌡️ 模型热力图</h3>
        <div class="control">
            <label>数据点数量</label>
            <input type="range" id="pointCount" min="5" max="50" value="20" step="1">
            <div class="value" id="pointCountValue">20</div>
        </div>
        <div class="control">
            <label>数据更新速度</label>
            <input type="range" id="updateSpeed" min="50" max="500" value="200" step="50">
            <div class="value" id="speedValue">200ms</div>
        </div>
        <div class="control">
            <label>热力透明度</label>
            <input type="range" id="opacity" min="0.1" max="1" value="0.8" step="0.1">
            <div class="value" id="opacityValue">0.8</div>
        </div>
        <button class="btn" id="btnToggleAnim">暂停更新</button>
        <button class="btn" id="btnReset">重置视角</button>
        <div class="legend">
            <label>热力图例</label>
            <div class="legend-bar"></div>
            <div class="legend-labels">
                <span>低</span>
                <span>中</span>
                <span>高</span>
            </div>
        </div>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            展示3D模型热力分布
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const container = document.getElementById('threeContainer');
        const loadingDiv = document.getElementById('loading');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);
        
        // 热力图着色器材质
        class HeatmapMaterial extends THREE.ShaderMaterial {
            constructor(options = {}) {
                const maxPoints = options.maxPoints || 50;
                
                const vertexShader = `
                    varying vec3 vPosition;
                    varying vec3 vNormal;
                    
                    void main() {
                        vPosition = position;
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `;
                
                const fragmentShader = `
                    varying vec3 vPosition;
                    varying vec3 vNormal;
                    
                    uniform vec3 uDataPoints[${maxPoints}];
                    uniform float uDataValues[${maxPoints}];
                    uniform int uPointCount;
                    uniform float uMinValue;
                    uniform float uMaxValue;
                    uniform float uOpacity;
                    uniform vec3 uBoxMin;
                    uniform vec3 uBoxMax;
                    
                    vec3 heatmapColor(float t) {
                        vec3 blue = vec3(0.0, 0.0, 1.0);
                        vec3 cyan = vec3(0.0, 1.0, 1.0);
                        vec3 green = vec3(0.0, 1.0, 0.0);
                        vec3 yellow = vec3(1.0, 1.0, 0.0);
                        vec3 red = vec3(1.0, 0.0, 0.0);
                        
                        if (t < 0.25) {
                            return mix(blue, cyan, t * 4.0);
                        } else if (t < 0.5) {
                            return mix(cyan, green, (t - 0.25) * 4.0);
                        } else if (t < 0.75) {
                            return mix(green, yellow, (t - 0.5) * 4.0);
                        } else {
                            return mix(yellow, red, (t - 0.75) * 4.0);
                        }
                    }
                    
                    void main() {
                        float totalWeight = 0.0;
                        float weightedValue = 0.0;
                        
                        for(int i = 0; i < ${maxPoints}; i++) {
                            if (i >= uPointCount) break;
                            
                            float dist = length(vPosition - uDataPoints[i]);
                            float weight = 1.0 / (dist * dist + 0.1);
                            totalWeight += weight;
                            weightedValue += uDataValues[i] * weight;
                        }
                        
                        float value = weightedValue / totalWeight;
                        value = (value - uMinValue) / (uMaxValue - uMinValue);
                        value = clamp(value, 0.0, 1.0);
                        
                        vec3 color = heatmapColor(value);
                        
                        // 添加简单的光照效果
                        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                        float diff = max(dot(vNormal, lightDir), 0.0);
                        color *= (0.4 + 0.6 * diff);
                        
                        gl_FragColor = vec4(color, uOpacity);
                    }
                `;
                
                super({
                    vertexShader,
                    fragmentShader,
                    uniforms: {
                        uDataPoints: { value: new Array(maxPoints).fill().map(() => new THREE.Vector3()) },
                        uDataValues: { value: new Array(maxPoints).fill(0) },
                        uPointCount: { value: 0 },
                        uMinValue: { value: 0 },
                        uMaxValue: { value: 1 },
                        uOpacity: { value: options.opacity || 0.8 },
                        uBoxMin: { value: options.boxMin || new THREE.Vector3() },
                        uBoxMax: { value: options.boxMax || new THREE.Vector3() }
                    },
                    transparent: true,
                    side: THREE.DoubleSide
                });
                
                this.maxPoints = maxPoints;
            }
            
            updateData(points, values) {
                const count = Math.min(points.length, this.maxPoints);
                for (let i = 0; i < count; i++) {
                    this.uniforms.uDataPoints.value[i].copy(points[i]);
                    this.uniforms.uDataValues.value[i] = values[i];
                }
                this.uniforms.uPointCount.value = count;
                this.uniformsNeedUpdate = true;
            }
        }
        
        // 加载模型
        let heatmapMaterial;
        let updateInterval;
        let isUpdating = true;
        let currentPointCount = 20;
        let currentSpeed = 200;
        
        const objLoader = new OBJLoader();
        objLoader.load(
            '../../models/obj/ninja/ninjaHead_Low.obj',
            (object) => {
                // 计算模型边界
                const box = new THREE.Box3().setFromObject(object);
                const boxSize = new THREE.Vector3();
                box.getSize(boxSize);
                
                // 创建热力图材质
                heatmapMaterial = new HeatmapMaterial({
                    maxPoints: 50,
                    opacity: 0.8,
                    boxMin: box.min,
                    boxMax: box.max
                });
                
                // 应用材质
                object.traverse((child) => {
                    if (child.isMesh) {
                        child.material = heatmapMaterial;
                    }
                });
                
                // 居中并缩放
                const center = new THREE.Vector3();
                box.getCenter(center);
                object.position.sub(center);
                
                const maxDim = Math.max(boxSize.x, boxSize.y, boxSize.z);
                const scale = 4 / maxDim;
                object.scale.set(scale, scale, scale);
                
                scene.add(object);
                
                // 开始数据更新
                startDataUpdate(box, currentPointCount, currentSpeed);
                
                loadingDiv.style.display = 'none';
            },
            undefined,
            (error) => {
                console.error('模型加载失败:', error);
                loadingDiv.textContent = '加载失败';
            }
        );
        
        function generateRandomData(box, count) {
            const points = [];
            const values = [];
            const size = new THREE.Vector3();
            box.getSize(size);
            
            for (let i = 0; i < count; i++) {
                const point = new THREE.Vector3(
                    (Math.random() - 0.5) * size.x,
                    (Math.random() - 0.5) * size.y,
                    (Math.random() - 0.5) * size.z
                );
                points.push(point);
                values.push(Math.random());
            }
            
            return { points, values };
        }
        
        function startDataUpdate(box, count, speed) {
            if (updateInterval) clearInterval(updateInterval);
            
            // 初始数据
            const data = generateRandomData(box, count);
            heatmapMaterial.updateData(data.points, data.values);
            
            // 定期更新
            updateInterval = setInterval(() => {
                if (!isUpdating) return;
                
                const data = generateRandomData(box, count);
                heatmapMaterial.updateData(data.points, data.values);
            }, speed);
        }
        
        // UI控制
        const pointCountSlider = document.getElementById('pointCount');
        const pointCountValue = document.getElementById('pointCountValue');
        const speedSlider = document.getElementById('updateSpeed');
        const speedValue = document.getElementById('speedValue');
        const opacitySlider = document.getElementById('opacity');
        const opacityValue = document.getElementById('opacityValue');
        const btnToggleAnim = document.getElementById('btnToggleAnim');
        const btnReset = document.getElementById('btnReset');
        
        pointCountSlider.addEventListener('input', (e) => {
            currentPointCount = parseInt(e.target.value);
            pointCountValue.textContent = currentPointCount;
            
            if (heatmapMaterial) {
                const box = new THREE.Box3(
                    heatmapMaterial.uniforms.uBoxMin.value,
                    heatmapMaterial.uniforms.uBoxMax.value
                );
                startDataUpdate(box, currentPointCount, currentSpeed);
            }
        });
        
        speedSlider.addEventListener('input', (e) => {
            currentSpeed = parseInt(e.target.value);
            speedValue.textContent = currentSpeed + 'ms';
            
            if (heatmapMaterial) {
                const box = new THREE.Box3(
                    heatmapMaterial.uniforms.uBoxMin.value,
                    heatmapMaterial.uniforms.uBoxMax.value
                );
                startDataUpdate(box, currentPointCount, currentSpeed);
            }
        });
        
        opacitySlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            opacityValue.textContent = value.toFixed(1);
            if (heatmapMaterial) {
                heatmapMaterial.uniforms.uOpacity.value = value;
            }
        });
        
        btnToggleAnim.addEventListener('click', function() {
            isUpdating = !isUpdating;
            this.textContent = isUpdating ? '暂停更新' : '继续更新';
        });
        
        btnReset.addEventListener('click', () => {
            camera.position.set(8, 6, 8);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
