<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="视频地板效果，展示视频投影在地板上的效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 视频地板</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #111;
            margin: 0;
            overflow: hidden;
        }
        #floorUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #floorUI h3 {
            margin: 0 0 10px 0;
            color: #00ff88;
            font-size: 16px;
        }
        #floorUI .control {
            margin: 10px 0;
        }
        #floorUI label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #floorUI input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #floorUI .value {
            font-size: 10px;
            color: #00ff88;
            text-align: right;
        }
        #floorUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #floorUI .btn:hover {
            background: #444;
            border-color: #00ff88;
        }
        #floorUI .btn.active {
            background: #00ff88;
            color: #000;
        }
        #floorUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #floorUI .floor-item {
            margin: 8px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        #floorUI .floor-item label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #floorUI .floor-item input[type="checkbox"] {
            accent-color: #00ff88;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    <div id="loading">加载视频中...</div>
    
    <div id="floorUI">
        <h3>🎬 视频地板</h3>
        <div class="floor-item">
            <label>
                <input type="checkbox" id="floor1" checked>
                地板1 (3x3) - 最上层
            </label>
        </div>
        <div class="floor-item">
            <label>
                <input type="checkbox" id="floor2" checked>
                地板2 (4x4) - 中层
            </label>
        </div>
        <div class="floor-item">
            <label>
                <input type="checkbox" id="floor3" checked>
                地板3 (5x5) - 底层
            </label>
        </div>
        <div class="control">
            <label>全局透明度</label>
            <input type="range" id="globalOpacity" min="0" max="1" value="0.8" step="0.05">
            <div class="value" id="opacityValue">0.80</div>
        </div>
        <div class="control">
            <label>亮度</label>
            <input type="range" id="brightness" min="0.5" max="2" value="1" step="0.1">
            <div class="value" id="brightnessValue">1.0</div>
        </div>
        <button class="btn active" id="btnPlay">播放</button>
        <button class="btn" id="btnPause">暂停</button>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            三层视频地板叠加效果<br>
            每层使用同一视频的不同透明度
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        const loadingDiv = document.getElementById('loading');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.Fog(0x111111, 10, 100);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);
        
        // 网格辅助
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 视频地板数组
        const videoFloors = [];
        let videoTexture;
        let loadedCount = 0;
        const totalFloors = 3;
        
        function checkAllLoaded() {
            loadedCount++;
            if (loadedCount >= totalFloors) {
                loadingDiv.style.display = 'none';
            }
        }
        
        function createVideoFloor(width, height, y, opacity, color) {
            const video = document.createElement('video');
            video.crossOrigin = 'anonymous';
            video.src = '../../images/textures/test.mp4';
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            
            video.addEventListener('loadeddata', () => {
                video.play();
                checkAllLoaded();
            });
            
            video.addEventListener('error', () => {
                console.error('视频加载失败');
                checkAllLoaded();
            });
            
            const texture = new THREE.VideoTexture(video);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            
            const geometry = new THREE.PlaneGeometry(width, height);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                map: texture,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                emissive: color,
                emissiveIntensity: 0.2
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(0, y, 0);
            
            scene.add(mesh);
            
            return {
                mesh: mesh,
                video: video,
                texture: texture,
                baseOpacity: opacity
            };
        }
        
        // 创建三层视频地板
        // 最上层 - 小尺寸，高透明度
        videoFloors.push(createVideoFloor(3, 3, 0.02, 0.9, 0x00ff88));
        
        // 中层 - 中等尺寸，中等透明度
        videoFloors.push(createVideoFloor(4, 4, 0.01, 0.7, 0x0088ff));
        
        // 底层 - 大尺寸，低透明度
        videoFloors.push(createVideoFloor(5, 5, 0, 0.5, 0xff8800));
        
        // UI控制
        const floor1Checkbox = document.getElementById('floor1');
        const floor2Checkbox = document.getElementById('floor2');
        const floor3Checkbox = document.getElementById('floor3');
        const globalOpacitySlider = document.getElementById('globalOpacity');
        const opacityValueDisplay = document.getElementById('opacityValue');
        const brightnessSlider = document.getElementById('brightness');
        const brightnessValueDisplay = document.getElementById('brightnessValue');
        
        floor1Checkbox.addEventListener('change', (e) => {
            videoFloors[0].mesh.visible = e.target.checked;
        });
        
        floor2Checkbox.addEventListener('change', (e) => {
            videoFloors[1].mesh.visible = e.target.checked;
        });
        
        floor3Checkbox.addEventListener('change', (e) => {
            videoFloors[2].mesh.visible = e.target.checked;
        });
        
        globalOpacitySlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            opacityValueDisplay.textContent = value.toFixed(2);
            videoFloors.forEach(floor => {
                floor.mesh.material.opacity = floor.baseOpacity * value;
            });
        });
        
        brightnessSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            brightnessValueDisplay.textContent = value.toFixed(1);
            directionalLight.intensity = value;
            ambientLight.intensity = 0.5 * value;
            videoFloors.forEach(floor => {
                floor.mesh.material.emissiveIntensity = 0.2 * value;
            });
        });
        
        document.getElementById('btnPlay').addEventListener('click', () => {
            videoFloors.forEach(floor => {
                floor.video.play();
            });
            document.getElementById('btnPlay').classList.add('active');
            document.getElementById('btnPause').classList.remove('active');
        });
        
        document.getElementById('btnPause').addEventListener('click', () => {
            videoFloors.forEach(floor => {
                floor.video.pause();
            });
            document.getElementById('btnPause').classList.add('active');
            document.getElementById('btnPlay').classList.remove('active');
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
