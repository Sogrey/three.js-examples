<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GLTF Opt解压 - Three.js压缩模型加载示例">
    <title>GLTF Opt解压 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 240px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls button:disabled {
            background: #555; cursor: not-allowed;
        }
        #info {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 4px;
            font-size: 11px; line-height: 1.6;
        }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white;
            padding: 20px; border-radius: 8px;
            font-size: 14px; display: none;
        }
        .progress-bar {
            width: 200px; height: 10px; background: #333;
            border-radius: 5px; margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: #4a9eff;
            width: 0%; transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>📦 GLTF Opt解压</h3>
        <div class="control-group">
            <label>加载方式</label>
            <button id="btnLoadNormal">加载普通GLTF</button>
            <button id="btnLoadDraco">加载Draco压缩</button>
            <button id="btnLoadKtx2">加载KTX2压缩</button>
        </div>
        <div class="control-group">
            <label>模型操作</label>
            <button id="btnAutoRotate">⏯️ 自动旋转</button>
            <button id="btnWireframe">👁️ 线框模式</button>
            <button id="btnReset">🔄 重置视角</button>
        </div>
        <div class="control-group">
            <label>模型信息</label>
            <div id="modelInfo" style="color: #aaa; font-size: 11px;">
                未加载模型
            </div>
        </div>
    </div>

    <div id="loading">
        <div>加载中...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="loadingText" style="margin-top: 10px; font-size: 12px;"></div>
    </div>

    <div id="info">
        <div>支持多种压缩格式：Draco、KTX2</div>
        <div>使用 KTX2Loader 和 DRACOLoader</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 5);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x4a9eff, 0.5);
        pointLight.position.set(-5, 5, -5);
        scene.add(pointLight);

        // 地面
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a4a,
            roughness: 0.8 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(20, 20, 0x4a4a6a, 0x3a3a5a);
        scene.add(gridHelper);

        // 当前模型
        let currentModel = null;
        let autoRotate = false;

        // 加载器配置
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('../../libs/three/r179/jsm/libs/draco/');

        const ktx2Loader = new KTX2Loader();
        ktx2Loader.setTranscoderPath('../../libs/three/r179/jsm/libs/basis/');

        // 显示加载进度
        function showLoading(text) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loadingText').textContent = text;
            document.getElementById('progressFill').style.width = '0%';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function updateProgress(progress) {
            document.getElementById('progressFill').style.width = (progress * 100) + '%';
        }

        // 清除当前模型
        function clearModel() {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse((child) => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
                currentModel = null;
            }
        }

        // 加载普通GLTF
        function loadNormalGLTF() {
            clearModel();
            showLoading('加载普通GLTF模型...');

            const loader = new GLTFLoader();
            loader.load(
                '../../models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf',
                (gltf) => {
                    currentModel = gltf.scene;
                    setupModel(currentModel, '普通GLTF');
                    hideLoading();
                },
                (progress) => {
                    if (progress.total > 0) {
                        updateProgress(progress.loaded / progress.total);
                    }
                },
                (error) => {
                    console.error('加载失败:', error);
                    document.getElementById('loadingText').textContent = '加载失败: ' + error.message;
                }
            );
        }

        // 加载Draco压缩模型
        function loadDracoGLTF() {
            clearModel();
            showLoading('加载Draco压缩模型...');

            const loader = new GLTFLoader();
            loader.setDRACOLoader(dracoLoader);
            
            loader.load(
                '../../models/gltf/DamagedHelmet/glTF-Draco/DamagedHelmet.gltf',
                (gltf) => {
                    currentModel = gltf.scene;
                    setupModel(currentModel, 'Draco压缩');
                    hideLoading();
                },
                (progress) => {
                    if (progress.total > 0) {
                        updateProgress(progress.loaded / progress.total);
                    }
                },
                (error) => {
                    console.error('加载失败:', error);
                    document.getElementById('loadingText').textContent = '加载失败: ' + error.message;
                }
            );
        }

        // 加载KTX2压缩模型
        function loadKtx2GLTF() {
            clearModel();
            showLoading('加载KTX2压缩模型...');

            const loader = new GLTFLoader();
            loader.setKTX2Loader(ktx2Loader);
            
            // 如果没有KTX2模型，使用普通模型演示
            loader.load(
                '../../models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf',
                (gltf) => {
                    currentModel = gltf.scene;
                    setupModel(currentModel, 'KTX2压缩 (演示)');
                    hideLoading();
                },
                (progress) => {
                    if (progress.total > 0) {
                        updateProgress(progress.loaded / progress.total);
                    }
                },
                (error) => {
                    console.error('加载失败:', error);
                    document.getElementById('loadingText').textContent = '加载失败: ' + error.message;
                }
            );
        }

        // 设置模型
        function setupModel(model, type) {
            // 计算包围盒
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            // 居中并缩放
            model.position.sub(center);
            model.position.y += size.y / 2;
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3 / maxDim;
            model.scale.setScalar(scale);
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            scene.add(model);
            
            // 更新信息
            let vertexCount = 0;
            let triangleCount = 0;
            model.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    vertexCount += child.geometry.attributes.position.count;
                    if (child.geometry.index) {
                        triangleCount += child.geometry.index.count / 3;
                    } else {
                        triangleCount += child.geometry.attributes.position.count / 3;
                    }
                }
            });
            
            document.getElementById('modelInfo').innerHTML = `
                <div>类型: ${type}</div>
                <div>顶点数: ${vertexCount.toLocaleString()}</div>
                <div>三角面: ${Math.floor(triangleCount).toLocaleString()}</div>
                <div>尺寸: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}</div>
            `;
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate && currentModel) {
                currentModel.rotation.y += 0.01;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('btnLoadNormal').addEventListener('click', loadNormalGLTF);
        document.getElementById('btnLoadDraco').addEventListener('click', loadDracoGLTF);
        document.getElementById('btnLoadKtx2').addEventListener('click', loadKtx2GLTF);

        document.getElementById('btnAutoRotate').addEventListener('click', () => {
            autoRotate = !autoRotate;
            document.getElementById('btnAutoRotate').textContent = 
                autoRotate ? '⏹️ 停止旋转' : '⏯️ 自动旋转';
        });

        document.getElementById('btnWireframe').addEventListener('click', () => {
            if (currentModel) {
                currentModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => {
                                m.wireframe = !m.wireframe;
                            });
                        } else {
                            child.material.wireframe = !child.material.wireframe;
                        }
                    }
                });
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            camera.position.set(5, 3, 5);
            camera.lookAt(0, 0, 0);
            controls.reset();
            if (currentModel) {
                currentModel.rotation.set(0, 0, 0);
            }
        });

        // 默认加载普通模型
        loadNormalGLTF();
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
