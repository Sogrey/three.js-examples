<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js城市混合Shader示例 - Raymarching光线行进技术">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 城市混合Shader</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x0a0a1a);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        window.camera.position.set(220.52, 19.29, 20.17);
        window.camera.rotation.set(-0.77, 0.17, 0.16);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0x000000, 0);
        window.renderer.setPixelRatio(window.devicePixelRatio * 2);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const dirLight = new THREE.DirectionalLight(0xffffff, 3.8);
        dirLight.position.set(83, 61, -183);
        dirLight.target.position.set(10, -11, -194);
        window.scene.add(dirLight);
        window.scene.add(new THREE.AmbientLight(0xffffff, 2));

        let model = null;

        // 加载模型
        new FBXLoader().load('../../models/fbx/shanghai.FBX', (object3d) => {
            window.scene.add(object3d);
            object3d.scale.set(0.04, 0.04, 0.04);
            object3d.position.set(224, -9, -49);
            model = object3d;

            modelBlendShader(object3d);
        }, undefined, (error) => {
            console.error('模型加载失败:', error);
        });

        // 新光线行进着色器实现
        function modelBlendShader(model) {
            let materials = [];
            model.traverse(c => c.isMesh && materials.push(c.material));
            materials = [...new Set(materials)];

            // 创建控制参数对象
            const params = {
                intensity: 1.2,
                colorScale: 1.5,
                animationSpeed: 0.8,
                baseColor: '#6edbe8',
                useTexture: true,
                textureMix: 0.7
            };

            const uniforms = {
                iTime: { value: 0 },
                intensity: { value: params.intensity },
                colorScale: { value: params.colorScale },
                baseColor: { value: new THREE.Color(params.baseColor) },
                animSpeed: { value: params.animationSpeed },
                useTexture: { value: params.useTexture },
                textureMix: { value: params.textureMix }
            };

            const glslProps = {
                vertexHeader: `
                    varying vec2 vUv;
                    varying vec3 v_position;
                    void main() {
                        vUv = uv;
                        v_position = position;
                `,

                fragHeader: Object.keys(uniforms).map(i => 'uniform ' + getUniformType(uniforms[i].value) + ' ' + i + ';').join('\n') + '\n' + 'varying vec3 v_position; varying vec2 vUv;\n',

                fragBody: `
                    vec4 O = vec4(0.0);
                    vec2 I = (vUv - 0.5) * 2.0;
                    
                    float i = 0.0, d, z = 0.0;
                    
                    for(O *= i; i++ < 1e2;
                    O += (cos(z + vec4(0,2,3,0)) + 1.5) / d / z * colorScale)
                    {
                        vec3 p = z * normalize(vec3(I.x*2.0, I.y*2.0, -1.0)) + .8;
                        d = max(-p.y, 0.);
                        p.y += d+d - 1.;
                        z += d = .3 * (.01 + .1*d + 
                        length(min( p = cos(p + iTime * animSpeed) + cos(p / .6).yzx, p.zxy)) / ++d / d);
                    }
                    O = tanh(O / 7e2) * intensity;
                    
                    O.rgb = mix(O.rgb, O.rgb * vec3(baseColor), 0.5);
                    
                    vec4 diffuseColor = O;
                    
                    #ifdef USE_MAP
                        if(useTexture) {
                            vec3 textureColor = texture2D(map, vUv).rgb;
                            float luminance = dot(textureColor, vec3(0.299, 0.587, 0.114));
                            diffuseColor = mix(diffuseColor, diffuseColor * vec4(textureColor * (1.0 + luminance), opacity), textureMix);
                        }
                    #endif
                `
            };

            materials.forEach(material => {
                material.onBeforeCompile = (shader) => {
                    Object.keys(uniforms).forEach((key) => shader.uniforms[key] = uniforms[key]);

                    shader.vertexShader = shader.vertexShader.replace(`void main() {`, glslProps.vertexHeader);
                    shader.fragmentShader = shader.fragmentShader.replace(/#include <common>/, glslProps.fragHeader + '\n#include <common>\n');
                    shader.fragmentShader = shader.fragmentShader.replace('vec4 diffuseColor = vec4( diffuse, opacity );', glslProps.fragBody);
                };
                material.needsUpdate = true;
            });

            // 设置GUI控制
            setupGUI(params, uniforms);

            // 更新着色器参数
            model.render = (time) => {
                uniforms.iTime.value = time || 0;
            };
        }

        function getUniformType(value) {
            if (value instanceof THREE.Color) return 'vec3';
            if (value instanceof THREE.Vector3) return 'vec3';
            if (typeof value === 'boolean') return 'bool';
            return 'float';
        }

        // 设置GUI控制面板
        function setupGUI(params, uniforms) {
            const gui = new GUI();
            gui.domElement.style.top = '50px';

            // 添加效果控制
            const effectsFolder = gui.addFolder('着色器效果');

            effectsFolder.add(params, 'intensity', 0.1, 3.0).name('强度').onChange(value => {
                uniforms.intensity.value = value;
            });

            effectsFolder.add(params, 'colorScale', 0.5, 3.0).name('颜色缩放').onChange(value => {
                uniforms.colorScale.value = value;
            });

            effectsFolder.add(params, 'animationSpeed', 0.1, 2.0).name('动画速度').onChange(value => {
                uniforms.animSpeed.value = value;
            });

            effectsFolder.addColor(params, 'baseColor').name('基础颜色').onChange(value => {
                uniforms.baseColor.value.set(value);
            });

            // 纹理混合控制
            const textureFolder = gui.addFolder('纹理控制');

            textureFolder.add(params, 'useTexture').name('使用纹理').onChange(value => {
                uniforms.useTexture.value = value;
            });

            textureFolder.add(params, 'textureMix', 0, 1).name('纹理混合').onChange(value => {
                uniforms.textureMix.value = value;
            });

            effectsFolder.open();
            textureFolder.open();
        }

        // 渲染
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;
            if (model && model.render) {
                model.render(time);
            }

            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
