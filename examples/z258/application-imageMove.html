<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="图片移动 - 展示图片在3D空间中的移动效果">
    <title>图片移动 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls select, #controls input[type="range"] { width: 100%; }
        #controls button {
            width: 100%; padding: 8px; margin: 5px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer;
        }
        #controls button:hover { background: #3a8eef; }
        #controls .value { color: #4a9eff; float: right; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🖼️ 图片移动</h3>
        <div class="control-group">
            <label>移动模式</label>
            <select id="modeSelect">
                <option value="circle">圆形轨道</option>
                <option value="wave">波浪运动</option>
                <option value="spiral">螺旋上升</option>
                <option value="random">随机飘动</option>
            </select>
        </div>
        <div class="control-group">
            <label>速度 <span class="value" id="speedValue">1.0</span></label>
            <input type="range" id="speedRange" min="0.1" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>图片数量 <span class="value" id="countValue">5</span></label>
            <input type="range" id="countRange" min="1" max="10" step="1" value="5">
        </div>
        <div class="control-group">
            <label>大小 <span class="value" id="sizeValue">1.0</span></label>
            <input type="range" id="sizeRange" min="0.5" max="3" step="0.1" value="1">
        </div>
        <button id="btnReset">🔄 重置</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 创建纹理加载器
        const textureLoader = new THREE.TextureLoader();
        
        // 图片组
        const imageGroup = new THREE.Group();
        scene.add(imageGroup);

        // 配置
        const config = {
            mode: 'circle',
            speed: 1.0,
            count: 5,
            size: 1.0
        };

        // 创建图片
        function createImages() {
            // 清除旧图片
            while(imageGroup.children.length > 0) {
                const child = imageGroup.children[0];
                if (child.material.map) child.material.map.dispose();
                child.material.dispose();
                child.geometry.dispose();
                imageGroup.remove(child);
            }

            // 加载纹理并创建图片平面
            const imageUrls = [
                '../../images/textures/test.jpg',
                '../../images/textures/uv_grid_opengl.jpg',
                '../../images/textures/test.jpg',
                '../../images/textures/uv_grid_opengl.jpg',
                '../../images/textures/test.jpg',
                '../../images/textures/uv_grid_opengl.jpg',
                '../../images/textures/test.jpg',
                '../../images/textures/uv_grid_opengl.jpg',
                '../../images/textures/test.jpg',
                '../../images/textures/uv_grid_opengl.jpg'
            ];

            for (let i = 0; i < config.count; i++) {
                const texture = textureLoader.load(imageUrls[i % imageUrls.length]);
                const geometry = new THREE.PlaneGeometry(2 * config.size, 2 * config.size);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.9
                });
                const mesh = new THREE.Mesh(geometry, material);
                
                // 保存初始参数
                mesh.userData = {
                    index: i,
                    offset: (i / config.count) * Math.PI * 2,
                    randomOffset: Math.random() * Math.PI * 2
                };
                
                imageGroup.add(mesh);
            }
        }

        // 更新图片位置
        function updateImages(time) {
            const meshes = imageGroup.children;
            
            for (let i = 0; i < meshes.length; i++) {
                const mesh = meshes[i];
                const { index, offset, randomOffset } = mesh.userData;
                const t = time * config.speed + offset;
                
                switch(config.mode) {
                    case 'circle':
                        // 圆形轨道
                        const radius = 8;
                        mesh.position.x = Math.cos(t) * radius;
                        mesh.position.z = Math.sin(t) * radius;
                        mesh.position.y = 0;
                        mesh.rotation.y = -t;
                        break;
                        
                    case 'wave':
                        // 波浪运动
                        mesh.position.x = (index - config.count/2) * 3;
                        mesh.position.y = Math.sin(t + index) * 3;
                        mesh.position.z = Math.cos(t * 0.5 + index) * 2;
                        mesh.rotation.x = Math.sin(t + index) * 0.3;
                        mesh.rotation.y = t * 0.5;
                        break;
                        
                    case 'spiral':
                        // 螺旋上升
                        const spiralRadius = 5 + Math.sin(t * 0.5) * 2;
                        const height = ((t * 2 + index * 2) % 20) - 10;
                        mesh.position.x = Math.cos(t + index) * spiralRadius;
                        mesh.position.z = Math.sin(t + index) * spiralRadius;
                        mesh.position.y = height;
                        mesh.rotation.y = -t - index;
                        break;
                        
                    case 'random':
                        // 随机飘动
                        mesh.position.x = Math.sin(t * 0.7 + randomOffset) * 8;
                        mesh.position.y = Math.cos(t * 0.5 + randomOffset * 2) * 4;
                        mesh.position.z = Math.sin(t * 0.3 + randomOffset * 3) * 6;
                        mesh.rotation.x = t * 0.3 + randomOffset;
                        mesh.rotation.y = t * 0.5 + randomOffset * 2;
                        break;
                }
            }
        }

        // 初始化
        createImages();

        // 动画
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            updateImages(time);
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('modeSelect').addEventListener('change', (e) => {
            config.mode = e.target.value;
        });

        document.getElementById('speedRange').addEventListener('input', (e) => {
            config.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = config.speed.toFixed(1);
        });

        document.getElementById('countRange').addEventListener('input', (e) => {
            config.count = parseInt(e.target.value);
            document.getElementById('countValue').textContent = config.count;
            createImages();
        });

        document.getElementById('sizeRange').addEventListener('input', (e) => {
            config.size = parseFloat(e.target.value);
            document.getElementById('sizeValue').textContent = config.size.toFixed(1);
            createImages();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            clock.start();
            createImages();
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
