<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字采集成粒子 - Three.js r179</title>
    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Microsoft YaHei', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            min-width: 200px;
        }
        #controls h3 { margin-bottom: 10px; font-size: 14px; color: #4CAF50; }
        #controls input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            background: #1a1a1a;
            color: white;
            font-size: 14px;
        }
        #controls button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: none;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        #controls button:hover { background: #45a049; }
        #controls .slider-container {
            margin-bottom: 10px;
        }
        #controls label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        #controls input[type="range"] {
            width: 100%;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls">
        <h3>文字粒子化</h3>
        <input type="text" id="textInput" value="HELLO" maxlength="10">
        <button id="btnGenerate">生成粒子文字</button>
        <button id="btnExplode">爆炸散开</button>
        <button id="btnGather">聚集还原</button>
        <div class="slider-container">
            <label>粒子大小: <span id="sizeValue">3</span></label>
            <input type="range" id="particleSize" min="1" max="10" value="3">
        </div>
        <div class="slider-container">
            <label>粒子间距: <span id="gapValue">4</span></label>
            <input type="range" id="particleGap" min="2" max="10" value="4">
        </div>
        <button id="btnColor">随机颜色</button>
        <button id="btnRotate">自动旋转: 开</button>
    </div>
    <div id="info">使用 helvetiker 字体 | 输入文字生成粒子效果</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x4CAF50, 1, 100);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // 粒子系统
        let particleSystem = null;
        let particles = [];
        let targetPositions = [];
        let isExploded = false;
        let autoRotate = true;
        let particleColor = new THREE.Color(0x4CAF50);

        // 加载字体
        const loader = new FontLoader();
        let font = null;

        loader.load('../../libs/three/r179/fonts/helvetiker_regular.typeface.json', function(loadedFont) {
            font = loadedFont;
            generateTextParticles();
        });

        // 生成文字粒子
        function generateTextParticles() {
            if (!font) return;

            // 清除旧粒子
            if (particleSystem) {
                scene.remove(particleSystem);
                particleSystem.geometry.dispose();
                particleSystem.material.dispose();
            }

            const text = document.getElementById('textInput').value || 'HELLO';
            const size = 15;
            const gap = parseInt(document.getElementById('particleGap').value);

            // 创建文字几何体
            const textGeometry = new TextGeometry(text, {
                font: font,
                size: size,
                height: 1,
                curveSegments: 12,
                bevelEnabled: false
            });

            textGeometry.computeBoundingBox();
            const centerOffset = -0.5 * (textGeometry.boundingBox.max.x - textGeometry.boundingBox.min.x);
            textGeometry.translate(centerOffset, 0, 0);

            // 采样点
            const positions = [];
            const positionAttribute = textGeometry.attributes.position;
            const indexAttribute = textGeometry.index;

            // 从三角面采样点
            for (let i = 0; i < indexAttribute.count; i += 3) {
                const a = indexAttribute.getX(i);
                const b = indexAttribute.getX(i + 1);
                const c = indexAttribute.getX(i + 2);

                const vA = new THREE.Vector3().fromBufferAttribute(positionAttribute, a);
                const vB = new THREE.Vector3().fromBufferAttribute(positionAttribute, b);
                const vC = new THREE.Vector3().fromBufferAttribute(positionAttribute, c);

                // 在三角形内随机采样
                for (let j = 0; j < 3; j++) {
                    const r1 = Math.random();
                    const r2 = Math.random();
                    const sqrtR1 = Math.sqrt(r1);

                    const u = 1 - sqrtR1;
                    const v = sqrtR1 * (1 - r2);
                    const w = sqrtR1 * r2;

                    const point = new THREE.Vector3()
                        .addScaledVector(vA, u)
                        .addScaledVector(vB, v)
                        .addScaledVector(vC, w);

                    // 根据间距筛选点
                    let tooClose = false;
                    for (let p of positions) {
                        if (point.distanceTo(p) < gap) {
                            tooClose = true;
                            break;
                        }
                    }

                    if (!tooClose) {
                        positions.push(point);
                    }
                }
            }

            // 创建粒子
            const particleCount = positions.length;
            const geometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            const targetArray = new Float32Array(particleCount * 3);
            const randomArray = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const pos = positions[i];

                // 当前位置（从随机位置开始）
                posArray[i3] = (Math.random() - 0.5) * 200;
                posArray[i3 + 1] = (Math.random() - 0.5) * 200;
                posArray[i3 + 2] = (Math.random() - 0.5) * 100;

                // 目标位置（文字形状）
                targetArray[i3] = pos.x;
                targetArray[i3 + 1] = pos.y;
                targetArray[i3 + 2] = pos.z;

                // 随机爆炸位置
                randomArray[i3] = (Math.random() - 0.5) * 300;
                randomArray[i3 + 1] = (Math.random() - 0.5) * 300;
                randomArray[i3 + 2] = (Math.random() - 0.5) * 200;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetArray, 3));
            geometry.setAttribute('randomPosition', new THREE.BufferAttribute(randomArray, 3));

            // 粒子材质
            const particleSize = parseInt(document.getElementById('particleSize').value);
            const material = new THREE.PointsMaterial({
                color: particleColor,
                size: particleSize,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            // 创建圆形粒子纹理
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            material.map = new THREE.CanvasTexture(canvas);

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // 存储数据用于动画
            particles = [];
            targetPositions = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    current: new THREE.Vector3(posArray[i*3], posArray[i*3+1], posArray[i*3+2]),
                    target: new THREE.Vector3(targetArray[i*3], targetArray[i*3+1], targetArray[i*3+2]),
                    random: new THREE.Vector3(randomArray[i*3], randomArray[i*3+1], randomArray[i*3+2]),
                    velocity: new THREE.Vector3(0, 0, 0)
                });
                targetPositions.push(new THREE.Vector3(targetArray[i*3], targetArray[i*3+1], targetArray[i*3+2]));
            }

            // 聚集动画
            isExploded = true;
            gatherParticles();
        }

        // 爆炸散开
        function explodeParticles() {
            isExploded = true;
        }

        // 聚集还原
        function gatherParticles() {
            isExploded = false;
        }

        // 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 粒子动画
            if (particleSystem && particles.length > 0) {
                const positions = particleSystem.geometry.attributes.position.array;

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    const target = isExploded ? p.random : p.target;

                    // 平滑插值
                    const speed = isExploded ? 2 : 1.5;
                    p.current.x += (target.x - p.current.x) * speed * delta;
                    p.current.y += (target.y - p.current.y) * speed * delta;
                    p.current.z += (target.z - p.current.z) * speed * delta;

                    // 添加微小波动
                    if (!isExploded) {
                        p.current.y += Math.sin(time * 2 + i * 0.1) * 0.02;
                    }

                    positions[i*3] = p.current.x;
                    positions[i*3+1] = p.current.y;
                    positions[i*3+2] = p.current.z;
                }

                particleSystem.geometry.attributes.position.needsUpdate = true;

                // 自动旋转
                if (autoRotate && !isExploded) {
                    particleSystem.rotation.y = Math.sin(time * 0.5) * 0.2;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 事件监听
        document.getElementById('btnGenerate').addEventListener('click', generateTextParticles);
        document.getElementById('btnExplode').addEventListener('click', explodeParticles);
        document.getElementById('btnGather').addEventListener('click', gatherParticles);

        document.getElementById('particleSize').addEventListener('input', function() {
            document.getElementById('sizeValue').textContent = this.value;
            if (particleSystem) {
                particleSystem.material.size = parseInt(this.value);
            }
        });

        document.getElementById('particleGap').addEventListener('input', function() {
            document.getElementById('gapValue').textContent = this.value;
        });

        document.getElementById('btnColor').addEventListener('click', function() {
            particleColor.setHex(Math.random() * 0xffffff);
            if (particleSystem) {
                particleSystem.material.color = particleColor;
            }
        });

        document.getElementById('btnRotate').addEventListener('click', function() {
            autoRotate = !autoRotate;
            this.textContent = `自动旋转: ${autoRotate ? '开' : '关'}`;
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window用于截图
        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;
    </script>
</body>
</html>
