<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="几何体合并示例，将模型所有网格合并为单一几何体">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 几何体合并</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        // 创建场景
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        // 创建相机
        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000000);
        window.camera.position.set(5, 5, 5);

        // 创建渲染器
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        window.renderer.shadowMap.enabled = true;
        window.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(window.renderer.domElement);

        // 创建控制器
        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        // 添加光照
        window.scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        window.scene.add(dirLight);
        
        // 添加补光
        const fillLight = new THREE.DirectionalLight(0x8888ff, 1);
        fillLight.position.set(-10, 10, -10);
        window.scene.add(fillLight);

        // GUI 参数
        const guiParams = {
            showOriginal: false,
            showMerged: true,
            metalness: 1.0,
            roughness: 0.0,
            polygonOffset: true,
            wireframe: false,
            mergeThreshold: 0.0001
        };

        // 创建GUI
        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.add(guiParams, 'showOriginal').name('显示原始模型').onChange(updateVisibility);
        gui.add(guiParams, 'showMerged').name('显示合并模型').onChange(updateVisibility);
        gui.add(guiParams, 'metalness', 0, 1).name('金属度').onChange(updateMaterial);
        gui.add(guiParams, 'roughness', 0, 1).name('粗糙度').onChange(updateMaterial);
        gui.add(guiParams, 'polygonOffset').name('多边形偏移').onChange(updateMaterial);
        gui.add(guiParams, 'wireframe').name('线框模式').onChange(updateMaterial);
        gui.add(guiParams, 'mergeThreshold', 0, 0.01).name('合并阈值').onChange(remergeModel);

        let originalModel = null;
        let mergedModel = null;
        let loadedGltf = null;

        // 几何体合并函数
        function mergeModelGeometries(model, options = {}) {
            const { 
                material = new THREE.MeshStandardMaterial({ 
                    color: 0x666666, 
                    metalness: 0.5, 
                    roughness: 0.5,
                    polygonOffset: true, 
                    polygonOffsetFactor: 1.0, 
                    polygonOffsetUnits: 1.0
                }), 
                ignoreHidden = true,
                mergeThreshold = 1e-4
            } = options;
            
            model.updateWorldMatrix(true, true);
            
            // 收集网格
            const meshes = [];
            model.traverse(object => {
                if (object.isMesh && object.geometry && (!ignoreHidden || object.visible)) {
                    meshes.push(object);
                }
            });
            
            if (meshes.length === 0) return null;
            
            // 找出共有属性
            const commonAttribs = new Set();
            let refGeom = null;
            
            meshes.forEach(mesh => {
                const geom = mesh.geometry;
                if (!refGeom) {
                    refGeom = geom;
                    Object.keys(geom.attributes).forEach(name => commonAttribs.add(name));
                } else {
                    for (const name of [...commonAttribs]) {
                        if (!geom.attributes[name]) commonAttribs.delete(name);
                    }
                }
            });
            
            if (!commonAttribs.has('position')) commonAttribs.add('position');
            
            try {
                // 预处理几何体
                const geometries = meshes.map(mesh => {
                    const geom = mesh.geometry.clone();
                    
                    commonAttribs.forEach(name => {
                        if (!geom.attributes[name]) {
                            if (name === 'normal') {
                                geom.computeVertexNormals();
                            } else if (name !== 'position') {
                                const itemSize = refGeom.attributes[name].itemSize;
                                geom.setAttribute(name, new THREE.BufferAttribute(
                                    new Float32Array(geom.attributes.position.count * itemSize), itemSize
                                ));
                            }
                        }
                    });
                    
                    Object.keys(geom.attributes).forEach(name => {
                        if (!commonAttribs.has(name)) geom.deleteAttribute(name);
                    });
                    
                    geom.applyMatrix4(mesh.matrixWorld);
                    return geom;
                });
                
                const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries);
                
                if (mergeThreshold > 0 && mergedGeometry.mergeVertices) {
                    mergedGeometry.mergeVertices(mergeThreshold);
                }
                
                return new THREE.Mesh(mergedGeometry, material);
                
            } catch (error) {
                console.error('模型合并失败:', error);
                return null;
            }
        }

        function updateVisibility() {
            if (originalModel) originalModel.visible = guiParams.showOriginal;
            if (mergedModel) mergedModel.visible = guiParams.showMerged;
        }

        function updateMaterial() {
            if (mergedModel) {
                mergedModel.material.metalness = guiParams.metalness;
                mergedModel.material.roughness = guiParams.roughness;
                mergedModel.material.wireframe = guiParams.wireframe;
                mergedModel.material.polygonOffset = guiParams.polygonOffset;
                if (guiParams.polygonOffset) {
                    mergedModel.material.polygonOffsetFactor = 1.0;
                    mergedModel.material.polygonOffsetUnits = 1.0;
                }
            }
        }

        function remergeModel() {
            if (!loadedGltf) return;
            
            // 移除旧的合并模型
            if (mergedModel) {
                window.scene.remove(mergedModel);
                mergedModel.geometry.dispose();
                mergedModel.material.dispose();
            }
            
            // 重新合并
            mergedModel = mergeModelGeometries(loadedGltf.scene, {
                material: new THREE.MeshStandardMaterial({
                    color: 0x00aaff,
                    metalness: guiParams.metalness,
                    roughness: guiParams.roughness,
                    polygonOffset: guiParams.polygonOffset,
                    polygonOffsetFactor: 1.0,
                    polygonOffsetUnits: 1.0,
                    wireframe: guiParams.wireframe
                }),
                mergeThreshold: guiParams.mergeThreshold
            });
            
            if (mergedModel) {
                window.scene.add(mergedModel);
                updateVisibility();
                console.log('模型重新合并成功，顶点数:', mergedModel.geometry.attributes.position.count);
            }
        }

        // 加载模型
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('../../libs/three/r179/jsm/libs/draco/');
        loader.setDRACOLoader(dracoLoader);

        loader.load(
            '../../models/gltf/LittlestTokyo.glb',
            (gltf) => {
                loadedGltf = gltf;
                
                // 添加原始模型（默认隐藏）
                originalModel = gltf.scene.clone();
                originalModel.visible = false;
                window.scene.add(originalModel);
                
                // 合并模型
                remergeModel();
                
                // 调整相机视角
                const box = new THREE.Box3().setFromObject(gltf.scene);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                window.camera.near = size * 0.01;
                window.camera.far = size * 100;
                window.camera.position.set(center.x, center.y, center.z + size * 1.5);
                window.camera.lookAt(center);
                controls.target.copy(center);
                window.camera.updateProjectionMatrix();
            },
            undefined,
            (error) => {
                console.error('模型加载失败:', error);
            }
        );

        // 动画循环
        function animate() {
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }
        
        window.renderer.setAnimationLoop(animate);

        // 窗口大小调整
        window.addEventListener('resize', () => {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
