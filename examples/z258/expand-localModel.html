<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="本地模型加载演示 - 支持拖拽加载本地GLTF/GLB/OBJ/FBX模型文件。功能：拖拽上传、多格式支持、自动缩放、模型信息展示。原理：使用Three.js加载器解析模型文件，通过FileReader读取本地文件，自动计算包围盒调整相机视角。执行流程：1)拖拽文件到页面 2)识别文件格式 3)使用对应加载器解析 4)添加到场景 5)自动调整视角">
    <title>本地模型加载 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; font-size: 12px; }
        #container { width: 100vw; height: 100vh; }
        
        /* 拖拽提示 */
        #drop-zone {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 3px dashed transparent; pointer-events: none;
            z-index: 50; transition: all 0.3s;
        }
        #drop-zone.dragover {
            border-color: #4a9eff; background: rgba(74,158,255,0.1);
        }
        #drop-hint {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center;
            color: #4a9eff; opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        #drop-zone.dragover #drop-hint { opacity: 1; }
        #drop-hint h2 { font-size: 24px; margin-bottom: 10px; }
        #drop-hint p { font-size: 14px; color: #888; }
        
        /* 控制面板 */
        #controls {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 11px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 13px; }
        #controls .file-input-wrapper { margin: 8px 0; }
        #controls input[type="file"] { display: none; }
        #controls .file-label {
            display: block; padding: 8px; background: #4a9eff;
            color: white; border-radius: 4px; cursor: pointer;
            text-align: center; transition: all 0.3s; font-size: 11px;
        }
        #controls .file-label:hover { background: #3a8eef; }
        #controls .hint {
            margin-top: 8px; padding: 8px; background: rgba(255,255,255,0.1);
            border-radius: 4px; font-size: 10px; color: #aaa; line-height: 1.5;
        }
        #controls button {
            width: 100%; padding: 6px; margin: 4px 0;
            background: #6c757d; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 11px;
        }
        #controls button:hover { background: #5a6268; }
        #controls button.primary { background: #4a9eff; }
        #controls button.primary:hover { background: #3a8eef; }
        #controls button.danger { background: #ff6b6b; }
        #controls button.danger:hover { background: #ff5252; }
        
        /* 模型信息 */
        #model-info {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 180px; font-size: 11px;
        }
        #model-info h4 { color: #4a9eff; margin-bottom: 10px; font-size: 12px; }
        #model-info .stat { display: flex; justify-content: space-between; margin: 6px 0; }
        #model-info .stat-value { color: #4a9eff; }
        #model-info .filename {
            margin-top: 10px; padding: 6px; background: rgba(255,255,255,0.1);
            border-radius: 4px; font-size: 10px; word-break: break-all; color: #aaa;
        }
        
        /* 加载进度 */
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.9);
            color: white; padding: 20px 40px; border-radius: 12px;
            z-index: 200; display: none; text-align: center;
        }
        #loading.show { display: block; }
        #loading-spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #4a9eff; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 消息提示 */
        #message {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.9);
            color: white; padding: 12px 24px; border-radius: 8px;
            font-size: 12px; z-index: 200; opacity: 0; transition: opacity 0.3s;
        }
        #message.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="drop-zone">
        <div id="drop-hint">
            <h2>📁 释放以加载模型</h2>
            <p>支持 GLTF / GLB / OBJ / FBX 格式</p>
        </div>
    </div>
    
    <div id="controls">
        <h3>📦 本地模型加载</h3>
        
        <div class="file-input-wrapper">
            <input type="file" id="fileInput" accept=".gltf,.glb,.obj,.fbx">
            <label for="fileInput" class="file-label">选择模型文件</label>
        </div>
        
        <div class="hint">
            💡 支持格式：<br>
            • GLTF (.gltf/.glb)<br>
            • OBJ (.obj)<br>
            • FBX (.fbx)<br><br>
            或直接拖拽文件到页面
        </div>
        
        <button class="primary" onclick="resetCamera()">🎥 重置视角</button>
        <button class="danger" onclick="clearScene()">🗑️ 清除模型</button>
    </div>
    
    <div id="model-info">
        <h4>📊 模型信息</h4>
        <div class="stat"><span>顶点数:</span><span class="stat-value" id="vert-count">-</span></div>
        <div class="stat"><span>面数:</span><span class="stat-value" id="face-count">-</span></div>
        <div class="stat"><span>材质数:</span><span class="stat-value" id="mat-count">-</span></div>
        <div class="stat"><span>网格数:</span><span class="stat-value" id="mesh-count">-</span></div>
        <div class="filename" id="filename">未加载</div>
    </div>
    
    <div id="loading">
        <div id="loading-spinner"></div>
        <div>加载中...</div>
    </div>
    
    <div id="message"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
        backLight.position.set(-10, 10, -10);
        scene.add(backLight);

        // 地面网格
        const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 模型组
        let currentModel = null;

        // 加载器
        const gltfLoader = new GLTFLoader();
        const objLoader = new OBJLoader();
        const fbxLoader = new FBXLoader();

        // 显示加载中
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        // 显示消息
        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.borderLeft = isError ? '4px solid #ff6b6b' : '4px solid #4a9eff';
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // 更新模型信息
        function updateModelInfo(object, filename) {
            let vertices = 0, faces = 0, materials = new Set(), meshes = 0;
            
            object.traverse((child) => {
                if (child.isMesh) {
                    meshes++;
                    const geo = child.geometry;
                    if (geo.attributes.position) vertices += geo.attributes.position.count;
                    if (geo.index) faces += geo.index.count / 3;
                    else if (geo.attributes.position) faces += geo.attributes.position.count / 3;
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => materials.add(m.uuid));
                        } else {
                            materials.add(child.material.uuid);
                        }
                    }
                }
            });

            document.getElementById('vert-count').textContent = vertices.toLocaleString();
            document.getElementById('face-count').textContent = Math.round(faces).toLocaleString();
            document.getElementById('mat-count').textContent = materials.size;
            document.getElementById('mesh-count').textContent = meshes;
            document.getElementById('filename').textContent = filename;
        }

        // 自动调整视角
        function fitCameraToObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            const fov = camera.fov * (Math.PI / 180);
            const cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2;
            
            camera.position.set(center.x + cameraZ, center.y + cameraZ * 0.5, center.z + cameraZ);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        // 加载模型
        async function loadModel(file) {
            if (!file) return;
            
            const ext = file.name.split('.').pop().toLowerCase();
            const url = URL.createObjectURL(file);
            
            showLoading(true);
            
            try {
                // 清除旧模型
                if (currentModel) {
                    scene.remove(currentModel);
                    currentModel.traverse((child) => {
                        if (child.isMesh) {
                            child.geometry.dispose();
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }

                let object;
                
                switch(ext) {
                    case 'gltf':
                    case 'glb':
                        const gltf = await new Promise((resolve, reject) => {
                            gltfLoader.load(url, resolve, undefined, reject);
                        });
                        object = gltf.scene;
                        break;
                        
                    case 'obj':
                        object = await new Promise((resolve, reject) => {
                            objLoader.load(url, resolve, undefined, reject);
                        });
                        break;
                        
                    case 'fbx':
                        object = await new Promise((resolve, reject) => {
                            fbxLoader.load(url, resolve, undefined, reject);
                        });
                        break;
                        
                    default:
                        throw new Error('不支持的文件格式: ' + ext);
                }
                
                currentModel = object;
                scene.add(object);
                
                updateModelInfo(object, file.name);
                fitCameraToObject(object);
                
                showMessage('模型加载成功！');
                
            } catch (error) {
                console.error(error);
                showMessage('加载失败: ' + error.message, true);
            } finally {
                showLoading(false);
                URL.revokeObjectURL(url);
            }
        }

        // 文件选择
        document.getElementById('fileInput').addEventListener('change', (e) => {
            loadModel(e.target.files[0]);
        });

        // 拖拽功能
        const dropZone = document.getElementById('drop-zone');
        const container = document.getElementById('container');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            container.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            container.addEventListener(eventName, () => {
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            container.addEventListener(eventName, () => {
                dropZone.classList.remove('dragover');
            }, false);
        });

        container.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                loadModel(files[0]);
            }
        });

        // 重置视角
        window.resetCamera = function() {
            if (currentModel) {
                fitCameraToObject(currentModel);
            } else {
                camera.position.set(10, 10, 20);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        };

        // 清除场景
        window.clearScene = function() {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry.dispose();
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
                currentModel = null;
            }
            
            document.getElementById('vert-count').textContent = '-';
            document.getElementById('face-count').textContent = '-';
            document.getElementById('mat-count').textContent = '-';
            document.getElementById('mesh-count').textContent = '-';
            document.getElementById('filename').textContent = '未加载';
            
            showMessage('场景已清除');
        };

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到 window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
    </script>

    <!-- 截图支持脚本 -->
    <script>
        let _screenshotRenderer;
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) _screenshotRenderer = window.renderer;
                    if (!_screenshotRenderer) throw new Error('渲染器未初始化');
                    if (window.scene && window.camera) _screenshotRenderer.render(window.scene, window.camera);
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: tempCanvas.toDataURL('image/jpeg', quality) }, '*');
                } catch (error) {
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
