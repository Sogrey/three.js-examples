<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="分级地图演示 - 基于中国GeoJSON数据的3D分级统计地图。功能：34个省级行政区3D展示、分级着色、点击下钻、数据可视化。原理：加载GeoJSON解析多边形坐标，使用ExtrudeGeometry创建3D区域，根据数据值分级着色，点击区域加载市级GeoJSON下钻。执行流程：1)加载全国GeoJSON 2)解析坐标并创建3D区域 3)根据数值分级着色 4)点击区域下钻到市级 5)显示区域标签和统计信息">
    <title>分级地图 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; font-size: 12px; }
        #container { width: 100vw; height: 100vh; }
        
        /* 控制面板 */
        #controls {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 220px; font-size: 11px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 13px; }
        #controls .section { margin: 10px 0; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 6px; }
        #controls .section h4 { color: #4a9eff; margin-bottom: 8px; font-size: 11px; }
        #controls button {
            width: 100%; padding: 6px; margin: 4px 0;
            background: #4a9eff; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 11px;
        }
        #controls button:hover { background: #3a8eef; }
        #controls button.active { background: #6bcf7f; }
        #controls button.secondary { background: #6c757d; }
        #controls button.secondary:hover { background: #5a6268; }
        #controls .hint {
            margin-top: 8px; padding: 6px; background: rgba(255,255,255,0.1);
            border-radius: 4px; font-size: 10px; color: #aaa;
        }
        
        /* 图例 */
        #legend {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 140px; font-size: 10px;
        }
        #legend h4 { color: #4a9eff; margin-bottom: 10px; font-size: 11px; }
        .legend-item { display: flex; align-items: center; margin: 6px 0; }
        .legend-color { width: 20px; height: 14px; margin-right: 8px; border-radius: 2px; }
        .legend-label { flex: 1; }
        
        /* 区域信息 */
        #region-info {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 12px; border-radius: 8px; z-index: 100;
            width: 200px; font-size: 11px;
        }
        #region-info h4 { color: #4a9eff; margin-bottom: 10px; font-size: 12px; }
        #region-info .stat { display: flex; justify-content: space-between; margin: 6px 0; }
        #region-info .stat-value { color: #4a9eff; }
        #region-info .bar-container {
            height: 8px; background: rgba(255,255,255,0.2);
            border-radius: 4px; margin-top: 8px; overflow: hidden;
        }
        #region-info .bar-fill {
            height: 100%; background: #4a9eff; border-radius: 4px;
            transition: width 0.3s;
        }
        
        /* 加载提示 */
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.9);
            color: white; padding: 20px 40px; border-radius: 12px;
            z-index: 200; text-align: center;
        }
        #loading-spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #4a9eff; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 返回按钮 */
        #back-btn {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%); background: #4a9eff;
            color: white; padding: 8px 20px; border-radius: 20px;
            cursor: pointer; z-index: 100; display: none;
            font-size: 12px; border: none;
        }
        #back-btn:hover { background: #3a8eef; }
        #back-btn.show { display: block; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <button id="back-btn" onclick="goBack()">← 返回全国</button>
    
    <div id="loading">
        <div id="loading-spinner"></div>
        <div>加载地图数据...</div>
    </div>
    
    <div id="controls">
        <h3>🗺️ 分级地图</h3>
        
        <div class="section">
            <h4>数据指标</h4>
            <button id="btn-population" class="active">人口分布</button>
            <button id="btn-gdp">GDP产值</button>
            <button id="btn-temperature">平均气温</button>
        </div>
        
        <div class="section">
            <h4>操作</h4>
            <button class="secondary" onclick="randomizeData()">🎲 随机数据</button>
            <button class="secondary" onclick="resetView()">🎥 重置视角</button>
        </div>
        
        <div class="hint">
            💡 点击省份可下钻查看市级地图
        </div>
    </div>
    
    <div id="legend">
        <h4>📊 数值分级</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #d73027;"></div>
            <span class="legend-label">极高 (>80)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #fc8d59;"></div>
            <span class="legend-label">高 (60-80)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #fee090;"></div>
            <span class="legend-label">中 (40-60)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #e0f3f8;"></div>
            <span class="legend-label">低 (20-40)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #91bfdb;"></div>
            <span class="legend-label">极低 (<20)</span>
        </div>
    </div>
    
    <div id="region-info">
        <h4>📍 区域信息</h4>
        <div class="stat"><span>名称:</span><span class="stat-value" id="region-name">-</span></div>
        <div class="stat"><span>数值:</span><span class="stat-value" id="region-value">-</span></div>
        <div class="stat"><span>排名:</span><span class="stat-value" id="region-rank">-</span></div>
        <div class="bar-container">
            <div class="bar-fill" id="region-bar" style="width: 0%;"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 80, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.2;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // 参数
        const PARAMS = { DEPTH: 8, coordsMaxCounts: 500 };
        let currentGroup = null;
        let regionData = new Map();
        let currentLevel = 'country'; // country, province
        let currentProvince = null;

        // 坐标转换
        function coordToVector(coord) {
            const [lng, lat] = coord;
            const x = lng * 20037508.34 / 180 / 10000;
            let y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) / (Math.PI / 180);
            y = y * 20037508.34 / 180 / 10000;
            return new THREE.Vector2(x, y);
        }

        // 获取颜色
        function getColor(value) {
            if (value > 80) return 0xd73027;
            if (value > 60) return 0xfc8d59;
            if (value > 40) return 0xfee090;
            if (value > 20) return 0xe0f3f8;
            return 0x91bfdb;
        }

        // 生成随机数据
        function generateData(features) {
            features.forEach(f => {
                const adcode = f.properties.adcode;
                const value = Math.floor(Math.random() * 90) + 10;
                regionData.set(adcode, {
                    name: f.properties.name,
                    value: value,
                    adcode: adcode
                });
            });
        }

        // 创建区域
        function createRegionMesh(feature) {
            const info = regionData.get(feature.properties.adcode);
            const color = info ? getColor(info.value) : 0x91bfdb;
            
            const group = new THREE.Group();
            group.userData = { feature: feature, info: info };

            // 材质
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.5,
                metalness: 0.3
            });

            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3
            });

            // 处理多边形
            const processPolygon = (coordinates) => {
                // 坐标点数量限制
                let coords = coordinates;
                while (coords.length > PARAMS.coordsMaxCounts) {
                    coords = coords.filter((_, i) => i % 2 === 0);
                }

                // 创建形状
                const shape = new THREE.Shape();
                const points = coords.map(c => coordToVector(c));
                
                if (points.length < 3) return;

                shape.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    shape.lineTo(points[i].x, points[i].y);
                }
                shape.closePath();

                // 挤出几何体
                const geometry = new THREE.ExtrudeGeometry(shape, {
                    depth: PARAMS.DEPTH,
                    bevelEnabled: true,
                    bevelThickness: 0.3,
                    bevelSize: 0.3,
                    bevelSegments: 2
                });

                const mesh = new THREE.Mesh(geometry, material.clone());
                mesh.userData = { parent: group };
                group.add(mesh);

                // 边框线
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeo, lineMaterial.clone());
                line.position.z = PARAMS.DEPTH + 0.1;
                group.add(line);
            };

            // 根据类型处理
            if (feature.geometry.type === 'MultiPolygon') {
                feature.geometry.coordinates.forEach(polygon => {
                    polygon.forEach(ring => processPolygon(ring));
                });
            } else if (feature.geometry.type === 'Polygon') {
                feature.geometry.coordinates.forEach(ring => processPolygon(ring));
            }

            // 创建标签
            const center = feature.properties.centroid || feature.properties.center;
            if (center) {
                const pos = coordToVector(center);
                createLabel(group, feature.properties.name, pos.x, pos.y, PARAMS.DEPTH + 2);
            }

            return group;
        }

        // 创建标签
        function createLabel(parent, text, x, y, z) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 32;
            
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 128, 32);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 16);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(x, y, z);
            sprite.scale.set(6, 1.5, 1);
            parent.add(sprite);
            parent.userData.label = sprite;
        }

        // 加载地图
        async function loadMap(adcode = null) {
            document.getElementById('loading').style.display = 'block';
            
            try {
                // 清除当前地图
                if (currentGroup) {
                    scene.remove(currentGroup);
                    currentGroup.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }

                const url = adcode 
                    ? `../../models/geojson/china/${adcode}.json`
                    : '../../models/geojson/china/china.json';
                
                const response = await fetch(url);
                const geoJson = await response.json();

                // 生成数据
                if (!adcode) {
                    generateData(geoJson.features);
                }

                // 创建地图组
                currentGroup = new THREE.Group();
                
                geoJson.features.forEach(feature => {
                    const mesh = createRegionMesh(feature);
                    if (mesh) currentGroup.add(mesh);
                });

                // 居中
                const box = new THREE.Box3().setFromObject(currentGroup);
                const center = box.getCenter(new THREE.Vector3());
                currentGroup.position.sub(center);
                currentGroup.rotation.x = -Math.PI / 2;

                scene.add(currentGroup);

                // 更新UI
                currentLevel = adcode ? 'province' : 'country';
                currentProvince = adcode;
                document.getElementById('back-btn').classList.toggle('show', !!adcode);

            } catch (error) {
                console.error('加载地图失败:', error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 返回
        window.goBack = function() {
            loadMap();
        };

        // 随机数据
        window.randomizeData = function() {
            regionData.clear();
            loadMap(currentProvince);
        };

        // 重置视角
        window.resetView = function() {
            camera.position.set(0, 80, 120);
            controls.target.set(0, 0, 0);
            controls.update();
        };

        // 事件监听
        document.getElementById('btn-population').addEventListener('click', () => {
            updateActiveButton('btn-population');
        });
        document.getElementById('btn-gdp').addEventListener('click', () => {
            updateActiveButton('btn-gdp');
        });
        document.getElementById('btn-temperature').addEventListener('click', () => {
            updateActiveButton('btn-temperature');
        });

        function updateActiveButton(id) {
            ['btn-population', 'btn-gdp', 'btn-temperature'].forEach(btnId => {
                document.getElementById(btnId).classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
            randomizeData();
        }

        // 鼠标交互
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredMesh = null;

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const meshes = [];
            currentGroup?.traverse(child => {
                if (child.isMesh && child.userData.parent) meshes.push(child);
            });

            const intersects = raycaster.intersectObjects(meshes);

            // 恢复之前高亮
            if (hoveredMesh && (!intersects.length || intersects[0].object !== hoveredMesh)) {
                hoveredMesh.material.emissive.setHex(0x000000);
                hoveredMesh = null;
                document.getElementById('region-name').textContent = '-';
                document.getElementById('region-value').textContent = '-';
                document.getElementById('region-rank').textContent = '-';
                document.getElementById('region-bar').style.width = '0%';
            }

            // 高亮新区域
            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                const group = mesh.userData.parent;
                const info = group.userData.info;
                
                if (info) {
                    hoveredMesh = mesh;
                    mesh.material.emissive.setHex(0x333333);
                    
                    const sorted = Array.from(regionData.values()).sort((a, b) => b.value - a.value);
                    const rank = sorted.findIndex(r => r.adcode === info.adcode) + 1;
                    
                    document.getElementById('region-name').textContent = info.name;
                    document.getElementById('region-value').textContent = info.value;
                    document.getElementById('region-rank').textContent = rank + '/' + regionData.size;
                    document.getElementById('region-bar').style.width = info.value + '%';
                }
            }
        });

        // 点击下钻
        window.addEventListener('click', (e) => {
            if (currentLevel !== 'country') return;
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const meshes = [];
            currentGroup?.traverse(child => {
                if (child.isMesh && child.userData.parent) meshes.push(child);
            });

            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const group = intersects[0].object.userData.parent;
                const feature = group.userData.feature;
                if (feature.properties.childrenNum > 0) {
                    loadMap(feature.properties.adcode);
                }
            }
        });

        // 动画
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 加载全国地图
        loadMap();

        // 暴露
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
    </script>

    <!-- 截图支持 -->
    <script>
        let _screenshotRenderer;
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer) _screenshotRenderer = window.renderer;
                    if (window.scene && window.camera) _screenshotRenderer.render(window.scene, window.camera);
                    const canvas = _screenshotRenderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
