<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="残影效果，展示运动残影和拖尾效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 残影效果</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #000;
            margin: 0;
            overflow: hidden;
        }
        #afterimageUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #afterimageUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #afterimageUI .control {
            margin: 10px 0;
        }
        #afterimageUI label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #afterimageUI input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #afterimageUI .value {
            font-size: 10px;
            color: #00ff00;
            text-align: right;
        }
        #afterimageUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #afterimageUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #afterimageUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #afterimageUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="afterimageUI">
        <h3>👻 残影效果</h3>
        <div class="control">
            <label>残影强度</label>
            <input type="range" id="afterimageStrength" min="0" max="0.95" value="0.85" step="0.05">
            <div class="value" id="strengthValue">0.85</div>
        </div>
        <div class="control">
            <label>运动速度</label>
            <input type="range" id="motionSpeed" min="0.5" max="3" value="1" step="0.1">
            <div class="value" id="speedValue">1.0</div>
        </div>
        <div class="control">
            <label>物体数量</label>
            <input type="range" id="objectCount" min="1" max="10" value="5" step="1">
            <div class="value" id="countValue">5</div>
        </div>
        <button class="btn active" id="btnAfterimageOn">残影开启</button>
        <button class="btn" id="btnAfterimageOff">残影关闭</button>
        <button class="btn" id="btnTrail">拖尾模式</button>
        <button class="btn" id="btnChaos">混乱模式</button>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            调整参数查看残影效果
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);
        
        const pointLight1 = new THREE.PointLight(0xff0088, 1, 20);
        pointLight1.position.set(-5, 3, -5);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x0088ff, 1, 20);
        pointLight2.position.set(5, 3, 5);
        scene.add(pointLight2);
        
        // 创建运动物体
        const objects = [];
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xff8800, 0x8800ff, 0x88ff00, 0x0088ff];
        const geometries = [
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.ConeGeometry(0.4, 0.8, 16),
            new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16),
            new THREE.TorusGeometry(0.4, 0.15, 8, 16)
        ];
        
        function createObject(index) {
            const geometry = geometries[index % geometries.length];
            const material = new THREE.MeshStandardMaterial({
                color: colors[index % colors.length],
                emissive: colors[index % colors.length],
                emissiveIntensity: 0.5,
                roughness: 0.3,
                metalness: 0.7
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 1, 0);
            scene.add(mesh);
            return {
                mesh: mesh,
                baseIndex: index,
                angle: (index / 5) * Math.PI * 2,
                radius: 2 + index * 0.5,
                speed: 1 + index * 0.2,
                yOffset: index * 0.5,
                verticalSpeed: 2 + index * 0.5
            };
        }
        
        let activeObjectCount = 5;
        for (let i = 0; i < 10; i++) {
            objects.push(createObject(i));
            if (i >= activeObjectCount) {
                objects[i].mesh.visible = false;
            }
        }
        
        // 地面网格
        const gridHelper = new THREE.GridHelper(20, 20, 0x333333, 0x111111);
        scene.add(gridHelper);
        
        // 后期处理
        const renderScene = new RenderPass(scene, camera);
        
        const afterimagePass = new AfterimagePass(0.85);
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(afterimagePass);
        
        // 动画变量
        let time = 0;
        let motionSpeed = 1;
        let afterimageEnabled = true;
        let trailMode = false;
        let chaosMode = false;
        
        // UI控制
        const afterimageStrengthSlider = document.getElementById('afterimageStrength');
        const strengthValueDisplay = document.getElementById('strengthValue');
        const motionSpeedSlider = document.getElementById('motionSpeed');
        const speedValueDisplay = document.getElementById('speedValue');
        const objectCountSlider = document.getElementById('objectCount');
        const countValueDisplay = document.getElementById('countValue');
        
        afterimageStrengthSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            strengthValueDisplay.textContent = value.toFixed(2);
            afterimagePass.uniforms.damp.value = value;
        });
        
        motionSpeedSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            speedValueDisplay.textContent = value.toFixed(1);
            motionSpeed = value;
        });
        
        objectCountSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            countValueDisplay.textContent = value;
            activeObjectCount = value;
            objects.forEach((obj, i) => {
                obj.mesh.visible = i < activeObjectCount;
            });
        });
        
        document.getElementById('btnAfterimageOn').addEventListener('click', () => {
            afterimageEnabled = true;
            afterimagePass.enabled = true;
            document.getElementById('btnAfterimageOn').classList.add('active');
            document.getElementById('btnAfterimageOff').classList.remove('active');
        });
        
        document.getElementById('btnAfterimageOff').addEventListener('click', () => {
            afterimageEnabled = false;
            afterimagePass.enabled = false;
            document.getElementById('btnAfterimageOff').classList.add('active');
            document.getElementById('btnAfterimageOn').classList.remove('active');
        });
        
        document.getElementById('btnTrail').addEventListener('click', () => {
            trailMode = !trailMode;
            chaosMode = false;
            document.getElementById('btnTrail').classList.toggle('active');
            document.getElementById('btnChaos').classList.remove('active');
        });
        
        document.getElementById('btnChaos').addEventListener('click', () => {
            chaosMode = !chaosMode;
            trailMode = false;
            document.getElementById('btnChaos').classList.toggle('active');
            document.getElementById('btnTrail').classList.remove('active');
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01 * motionSpeed;
            
            // 更新物体位置
            objects.forEach((obj, i) => {
                if (!obj.mesh.visible) return;
                
                if (chaosMode) {
                    // 混乱模式 - 随机运动
                    obj.angle += obj.speed * 0.02 * motionSpeed;
                    obj.mesh.position.x = Math.cos(obj.angle) * obj.radius + Math.sin(time * 3 + i) * 2;
                    obj.mesh.position.z = Math.sin(obj.angle) * obj.radius + Math.cos(time * 2 + i) * 2;
                    obj.mesh.position.y = 1 + Math.abs(Math.sin(time * obj.verticalSpeed + i)) * 3;
                } else if (trailMode) {
                    // 拖尾模式 - 直线快速运动
                    const trailX = (time * obj.speed * 3) % 20 - 10;
                    obj.mesh.position.x = trailX;
                    obj.mesh.position.z = Math.sin(obj.angle) * 3;
                    obj.mesh.position.y = 1 + obj.yOffset;
                } else {
                    // 正常模式 - 圆周运动
                    obj.angle += obj.speed * 0.01 * motionSpeed;
                    obj.mesh.position.x = Math.cos(obj.angle) * obj.radius;
                    obj.mesh.position.z = Math.sin(obj.angle) * obj.radius;
                    obj.mesh.position.y = 1 + Math.sin(time * obj.verticalSpeed + i) * 1.5;
                }
                
                // 旋转物体
                obj.mesh.rotation.x += 0.02 * motionSpeed;
                obj.mesh.rotation.y += 0.03 * motionSpeed;
            });
            
            controls.update();
            
            if (afterimageEnabled) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
