<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="模型加载动画示例，展示加载进度和动画效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 加载动画</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a1a;
            margin: 0;
            overflow: hidden;
        }
        #loadingUI {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
            transition: opacity 0.5s;
        }
        #loadingUI.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingUI .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 136, 0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loadingUI .text {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 18px;
        }
        #loadingUI .progress {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 15px auto;
            overflow: hidden;
        }
        #loadingUI .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            border-radius: 3px;
            transition: width 0.3s;
            width: 0%;
        }
        #loadingUI .progress-text {
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        #animateUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #animateUI h3 {
            margin: 0 0 10px 0;
            color: #00ff88;
            font-size: 16px;
        }
        #animateUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #animateUI .btn:hover {
            background: #444;
            border-color: #00ff88;
        }
        #animateUI .btn.active {
            background: #00ff88;
            color: #000;
        }
        #animateUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="loadingUI">
        <div class="spinner"></div>
        <div class="text">加载模型中...</div>
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>
    </div>
    
    <div id="animateUI">
        <h3>🎬 加载动画</h3>
        <button class="btn active" id="btnPlay">播放动画</button>
        <button class="btn" id="btnPause">暂停动画</button>
        <button class="btn" id="btnReset">重置视角</button>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            展示加载进度和模型动画
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('threeContainer');
        const loadingUI = document.getElementById('loadingUI');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // 网格辅助
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 加载管理器
        const manager = new THREE.LoadingManager();
        
        manager.onStart = function(url, itemsLoaded, itemsTotal) {
            console.log('开始加载:', url);
        };
        
        manager.onProgress = function(url, itemsLoaded, itemsTotal) {
            const progress = (itemsLoaded / itemsTotal * 100).toFixed(0);
            progressBar.style.width = progress + '%';
            progressText.textContent = progress + '%';
        };
        
        manager.onLoad = function() {
            console.log('所有资源加载完成');
        };
        
        manager.onError = function(url) {
            console.error('加载失败:', url);
        };
        
        // 加载模型
        let model;
        let mixer;
        const loader = new GLTFLoader(manager);
        
        loader.load(
            '../../models/gltf/Xbot.glb',
            (gltf) => {
                model = gltf.scene;
                
                // 启用阴影
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                model.position.set(0, 0, 0);
                model.scale.set(0.02, 0.02, 0.02);
                scene.add(model);
                
                // 创建动画混合器
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
                
                // 隐藏加载界面
                setTimeout(() => {
                    loadingUI.classList.add('hidden');
                }, 500);
            },
            (xhr) => {
                // 进度回调
                if (xhr.lengthComputable) {
                    const progress = (xhr.loaded / xhr.total * 100).toFixed(0);
                    progressBar.style.width = progress + '%';
                    progressText.textContent = progress + '%';
                }
            },
            (error) => {
                console.error('模型加载失败:', error);
                progressText.textContent = '加载失败';
            }
        );
        
        // UI控制
        const btnPlay = document.getElementById('btnPlay');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        
        btnPlay.addEventListener('click', function() {
            if (mixer) {
                mixer.timeScale = 1;
            }
            btnPlay.classList.add('active');
            btnPause.classList.remove('active');
        });
        
        btnPause.addEventListener('click', function() {
            if (mixer) {
                mixer.timeScale = 0;
            }
            btnPause.classList.add('active');
            btnPlay.classList.remove('active');
        });
        
        btnReset.addEventListener('click', () => {
            camera.position.set(5, 3, 5);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            if (mixer) {
                mixer.update(delta);
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
