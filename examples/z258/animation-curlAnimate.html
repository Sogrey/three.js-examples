<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="卷曲动画 - 展示钢带卷绕效果的物理动画"
    />
    <meta name="three-version" content="r179" />
    <title>Three.js 示例 - 卷曲动画</title>
    <link rel="stylesheet" href="../../css/example-common.css" />
  </head>
  <body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../libs/three/r179/build/three.module.js",
          "three/addons/": "../../libs/three/r179/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GUI } from "three/addons/libs/lil-gui.module.min.js";

      const container = document.getElementById("threeContainer");

      window.scene = new THREE.Scene();
      window.scene.background = new THREE.Color(0x1a1a2e);

      window.camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      window.camera.position.set(0, 12, 20);

      window.renderer = new THREE.WebGLRenderer({ antialias: true });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(window.renderer.domElement);

      const controls = new OrbitControls(
        window.camera,
        window.renderer.domElement,
      );
      controls.enableDamping = true;

      window.scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(5, 10, 5);
      dirLight.castShadow = true;
      window.scene.add(dirLight);
      window.scene.add(
        new THREE.DirectionalLight(0x4488ff, 0.5).position.set(-5, 5, -5),
      );

      const stripMat = new THREE.MeshStandardMaterial({
        color: "white",
        metalness: 0.7,
        roughness: 0.15,
        side: THREE.DoubleSide,
      });

      const params = {
        speed: 1.0,
        stripWidth: 4,
        thickness: 0.15,
        coreRadius: 1.5,
        maxTurns: 8,
        feedLength: 12,
        playing: true,
        reset() {
          totalAngle = 0;
        },
      };

      let totalAngle = 0;
      let stripMesh = null;

      function buildStripGeometry(
        angle,
        coreRadius,
        stripThickness,
        width,
        feedLen,
      ) {
        const segsPerRad = 10;
        const coilSegs = Math.max(Math.floor(angle * segsPerRad), 1);
        const feedSegs = 20;
        const totalSegs = feedSegs + coilSegs;
        const halfW = width / 2;
        const halfT = stripThickness / 2;

        const positions = [];
        const indices = [];

        const radiusAt = (a) => coreRadius + (a / (Math.PI * 2)) * stripThickness;

        for (let i = 0; i <= totalSegs; i++) {
          let cx, cy, nx, ny;

          if (i < feedSegs) {
            const t = 1 - i / feedSegs;
            cx = radiusAt(angle) + t * feedLen;
            cy = 0;
            nx = 0;
            ny = 1;
          } else {
            const t = (i - feedSegs) / coilSegs;
            const a = angle * (1 - t);
            const r = radiusAt(a);
            const theta = -(angle - a);
            cx = Math.cos(theta) * r;
            cy = Math.sin(theta) * r;
            nx = Math.cos(theta);
            ny = Math.sin(theta);
          }

          positions.push(cx + nx * halfT, cy + ny * halfT, halfW);
          positions.push(cx + nx * halfT, cy + ny * halfT, -halfW);
          positions.push(cx - nx * halfT, cy - ny * halfT, halfW);
          positions.push(cx - nx * halfT, cy - ny * halfT, -halfW);
        }

        for (let i = 0; i < totalSegs; i++) {
          const base = i * 4;
          const next = base + 4;
          indices.push(base, next, base + 1, base + 1, next, next + 1);
          indices.push(base + 2, base + 3, next + 2, base + 3, next + 3, next + 2);
          indices.push(base, base + 2, next, next, base + 2, next + 2);
          indices.push(base + 1, next + 1, base + 3, base + 3, next + 1, next + 3);
        }

        indices.push(0, 1, 2, 1, 3, 2);
        const last = totalSegs * 4;
        indices.push(last, last + 2, last + 1, last + 1, last + 2, last + 3);

        const geo = new THREE.BufferGeometry();
        geo.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(positions, 3),
        );
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      const coreMat = new THREE.MeshStandardMaterial({
        color: 0x444444,
        metalness: 0.9,
        roughness: 0.2,
      });
      const core = new THREE.Mesh(
        new THREE.CylinderGeometry(
          params.coreRadius,
          params.coreRadius,
          params.stripWidth + 0.2,
          32,
        ),
        coreMat,
      );
      core.rotation.x = Math.PI / 2;
      window.scene.add(core);

      const rollerMat = new THREE.MeshStandardMaterial({
        color: 0x666666,
        metalness: 0.7,
        roughness: 0.4,
      });
      const roller = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.3, params.stripWidth + 1, 16),
        rollerMat,
      );
      roller.rotation.x = Math.PI / 2;
      roller.position.set(params.coreRadius + params.feedLength * 0.5, -0.5, 0);
      window.scene.add(roller);

      function updateStrip() {
        if (stripMesh) {
          window.scene.remove(stripMesh);
          stripMesh.geometry.dispose();
        }

        const remainFeed =
          params.feedLength *
          Math.max(1 - totalAngle / (params.maxTurns * Math.PI * 2), 0);

        const geo = buildStripGeometry(
          totalAngle,
          params.coreRadius,
          params.thickness,
          params.stripWidth,
          remainFeed,
        );

        stripMesh = new THREE.Mesh(geo, stripMat);
        stripMesh.castShadow = true;
        stripMesh.receiveShadow = true;
        window.scene.add(stripMesh);
      }

      const gui = new GUI();
      gui.domElement.style.marginTop = "50px";
      gui.add(params, "speed", 0.1, 5).name("速度");
      gui
        .add(params, "coreRadius", 0.5, 4)
        .name("卷芯半径")
        .onChange((v) => {
          core.geometry.dispose();
          core.geometry = new THREE.CylinderGeometry(
            v,
            v,
            params.stripWidth + 0.2,
            32,
          );
        });
      gui.add(params, "thickness", 0.05, 0.5).name("钢带厚度");
      gui.add(params, "maxTurns", 2, 20, 1).name("最大圈数");
      gui
        .add(params, "stripWidth", 1, 8)
        .name("钢带宽度")
        .onChange((v) => {
          core.geometry.dispose();
          core.geometry = new THREE.CylinderGeometry(
            params.coreRadius,
            params.coreRadius,
            v + 0.2,
            32,
          );
        });
      gui.add(params, "playing").name("播放");
      gui.add(params, "reset").name("重置");

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        const maxAngle = params.maxTurns * Math.PI * 2;
        if (params.playing && totalAngle < maxAngle) {
          totalAngle += delta * params.speed * 2;
          totalAngle = Math.min(totalAngle, maxAngle);
          updateStrip();
        }

        core.rotation.y = -totalAngle;

        window.renderer.render(window.scene, window.camera);
      }
      animate();

      window.addEventListener("resize", () => {
        window.camera.aspect = window.innerWidth / window.innerHeight;
        window.camera.updateProjectionMatrix();
        window.renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "take-screenshot") {
          try {
            if (window.scene && window.camera) {
              window.renderer.render(window.scene, window.camera);
            }
            const quality = event.data.quality || 0.8;
            const canvas = window.renderer.domElement;
            const tempCanvas = document.createElement("canvas");
            const maxSize = 600;
            const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
            tempCanvas.width = Math.floor(canvas.width * scale);
            tempCanvas.height = Math.floor(canvas.height * scale);
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            const dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
            window.parent.postMessage(
              { type: "screenshot-data", dataUrl: dataUrl },
              "*",
            );
          } catch (error) {
            console.error("截图失败:", error);
            window.parent.postMessage(
              { type: "screenshot-error", error: error.message },
              "*",
            );
          }
        }
      });
    </script>
  </body>
</html>
