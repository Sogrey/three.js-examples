<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="地理边界可视化，展示中国边界线效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 地理边界</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #050510;
            margin: 0;
            overflow: hidden;
        }
        #geoUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #geoUI h3 {
            margin: 0 0 10px 0;
            color: #00ffff;
            font-size: 16px;
        }
        #geoUI .control {
            margin: 10px 0;
        }
        #geoUI label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #geoUI input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }
        #geoUI .value {
            font-size: 10px;
            color: #00ffff;
            text-align: right;
        }
        #geoUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #geoUI .btn:hover {
            background: #444;
            border-color: #00ffff;
        }
        #geoUI .btn.active {
            background: #00ffff;
            color: #000;
        }
        #geoUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #geoUI .stats {
            font-size: 10px;
            color: #00ffff;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #333;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    <div id="loading">加载地理数据...</div>
    
    <div id="geoUI">
        <h3>🗺️ 地理边界</h3>
        <div class="control">
            <label>边界颜色</label>
            <input type="color" id="borderColor" value="#00ffff" style="width: 100%; height: 30px; border: none; border-radius: 4px; cursor: pointer;">
        </div>
        <div class="control">
            <label>线条粗细</label>
            <input type="range" id="lineWidth" min="0.5" max="3" value="1" step="0.1">
            <div class="value" id="lineWidthValue">1.0</div>
        </div>
        <div class="control">
            <label>发光强度</label>
            <input type="range" id="glowIntensity" min="0" max="2" value="0.5" step="0.1">
            <div class="value" id="glowValue">0.5</div>
        </div>
        <div class="control">
            <label>流动速度</label>
            <input type="range" id="flowSpeed" min="0" max="2" value="0.5" step="0.1">
            <div class="value" id="flowValue">0.5</div>
        </div>
        <div class="control">
            <label>垂直高度</label>
            <input type="range" id="heightOffset" min="0" max="5" value="0" step="0.5">
            <div class="value" id="heightValue">0.0</div>
        </div>
        <button class="btn active" id="btnAnimate">动画开启</button>
        <button class="btn" id="btnReset">重置视角</button>
        <div class="stats" id="stats">加载中...</div>
        <div class="info">
            左键拖拽旋转视角<br>
            滚轮缩放<br>
            展示中国地理边界线
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        const loadingDiv = document.getElementById('loading');
        const statsDiv = document.getElementById('stats');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.Fog(0x050510, 100, 500);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 80, 120);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(100, 200, 100);
        scene.add(directionalLight);
        
        // 网格辅助
        const gridHelper = new THREE.GridHelper(200, 20, 0x222222, 0x111111);
        scene.add(gridHelper);
        
        // 边界组
        const borderGroup = new THREE.Group();
        scene.add(borderGroup);
        
        // 材质
        let borderMaterial;
        let isAnimating = true;
        let flowSpeed = 0.5;
        
        function createBorderMaterial(color) {
            return new THREE.MeshPhongMaterial({
                color: new THREE.Color(color),
                emissive: new THREE.Color(color),
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });
        }
        
        // 坐标转换函数
        function coordToVector3(coord, scale = 10000) {
            const [lng, lat] = coord;
            // Web Mercator投影
            const x = lng * 20037508.34 / 180;
            const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) / (Math.PI / 180) * 20037508.34 / 180;
            return new THREE.Vector3(x / scale, y / scale, 0);
        }
        
        // 创建边界线
        function createShapeWithCoord(group, coordinates, minPoints = 100) {
            if (coordinates.length < minPoints) return;
            
            const points = coordinates.map(k => coordToVector3(k));
            
            // 创建平滑曲线
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeometry = new THREE.TubeGeometry(curve, points.length - 1, 0.3, 8, false);
            
            const mesh = new THREE.Mesh(tubeGeometry, borderMaterial);
            
            // 居中几何体
            mesh.geometry.center();
            
            group.add(mesh);
        }
        
        // 设置组中心点
        function translationOriginForGroup(group) {
            const boundingBox = new THREE.Box3().setFromObject(group);
            boundingBox.getCenter(group.position);
            
            group.traverse((child) => {
                if (child.isMesh) {
                    child.position.sub(group.position);
                }
            });
            
            group.position.set(0, 0, 0);
        }
        
        // 加载地理数据
        async function loadGeoData() {
            try {
                const response = await fetch('../../json/chinaBound.json');
                const data = await response.json();
                
                borderMaterial = createBorderMaterial('#00ffff');
                
                const { features } = data;
                let borderCount = 0;
                
                features.forEach((feature) => {
                    const { geometry } = feature;
                    
                    if (geometry.type === 'MultiPolygon') {
                        geometry.coordinates.forEach((polygon) => {
                            polygon.forEach((ring) => {
                                createShapeWithCoord(borderGroup, ring);
                                borderCount++;
                            });
                        });
                    } else if (geometry.type === 'Polygon') {
                        geometry.coordinates.forEach((ring) => {
                            createShapeWithCoord(borderGroup, ring);
                            borderCount++;
                        });
                    } else if (geometry.type === 'LineString' && geometry.coordinates.length > 1) {
                        createShapeWithCoord(borderGroup, geometry.coordinates);
                        borderCount++;
                    }
                });
                
                translationOriginForGroup(borderGroup);
                
                loadingDiv.style.display = 'none';
                statsDiv.textContent = `边界线段: ${borderCount}`;
                
            } catch (error) {
                console.error('加载地理数据失败:', error);
                loadingDiv.textContent = '加载失败';
                statsDiv.textContent = '加载失败';
            }
        }
        
        loadGeoData();
        
        // UI控制
        const colorPicker = document.getElementById('borderColor');
        const lineWidthSlider = document.getElementById('lineWidth');
        const lineWidthValue = document.getElementById('lineWidthValue');
        const glowSlider = document.getElementById('glowIntensity');
        const glowValue = document.getElementById('glowValue');
        const flowSlider = document.getElementById('flowSpeed');
        const flowValue = document.getElementById('flowValue');
        const heightSlider = document.getElementById('heightOffset');
        const heightValue = document.getElementById('heightValue');
        const btnAnimate = document.getElementById('btnAnimate');
        const btnReset = document.getElementById('btnReset');
        
        colorPicker.addEventListener('input', (e) => {
            const color = new THREE.Color(e.target.value);
            borderMaterial.color = color;
            borderMaterial.emissive = color;
        });
        
        lineWidthSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            lineWidthValue.textContent = value.toFixed(1);
            borderGroup.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    // 重新创建几何体以改变粗细
                    // 注意：TubeGeometry的半径在创建时确定，这里简化处理
                    child.scale.setScalar(value);
                }
            });
        });
        
        glowSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            glowValue.textContent = value.toFixed(1);
            borderMaterial.emissiveIntensity = value;
        });
        
        flowSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            flowValue.textContent = value.toFixed(1);
            flowSpeed = value;
        });
        
        heightSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            heightValue.textContent = value.toFixed(1);
            borderGroup.position.y = value;
        });
        
        btnAnimate.addEventListener('click', () => {
            isAnimating = !isAnimating;
            btnAnimate.classList.toggle('active');
            btnAnimate.textContent = isAnimating ? '动画开启' : '动画暂停';
        });
        
        btnReset.addEventListener('click', () => {
            camera.position.set(0, 80, 120);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            if (isAnimating && borderGroup) {
                time += 0.01 * flowSpeed;
                
                // 边界线发光脉冲效果
                const pulse = 0.5 + Math.sin(time * 2) * 0.3;
                borderMaterial.emissiveIntensity = parseFloat(glowSlider.value) * (0.7 + pulse * 0.3);
                
                // 缓慢旋转
                borderGroup.rotation.y = Math.sin(time * 0.1) * 0.1;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
