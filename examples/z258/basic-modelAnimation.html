<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型动画 - Model Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a2e;
        }
        #threeContainer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.179.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.179.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import Stats from 'three/addons/libs/stats.module.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // Scene setup
        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0xa0a0a0);
        window.scene.fog = new THREE.Fog(0xa0a0a0, 10, 50);

        // Camera
        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100);
        window.camera.position.set(1, 2, -3);
        window.camera.lookAt(0, 1, 0);

        // Renderer
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        window.renderer.shadowMap.enabled = true;
        container.appendChild(window.renderer.domElement);

        // Alias for local use
        const scene = window.scene;
        const camera = window.camera;
        const renderer = window.renderer;

        // Stats
        const stats = new Stats();
        stats.dom.style.position = 'absolute';
        stats.dom.style.left = '30px';
        stats.dom.style.top = '0px';
        container.appendChild(stats.dom);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 3;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 2;

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8d8d8d, 3);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(-3, 10, -10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 2;
        dirLight.shadow.camera.bottom = -2;
        dirLight.shadow.camera.left = -2;
        dirLight.shadow.camera.right = 2;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 40;
        scene.add(dirLight);

        // Ground
        const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshPhongMaterial({ color: 0xcbcbcb, depthWrite: false })
        );
        mesh.rotation.x = -Math.PI / 2;
        mesh.receiveShadow = true;
        scene.add(mesh);

        // Animation variables
        let model, skeleton, mixer;
        const clock = new THREE.Clock();
        const cameraTarget = new THREE.Vector3();

        let idleAction, walkAction, runAction;
        let idleWeight, walkWeight, runWeight;
        let actions, settings;

        let singleStepMode = false;
        let sizeOfNextStep = 0;

        const crossFadeControls = [];

        // Load GLTF model
        const loader = new GLTFLoader();
        loader.load(
            '../../models/gltf/Soldier.glb',
            function (gltf) {
                model = gltf.scene;
                scene.add(model);

                model.traverse(function (object) {
                    if (object.isMesh) object.castShadow = true;
                });

                // Skeleton helper
                skeleton = new THREE.SkeletonHelper(model);
                skeleton.visible = false;
                scene.add(skeleton);

                // Create GUI panel
                createPanel();

                // Setup animations
                const animations = gltf.animations;
                mixer = new THREE.AnimationMixer(model);

                idleAction = mixer.clipAction(animations[0]);
                walkAction = mixer.clipAction(animations[3]);
                runAction = mixer.clipAction(animations[1]);

                actions = [idleAction, walkAction, runAction];

                activateAllActions();
            },
            undefined,
            function (error) {
                console.error('Error loading model:', error);
            }
        );

        function createPanel() {
            const panel = new GUI({ width: 310 });
            
            panel.domElement.style.top = '50px';

            const folder1 = panel.addFolder('可见性控制');
            const folder2 = panel.addFolder('动画激活/停用');
            const folder3 = panel.addFolder('暂停/步进');
            const folder4 = panel.addFolder('动画过渡');
            const folder5 = panel.addFolder('混合权重');
            const folder6 = panel.addFolder('全局速度');

            settings = {
                'show model': true,
                'show skeleton': false,
                'deactivate all': deactivateAllActions,
                'activate all': activateAllActions,
                'pause/continue': pauseContinue,
                'make single step': toSingleStepMode,
                'modify step size': 0.05,
                'from walk to idle': function () {
                    prepareCrossFade(walkAction, idleAction, 1.0);
                },
                'from idle to walk': function () {
                    prepareCrossFade(idleAction, walkAction, 0.5);
                },
                'from walk to run': function () {
                    prepareCrossFade(walkAction, runAction, 2.5);
                },
                'from run to walk': function () {
                    prepareCrossFade(runAction, walkAction, 5.0);
                },
                'use default duration': true,
                'set custom duration': 3.5,
                'modify idle weight': 0.0,
                'modify walk weight': 1.0,
                'modify run weight': 0.0,
                'modify time scale': 1.0,
            };

            folder1.add(settings, 'show model').name('显示模型').onChange(showModel);
            folder1.add(settings, 'show skeleton').name('显示骨骼').onChange(showSkeleton);
            folder2.add(settings, 'deactivate all').name('停用所有');
            folder2.add(settings, 'activate all').name('激活所有');
            folder3.add(settings, 'pause/continue').name('暂停/继续');
            folder3.add(settings, 'make single step').name('单步执行');
            folder3.add(settings, 'modify step size', 0.01, 0.1, 0.001).name('步长修改');
            crossFadeControls.push(
                folder4.add(settings, 'from walk to idle').name('从行走到待机')
            );
            crossFadeControls.push(
                folder4.add(settings, 'from idle to walk').name('从待机到行走')
            );
            crossFadeControls.push(
                folder4.add(settings, 'from walk to run').name('从行走到跑步')
            );
            crossFadeControls.push(
                folder4.add(settings, 'from run to walk').name('从跑步到行走')
            );
            folder4.add(settings, 'use default duration').name('使用默认时长');
            folder4.add(settings, 'set custom duration', 0, 10, 0.01).name('自定义时长');
            folder5
                .add(settings, 'modify idle weight', 0.0, 1.0, 0.01)
                .name('待机权重')
                .listen()
                .onChange(function (weight) {
                    setWeight(idleAction, weight);
                });
            folder5
                .add(settings, 'modify walk weight', 0.0, 1.0, 0.01)
                .name('行走权重')
                .listen()
                .onChange(function (weight) {
                    setWeight(walkAction, weight);
                });
            folder5
                .add(settings, 'modify run weight', 0.0, 1.0, 0.01)
                .name('跑步权重')
                .listen()
                .onChange(function (weight) {
                    setWeight(runAction, weight);
                });
            folder6
                .add(settings, 'modify time scale', 0.0, 1.5, 0.01)
                .name('时间缩放')
                .onChange(modifyTimeScale);

            folder1.open();
            folder2.open();
            folder3.open();
            folder4.open();
            folder5.open();
            folder6.open();
        }

        function showModel(visibility) {
            model.visible = visibility;
        }

        function showSkeleton(visibility) {
            skeleton.visible = visibility;
        }

        function modifyTimeScale(speed) {
            mixer.timeScale = speed;
        }

        function deactivateAllActions() {
            actions.forEach(function (action) {
                action.stop();
            });
        }

        function activateAllActions() {
            setWeight(idleAction, settings['modify idle weight']);
            setWeight(walkAction, settings['modify walk weight']);
            setWeight(runAction, settings['modify run weight']);

            actions.forEach(function (action) {
                action.play();
            });
        }

        function pauseContinue() {
            if (singleStepMode) {
                singleStepMode = false;
                unPauseAllActions();
            } else {
                if (idleAction.paused) {
                    unPauseAllActions();
                } else {
                    pauseAllActions();
                }
            }
        }

        function pauseAllActions() {
            actions.forEach(function (action) {
                action.paused = true;
            });
        }

        function unPauseAllActions() {
            actions.forEach(function (action) {
                action.paused = false;
            });
        }

        function toSingleStepMode() {
            unPauseAllActions();
            singleStepMode = true;
            sizeOfNextStep = settings['modify step size'];
        }

        function prepareCrossFade(startAction, endAction, defaultDuration) {
            const duration = setCrossFadeDuration(defaultDuration);
            singleStepMode = false;
            unPauseAllActions();

            if (startAction === idleAction) {
                executeCrossFade(startAction, endAction, duration);
            } else {
                synchronizeCrossFade(startAction, endAction, duration);
            }
        }

        function setCrossFadeDuration(defaultDuration) {
            if (settings['use default duration']) {
                return defaultDuration;
            } else {
                return settings['set custom duration'];
            }
        }

        function synchronizeCrossFade(startAction, endAction, duration) {
            mixer.addEventListener('loop', onLoopFinished);

            function onLoopFinished(event) {
                if (event.action === startAction) {
                    mixer.removeEventListener('loop', onLoopFinished);
                    executeCrossFade(startAction, endAction, duration);
                }
            }
        }

        function executeCrossFade(startAction, endAction, duration) {
            setWeight(endAction, 1);
            endAction.time = 0;
            startAction.crossFadeTo(endAction, duration, true);
        }

        function setWeight(action, weight) {
            action.enabled = true;
            action.setEffectiveTimeScale(1);
            action.setEffectiveWeight(weight);
        }

        function updateWeightSliders() {
            settings['modify idle weight'] = idleWeight;
            settings['modify walk weight'] = walkWeight;
            settings['modify run weight'] = runWeight;
        }

        function updateCrossFadeControls() {
            if (idleWeight === 1 && walkWeight === 0 && runWeight === 0) {
                crossFadeControls[0].disable();
                crossFadeControls[1].enable();
                crossFadeControls[2].disable();
                crossFadeControls[3].disable();
            } else if (idleWeight === 0 && walkWeight === 1 && runWeight === 0) {
                crossFadeControls[0].enable();
                crossFadeControls[1].disable();
                crossFadeControls[2].enable();
                crossFadeControls[3].disable();
            } else if (idleWeight === 0 && walkWeight === 0 && runWeight === 1) {
                crossFadeControls[0].disable();
                crossFadeControls[1].disable();
                crossFadeControls[2].disable();
                crossFadeControls[3].enable();
            } else {
                crossFadeControls.forEach(control => control.enable());
            }
        }

        // Window resize
        window.addEventListener('resize', onWindowResize);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Screenshot support - listen for message from parent
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    // Render the scene to ensure it's up to date
                    renderer.render(scene, camera);
                    
                    // Get the canvas data URL
                    const dataUrl = renderer.domElement.toDataURL('image/jpeg', event.data.quality || 0.8);
                    
                    // Send the screenshot data back to parent
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('Screenshot failed:', error);
                }
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (mixer && model) {
                idleWeight = idleAction.getEffectiveWeight();
                walkWeight = walkAction.getEffectiveWeight();
                runWeight = runAction.getEffectiveWeight();

                updateWeightSliders();
                updateCrossFadeControls();

                let mixerUpdateDelta = clock.getDelta();

                if (singleStepMode) {
                    mixerUpdateDelta = sizeOfNextStep;
                    sizeOfNextStep = 0;
                }

                mixer.update(mixerUpdateDelta);

                cameraTarget.copy(model.position);
                cameraTarget.y += 1;
                controls.target.copy(cameraTarget);
            }

            controls.update();
            renderer.render(scene, camera);
            stats.update();
        }

        animate();
    </script>
</body>
</html>
