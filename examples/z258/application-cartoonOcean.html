<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="卡通海面 - 使用自定义着色器实现卡通风格波浪效果">
    <title>卡通海面 - Three.js r179</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        #container { width: 100vw; height: 100vh; }
        
        #controls {
            position: absolute; top: 50px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 100;
            width: 200px; font-size: 12px;
        }
        #controls h3 { color: #4a9eff; margin-bottom: 10px; font-size: 14px; }
        #controls .control-group { margin: 10px 0; }
        #controls label { display: block; margin-bottom: 5px; color: #aaa; }
        #controls input[type="range"] { width: 100%; }
        #controls .value { color: #4a9eff; float: right; }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="controls">
        <h3>🌊 卡通海面</h3>
        <div class="control-group">
            <label>波浪速度 <span class="value" id="speedValue">1.0</span></label>
            <input type="range" id="speedRange" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>波浪高度 <span class="value" id="heightValue">1.5</span></label>
            <input type="range" id="heightRange" min="0.5" max="3" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <label>泡沫密度 <span class="value" id="foamValue">0.5</span></label>
            <input type="range" id="foamRange" min="0" max="1" step="0.1" value="0.5">
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Sky } from 'three/addons/objects/Sky.js';

        const container = document.getElementById('container');

        // 场景
        const scene = new THREE.Scene();

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(30, 10, 30);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        // 天空
        const sky = new Sky();
        sky.scale.setScalar(10000);
        scene.add(sky);
        
        const skyUniforms = sky.material.uniforms;
        skyUniforms['turbidity'].value = 10;
        skyUniforms['rayleigh'].value = 2;
        skyUniforms['mieCoefficient'].value = 0.005;
        skyUniforms['mieDirectionalG'].value = 0.8;
        
        const sun = new THREE.Vector3();
        const phi = THREE.MathUtils.degToRad(90 - 2);
        const theta = THREE.MathUtils.degToRad(180);
        sun.setFromSphericalCoords(1, phi, theta);
        skyUniforms['sunPosition'].value.copy(sun);

        // 灯光
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.copy(sun).multiplyScalar(100);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 0.5));

        // 卡通海面着色器
        const vertexShader = `
            varying vec2 vUv;
            varying float vHeight;
            uniform float time;
            uniform float waveHeight;
            
            vec3 moveWave(vec3 p) {
                float k = 0.03;
                float h = 0.0;
                
                // 波浪1
                float angle1 = 50.0 * time + -1.0 * p.x * k + -2.0 * p.z * k;
                h += waveHeight * sin(angle1);
                
                // 波浪2
                float angle2 = 25.0 * time + -3.0 * p.x * k + -1.0 * p.z * k;
                h += waveHeight * 0.5 * sin(angle2);
                
                // 波浪3 - 细节
                float angle3 = 100.0 * time + 2.0 * p.x * k + 1.0 * p.z * k;
                h += waveHeight * 0.2 * sin(angle3);
                
                return vec3(p.x, h, p.z);
            }
            
            void main() {
                vUv = uv;
                vec3 newPos = moveWave(position);
                vHeight = newPos.y;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec2 vUv;
            varying float vHeight;
            uniform float time;
            uniform float foamDensity;
            
            #define WATER_COL vec3(0.0, 0.45, 0.73)
            #define WATER2_COL vec3(0.0, 0.42, 0.68)
            #define FOAM_COL vec3(0.81, 0.96, 0.96)
            
            // 噪声函数
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }
            
            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }
            
            void main() {
                // 基础水色
                vec3 color = mix(WATER_COL, WATER2_COL, vHeight * 0.5 + 0.5);
                
                // 泡沫效果
                float foam = noise(vUv * 20.0 + time * 0.5);
                foam += noise(vUv * 40.0 - time * 0.3) * 0.5;
                foam = smoothstep(1.0 - foamDensity * 0.3, 1.0, foam);
                
                // 波浪高光
                float highlight = smoothstep(0.5, 1.0, vHeight * 0.5 + 0.5);
                color = mix(color, FOAM_COL, foam * 0.5 + highlight * 0.3);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // 海面
        const grid = 200;
        const oceanGeometry = new THREE.PlaneGeometry(grid, grid, 100, 100);
        oceanGeometry.rotateX(-Math.PI / 2);
        
        const oceanMaterial = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                time: { value: 0 },
                waveHeight: { value: 1.5 },
                foamDensity: { value: 0.5 }
            }
        });
        
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        scene.add(ocean);

        // 漂浮的小船（简化版）
        const boatGroup = new THREE.Group();
        
        // 船体
        const hullGeometry = new THREE.BoxGeometry(4, 1, 2);
        const hullMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const hull = new THREE.Mesh(hullGeometry, hullMaterial);
        boatGroup.add(hull);
        
        // 船帆
        const sailGeometry = new THREE.BufferGeometry();
        const sailVertices = new Float32Array([
            0, 0.5, 0,
            0, 4, 0,
            2, 0.5, 0,
            0, 4, 0,
            2, 4, 0,
            2, 0.5, 0
        ]);
        sailGeometry.setAttribute('position', new THREE.BufferAttribute(sailVertices, 3));
        sailGeometry.computeVertexNormals();
        const sailMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xFFFFFF, 
            side: THREE.DoubleSide 
        });
        const sail = new THREE.Mesh(sailGeometry, sailMaterial);
        sail.position.set(0, 0.5, 0);
        boatGroup.add(sail);
        
        scene.add(boatGroup);

        // 动画
        const clock = new THREE.Clock();
        
        function getWaveHeight(x, z, time) {
            const k = 0.03;
            let h = 0;
            h += 1.5 * Math.sin(50 * time + -1 * x * k + -2 * z * k);
            h += 0.75 * Math.sin(25 * time + -3 * x * k + -1 * z * k);
            h += 0.3 * Math.sin(100 * time + 2 * x * k + 1 * z * k);
            return h;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            oceanMaterial.uniforms.time.value = time;
            
            // 更新小船位置
            const boatX = 0;
            const boatZ = 0;
            const boatY = getWaveHeight(boatX, boatZ, time);
            boatGroup.position.set(boatX, boatY, boatZ);
            
            // 计算小船倾斜
            const delta = 0.5;
            const h1 = getWaveHeight(boatX - delta, boatZ, time);
            const h2 = getWaveHeight(boatX + delta, boatZ, time);
            const h3 = getWaveHeight(boatX, boatZ - delta, time);
            const h4 = getWaveHeight(boatX, boatZ + delta, time);
            
            boatGroup.rotation.z = Math.atan2(h2 - h1, delta * 2) * 0.5;
            boatGroup.rotation.x = Math.atan2(h4 - h3, delta * 2) * 0.5;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 暴露到window
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;

        // 控制面板事件
        document.getElementById('speedRange').addEventListener('input', (e) => {
            const speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = speed.toFixed(1);
            clock.multiplier = speed;
        });

        document.getElementById('heightRange').addEventListener('input', (e) => {
            const height = parseFloat(e.target.value);
            document.getElementById('heightValue').textContent = height.toFixed(1);
            oceanMaterial.uniforms.waveHeight.value = height;
        });

        document.getElementById('foamRange').addEventListener('input', (e) => {
            const foam = parseFloat(e.target.value);
            document.getElementById('foamValue').textContent = foam.toFixed(1);
            oceanMaterial.uniforms.foamDensity.value = foam;
        });
    </script>

    <!-- 截图支持 -->
    <script>
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const canvas = window.renderer.domElement;
                    const temp = document.createElement('canvas');
                    const scale = Math.min(600 / canvas.width, 600 / canvas.height);
                    temp.width = canvas.width * scale;
                    temp.height = canvas.height * scale;
                    temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: temp.toDataURL('image/jpeg', e.data.quality || 0.8) }, '*');
                } catch (err) {
                    window.parent.postMessage({ type: 'screenshot-error', error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
