<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="管道流动效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 管道流动</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/",
            "gsap": "../../libs/gsap/index.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import gsap from 'gsap';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 30000);
        window.camera.position.set(0, 2000, 5000);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.target.set(1500, 1500, 0);
        controls.update();

        const ambientLight = new THREE.AmbientLight(0xffffff, 5);
        window.scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 4);
        directionalLight1.position.set(0, 10000, 20000);
        window.scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 8);
        directionalLight2.position.set(0, 10000, -20000);
        window.scene.add(directionalLight2);

        window.scene.add(new THREE.AxesHelper(500));

        function createFlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 256, 0);
            gradient.addColorStop(0, 'rgba(0, 150, 255, 0.3)');
            gradient.addColorStop(0.3, 'rgba(0, 200, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(100, 255, 255, 1)');
            gradient.addColorStop(0.7, 'rgba(0, 200, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 150, 255, 0.3)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const flowTexture = createFlowTexture();

        class DemoPipe extends THREE.Mesh {
            constructor(name, options) {
                const defaultOptions = {
                    radius: 70,
                    color: 0x777777,
                    radiusSegments: 16,
                    tubularSegments: 100,
                    curve: new THREE.CatmullRomCurve3(),
                };
                const finalOptions = Object.assign({}, defaultOptions, options);
                
                flowTexture.repeat.set(finalOptions.curve.getLength() / 1000, 1);
                
                const mat = new THREE.MeshPhongMaterial({
                    color: finalOptions.color,
                    transparent: true,
                    side: THREE.DoubleSide,
                    specular: finalOptions.color,
                    shininess: 15,
                });
                
                const geo = new THREE.TubeGeometry(
                    finalOptions.curve, 
                    finalOptions.tubularSegments, 
                    finalOptions.radius, 
                    finalOptions.radiusSegments
                );
                
                super(geo, mat);
                this.name = name;
                this.flowTexture = flowTexture;
                
                this.flowAnimation = gsap.to(this.flowTexture.offset, {
                    x: -3,
                    duration: 1,
                    ease: "none",
                    repeat: -1,
                    paused: true
                });
            }
            
            startFlow() {
                const mat = this.material;
                mat.map = this.flowTexture;
                this.flowAnimation.resume();
            }
            
            stopFlow() {
                this.flowAnimation.pause();
                const mat = this.material;
                mat.map = null;
            }
        }

        const p1 = new THREE.Vector3(0, 0, 0);
        const p2 = new THREE.Vector3(0, 1400, 0);
        const p3 = new THREE.Vector3(50, 1450, 0);
        const p4 = new THREE.Vector3(100, 1500, 0);
        const p5 = new THREE.Vector3(3000, 1500, 0);

        const line1 = new THREE.LineCurve3(p1, p2);
        const curve1 = new THREE.CatmullRomCurve3([p2, p3, p4]);
        const line2 = new THREE.LineCurve3(p4, p5);

        const curvePath = new THREE.CurvePath();
        curvePath.curves.push(line1, curve1, line2);

        const pipe = new DemoPipe("管道1", {
            radius: 60,
            color: 0x777777,
            tubularSegments: 200,
            radiusSegments: 16,
            curve: curvePath,
        });
        window.scene.add(pipe);

        const gui = {
            startFlow: () => pipe.startFlow(),
            stopFlow: () => pipe.stopFlow()
        };

        const guiContainer = document.createElement('div');
        guiContainer.style.position = 'absolute';
        guiContainer.style.top = '20px';
        guiContainer.style.left = '20px';
        guiContainer.style.zIndex = '100';
        
        const startBtn = document.createElement('button');
        startBtn.textContent = '开始流动';
        startBtn.style.padding = '8px 16px';
        startBtn.style.marginRight = '10px';
        startBtn.style.backgroundColor = '#0077ff';
        startBtn.style.color = 'white';
        startBtn.style.border = 'none';
        startBtn.style.borderRadius = '4px';
        startBtn.style.cursor = 'pointer';
        startBtn.addEventListener('click', gui.startFlow);
        
        const stopBtn = document.createElement('button');
        stopBtn.textContent = '停止流动';
        stopBtn.style.padding = '8px 16px';
        stopBtn.style.backgroundColor = '#ff6666';
        stopBtn.style.color = 'white';
        stopBtn.style.border = 'none';
        stopBtn.style.borderRadius = '4px';
        stopBtn.style.cursor = 'pointer';
        stopBtn.addEventListener('click', gui.stopFlow);
        
        guiContainer.appendChild(startBtn);
        guiContainer.appendChild(stopBtn);
        document.body.appendChild(guiContainer);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        animate();

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
