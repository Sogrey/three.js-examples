<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js Logo - 展示three.js标志的3D渲染效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - Three.js Logo</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 10);

        window.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);
        controls.enableDamping = true;

        window.addEventListener('resize', onWindowResize);

        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vNormal;

            void main() {
                vUv = uv;
                vPosition = position;
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float time;
            uniform vec3 color1;
            uniform vec3 color2;
            uniform vec3 color3;

            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vNormal;

            void main() {
                float noise = sin(vPosition.x * 2.0 + time) * 0.25 +
                             cos(vPosition.y * 2.0 + time * 0.5) * 0.25 +
                             sin(vPosition.z * 2.0 + time * 0.8) * 0.5;

                float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.0);

                vec3 baseColor = mix(color1, color2, noise + 0.5);
                vec3 glowColor = mix(baseColor, color3, fresnel);

                float pulse = (sin(time * 2.0) + 1.0) * 0.15 + 0.85;

                gl_FragColor = vec4(glowColor * pulse, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color1: { value: new THREE.Color(0xdbb8ff) },
                color2: { value: new THREE.Color(0x98d0fb) },
                color3: { value: new THREE.Color(0xfdebbf) }
            },
            vertexShader,
            fragmentShader,
            side: THREE.DoubleSide,
            transparent: true
        });

        const gui = new GUI();
        gui.domElement.style.top = '50px';
        gui.addColor(material.uniforms.color1, 'value').name('Color 1');
        gui.addColor(material.uniforms.color2, 'value').name('Color 2');
        gui.addColor(material.uniforms.color3, 'value').name('Color 3');

        const geometry = createThreeJSLogoGeometry();
        const mesh = new THREE.Mesh(geometry, material);
        window.scene.add(mesh);

        function createThreeJSLogoGeometry() {
            const v = new THREE.Vector2(0, 1);
            const c = new THREE.Vector2();
            const s = 0.85;

            const tri = [
                v.clone().multiplyScalar(s).add(new THREE.Vector2(0, -0.25)),
                v.clone().rotateAround(c, (-Math.PI * 2) / 3).multiplyScalar(s).add(new THREE.Vector2(0, -0.25)),
                v.clone().rotateAround(c, (Math.PI * 2) / 3).multiplyScalar(s).add(new THREE.Vector2(0, -0.25))
            ];

            const triFlip = [
                v.clone().rotateAround(c, Math.PI).multiplyScalar(s).sub(new THREE.Vector2(0, -0.25)),
                v.clone().rotateAround(c, Math.PI / 3).multiplyScalar(s).sub(new THREE.Vector2(0, -0.25)),
                v.clone().rotateAround(c, -Math.PI / 3).multiplyScalar(s).sub(new THREE.Vector2(0, -0.25))
            ];

            const holes = [];
            const hA = 3 / Math.sqrt(3) * 0.5;

            for (let row = 0; row < 4; row++) {
                const items = 1 + row * 2;
                const h = 1.5 * (1.5 - row);
                const w = -((items - 1) / 2) * hA;

                for (let i = 0; i < items; i++) {
                    const offsetX = w + hA * i;
                    const offsetY = h;
                    const points = (i % 2 === 0 ? tri : triFlip).map(p => {
                        const pt = p.clone();
                        pt.x += offsetX;
                        pt.y += offsetY;
                        return pt;
                    });
                    holes.push(new THREE.Path(points));
                }
            }

            const contour = [
                v.clone().multiplyScalar(4.1).add(new THREE.Vector2(0, -1)),
                v.clone().rotateAround(c, (Math.PI * 2) / 3).multiplyScalar(4.1).add(new THREE.Vector2(0, -1)),
                v.clone().rotateAround(c, (-Math.PI * 2) / 3).multiplyScalar(4.1).add(new THREE.Vector2(0, -1))
            ];

            const shape = new THREE.Shape(contour);
            shape.holes = holes;

            const geometry = new THREE.ExtrudeGeometry(shape, {
                depth: 0.1,
                bevelEnabled: false
            });

            geometry.rotateZ(Math.PI * 0.25);
            geometry.center();

            return geometry;
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        function animate() {
            material.uniforms.time.value += 0.01;
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
