<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="发散飞线效果2">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 发散飞线2</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import Stats from 'three/addons/libs/stats.module.js';

        class InitFly {
            constructor({ texture } = {}) {
                this.flyId = 0;
                this.flyArr = [];
                this.baicSpeed = 1;
                this.texture = 0.0;
                if (texture && !texture.isTexture) {
                    this.texture = new THREE.TextureLoader().load(texture);
                } else {
                    this.texture = texture;
                }
                this.flyShader = {
                    vertexshader: `
                        uniform float size;
                        uniform float time;
                        uniform float u_len;
                        attribute float u_index;
                        varying float u_opacitys;
                        void main() {
                            if( u_index < time + u_len && u_index > time){
                                float u_scale = 1.0 - (time + u_len - u_index) /u_len;
                                u_opacitys = u_scale;
                                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                                gl_Position = projectionMatrix * mvPosition;
                                gl_PointSize = size * u_scale * 300.0 / (-mvPosition.z);
                            }
                        }
                        `,
                    fragmentshader: `
                        uniform sampler2D u_map;
                        uniform float u_opacity;
                        uniform vec3 color;
                        uniform float isTexture;
                        varying float u_opacitys;
                        void main() {
                            vec4 u_color = vec4(color,u_opacity * u_opacitys);
                            if( isTexture != 0.0 ){
                                gl_FragColor = u_color * texture2D(u_map, vec2(gl_PointCoord.x, 1.0 - gl_PointCoord.y));
                            }else{
                                gl_FragColor = u_color;
                            }
                        }`
                };
            }

            addFly({
                color = "rgba(255,255,255,1)",
                curve = [],
                width = 1,
                length = 10,
                speed = 1,
                repeat = 1,
                texture = null,
                callback
            } = {}) {
                let colorArr = this.getColorArr(color);
                let geometry = new THREE.BufferGeometry();
                let material = new THREE.ShaderMaterial({
                    uniforms: {
                        color: { value: colorArr[0], type: "v3" },
                        size: { value: width, type: "f" },
                        u_map: { value: texture ? texture : this.texture, type: "t2" },
                        u_len: { value: length, type: "f" },
                        u_opacity: { value: colorArr[1], type: "f" },
                        time: { value: -length, type: "f" },
                        isTexture: { value: 1.0, type: "f" }
                    },
                    transparent: true,
                    depthTest: false,
                    vertexShader: this.flyShader.vertexshader,
                    fragmentShader: this.flyShader.fragmentshader
                });

                const [position, u_index] = [[], []];
                curve.forEach((elem, index) => {
                    position.push(elem.x, elem.y, elem.z);
                    u_index.push(index);
                });

                geometry.setAttribute("position", new THREE.Float32BufferAttribute(position, 3));
                geometry.setAttribute("u_index", new THREE.Float32BufferAttribute(u_index, 1));

                let mesh = new THREE.Points(geometry, material);
                mesh.name = "fly";
                mesh._flyId = this.flyId;
                mesh._speed = speed;
                mesh._repeat = repeat;
                mesh._been = 0;
                mesh._total = curve.length;
                mesh._callback = callback;
                this.flyId++;
                this.flyArr.push(mesh);
                return mesh;
            }

            tranformPath(arr, dpi = 1) {
                const vecs = [];
                for (let i = 1; i < arr.length; i++) {
                    let src = arr[i - 1];
                    let dst = arr[i];
                    let s = new THREE.Vector3(src.x, src.y, src.z);
                    let d = new THREE.Vector3(dst.x, dst.y, dst.z);
                    let length = s.distanceTo(d) * dpi;
                    let len = parseInt(length);
                    for (let i = 0; i <= len; i++) {
                        vecs.push(s.clone().lerp(d, i / len));
                    }
                }
                return vecs;
            }

            remove(mesh) {
                mesh.material.dispose();
                mesh.geometry.dispose();
                this.flyArr = this.flyArr.filter(elem => elem._flyId != mesh._flyId);
                mesh.parent.remove(mesh);
                mesh = null;
            }

            animation(delta = 0.015) {
                if (delta > 0.2) return;
                this.flyArr.forEach(elem => {
                    if (!elem.parent) return;
                    if (elem._been > elem._repeat) {
                        elem.visible = false;
                        if (typeof elem._callback === 'function') {
                            elem._callback(elem);
                        }
                        this.remove(elem);
                    } else {
                        let uniforms = elem.material.uniforms;
                        if (uniforms.time.value < elem._total) {
                            uniforms.time.value += delta * (this.baicSpeed / delta) * elem._speed;
                        } else {
                            elem._been += 1;
                            uniforms.time.value = -uniforms.u_len.value;
                        }
                    }
                });
            }

            color(c) {
                return new THREE.Color(c);
            }

            getColorArr(str) {
                if (Array.isArray(str)) return str;
                var _arr = [];
                str = str + '';
                str = str.toLowerCase().replace(/\s/g, "");
                if (/^((?:rgba)?)\(\s*([^\)]*)/.test(str)) {
                    var arr = str.replace(/rgba\(|\)/gi, '').split(',');
                    var hex = [
                        pad2(Math.round(arr[0] * 1 || 0).toString(16)),
                        pad2(Math.round(arr[1] * 1 || 0).toString(16)),
                        pad2(Math.round(arr[2] * 1 || 0).toString(16))
                    ];
                    _arr[0] = this.color('#' + hex.join(""));
                    _arr[1] = Math.max(0, Math.min(1, (arr[3] * 1 || 0)));
                } else if ('transparent' === str) {
                    _arr[0] = this.color();
                    _arr[1] = 0;
                } else {
                    _arr[0] = this.color(str);
                    _arr[1] = 1;
                }

                function pad2(c) {
                    return c.length == 1 ? '0' + c : '' + c;
                }
                return _arr;
            }
        }

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
        window.camera.position.set(0, 400, 400);
        window.camera.lookAt(new THREE.Vector3(0, 0, 0));

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setPixelRatio(window.devicePixelRatio * 1.3);
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const stats = new Stats();
        container.appendChild(stats.dom);

        window.scene.add(new THREE.AxesHelper(500));

        const gridHelper = new THREE.GridHelper(800, 40, 0x4a4a6e, 0x3a3a5e);
        window.scene.add(gridHelper);

        let _Fly;

        _Fly = new InitFly({
            texture: '../../images/textures/flyLine1.png'
        });

        let index = 0;
        var time = setInterval(() => {
            if (index >= 200) {
                clearInterval(time);
                return;
            }
            var x = 0;
            var z = 0;
            var x1 = THREE.MathUtils.randFloat(-200, 200);
            var z1 = THREE.MathUtils.randFloat(-200, 200);
            var curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(x, 0, z),
                new THREE.Vector3((x + x1) / 2, THREE.MathUtils.randInt(200, 420), (z1 + z) / 2),
                new THREE.Vector3(x1, 0, z1)
            );
            var points = curve.getPoints(500);
            var flyMesh = _Fly.addFly({
                color: `rgba(${THREE.MathUtils.randInt(0, 255)},${THREE.MathUtils.randInt(0, 255)},${THREE.MathUtils.randInt(0, 255)},1)`,
                curve: points,
                width: 9,
                length: 150,
                speed: 1,
                repeat: Infinity
            });
            window.scene.add(flyMesh);
            index++;
        }, 50);

        function animate() {
            requestAnimationFrame(animate);
            var delta = 0.016;
            if (_Fly) {
                _Fly.animation(delta);
            }
            window.renderer.render(window.scene, window.camera);
            stats.update();
        }

        animate();

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        window.scene = window.scene;
        window.camera = window.camera;
        window.renderer = window.renderer;

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
