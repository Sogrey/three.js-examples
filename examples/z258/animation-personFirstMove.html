<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="第一人称移动控制，展示WASD移动和鼠标视角控制">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 第一人称移动</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        #moveUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #moveUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #moveUI .info {
            font-size: 11px;
            color: #aaa;
            line-height: 1.6;
        }
        #moveUI .key {
            display: inline-block;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 2px 8px;
            margin: 2px;
            font-size: 10px;
            color: #fff;
        }
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        #blocker h1 {
            color: #00ff00;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        #blocker p {
            font-size: 18px;
            margin: 10px 0;
        }
        #blocker .click-hint {
            color: #ffff00;
            font-size: 24px;
            margin-top: 30px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 4px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="crosshair"></div>
    
    <div id="moveUI">
        <h3>🎮 第一人称移动</h3>
        <div class="info">
            <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动<br>
            <span class="key">SPACE</span> 跳跃<br>
            <span class="key">SHIFT</span> 加速<br>
            <span class="key">鼠标</span> 视角控制<br>
            <span class="key">ESC</span> 释放鼠标
        </div>
    </div>
    
    <div id="stats">
        位置: <span id="posX">0</span>, <span id="posY">0</span>, <span id="posZ">0</span><br>
        速度: <span id="velocity">0</span> m/s
    </div>
    
    <div id="blocker">
        <h1>第一人称移动控制</h1>
        <p>WASD 移动 | SPACE 跳跃 | SHIFT 加速</p>
        <p>鼠标控制视角 | ESC 释放鼠标</p>
        <p class="click-hint">点击屏幕开始</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 0, 50);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 2;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        // 控制器
        const controls = new PointerLockControls(camera, document.body);
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // 地面
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222,
            roughness: 0.8
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // 网格辅助
        const gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
        scene.add(gridHelper);
        
        // 创建障碍物
        const obstacles = [];
        const obstacleGeometry = new THREE.BoxGeometry(2, 4, 2);
        const obstacleMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4444ff,
            roughness: 0.5,
            metalness: 0.3
        });
        
        // 随机生成障碍物
        for (let i = 0; i < 20; i++) {
            const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80;
            // 避免在出生点附近生成
            if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
            
            obstacle.position.set(x, 2, z);
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;
            scene.add(obstacle);
            obstacles.push(obstacle);
        }
        
        // 创建一些彩色方块作为标记
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
        for (let i = 0; i < 6; i++) {
            const markerGeometry = new THREE.BoxGeometry(1, 1, 1);
            const markerMaterial = new THREE.MeshStandardMaterial({ 
                color: colors[i],
                emissive: colors[i],
                emissiveIntensity: 0.3
            });
            const marker = new THREE.Mesh(markerGeometry, markerMaterial);
            const angle = (i / 6) * Math.PI * 2;
            marker.position.set(Math.cos(angle) * 15, 0.5, Math.sin(angle) * 15);
            marker.castShadow = true;
            scene.add(marker);
        }
        
        // 移动状态
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false,
            sprint: false
        };
        
        // 物理参数
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let speed = 10.0;
        const sprintSpeed = 20.0;
        const jumpForce = 15.0;
        const gravity = 30.0;
        let canJump = false;
        
        // 键盘事件
        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveState.forward = true; break;
                case 'ArrowLeft':
                case 'KeyA': moveState.left = true; break;
                case 'ArrowDown':
                case 'KeyS': moveState.backward = true; break;
                case 'ArrowRight':
                case 'KeyD': moveState.right = true; break;
                case 'Space': 
                    if (canJump) {
                        velocity.y += jumpForce;
                        canJump = false;
                    }
                    break;
                case 'ShiftLeft':
                case 'ShiftRight': moveState.sprint = true; break;
            }
        });
        
        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveState.forward = false; break;
                case 'ArrowLeft':
                case 'KeyA': moveState.left = false; break;
                case 'ArrowDown':
                case 'KeyS': moveState.backward = false; break;
                case 'ArrowRight':
                case 'KeyD': moveState.right = false; break;
                case 'ShiftLeft':
                case 'ShiftRight': moveState.sprint = false; break;
            }
        });
        
        // 碰撞检测
        function checkCollision(position) {
            const playerRadius = 0.5;
            for (const obstacle of obstacles) {
                const dx = Math.abs(position.x - obstacle.position.x);
                const dz = Math.abs(position.z - obstacle.position.z);
                if (dx < 1 + playerRadius && dz < 1 + playerRadius) {
                    return true;
                }
            }
            return false;
        }
        
        // UI控制
        const blocker = document.getElementById('blocker');
        
        blocker.addEventListener('click', () => {
            controls.lock();
        });
        
        controls.addEventListener('lock', () => {
            blocker.style.display = 'none';
        });
        
        controls.addEventListener('unlock', () => {
            blocker.style.display = 'flex';
        });
        
        // 更新统计信息
        function updateStats() {
            document.getElementById('posX').textContent = camera.position.x.toFixed(1);
            document.getElementById('posY').textContent = camera.position.y.toFixed(1);
            document.getElementById('posZ').textContent = camera.position.z.toFixed(1);
            const vel = Math.sqrt(velocity.x ** 2 + velocity.z ** 2);
            document.getElementById('velocity').textContent = vel.toFixed(1);
        }
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            if (controls.isLocked) {
                // 计算移动方向
                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize();
                
                // 应用速度
                const currentSpeed = moveState.sprint ? sprintSpeed : speed;
                
                if (moveState.forward || moveState.backward) {
                    velocity.z -= direction.z * currentSpeed * delta;
                }
                if (moveState.left || moveState.right) {
                    velocity.x -= direction.x * currentSpeed * delta;
                }
                
                // 应用摩擦力
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                
                // 应用重力
                velocity.y -= gravity * delta;
                
                // 计算新位置
                const newPosition = camera.position.clone();
                newPosition.x -= velocity.x * delta;
                newPosition.z -= velocity.z * delta;
                newPosition.y += velocity.y * delta;
                
                // 碰撞检测
                if (!checkCollision(newPosition)) {
                    camera.position.x = newPosition.x;
                    camera.position.z = newPosition.z;
                } else {
                    velocity.x = 0;
                    velocity.z = 0;
                }
                
                // 地面碰撞
                if (camera.position.y < 2) {
                    velocity.y = 0;
                    camera.position.y = 2;
                    canJump = true;
                }
            }
            
            updateStats();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
