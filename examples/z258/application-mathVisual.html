<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D数学函数可视化，展示各种数学函数生成的3D曲面">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D数学函数可视化</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            overflow: hidden;
        }
        #mathUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #mathUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #mathUI .btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }
        #mathUI .btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #mathUI .btn.active {
            background: #00ff00;
            color: #000;
        }
        #mathUI .formula {
            font-size: 12px;
            color: #ffff00;
            margin: 10px 0;
            padding: 8px;
            background: rgba(255, 255, 0, 0.1);
            border-radius: 4px;
            text-align: center;
        }
        #mathUI .info {
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        #mathInfo {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 100;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="mathUI">
        <h3>📐 数学函数可视化</h3>
        <button class="btn active" id="btnSine">正弦波</button>
        <button class="btn" id="btnRipple">波纹</button>
        <button class="btn" id="btnSaddle">马鞍面</button>
        <button class="btn" id="btnGaussian">高斯分布</button>
        <button class="btn" id="btnSpiral">螺旋面</button>
        <button class="btn" id="btnHeart">心形曲面</button>
        <div class="formula" id="formula">z = sin(x) * cos(y)</div>
        <div class="info">
            左键拖拽旋转<br>
            滚轮缩放
        </div>
    </div>
    
    <div id="mathInfo">
        3D数学函数可视化
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // 网格地面
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        // 数学函数定义
        const mathFunctions = {
            sine: {
                name: '正弦波',
                formula: 'z = sin(x) * cos(y)',
                func: (x, y, t) => Math.sin(x + t) * Math.cos(y + t) * 2
            },
            ripple: {
                name: '波纹',
                formula: 'z = sin(√(x²+y²)) / √(x²+y²)',
                func: (x, y, t) => {
                    const r = Math.sqrt(x * x + y * y);
                    return r === 0 ? 2 : Math.sin(r * 2 - t * 2) / r * 2;
                }
            },
            saddle: {
                name: '马鞍面',
                formula: 'z = x² - y²',
                func: (x, y, t) => (x * x - y * y) * 0.3
            },
            gaussian: {
                name: '高斯分布',
                formula: 'z = e^(-(x²+y²)/2)',
                func: (x, y, t) => Math.exp(-(x * x + y * y) / 4) * 4
            },
            spiral: {
                name: '螺旋面',
                formula: 'z = θ * r',
                func: (x, y, t) => {
                    const r = Math.sqrt(x * x + y * y);
                    const theta = Math.atan2(y, x);
                    return (theta + t * 0.5) * r * 0.3;
                }
            },
            heart: {
                name: '心形曲面',
                formula: 'z = (x²+y²-1)³ - x²y³',
                func: (x, y, t) => {
                    const scale = 1.5;
                    const x1 = x / scale;
                    const y1 = y / scale;
                    const val = Math.pow(x1 * x1 + y1 * y1 - 1, 3) - x1 * x1 * Math.pow(y1, 3);
                    return val > 0 ? val * 2 : 0;
                }
            }
        };
        
        let currentFunction = 'sine';
        let currentMesh = null;
        let time = 0;
        let isAnimating = true;
        
        // 创建函数曲面
        function createFunctionSurface(funcName) {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }
            
            const func = mathFunctions[funcName];
            const segments = 100;
            const geometry = new THREE.PlaneGeometry(10, 10, segments, segments);
            
            // 计算顶点高度
            const positions = geometry.attributes.position;
            const colors = [];
            
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const z = func.func(x, y, time);
                positions.setZ(i, z);
                
                // 根据高度设置颜色
                const normalizedZ = (z + 2) / 4;
                const color = new THREE.Color();
                color.setHSL(0.3 + normalizedZ * 0.4, 0.8, 0.5);
                colors.push(color.r, color.g, color.b);
            }
            
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                side: THREE.DoubleSide,
                wireframe: false,
                roughness: 0.3,
                metalness: 0.7
            });
            
            currentMesh = new THREE.Mesh(geometry, material);
            currentMesh.rotation.x = -Math.PI / 2;
            currentMesh.castShadow = true;
            currentMesh.receiveShadow = true;
            scene.add(currentMesh);
            
            // 更新UI
            document.getElementById('formula').textContent = func.formula;
            document.getElementById('mathInfo').textContent = func.name;
        }
        
        // 更新曲面动画
        function updateSurface() {
            if (!currentMesh || !isAnimating) return;
            
            const func = mathFunctions[currentFunction];
            const positions = currentMesh.geometry.attributes.position;
            const colors = [];
            
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const z = func.func(x, y, time);
                positions.setZ(i, z);
                
                const normalizedZ = (z + 2) / 4;
                const color = new THREE.Color();
                color.setHSL(0.3 + normalizedZ * 0.4, 0.8, 0.5);
                colors.push(color.r, color.g, color.b);
            }
            
            currentMesh.geometry.attributes.color.array.set(colors);
            currentMesh.geometry.attributes.color.needsUpdate = true;
            currentMesh.geometry.computeVertexNormals();
        }
        
        // 初始加载
        createFunctionSurface('sine');
        
        // UI事件
        function setActiveButton(id) {
            document.querySelectorAll('#mathUI .btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        
        document.getElementById('btnSine').addEventListener('click', () => {
            currentFunction = 'sine';
            setActiveButton('btnSine');
            createFunctionSurface('sine');
        });
        
        document.getElementById('btnRipple').addEventListener('click', () => {
            currentFunction = 'ripple';
            setActiveButton('btnRipple');
            createFunctionSurface('ripple');
        });
        
        document.getElementById('btnSaddle').addEventListener('click', () => {
            currentFunction = 'saddle';
            setActiveButton('btnSaddle');
            createFunctionSurface('saddle');
        });
        
        document.getElementById('btnGaussian').addEventListener('click', () => {
            currentFunction = 'gaussian';
            setActiveButton('btnGaussian');
            createFunctionSurface('gaussian');
        });
        
        document.getElementById('btnSpiral').addEventListener('click', () => {
            currentFunction = 'spiral';
            setActiveButton('btnSpiral');
            createFunctionSurface('spiral');
        });
        
        document.getElementById('btnHeart').addEventListener('click', () => {
            currentFunction = 'heart';
            setActiveButton('btnHeart');
            createFunctionSurface('heart');
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.02;
            updateSurface();
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
