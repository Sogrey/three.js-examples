<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D数学函数可视化，展示各种数学曲面">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D数学函数可视化</title>
    <link rel="stylesheet" href="../../css/example-common.css">
    <style>
        #mathUI {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            max-width: 280px;
        }
        #mathUI h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 16px;
        }
        #mathUI .function-btn {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            text-align: left;
        }
        #mathUI .function-btn:hover {
            background: #444;
            border-color: #00ff00;
        }
        #mathUI .function-btn.active {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
        }
        #mathUI .formula {
            margin-top: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            font-size: 14px;
            color: #00ffff;
            text-align: center;
        }
        #mathUI .controls {
            margin-top: 10px;
        }
        #mathUI .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        #mathUI input[type="range"] {
            width: 100px;
        }
        #mathUI .info {
            margin-top: 10px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <div id="mathUI">
        <h3>3D数学函数可视化</h3>
        <button class="function-btn active" data-func="sine">正弦波曲面</button>
        <button class="function-btn" data-func="ripple">涟漪效果</button>
        <button class="function-btn" data-func="saddle">马鞍面</button>
        <button class="function-btn" data-func="cone">圆锥面</button>
        <button class="function-btn" data-func="twist">扭曲曲面</button>
        <button class="function-btn" data-func="heart">心形曲面</button>
        
        <div class="formula" id="formula">z = sin(x) + cos(y)</div>
        
        <div class="controls">
            <div class="control-row">
                <span>振幅:</span>
                <input type="range" id="amplitude" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="control-row">
                <span>频率:</span>
                <input type="range" id="frequency" min="0.1" max="2" step="0.1" value="0.5">
            </div>
            <div class="control-row">
                <span>动画速度:</span>
                <input type="range" id="speed" min="0" max="2" step="0.1" value="0.5">
            </div>
        </div>
        
        <div class="info">
            左键旋转 | 右键平移 | 滚轮缩放
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('threeContainer');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        const pointLight = new THREE.PointLight(0x00ffff, 0.5, 50);
        pointLight.position.set(-10, 10, -10);
        scene.add(pointLight);
        
        // 网格地板
        const gridHelper = new THREE.GridHelper(30, 30, 0x333333, 0x222222);
        scene.add(gridHelper);
        
        // 坐标轴
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // 当前曲面
        let currentMesh = null;
        let currentFunction = 'sine';
        
        // 参数
        const params = {
            amplitude: 1,
            frequency: 0.5,
            speed: 0.5
        };
        
        // 数学函数定义
        const mathFunctions = {
            sine: {
                formula: 'z = A·sin(f·x) + A·cos(f·y)',
                func: (x, y, t, amp, freq) => {
                    return amp * (Math.sin(freq * x + t) + Math.cos(freq * y + t));
                }
            },
            ripple: {
                formula: 'z = A·sin(f·√(x²+y²) - t)',
                func: (x, y, t, amp, freq) => {
                    const r = Math.sqrt(x * x + y * y);
                    return amp * Math.sin(freq * r - t * 2) / (r * 0.3 + 1);
                }
            },
            saddle: {
                formula: 'z = A·(x² - y²)',
                func: (x, y, t, amp, freq) => {
                    return amp * (x * x * 0.1 - y * y * 0.1);
                }
            },
            cone: {
                formula: 'z = A·√(x² + y²)',
                func: (x, y, t, amp, freq) => {
                    return amp * Math.sqrt(x * x + y * y) * 0.3;
                }
            },
            twist: {
                formula: 'z = A·sin(f·θ + t)·r',
                func: (x, y, t, amp, freq) => {
                    const r = Math.sqrt(x * x + y * y);
                    const theta = Math.atan2(y, x);
                    return amp * Math.sin(freq * theta + t) * r * 0.3;
                }
            },
            heart: {
                formula: 'z = A·(x²+2.25y²+z²-1)³ - x²z³ - 0.1125y²z³',
                func: (x, y, t, amp, freq) => {
                    const scale = 0.15;
                    const x1 = x * scale;
                    const y1 = y * scale;
                    const a = x1 * x1 + 2.25 * y1 * y1;
                    return amp * (a - 1) * 3;
                }
            }
        };
        
        // 创建曲面
        function createSurface(funcName) {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }
            
            const geometry = new THREE.PlaneGeometry(20, 20, 100, 100);
            geometry.rotateX(-Math.PI / 2);
            
            const material = new THREE.MeshStandardMaterial({
                color: 0x0088ff,
                wireframe: false,
                side: THREE.DoubleSide,
                roughness: 0.3,
                metalness: 0.6,
                flatShading: false
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // 存储原始位置
            mesh.userData.originalPositions = geometry.attributes.position.array.slice();
            
            scene.add(mesh);
            currentMesh = mesh;
            
            // 更新公式显示
            document.getElementById('formula').textContent = mathFunctions[funcName].formula;
            
            return mesh;
        }
        
        // 更新曲面
        function updateSurface(time) {
            if (!currentMesh) return;
            
            const positions = currentMesh.geometry.attributes.position.array;
            const originalPositions = currentMesh.userData.originalPositions;
            const func = mathFunctions[currentFunction].func;
            
            for (let i = 0; i < positions.length; i += 3) {
                const x = originalPositions[i];
                const z = originalPositions[i + 2];
                
                const y = func(x, z, time, params.amplitude, params.frequency);
                
                positions[i + 1] = y;
            }
            
            currentMesh.geometry.attributes.position.needsUpdate = true;
            currentMesh.geometry.computeVertexNormals();
        }
        
        // 创建线框版本
        let wireframeMesh = null;
        function toggleWireframe(show) {
            if (wireframeMesh) {
                scene.remove(wireframeMesh);
                wireframeMesh = null;
            }
            
            if (show && currentMesh) {
                const wireGeometry = currentMesh.geometry.clone();
                const wireMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.3
                });
                wireframeMesh = new THREE.Mesh(wireGeometry, wireMaterial);
                scene.add(wireframeMesh);
            }
        }
        
        // 初始化
        createSurface('sine');
        
        // UI事件
        document.querySelectorAll('.function-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.function-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentFunction = btn.dataset.func;
                createSurface(currentFunction);
            });
        });
        
        document.getElementById('amplitude').addEventListener('input', (e) => {
            params.amplitude = parseFloat(e.target.value);
        });
        
        document.getElementById('frequency').addEventListener('input', (e) => {
            params.frequency = parseFloat(e.target.value);
        });
        
        document.getElementById('speed').addEventListener('input', (e) => {
            params.speed = parseFloat(e.target.value);
        });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 暴露到 window 供截图使用
        window.renderer = renderer;
        window.camera = camera;
        window.scene = scene;
        
        // 动画循环
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime() * params.speed;
            updateSurface(time);
            
            if (wireframeMesh && currentMesh) {
                wireframeMesh.geometry.attributes.position.array = currentMesh.geometry.attributes.position.array.slice();
                wireframeMesh.geometry.attributes.position.needsUpdate = true;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>

    <!-- 截图支持脚本 -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera && window.renderer) {
                        window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
