<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="展示心形曲线着色器效果，使用TubeGeometry创建心形并添加渐变色动画">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 心形着色器</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x1a1a2e);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 20);

        const container = document.getElementById('threeContainer');
        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const composer = new EffectComposer(window.renderer);
        window.composer = composer;

        const renderPass = new RenderPass(window.scene, window.camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 5, 1.2, 0);
        composer.addPass(bloomPass);

        class HeartCurve extends THREE.Curve {
            constructor(scale = 1) {
                super();
                this.scale = scale;
            }

            getPoint(a, optionalTarget = new THREE.Vector3()) {
                const t = a * Math.PI * 2;
                const tx = 16 * Math.pow(Math.sin(t), 3);
                const ty = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const tz = 0;

                return optionalTarget.set(tx, ty, tz).multiplyScalar(this.scale);
            }
        }

        const geometry = new THREE.TubeGeometry(new HeartCurve(0.5), 100, 0.1, 30, false);

        const vertexShader = `
            varying vec2 vUv;
            void main(void) {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec2 vUv;
            uniform float uSpeed;
            uniform float uTime;
            uniform vec2 uFade;
            uniform vec3 uColor;
            uniform float uDirection;
            void main() {
                vec3 color = uColor;
                float s = 0.0;
                float v = 0.0;
                if(uDirection == 1.0) {
                    v = vUv.x;
                    s = -uTime * uSpeed;
                } else {
                    v = -vUv.x;
                    s = -uTime * uSpeed;
                }
                float d = mod((v + s), 1.0);
                if(d > uFade.y) discard;
                else {
                    float alpha = smoothstep(uFade.x, uFade.y, d);
                    if (alpha < 0.0001) discard;
                    gl_FragColor = vec4(color, alpha);
                }
            }
        `;

        const getMaterial = (uniforms) => {
            return new THREE.ShaderMaterial({
                uniforms,
                vertexShader,
                fragmentShader,
                transparent: true
            });
        }

        const material1 = getMaterial({
            uColor: { value: new THREE.Color('pink') },
            uTime: { value: 0 },
            uDirection: { value: 1 },
            uSpeed: { value: 1 },
            uFade: { value: new THREE.Vector2(0, 0.5) }
        });

        const material2 = getMaterial({
            uColor: { value: new THREE.Color('#00BFFF') },
            uTime: { value: 0.5 },
            uDirection: { value: 1 },
            uSpeed: { value: 1 },
            uFade: { value: new THREE.Vector2(0, 0.5) }
        });

        const mesh = new THREE.Mesh(geometry, material1);
        const mesh2 = new THREE.Mesh(geometry, material2);

        window.scene.add(mesh);
        window.scene.add(mesh2);

        function animate() {
            material1.uniforms.uTime.value += 0.002;
            material2.uniforms.uTime.value += 0.002;
            composer.render();
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            window.renderer.setSize(w, h);
            window.camera.aspect = w / h;
            window.camera.updateProjectionMatrix();
            composer.setSize(w, h);
        });

        window.renderer.setAnimationLoop(animate);
    </script>

    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.composer) {
                        window.composer.render();
                    } else if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
