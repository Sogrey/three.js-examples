<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="粒子地球效果 - 使用真实世界地图纹理">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 粒子地球</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x000005);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 3);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const params = {
            earthRadius: 1,
            particleCount: 8000,
            particleSize: 0.008,
            rotationSpeed: 0.5,
            glowIntensity: 0.6,
            atmosphereColor: '#4fc3f7',
            showAtmosphere: true,
            showGlow: true,
            showEarth: true
        };

        let earth, atmosphere, glow;
        let worldTexture = null;
        let isTextureLoaded = false;

        const loader = new THREE.TextureLoader();
        
        loader.load('../../images/textures/world.jpg', function(texture) {
            worldTexture = texture;
            worldTexture.colorSpace = THREE.SRGBColorSpace;
            isTextureLoaded = true;
            initScene();
        }, undefined, function() {
            console.log('纹理加载失败，使用默认颜色');
            isTextureLoaded = true;
            initScene();
        });

        function initScene() {
            createEarth();
            createAtmosphere();
            createGlow();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            window.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 3, 5);
            window.scene.add(directionalLight);

            window.addEventListener('resize', onWindowResize);
            window.renderer.setAnimationLoop(animate);
        }

        function onWindowResize() {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        }

        function createEarth() {
            if (earth) {
                window.scene.remove(earth);
                earth.geometry.dispose();
                earth.material.dispose();
            }

            const positions = new Float32Array(params.particleCount * 3);
            const colors = new Float32Array(params.particleCount * 3);
            const sizes = new Float32Array(params.particleCount);

            let imageData = null;
            
            if (worldTexture && worldTexture.image) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = worldTexture.image.width;
                tempCanvas.height = worldTexture.image.height;
                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(worldTexture.image, 0, 0);
                imageData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            }

            for (let i = 0; i < params.particleCount; i++) {
                const u = Math.random();
                const v = Math.random();
                
                const theta = u * Math.PI * 2;
                const phi = Math.acos(2 * v - 1);

                const x = params.earthRadius * Math.sin(phi) * Math.cos(theta);
                const y = params.earthRadius * Math.sin(phi) * Math.sin(theta);
                const z = params.earthRadius * Math.cos(phi);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                let r, g, b;
                
                if (imageData) {
                    const texX = Math.floor(u * imageData.width);
                    const texY = Math.floor(v * imageData.height);
                    const idx = (texY * imageData.width + texX) * 4;
                    
                    r = imageData.data[idx] / 255;
                    g = imageData.data[idx + 1] / 255;
                    b = imageData.data[idx + 2] / 255;
                } else {
                    const isLand = Math.random() > 0.6;
                    if (isLand) {
                        r = 0.3 + Math.random() * 0.3;
                        g = 0.5 + Math.random() * 0.3;
                        b = 0.2 + Math.random() * 0.2;
                    } else {
                        r = 0.1 + Math.random() * 0.2;
                        g = 0.3 + Math.random() * 0.3;
                        b = 0.6 + Math.random() * 0.3;
                    }
                }

                colors[i * 3] = r;
                colors[i * 3 + 1] = g;
                colors[i * 3 + 2] = b;

                sizes[i] = params.particleSize * (0.5 + Math.random() * 0.5);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: params.particleSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            earth = new THREE.Points(geometry, material);
            window.scene.add(earth);
        }

        function createAtmosphere() {
            if (atmosphere) {
                window.scene.remove(atmosphere);
                atmosphere.geometry.dispose();
                atmosphere.material.dispose();
            }

            if (!params.showAtmosphere) return;

            const geometry = new THREE.SphereGeometry(params.earthRadius * 1.05, 64, 64);
            const material = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vec3 viewDir = normalize(cameraPosition - vPosition);
                        float rim = 1.0 - max(dot(viewDir, vNormal), 0.0);
                        rim = pow(rim, 4.0);
                        gl_FragColor = vec4(uColor, rim * 0.4);
                    }
                `,
                uniforms: {
                    uColor: { value: new THREE.Color(params.atmosphereColor) }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                depthWrite: false
            });

            atmosphere = new THREE.Mesh(geometry, material);
            window.scene.add(atmosphere);
        }

        function createGlow() {
            if (glow) {
                window.scene.remove(glow);
                glow.geometry.dispose();
                glow.material.dispose();
            }

            if (!params.showGlow) return;

            const geometry = new THREE.SphereGeometry(params.earthRadius * 1.25, 64, 64);
            const material = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    uniform float uIntensity;
                    
                    void main() {
                        float intensity = pow(0.45 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.2, 0.5, 0.9, intensity * uIntensity);
                    }
                `,
                uniforms: {
                    uIntensity: { value: params.glowIntensity }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                depthWrite: false
            });

            glow = new THREE.Mesh(geometry, material);
            window.scene.add(glow);
        }

        function animate() {
            if (earth && params.showEarth) {
                earth.rotation.y += 0.002 * params.rotationSpeed;
            }
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        const gui = new GUI();
        gui.title('粒子地球参数');
        gui.add(params, 'particleCount', 1000, 15000, 1000).name('粒子数量').onChange(() => {
            if (isTextureLoaded) createEarth();
        });
        gui.add(params, 'particleSize', 0.002, 0.02, 0.001).name('粒子大小').onChange(() => {
            if (earth) earth.material.size = params.particleSize;
        });
        gui.add(params, 'rotationSpeed', 0, 3, 0.1).name('旋转速度');
        gui.add(params, 'glowIntensity', 0.1, 2, 0.1).name('光晕强度').onChange(() => {
            if (isTextureLoaded) createGlow();
        });
        gui.addColor(params, 'atmosphereColor').name('大气颜色').onChange(() => {
            if (isTextureLoaded) createAtmosphere();
        });
        gui.add(params, 'showAtmosphere').name('显示大气层').onChange(() => {
            if (isTextureLoaded) createAtmosphere();
        });
        gui.add(params, 'showGlow').name('显示光晕').onChange(() => {
            if (isTextureLoaded) createGlow();
        });
        gui.add(params, 'showEarth').name('显示地球');
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
