<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="粒子地球效果 - 使用真实世界地图纹理和着色器">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 粒子地球</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x332148);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setClearColor(0x332148);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        window.renderer = renderer;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.update();

        const params = {
            color: '#17c5a9',
            pointSize: 4.0,
        };

        const vertexShader = `
            uniform float size;
            uniform sampler2D elevTexture;
            uniform sampler2D alphaTexture;
            uniform float uTime;
            uniform float uWaveHeight;
            uniform float uWaveSpeed;

            varying vec2 vUv;
            varying float vVisible;
            varying float vAlpha;
            varying float vElevation;

            float random(vec3 st) {
                return fract(sin(dot(st.xyz, vec3(12.9898,78.233,45.164))) * 43758.5453123);
            }

            float noise(vec3 st) {
                vec3 i = floor(st);
                vec3 f = fract(st);

                float a = random(i);
                float b = random(i + vec3(1.0, 0.0, 0.0));
                float c = random(i + vec3(0.0, 1.0, 0.0));
                float d = random(i + vec3(1.0, 1.0, 0.0));
                float e = random(i + vec3(0.0, 0.0, 1.0));
                float f1 = random(i + vec3(1.0, 0.0, 1.0));
                float g = random(i + vec3(0.0, 1.0, 1.0));
                float h = random(i + vec3(1.0, 1.0, 1.0));

                vec3 u = f * f * (3.0 - 2.0 * f);

                return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y),
                       mix(mix(e, f1, u.x), mix(g, h, u.x), u.y), u.z);
            }

            float fbm(vec3 st) {
                float value = 0.0;
                float amplitude = 0.5;

                for (int i = 0; i < 5; i++) {
                    value += amplitude * noise(st);
                    st *= 2.0;
                    amplitude *= 0.5;
                }
                return value;
            }

            void main() {
                vUv = uv;
                float alphaLand = 1.0 - texture2D(alphaTexture, vUv).r;
                vAlpha = alphaLand;
                vec3 newPosition = position;

                if(alphaLand < 0.5) {
                    float waveHeight = uWaveHeight;
                    float waveSpeed = uWaveSpeed;
                    float displacement = (fbm(newPosition * 5.0 + uTime * waveSpeed) * 2.0 - 1.0) * waveHeight;
                    vElevation = displacement;
                    newPosition += normal * displacement;
                }

                vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
                float elv = texture2D(elevTexture, vUv).r;
                vec3 vNormal = normalMatrix * normal;
                vVisible = step(0.0, dot(-normalize(mvPosition.xyz), normalize(vNormal)));
                mvPosition.z += 0.45 * elv;

                float dist = length(mvPosition.xyz);
                float pointSize = size * (1.0 - dist / 10.0);
                gl_PointSize = pointSize;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform sampler2D colorTexture;
            uniform sampler2D earthTexture;
            uniform sampler2D starTexture;

            varying vec2 vUv;
            varying float vVisible;
            varying float vAlpha;
            varying float vElevation;

            void main() {
                if (floor(vVisible + 0.1) == 0.0) discard;
                vec2 coord = gl_PointCoord;
                float alpha = texture2D(starTexture, coord).a;
                if (alpha < 0.1) discard;

                vec3 color = texture2D(colorTexture, vUv).rgb;
                vec3 earth = texture2D(earthTexture, vUv).rgb;
                color = mix(color, earth, 0.65);

                if(vAlpha > 0.5) {
                    gl_FragColor = vec4(color, vAlpha);
                } else {
                    float elevationEffect = clamp(vElevation * 30.0, -1.0, 1.0);
                    vec3 deep_sea_blue = vec3(0.004, 0.227, 0.388);
                    vec3 adjustedColor = mix(deep_sea_blue, earth * 1.75, (elevationEffect + 1.0) * 0.5);
                    gl_FragColor = vec4(adjustedColor, 1.0 - vAlpha);
                }
            }
        `;

        const loader = new THREE.TextureLoader();

        const textures = {
            earthMap: loader.load('../../images/textures/world.jpg'),
            starSprite: loader.load('../../images/textures/particle/circle.png'),
            colorMap: loader.load('../../images/textures/particle/04_rainbow1k.jpg'),
            elevMap: loader.load('../../images/textures/particle/01_earthbump1k.jpg'),
            alphaMap: loader.load('../../images/textures/particle/02_earthspec1k.jpg'),
        };

        textures.earthMap.colorSpace = THREE.SRGBColorSpace;
        textures.colorMap.colorSpace = THREE.SRGBColorSpace;

        const pointsShader = {
            uniforms: {
                size: { type: 'f', value: params.pointSize },
                uTime: { type: 'f', value: 0.0 },
                uWaveHeight: { type: 'f', value: 0.075 },
                uWaveSpeed: { type: 'f', value: 0.2 },
                colorTexture: { type: 't', value: textures.colorMap },
                elevTexture: { type: 't', value: textures.elevMap },
                alphaTexture: { type: 't', value: textures.alphaMap },
                earthTexture: { type: 't', value: textures.earthMap },
                starTexture: { type: 't', value: textures.starSprite },
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
            side: THREE.FrontSide,
            depthWrite: false,
        };

        const group = new THREE.Group();

        const wireframeMaterialRef = new THREE.MeshBasicMaterial({
            color: params.color,
            wireframe: true,
            transparent: true,
            opacity: 0.2,
        });

        const pointsMaterial = new THREE.ShaderMaterial(pointsShader);

        const geometry = new THREE.IcosahedronGeometry(1, 4);
        const wireframeMesh = new THREE.Mesh(geometry, wireframeMaterialRef);
        group.add(wireframeMesh);

        const pointsGeometry = new THREE.IcosahedronGeometry(1, 128);
        const pointsMesh = new THREE.Points(pointsGeometry, pointsMaterial);
        group.add(pointsMesh);

        const hemisphereLight = new THREE.HemisphereLight('#ffffff', '#080820', 3);
        scene.add(hemisphereLight);

        scene.add(group);

        const gui = new GUI();        
        gui.domElement.style.top = '50px';
        const debugFolder = gui.addFolder('Debug');

        debugFolder.addColor(params, 'color').name('颜色').onChange((value) => {
            wireframeMaterialRef.color.set(value);
        });

        debugFolder.add(params, 'pointSize', 0.1, 10, 0.1).name('粒子大小').onChange((value) => {
            pointsShader.uniforms.size.value = value;
        });

        debugFolder.add(pointsShader.uniforms.uWaveHeight, 'value', 0.01, 0.5, 0.01).name('海浪高度');

        debugFolder.add(pointsShader.uniforms.uWaveSpeed, 'value', 0.01, 1, 0.01).name('海浪变化速度');

        function animate() {
            pointsShader.uniforms.uTime.value += 10 * 0.016;
            group.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    const quality = event.data.quality || 0.8;
                    const canvas = window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
