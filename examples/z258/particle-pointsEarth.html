<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="粒子地球效果 - 使用真实世界地图纹理">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 粒子地球</title>
    <link rel="stylesheet" href="../../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "../../libs/three/r179/build/three.module.js",
            "three/addons/": "../../libs/three/r179/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const container = document.getElementById('threeContainer');

        window.scene = new THREE.Scene();
        window.scene.background = new THREE.Color(0x000005);

        window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        window.camera.position.set(0, 0, 3);

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(window.renderer.domElement);

        const controls = new OrbitControls(window.camera, window.renderer.domElement);

        const params = {
            earthRadius: 1,
            particleCount: 5000,
            particleSize: 0.012,
            rotationSpeed: 0.5,
            glowIntensity: 0.6,
            atmosphereColor: '#4fc3f7',
            showAtmosphere: true,
            showGlow: true,
            useTexture: true
        };

        let earth, atmosphere, glow;
        let worldTexture;

        const textureLoader = new THREE.TextureLoader();
        
        function loadTexture() {
            return new Promise((resolve) => {
                textureLoader.load('../../images/textures/world.jpg', (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    resolve(texture);
                }, undefined, () => {
                    resolve(null);
                });
            });
        }

        function latLngToUV(lat, lng) {
            const u = (lng + 180) / 360;
            const v = (90 - lat) / 180;
            return { u, v };
        }

        function sphericalToCartesian(radius, theta, phi) {
            return {
                x: radius * Math.sin(phi) * Math.cos(theta),
                y: radius * Math.sin(phi) * Math.sin(theta),
                z: radius * Math.cos(phi)
            };
        }

        async function createEarth() {
            if (earth) {
                window.scene.remove(earth);
                earth.geometry.dispose();
                earth.material.dispose();
            }

            if (!worldTexture && params.useTexture) {
                worldTexture = await loadTexture();
            }

            const positions = new Float32Array(params.particleCount * 3);
            const colors = new Float32Array(params.particleCount * 3);
            const sizes = new Float32Array(params.particleCount);

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (worldTexture) {
                ctx.drawImage(worldTexture.image, 0, 0, 1024, 512);
            } else {
                ctx.fillStyle = '#1976d2';
                ctx.fillRect(0, 0, 1024, 512);
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(100, 100, 200, 100);
                ctx.fillRect(400, 80, 150, 120);
                ctx.fillRect(600, 150, 250, 150);
                ctx.fillRect(850, 200, 120, 100);
            }

            const imageData = ctx.getImageData(0, 0, 1024, 512);
            const data = imageData.data;

            for (let i = 0; i < params.particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                const pos = sphericalToCartesian(params.earthRadius, theta, phi);

                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                const lat = (Math.PI / 2 - phi) * 180 / Math.PI;
                const lng = theta * 180 / Math.PI;
                const uv = latLngToUV(lat, lng);

                const x = Math.floor(uv.u * 1024);
                const y = Math.floor(uv.v * 512);
                const idx = (y * 1024 + x) * 4;

                const r = data[idx] / 255;
                const g = data[idx + 1] / 255;
                const b = data[idx + 2] / 255;

                const brightness = 0.8 + Math.random() * 0.2;
                colors[i * 3] = r * brightness;
                colors[i * 3 + 1] = g * brightness;
                colors[i * 3 + 2] = b * brightness;

                sizes[i] = params.particleSize * (0.5 + Math.random() * 0.5);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                vertexShader: `
                    attribute float size;
                    varying vec3 vColor;
                    varying vec3 vNormal;
                    
                    void main() {
                        vColor = color;
                        vNormal = normalize(position);
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying vec3 vNormal;
                    
                    void main() {
                        float dist = length(gl_PointCoord - vec2(0.5));
                        if (dist > 0.5) discard;
                        
                        float alpha = 1.0 - dist * 2.0;
                        alpha = pow(alpha, 1.5);
                        
                        vec3 lightDir = normalize(vec3(1.0, 0.5, 1.0));
                        float diff = max(dot(vNormal, lightDir), 0.0);
                        diff = diff * 0.7 + 0.3;
                        
                        gl_FragColor = vec4(vColor * diff, alpha);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true
            });

            earth = new THREE.Points(geometry, material);
            window.scene.add(earth);
        }

        function createAtmosphere() {
            if (atmosphere) {
                window.scene.remove(atmosphere);
                atmosphere.geometry.dispose();
                atmosphere.material.dispose();
            }

            if (!params.showAtmosphere) return;

            const geometry = new THREE.SphereGeometry(params.earthRadius * 1.05, 64, 64);
            const material = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vec3 viewDir = normalize(cameraPosition - vPosition);
                        float rim = 1.0 - max(dot(viewDir, vNormal), 0.0);
                        rim = pow(rim, 3.5);
                        gl_FragColor = vec4(uColor, rim * 0.5);
                    }
                `,
                uniforms: {
                    uColor: { value: new THREE.Color(params.atmosphereColor) }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                depthWrite: false
            });

            atmosphere = new THREE.Mesh(geometry, material);
            window.scene.add(atmosphere);
        }

        function createGlow() {
            if (glow) {
                window.scene.remove(glow);
                glow.geometry.dispose();
                glow.material.dispose();
            }

            if (!params.showGlow) return;

            const geometry = new THREE.SphereGeometry(params.earthRadius * 1.25, 64, 64);
            const material = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    uniform float uIntensity;
                    
                    void main() {
                        float intensity = pow(0.45 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.2, 0.5, 0.9, intensity * uIntensity);
                    }
                `,
                uniforms: {
                    uIntensity: { value: params.glowIntensity }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                depthWrite: false
            });

            glow = new THREE.Mesh(geometry, material);
            window.scene.add(glow);
        }

        createEarth().then(() => {
            createAtmosphere();
            createGlow();
        });

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        window.scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 3, 5);
        window.scene.add(directionalLight);

        window.addEventListener('resize', () => {
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
        });

        function animate() {
            if (earth) {
                earth.rotation.y += 0.002 * params.rotationSpeed;
            }
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        window.renderer.setAnimationLoop(animate);

        const gui = new GUI();
        gui.title('粒子地球参数');
        gui.add(params, 'earthRadius', 0.5, 2, 0.1).name('地球半径').onChange(() => {
            createEarth().then(() => {
                createAtmosphere();
                createGlow();
            });
        });
        gui.add(params, 'particleCount', 1000, 10000, 500).name('粒子数量').onChange(() => createEarth());
        gui.add(params, 'particleSize', 0.005, 0.05, 0.005).name('粒子大小').onChange(() => createEarth());
        gui.add(params, 'rotationSpeed', 0, 3, 0.1).name('旋转速度');
        gui.add(params, 'glowIntensity', 0.1, 2, 0.1).name('光晕强度').onChange(() => createGlow());
        gui.addColor(params, 'atmosphereColor').name('大气颜色').onChange(() => createAtmosphere());
        gui.add(params, 'showAtmosphere').name('显示大气层').onChange(() => createAtmosphere());
        gui.add(params, 'showGlow').name('显示光晕').onChange(() => createGlow());
        gui.add(params, 'useTexture').name('使用纹理').onChange(() => createEarth());
    </script>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (window.scene && window.camera) {
                        if (window.composer) window.composer.render();
                        else window.renderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = window.composer ? window.composer.renderer.domElement : window.renderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({ type: 'screenshot-data', dataUrl: dataUrl }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({ type: 'screenshot-error', error: error.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
