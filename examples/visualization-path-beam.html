<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沿路径流动的光束</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="importmap">
    {
        "imports": {
            "three": "../libs/three/r179/build/three.module.js",
            "three/addons/": "../libs/three/r179/jsm/"
        }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let scene, camera, renderer, controls, composer;
    let materials = [];
    let normalObj = null;
    const speed = 0.005;

    function init() {
      const container = document.getElementById('canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
      camera.position.set(43.95, 39.98, 107.5);

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      initLight();
      createLightBeams();
      initPostProcessing();

      window.scene = scene;
      window.camera = camera;
      window.renderer = renderer;

      animate();
    }

    function initLight() {
      const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
      scene.add(ambientLight);
    }

    function createLightBeams() {
      const commonUniforms = {
        uFade: { value: new THREE.Vector2(0, 0.6) },
        uOffset: { value: new THREE.Vector2(40, 20) }
      };

      const lineWidth = 0.5;
      const width = 48;
      const height = 400;
      const gap = 8;
      const amount = 20;

      const vertexMoveHeight = `
        float PI = acos(-1.0);
        float getMove(float u, float offset) {
            float a = u * PI * 2.0;
            return sin(a + PI * 0.25) * u * offset;
        }
        float getHeight(float u, float offset) {
            float a = u * PI * 3.0;
            return cos(a) * u * offset;
        }
      `;

      const spline = new THREE.LineCurve3(
        new THREE.Vector3(0, 0, height * 0.25),
        new THREE.Vector3(0, 0, -height * 0.75)
      );
      const geometry = new THREE.TubeGeometry(spline, height, lineWidth, 8, false);

      const vertexShader = `
        float PI = acos(-1.0);
        uniform vec2 uOffset;
        varying vec2 vUv;
        float getMove(float u, float offset) {
            float a = u * PI * 2.0;
            return sin(a + PI * 0.25) * u * offset;
        }
        float getHeight(float u, float offset) {
            float a = u * PI * 3.0;
            return cos(a) * u * offset;
        }
        void main(void) {
            vUv = uv;
            float m = getMove(uv.x, uOffset.x);
            float h = getHeight(uv.x, uOffset.y);
            vec3 newPosition = position;
            newPosition.x = newPosition.x + m;
            newPosition.y = newPosition.y + h;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
        }`;

      const fragmentShader = `
        varying vec2 vUv;
        uniform float uSpeed;
        uniform float uTime;
        uniform vec2 uFade;
        uniform vec3 uColor;
        uniform float uDirection;
        void main() {
            vec3 color = uColor;
            float s = -uTime * uSpeed;
            float v = 0.0;
            if(uDirection == 1.0) {
                v = vUv.x;
            } else {
                v = -vUv.x;
            }
            float d = mod((v + s), 1.0);
            if(d > uFade.y) discard;
            else {
                float alpha = smoothstep(uFade.x, uFade.y, d);
                if(alpha < 0.0001) discard;
                gl_FragColor = vec4(color, alpha);
            }
        }`;

      const step = (width - gap) / amount;
      for (let i = 0; i < amount; i++) {
        const c = new THREE.Color();
        const v = i / amount;
        c.setHSL(
          THREE.MathUtils.lerp(0.7, 0.2, v),
          1,
          THREE.MathUtils.lerp(0.5, 1.0, v)
        );

        const material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          transparent: true,
          uniforms: {
            uColor: { value: c },
            uTime: { value: THREE.MathUtils.lerp(-1, 1, Math.random()) },
            uDirection: { value: i < amount * 0.5 ? 1 : 0 },
            uSpeed: { value: THREE.MathUtils.lerp(1, 1.5, Math.random()) },
            ...commonUniforms
          },
          vertexShader,
          fragmentShader
        });

        materials.push(material);
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.x = i * step + (i > amount * 0.5 - 1 ? gap : 0);
        mesh.position.y = Math.random() * 5;
        scene.add(mesh);
      }

      {
        const geometry = new THREE.PlaneGeometry(
          width,
          height,
          width * 0.25,
          height * 0.25
        );

        const material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          transparent: true,
          uniforms: {
            uColor: { value: new THREE.Color('gray') },
            ...commonUniforms
          },
          vertexShader: `
            float PI = acos(-1.0);
            uniform vec2 uOffset;
            float getMove(float u, float offset) {
                float a = u * PI * 2.0;
                return sin(a + PI * 0.25) * u * offset;
            }
            float getHeight(float u, float offset) {
                float a = u * PI * 3.0;
                return cos(a) * u * offset;
            }
            void main(void) {
                float m = getMove(uv.y, uOffset.x);
                float h = getHeight(uv.y, uOffset.y);
                vec3 newPosition = position;
                newPosition.x = newPosition.x + m;
                newPosition.z = newPosition.z + h;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }`,
          fragmentShader: `
            uniform vec3 uColor;
            void main() {
                gl_FragColor = vec4(uColor, 0.6);
            }`
        });

        const plane = new THREE.Mesh(geometry, material);
        plane.rotateX(-Math.PI * 0.5);
        plane.position.set(width * 0.5, -1, -height * 0.25);
        normalObj = plane;
        scene.add(plane);
      }
    }

    function initPostProcessing() {
      const params = {
        threshold: 0,
        strength: 0.5,
        radius: 0.5
      };

      const renderScene = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
      bloomPass.threshold = params.threshold;
      bloomPass.strength = params.strength;
      bloomPass.radius = params.radius;

      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);

      window.composer = composer;
    }

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      materials.forEach((m) => {
        m.uniforms.uTime.value += speed;
        if (m.uniforms.uTime.value > 1) {
          m.uniforms.uTime.value = 0;
        }
      });

      renderer.autoClear = false;
      renderer.clear();

      if (normalObj) {
        normalObj.visible = false;
      }

      composer.render();
      renderer.clearDepth();

      if (normalObj) {
        normalObj.visible = true;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      composer.setSize(width, height);
    }

    window.addEventListener('resize', onWindowResize);
    init();
  </script>

  <script>
    let _screenshotRenderer;
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'take-screenshot') {
            try {
                if (!_screenshotRenderer) {
                    _screenshotRenderer = window.renderer;
                }
                if (!_screenshotRenderer) {
                    throw new Error('渲染器未初始化');
                }
                const composer = window.composer;
                if (composer && window.scene && window.camera) {
                    _screenshotRenderer.autoClear = false;
                    _screenshotRenderer.clear();
                    composer.render();
                    _screenshotRenderer.clearDepth();
                    _screenshotRenderer.render(window.scene, window.camera);
                } else if (window.scene && window.camera) {
                    _screenshotRenderer.render(window.scene, window.camera);
                }
                const quality = event.data.quality || 0.8;
                const canvas = _screenshotRenderer.domElement;
                const tempCanvas = document.createElement('canvas');
                const maxSize = 600;
                const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                tempCanvas.width = Math.floor(canvas.width * scale);
                tempCanvas.height = Math.floor(canvas.height * scale);
                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                window.parent.postMessage({
                    type: 'screenshot-data',
                    dataUrl: dataUrl
                }, '*');
            } catch (error) {
                console.error('截图失败:', error);
                window.parent.postMessage({
                    type: 'screenshot-error',
                    error: error.message
                }, '*');
            }
        }
    });
  </script>
</body>
</html>
