<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="平面水效果着色器 - 使用波浪函数和反射效果模拟水面">
    <meta name="three-version" content="r179">
    <title>平面水效果着色器</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.001, 10000);
        camera.position.z = 5;

        window.scene = new THREE.Scene();

        window.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0x1a2a3a);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(camera, window.renderer.domElement);

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                iUv: { value: new THREE.Vector2() },
                iResolution: { value: new THREE.Vector2() },
                iTime: { value: 0.0 }
            },
            vertexShader: vertexShader(),
            fragmentShader: fragmentShader()
        });

        const a = 25.6;
        const b = 7.2;

        const planeGeometry = new THREE.PlaneGeometry(a, b);
        const planeMesh = new THREE.Mesh(planeGeometry, shaderMaterial);
        window.scene.add(planeMesh);

        shaderMaterial.uniforms.iResolution.value.set(a, b);

        window.camera = camera;

        function animate() {
            requestAnimationFrame(animate);
            shaderMaterial.uniforms.iTime.value += 0.03;
            window.renderer.render(window.scene, window.camera);
        }

        function vertexShader() {
            return `
                varying vec2 iUv;

                void main() {
                    iUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
        }

        function fragmentShader() {
            return `
                varying vec2 iUv;
                uniform vec2 iResolution;
                uniform float iTime;

                const float gravity = 1.0;
                const float waterTension = 0.01;
                const vec3 skyCol1 = vec3(0.2, 0.4, 0.6);
                const vec3 skyCol2 = vec3(0.4, 0.7, 1.0);
                const vec3 sunCol = vec3(8.0, 7.0, 6.0) / 8.0;
                const vec3 seaCol1 = vec3(0.1, 0.2, 0.2);
                const vec3 seaCol2 = vec3(0.8, 0.9, 0.6);

                float gravityWave(in vec2 p, float k, float h) {
                    float w = sqrt(gravity * k * tanh(k * h));
                    return sin(p.y * k + w * iTime);
                }

                float capillaryWave(in vec2 p, float k, float h) {
                    float w = sqrt((gravity * k + waterTension * k * k * k) * tanh(k * h));
                    return sin(p.y * k + w * iTime);
                }

                void rot(inout vec2 p, float a) {
                    float c = cos(a);
                    float s = sin(a);
                    p = vec2(p.x * c + p.y * s, -p.x * s + p.y * c);
                }

                float seaHeight(in vec2 p) {
                    float height = 0.0;

                    float k = 1.0;
                    float kk = 1.3;
                    float a = 0.25;
                    float aa = 1.0 / (kk * kk);

                    float h = 10.0;
                    p *= 0.5;

                    for (int i = 0; i < 3; ++i) {
                        height += a * gravityWave(p + float(i), k, h);
                        rot(p, float(i));
                        k *= kk;
                        a *= aa;
                    }

                    for (int i = 3; i < 7; ++i) {
                        height += a * capillaryWave(p + float(i), k, h);
                        rot(p, float(i));
                        k *= kk;
                        a *= aa;
                    }

                    return height;
                }

                vec3 seaNormal(in vec2 p, in float d) {
                    vec2 eps = vec2(0.001 * pow(d, 1.5), 0.0);
                    vec3 n = vec3(
                        seaHeight(p + eps) - seaHeight(p - eps),
                        2.0 * eps.x,
                        seaHeight(p + eps.yx) - seaHeight(p - eps.yx)
                    );
                    return normalize(n);
                }

                vec3 sunDirection() {
                    vec3 dir = normalize(vec3(0, 0.15, 1));
                    return dir;
                }

                vec3 skyColor(vec3 rd) {
                    vec3 sunDir = sunDirection();
                    float sunDot = max(dot(rd, sunDir), 0.0);
                    vec3 final = vec3(0.0);
                    final += mix(skyCol1, skyCol2, rd.y);
                    final += 0.5 * sunCol * pow(sunDot, 20.0);
                    final += 4.0 * sunCol * pow(sunDot, 400.0);
                    return final;
                }

                void main() {
                    vec2 p = -1.0 + 2.0 * iUv.xy;
                    p.x *= iResolution.x / iResolution.y;

                    vec3 ro = vec3(0.0, 10.0, 0.0);
                    vec3 ww = normalize(vec3(0.0, -0.1, 1.0));
                    vec3 uu = normalize(cross(vec3(0.0, 1.0, 0.0), ww));
                    vec3 vv = normalize(cross(ww, uu));
                    vec3 rd = normalize(p.x * uu + p.y * vv + 2.5 * ww);

                    vec3 col = vec3(0.0);

                    float dsea = (0.0 - ro.y) / rd.y;
                    vec3 sunDir = sunDirection();
                    vec3 sky = skyColor(rd);

                    if (dsea > 0.0) {
                        vec3 p = ro + dsea * rd;
                        float h = seaHeight(p.xz);
                        vec3 nor = mix(seaNormal(p.xz, dsea), vec3(0.0, 1.0, 0.0), smoothstep(0.0, 200.0, dsea));
                        float fre = clamp(1.0 - dot(-nor, rd), 0.0, 1.0);
                        fre = pow(fre, 3.0);
                        float dif = mix(0.25, 1.0, max(dot(nor, sunDir), 0.0));

                        vec3 refl = skyColor(reflect(rd, nor));
                        vec3 refr = seaCol1 + dif * seaCol2 * 0.1;

                        col = mix(refr, 0.9 * refl, fre);

                        float atten = max(1.0 - dot(dsea, dsea) * 0.001, 0.0);
                        col += seaCol2 * (p.y - h) * 2.0 * atten;

                        col = mix(col, sky, 1.0 - exp(-0.01 * dsea));
                    } else {
                        col = sky;
                    }

                    gl_FragColor = vec4(col, 1.0);
                }
            `;
        }

        animate();
    </script>

    <script>
        let _screenshotRenderer;
        const MAX_RETRY = 3;
        const RETRY_DELAY = 200;

        function doScreenshot(retryCount = 0) {
            try {
                if (!_screenshotRenderer && window.renderer) {
                    _screenshotRenderer = window.renderer;
                }

                if (!_screenshotRenderer) {
                    throw new Error('渲染器未初始化');
                }

                if (!window.scene || !window.camera) {
                    throw new Error('场景或相机未初始化');
                }

                _screenshotRenderer.render(window.scene, window.camera);

                const quality = 0.8;
                const canvas = _screenshotRenderer.domElement;

                if (canvas.width === 0 || canvas.height === 0) {
                    throw new Error('Canvas尺寸无效');
                }

                const tempCanvas = document.createElement('canvas');
                const maxSize = 600;
                const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                tempCanvas.width = Math.floor(canvas.width * scale);
                tempCanvas.height = Math.floor(canvas.height * scale);

                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                window.parent.postMessage({
                    type: 'screenshot-data',
                    dataUrl: dataUrl
                }, '*');

            } catch (error) {
                console.error('截图失败 (尝试 ' + (retryCount + 1) + '):', error);

                if (retryCount < MAX_RETRY) {
                    setTimeout(() => {
                        doScreenshot(retryCount + 1);
                    }, RETRY_DELAY * (retryCount + 1));
                } else {
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                requestAnimationFrame(() => {
                    doScreenshot();
                });
            }
        });
    </script>
</body>
</html>
