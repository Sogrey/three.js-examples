<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js音频加载器和可视化">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 音频加载器</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        .audio-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    <div class="audio-info" id="audioInfo">点击"播放/暂停"按钮加载并播放音频</div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        let controls;
        let audioListener;
        let audioLoader;
        let audioContext;
        let sound;
        let analyser;
        let bars = [];
        let isPlaying = false;
        let audioLoaded = false;

        const params = {
            volume: 0.8,
            autoRotate: true,
            barCount: 64,
            barRadius: 5,
            barHeight: 3,
            sensitivity: 1.5
        };

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x0a0a15);

            window.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            window.camera.position.set(0, 8, 12);
            window.camera.lookAt(0, 0, 0);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = params.autoRotate;

            initAudio();
            createVisualization();
            addLights();
            initGUI();

            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function initAudio() {
            audioListener = new THREE.AudioListener();
            window.camera.add(audioListener);

            audioLoader = new THREE.AudioLoader();
        }

        function togglePlay() {
            if (!audioLoaded) {
                const audioInfo = document.getElementById('audioInfo');
                audioInfo.textContent = '正在加载音频...';

                audioLoader.load(
                    '../mp3/桥边姑娘.mp3',
                    function(buffer) {
                        audioContext = audioListener.context;

                        sound = new THREE.PositionalAudio(audioListener);
                        sound.setBuffer(buffer);
                        sound.setLoop(true);
                        sound.setVolume(params.volume);
                        sound.setRefDistance(1);
                        sound.setRolloffFactor(1);
                        sound.setMaxDistance(100);

                        analyser = new THREE.AudioAnalyser(sound, Math.pow(2, Math.ceil(Math.log2(params.barCount))));

                        const centerSphere = new THREE.Mesh(
                            new THREE.SphereGeometry(0.5, 32, 32),
                            new THREE.MeshStandardMaterial({
                                color: 0xff6b9d,
                                emissive: 0xff3366,
                                emissiveIntensity: 0.3,
                                metalness: 0.8,
                                roughness: 0.2
                            })
                        );
                        centerSphere.add(sound);
                        window.scene.add(centerSphere);

                        audioLoaded = true;
                        isPlaying = true;

                        if (audioContext.state === 'suspended') {
                            audioContext.resume();
                        }
                        sound.play();

                        audioInfo.textContent = '正在播放: 桥边姑娘';
                        console.log('音频加载成功');
                    },
                    function(progress) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        audioInfo.textContent = `正在加载音频... ${percent}%`;
                    },
                    function(error) {
                        console.error('音频加载失败:', error);
                        audioInfo.textContent = '音频加载失败，请检查文件路径';
                    }
                );
                return;
            }

            if (isPlaying) {
                sound.pause();
                isPlaying = false;
                document.getElementById('audioInfo').textContent = '已暂停';
            } else {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                sound.play();
                isPlaying = true;
                document.getElementById('audioInfo').textContent = '正在播放: 桥边姑娘';
            }
        }

        function createBar(i) {
            const barGeometry = new THREE.BoxGeometry(0.15, 1, 0.15);
            const hue = i / params.barCount;
            const color = new THREE.Color().setHSL(hue, 0.8, 0.6);

            const barMaterial = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.5,
                metalness: 0.9,
                roughness: 0.1,
                transparent: true,
                opacity: 0.8
            });

            const bar = new THREE.Mesh(barGeometry, barMaterial);

            const angle = (i / params.barCount) * Math.PI * 2;
            bar.position.x = Math.cos(angle) * params.barRadius;
            bar.position.z = Math.sin(angle) * params.barRadius;
            bar.position.y = 0;
            bar.rotation.y = -angle + Math.PI / 2;

            window.scene.add(bar);
            return bar;
        }

        function recreateVisualization() {
            bars.forEach(bar => {
                window.scene.remove(bar);
                bar.geometry.dispose();
                bar.material.dispose();
            });
            bars = [];

            for (let i = 0; i < params.barCount; i++) {
                bars.push(createBar(i));
            }

            if (analyser && sound) {
                const fftSize = Math.pow(2, Math.ceil(Math.log2(params.barCount)));
                analyser = new THREE.AudioAnalyser(sound, fftSize);
            }
        }

        function createVisualization() {
            for (let i = 0; i < params.barCount; i++) {
                bars.push(createBar(i));
            }

            const ringGeometry = new THREE.TorusGeometry(params.barRadius, 0.05, 8, 64);
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: 0x4a90d9,
                emissive: 0x2266aa,
                emissiveIntensity: 0.3,
                metalness: 1,
                roughness: 0.3
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -0.5;
            ring.name = 'ring';
            window.scene.add(ring);

            const gridHelper = new THREE.GridHelper(30, 30, 0x222233, 0x111122);
            gridHelper.position.y = -2;
            window.scene.add(gridHelper);
        }

        function updateVisualization() {
            if (!analyser || !isPlaying) {
                bars.forEach((bar) => {
                    bar.scale.y = 1;
                    bar.position.y = 0;
                });
                return;
            }

            const data = analyser.getFrequencyData();
            const dataLength = data.length;

            bars.forEach((bar, i) => {
                const normalizedIndex = i / params.barCount;
                const dataIndex = Math.floor(normalizedIndex * dataLength);
                const value = data[Math.min(dataIndex, dataLength - 1)];
                const percent = value / 255;
                const height = percent * params.barHeight * params.sensitivity + 0.1;

                bar.scale.y = height;
                bar.position.y = height / 2;

                const hue = normalizedIndex;
                const saturation = 0.6 + percent * 0.4;
                const lightness = 0.4 + percent * 0.3;
                bar.material.color.setHSL(hue, saturation, lightness);
                bar.material.emissive.setHSL(hue, saturation, lightness);
                bar.material.emissiveIntensity = 0.3 + percent * 0.7;
            });
        }

        function updateBarPositions() {
            bars.forEach((bar, i) => {
                const angle = (i / params.barCount) * Math.PI * 2;
                bar.position.x = Math.cos(angle) * params.barRadius;
                bar.position.z = Math.sin(angle) * params.barRadius;
                bar.rotation.y = -angle + Math.PI / 2;
            });

            const ring = window.scene.getObjectByName('ring');
            if (ring) {
                ring.geometry.dispose();
                ring.geometry = new THREE.TorusGeometry(params.barRadius, 0.05, 8, 64);
            }
        }

        function addLights() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            window.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            window.scene.add(directionalLight);

            const pointLight1 = new THREE.PointLight(0xff6b9d, 1, 50);
            pointLight1.position.set(-10, 5, 0);
            window.scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x4a90d9, 1, 50);
            pointLight2.position.set(10, 5, 0);
            window.scene.add(pointLight2);
        }

        function initGUI() {
            const gui = new GUI({ title: '音频控制面板', width: 280 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            const audioFolder = gui.addFolder('音频控制');

            const playButton = {
                playPause: () => togglePlay()
            };
            audioFolder.add(playButton, 'playPause').name('播放/暂停');
            audioFolder.add(params, 'volume', 0, 1, 0.01).name('音量').onChange(value => {
                if (sound) sound.setVolume(value);
            });

            const visualFolder = gui.addFolder('可视化设置');
            visualFolder.add(params, 'barCount', 16, 128, 1).name('柱状数量')
                .onChange(() => {
                    recreateVisualization();
                });
            visualFolder.add(params, 'barRadius', 1, 10, 0.1).name('半径')
                .onChange(() => {
                    updateBarPositions();
                });
            visualFolder.add(params, 'barHeight', 1, 10, 0.1).name('最大高度');
            visualFolder.add(params, 'sensitivity', 0.5, 3, 0.1).name('灵敏度');

            const animFolder = gui.addFolder('动画设置');
            animFolder.add(params, 'autoRotate').name('自动旋转').onChange(value => {
                controls.autoRotate = value;
            });

            audioFolder.open();
            visualFolder.open();
        }

        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            updateVisualization();

            window.renderer.render(window.scene, window.camera);
        }

        init();
    </script>

    <script>
        let _screenshotRenderer;
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
