<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 泛光3D区块 - 发光方块可视化">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 泛光3D区块</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        
        window.scene = null;
        window.camera = null;
        window.renderer = null;
        
        const params = {
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.2,
            blockCount: 15,
            blockSize: 1.0,
            autoRotate: true,
            rotationSpeed: 0.5,
            color1: '#ff0066',
            color2: '#00ffff',
            color3: '#ffff00',
            color4: '#ff00ff',
            backgroundColor: '#0a0a1a'
        };
        
        let composer;
        let bloomPass;
        let blocks = [];
        let controls;
        
        init();
        animate();
        
        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(params.backgroundColor);
            
            window.camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(10, 8, 10);
            window.camera.lookAt(0, 0, 0);
            
            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            window.renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);
            
            composer = new EffectComposer(window.renderer);
            const renderPass = new RenderPass(window.scene, window.camera);
            composer.addPass(renderPass);
            
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                params.bloomStrength,
                params.bloomRadius,
                params.bloomThreshold
            );
            composer.addPass(bloomPass);
            
            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = params.rotationSpeed;
            
            createBlocks();
            initGUI();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function createBlocks() {
            blocks.forEach(block => {
                window.scene.remove(block);
                block.geometry.dispose();
                block.material.dispose();
            });
            blocks = [];
            
            const colors = [
                new THREE.Color(params.color1),
                new THREE.Color(params.color2),
                new THREE.Color(params.color3),
                new THREE.Color(params.color4)
            ];
            
            const spacing = params.blockSize * 2.5;
            
            for (let i = 0; i < params.blockCount; i++) {
                const geometry = new THREE.BoxGeometry(
                    params.blockSize * (0.5 + Math.random() * 0.5),
                    params.blockSize * (0.5 + Math.random() * 0.5),
                    params.blockSize * (0.5 + Math.random() * 0.5)
                );
                
                const color = colors[i % colors.length];
                const emissiveIntensity = 0.8 + Math.random() * 0.2;
                
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: emissiveIntensity,
                    roughness: 0.2,
                    metalness: 0.8
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                
                const gridX = (i % 5) - 2;
                const gridY = Math.floor(i / 5) % 3;
                const gridZ = Math.floor(i / 15);
                
                mesh.position.set(
                    gridX * spacing + (Math.random() - 0.5) * spacing * 0.5,
                    gridY * spacing * 0.6 + params.blockSize,
                    gridZ * spacing + (Math.random() - 0.5) * spacing * 0.5
                );
                
                mesh.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                
                mesh.userData = {
                    rotationSpeed: {
                        x: (Math.random() - 0.5) * 0.02,
                        y: (Math.random() - 0.5) * 0.02,
                        z: (Math.random() - 0.5) * 0.02
                    },
                    floatSpeed: 0.5 + Math.random() * 0.5,
                    floatOffset: Math.random() * Math.PI * 2,
                    originalY: mesh.position.y
                };
                
                blocks.push(mesh);
                window.scene.add(mesh);
            }
            
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            window.scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 5);
            window.scene.add(directionalLight);
        }
        
        function updateBlocks(time) {
            blocks.forEach((block, i) => {
                block.rotation.x += block.userData.rotationSpeed.x;
                block.rotation.y += block.userData.rotationSpeed.y;
                block.rotation.z += block.userData.rotationSpeed.z;
                
                block.position.y = block.userData.originalY + 
                    Math.sin(time * block.userData.floatSpeed + block.userData.floatOffset) * 0.3;
                
                const pulse = 0.7 + 0.3 * Math.sin(time * 2 + i);
                block.material.emissiveIntensity = pulse;
            });
        }
        
        function initGUI() {
            const gui = new GUI({ title: '泛光区块参数控制', width: 300 });
            
            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';
            gui.domElement.style.maxHeight = '80vh';
            gui.domElement.style.overflowY = 'auto';
            
            setTimeout(() => {
                gui.show();
            }, 100);
            
            const bloomFolder = gui.addFolder('泛光设置');
            bloomFolder.add(params, 'bloomStrength', 0.1, 3.0).name('泛光强度').onChange((value) => {
                bloomPass.strength = value;
            });
            bloomFolder.add(params, 'bloomRadius', 0.1, 1.0).name('泛光半径').onChange((value) => {
                bloomPass.radius = value;
            });
            bloomFolder.add(params, 'bloomThreshold', 0.0, 1.0).name('泛光阈值').onChange((value) => {
                bloomPass.threshold = value;
            });
            bloomFolder.open();
            
            const blockFolder = gui.addFolder('区块设置');
            blockFolder.add(params, 'blockCount', 5, 30).step(1).name('区块数量').onChange(() => {
                createBlocks();
            });
            blockFolder.add(params, 'blockSize', 0.5, 2.0).name('区块大小').onChange(() => {
                createBlocks();
            });
            blockFolder.open();
            
            const colorFolder = gui.addFolder('颜色设置');
            colorFolder.addColor(params, 'color1').name('颜色1').onChange(() => createBlocks());
            colorFolder.addColor(params, 'color2').name('颜色2').onChange(() => createBlocks());
            colorFolder.addColor(params, 'color3').name('颜色3').onChange(() => createBlocks());
            colorFolder.addColor(params, 'color4').name('颜色4').onChange(() => createBlocks());
            colorFolder.addColor(params, 'backgroundColor').name('背景颜色').onChange((value) => {
                window.scene.background.set(value);
            });
            colorFolder.open();
            
            const controlFolder = gui.addFolder('控制设置');
            controlFolder.add(params, 'autoRotate').name('自动旋转').onChange((value) => {
                controls.autoRotate = value;
            });
            controlFolder.add(params, 'rotationSpeed', 0.1, 2.0).name('旋转速度');
        }
        
        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            const time = Date.now() * 0.001;
            updateBlocks(time);
            
            composer.render();
        }
    </script>
    
    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });
    </script>
</body>
</html>
