<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 地球斑点扫光 - 地球表面的斑点状扫描光效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 地球斑点扫光</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body { margin: 0; overflow: hidden; }
        #threeContainer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const params = {
            earthRadius: 5,
            spotColor: '#00ff88',
            backgroundColor: '#000510',
            autoRotate: true,
            rotationSpeed: 0.3,
            spotSpeed: 1.5,
            spotIntensity: 1.2,
            spotSize: 0.05,
            spotDensity: 50.0
        };

        let earth;
        let spotMesh;
        let atmosphereMesh;
        let controls;

        init();
        animate();

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(params.backgroundColor);

            window.camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(0, 5, 12);
            window.camera.lookAt(0, 0, 0);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            createEarth();
            createSpotEffect();
            createAtmosphere();
            createStars();
            initGUI();

            window.addEventListener('resize', onWindowResize);
        }

        function createEarth() {
            if (earth) {
                window.scene.remove(earth);
                earth.geometry.dispose();
                earth.material.dispose();
            }

            const earthGeometry = new THREE.SphereGeometry(params.earthRadius, 64, 64);
            const earthMaterial = new THREE.MeshPhongMaterial({
                color: 0x1a1a2e,
                emissive: 0x112244,
                specular: 0x333333,
                shininess: 25
            });

            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            window.scene.add(earth);
        }

        function createSpotEffect() {
            if (spotMesh) {
                window.scene.remove(spotMesh);
                spotMesh.geometry.dispose();
                spotMesh.material.dispose();
            }

            const spotGeometry = new THREE.SphereGeometry(params.earthRadius + 0.02, 64, 64);
            const spotMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uSpotColor: { value: new THREE.Color(params.spotColor) },
                    uSpotIntensity: { value: params.spotIntensity },
                    uSpotSize: { value: params.spotSize },
                    uSpotDensity: { value: params.spotDensity }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    varying vec2 vUv;

                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform vec3 uSpotColor;
                    uniform float uSpotIntensity;
                    uniform float uSpotSize;
                    uniform float uSpotDensity;

                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    varying vec2 vUv;

                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                    }

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);

                        float a = hash(i);
                        float b = hash(i + vec2(1.0, 0.0));
                        float c = hash(i + vec2(0.0, 1.0));
                        float d = hash(i + vec2(1.0, 1.0));

                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }

                    void main() {
                        vec3 viewDir = normalize(-vPosition);
                        float fresnel = 1.0 - max(dot(viewDir, vNormal), 0.0);

                        float lat = asin(clamp(vNormal.y, -1.0, 1.0));
                        float lon = atan(vNormal.z, vNormal.x);

                        float sweepAngle = uTime * 1.5;
                        float sweepPhase = sin(lat * 4.0 + sweepAngle) * cos(lon * 3.0 - sweepAngle * 0.5);

                        float spotPattern = noise(vec2(lat * uSpotDensity + uTime, lon * uSpotDensity - uTime * 0.7));
                        spotPattern += noise(vec2(lat * uSpotDensity * 2.0 - uTime * 0.5, lon * uSpotDensity * 2.0 + uTime));
                        spotPattern *= 0.5;

                        float spotThreshold = smoothstep(0.3, 0.7, sweepPhase * 0.5 + 0.5);
                        float spotIntensity = spotPattern * spotThreshold * pow(fresnel, 1.5);

                        spotIntensity *= smoothstep(0.0, 0.3, fresnel);
                        spotIntensity *= uSpotIntensity;

                        vec3 spotColor = uSpotColor;
                        spotColor.r += sin(uTime * 2.0) * 0.1;
                        spotColor.g += cos(uTime * 3.0) * 0.1;

                        gl_FragColor = vec4(spotColor * spotIntensity, spotIntensity * 0.8);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.FrontSide,
                depthWrite: false
            });

            spotMesh = new THREE.Mesh(spotGeometry, spotMaterial);
            window.scene.add(spotMesh);
        }

        function createAtmosphere() {
            if (atmosphereMesh) {
                window.scene.remove(atmosphereMesh);
                atmosphereMesh.geometry.dispose();
                atmosphereMesh.material.dispose();
            }

            const atmosphereGeometry = new THREE.SphereGeometry(params.earthRadius + 0.5, 64, 64);
            const atmosphereMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    glowColor: { value: new THREE.Color(params.spotColor) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    uniform vec3 glowColor;

                    void main() {
                        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
                        gl_FragColor = vec4(glowColor, 1.0) * intensity * 0.5;
                    }
                `,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                transparent: true
            });

            atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            window.scene.add(atmosphereMesh);
        }

        function createStars() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const positions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                const radius = 50 + Math.random() * 100;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i + 2] = radius * Math.cos(phi);
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.8
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            window.scene.add(stars);
        }

        function initGUI() {
            const gui = new GUI({ title: '地球斑点扫光参数控制', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            setTimeout(() => { gui.show(); }, 100);

            const displayFolder = gui.addFolder('显示设置');
            displayFolder.add(params, 'autoRotate').name('自动旋转');
            displayFolder.add(params, 'rotationSpeed', 0.1, 2.0).name('旋转速度');
            displayFolder.add(params, 'spotSpeed', 0.1, 3.0).name('斑点速度');
            displayFolder.open();

            const spotFolder = gui.addFolder('斑点设置');
            spotFolder.add(params, 'spotIntensity', 0.2, 2.0).name('斑点强度').onChange(() => {
                if (spotMesh) {
                    spotMesh.material.uniforms.uSpotIntensity.value = params.spotIntensity;
                }
            });
            spotFolder.add(params, 'spotSize', 0.02, 0.1).name('斑点大小').onChange(() => {
                if (spotMesh) {
                    spotMesh.material.uniforms.uSpotSize.value = params.spotSize;
                }
            });
            spotFolder.add(params, 'spotDensity', 20.0, 100.0).name('斑点密度').onChange(() => {
                if (spotMesh) {
                    spotMesh.material.uniforms.uSpotDensity.value = params.spotDensity;
                }
            });
            spotFolder.open();

            const colorFolder = gui.addFolder('颜色设置');
            colorFolder.addColor(params, 'spotColor').name('斑点颜色').onChange(() => {
                if (spotMesh) {
                    spotMesh.material.uniforms.uSpotColor.value.set(params.spotColor);
                }
                if (atmosphereMesh) {
                    atmosphereMesh.material.uniforms.glowColor.value.set(params.spotColor);
                }
            });
            colorFolder.open();
        }

        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            if (params.autoRotate) {
                if (earth) earth.rotation.y += 0.002 * params.rotationSpeed;
                if (spotMesh) spotMesh.rotation.y += 0.002 * params.rotationSpeed;
            }

            if (spotMesh) {
                spotMesh.material.uniforms.uTime.value += 0.016 * params.spotSpeed;
            }

            window.renderer.render(window.scene, window.camera);
        }

        function stopAnimation() {
            cancelAnimationFrame(animate);
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                stopAnimation();
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: window.renderer.domElement.toDataURL('image/jpeg', 0.8)
                    }, '*');
                    animate();
                }, 100);
            }
        });
    </script>
</body>
</html>
