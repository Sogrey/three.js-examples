<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 多重渐变围栏 - 多层渐变围栏组合效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 多重渐变围栏</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body { margin: 0; overflow: hidden; }
        #threeContainer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const params = {
            layerCount: 3,
            gridSize: 15,
            blockHeight: 0.8,
            gap: 0.15,
            autoRotate: true,
            rotationSpeed: 0.3,
            animationSpeed: 1.0,
            layerGap: 0.5,
            colors: ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff8800'],
            showWireframe: false
        };

        let fenceLayers = [];
        let controls;
        let time = 0;

        init();
        animate();

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x0a0a2a);

            window.camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(12, 12, 12);
            window.camera.lookAt(0, 0, 0);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            createMultiGradientFence();
            initGUI();

            window.addEventListener('resize', onWindowResize);
        }

        function createLayer(index) {
            const count = params.gridSize;
            const spacing = 1 + params.gap;
            const geometries = [];
            const colorArray = [];

            const layerColor = new THREE.Color(params.colors[index % params.colors.length]);

            for (let x = 0; x < count; x++) {
                for (let z = 0; z < count; z++) {
                    const height = 0.2 + Math.random() * params.blockHeight;

                    const geo = new THREE.BoxGeometry(1, height, 1);
                    const matrix = new THREE.Matrix4();
                    matrix.setPosition(
                        (x - count / 2) * spacing,
                        height / 2,
                        (z - count / 2) * spacing
                    );
                    geo.applyMatrix4(matrix);

                    geometries.push(geo);

                    const t = (x + z) / (count * 2);
                    const color = layerColor.clone().lerp(
                        new THREE.Color(params.colors[(index + 1) % params.colors.length]),
                        t
                    );

                    const vertexCount = geo.attributes.position.count;
                    for (let i = 0; i < vertexCount; i++) {
                        colorArray.push(color.r, color.g, color.b);
                    }
                }
            }

            const mergedGeometry = mergeGeometries(geometries);
            mergedGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colorArray, 3));

            const material = new THREE.MeshPhongMaterial({
                vertexColors: true,
                emissive: 0x111111,
                shininess: 50,
                transparent: true,
                opacity: 0.85 - index * 0.15,
                wireframe: params.showWireframe
            });

            const mesh = new THREE.Mesh(mergedGeometry, material);
            mesh.position.y = index * params.layerGap;

            geometries.forEach(g => g.dispose());

            return mesh;
        }

        function createMultiGradientFence() {
            fenceLayers.forEach(layer => {
                window.scene.remove(layer);
                layer.geometry.dispose();
                layer.material.dispose();
            });
            fenceLayers = [];

            for (let i = 0; i < params.layerCount; i++) {
                const layer = createLayer(i);
                fenceLayers.push(layer);
                window.scene.add(layer);
            }
        }

        function mergeGeometries(geometries) {
            const positions = [];
            const normals = [];
            const colors = [];

            for (const geo of geometries) {
                const pos = geo.attributes.position.array;
                const norm = geo.attributes.normal ? geo.attributes.normal.array : null;

                for (let i = 0; i < pos.length; i++) {
                    positions.push(pos[i]);
                    if (norm) normals.push(norm[i]);
                }

                const col = geo.attributes.color ? geo.attributes.color.array : null;
                if (col) {
                    for (let i = 0; i < col.length; i++) {
                        colors.push(col[i]);
                    }
                }
            }

            const merged = new THREE.BufferGeometry();
            merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            if (normals.length > 0) {
                merged.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            }
            if (colors.length > 0) {
                merged.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            }

            return merged;
        }

        function initGUI() {
            const gui = new GUI({ title: '多重渐变围栏参数控制', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            setTimeout(() => { gui.show(); }, 100);

            const displayFolder = gui.addFolder('显示设置');
            displayFolder.add(params, 'autoRotate').name('自动旋转');
            displayFolder.add(params, 'rotationSpeed', 0.1, 2.0).name('旋转速度');
            displayFolder.add(params, 'showWireframe').name('显示线框').onChange(() => {
                fenceLayers.forEach(layer => {
                    layer.material.wireframe = params.showWireframe;
                });
            });
            displayFolder.open();

            const fenceFolder = gui.addFolder('围栏设置');
            fenceFolder.add(params, 'layerCount', 2, 5).step(1).name('层数').onChange(() => {
                createMultiGradientFence();
            });
            fenceFolder.add(params, 'gridSize', 10, 25).step(1).name('网格大小').onChange(() => {
                createMultiGradientFence();
            });
            fenceFolder.add(params, 'blockHeight', 0.3, 2.0).name('方块高度').onChange(() => {
                createMultiGradientFence();
            });
            fenceFolder.add(params, 'gap', 0.1, 0.4).name('方块间隔').onChange(() => {
                createMultiGradientFence();
            });
            fenceFolder.add(params, 'layerGap', 0.2, 1.0).name('层间距').onChange(() => {
                fenceLayers.forEach((layer, i) => {
                    layer.position.y = i * params.layerGap;
                });
            });
            fenceFolder.open();

            const colorFolder = gui.addFolder('颜色设置');
            for (let i = 0; i < params.colors.length; i++) {
                const colorKey = 'color' + i;
                params[colorKey] = params.colors[i];
                colorFolder.addColor(params, colorKey).name('颜色' + (i + 1)).onChange(() => {
                    params.colors[i] = params[colorKey];
                    createMultiGradientFence();
                });
            }
            colorFolder.open();
        }

        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            time += 0.016 * params.animationSpeed;
            controls.update();

            if (params.autoRotate) {
                fenceLayers.forEach((layer, i) => {
                    layer.rotation.y += 0.001 * params.rotationSpeed * (1 + i * 0.2);
                });
            }

            window.renderer.render(window.scene, window.camera);
        }

        function stopAnimation() {
            cancelAnimationFrame(animate);
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                stopAnimation();
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: window.renderer.domElement.toDataURL('image/jpeg', 0.8)
                    }, '*');
                    animate();
                }, 100);
            }
        });
    </script>
</body>
</html>
