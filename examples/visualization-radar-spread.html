<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="雷达扩散特效 - 圆形波纹向外扩散效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 雷达扩散特效</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls;
        let shaders = [];

        const params = {
            uSize: 50,
            uTime: 0.2,
            uColor: '#00FFFF',
            speed: 0.005
        };

        async function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                200
            );
            camera.position.set(37, 50, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('threeContainer').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const light = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(light);

            const dirLight = new THREE.DirectionalLight(0x0000ff, 3);
            dirLight.position.set(50, 50, 50);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 100;
            dirLight.shadow.camera.bottom = -100;
            dirLight.shadow.camera.left = -100;
            dirLight.shadow.camera.right = 100;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.mapSize.set(1024, 1024);
            scene.add(dirLight);

            const pg = new THREE.PlaneGeometry(100, 100);
            const pm = new THREE.MeshStandardMaterial({
                color: new THREE.Color('gray'),
                side: THREE.FrontSide,
                transparent: true
            });
            const plane = new THREE.Mesh(pg, pm);
            plane.rotateX(-Math.PI * 0.5);
            plane.receiveShadow = true;
            scene.add(plane);

            const geometries = [];
            const helper = new THREE.Object3D();
            for (let i = 0; i < 100; i++) {
                const h = Math.round(Math.random() * 15) + 5;
                const x = Math.round(Math.random() * 50);
                const y = Math.round(Math.random() * 50);
                helper.position.set((x % 2 ? -1 : 1) * x, h * 0.5, (y % 2 ? -1 : 1) * y);
                const geometry = new THREE.BoxGeometry(5, h, 5);
                helper.updateWorldMatrix(true, false);
                geometry.applyMatrix4(helper.matrixWorld);
                geometries.push(geometry);
            }

            const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries, false);
            const texture = new THREE.TextureLoader().load('../images/textures/image.jpg');
            texture.wrapS = texture.wrapT = THREE.MirroredRepeatWrapping;
            const material = new THREE.MeshStandardMaterial({ map: texture, transparent: true });
            const cube = new THREE.Mesh(mergedGeometry, material);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);

            const vertexShader1 = `uniform float uSize;
                varying vec2 vUv;
                void main() {`;
            const vertexShader2 = `#include <fog_vertex>
                    vUv=position.xz/uSize;`;
            const vertexShader3 = `#include <fog_vertex>
                      vUv=vec2(-position.x,-position.y)/uSize;`;
            const fragmentShader1 = `varying vec2 vUv;
                  uniform float uTime;
                  uniform vec3 uColor;
                  uniform float uSize;
                  void main() {`;
            const fragmentShader2 = `#include <dithering_fragment> 
              float d=length(vUv);
                    if(d >= uTime&&d<=uTime+ 0.1) {
                      gl_FragColor.rgb = gl_FragColor.rgb+mix(uColor,gl_FragColor.rgb,1.0-(d-uTime)*10.0 )*0.5  ;                    
                    }`;

            material.onBeforeCompile = (shader) => {
                shaders.push(shader);
                shader.uniforms.uSize = { value: params.uSize };
                shader.uniforms.uTime = { value: params.uTime };
                shader.uniforms.uColor = { value: new THREE.Color(params.uColor) };
                shader.vertexShader = shader.vertexShader.replace('void main() {', vertexShader1);
                shader.vertexShader = shader.vertexShader.replace('#include <fog_vertex>', vertexShader2);
                shader.fragmentShader = shader.fragmentShader.replace('void main() {', fragmentShader1);
                shader.fragmentShader = shader.fragmentShader.replace('#include <dithering_fragment>', fragmentShader2);
            };

            pm.onBeforeCompile = (shader) => {
                shaders.push(shader);
                shader.uniforms.uSize = { value: params.uSize };
                shader.uniforms.uTime = { value: params.uTime };
                shader.uniforms.uColor = { value: new THREE.Color(params.uColor) };
                shader.vertexShader = shader.vertexShader.replace('void main() {', vertexShader1);
                shader.vertexShader = shader.vertexShader.replace('#include <fog_vertex>', vertexShader3);
                shader.fragmentShader = shader.fragmentShader.replace('void main() {', fragmentShader1);
                shader.fragmentShader = shader.fragmentShader.replace('#include <dithering_fragment>', fragmentShader2);
            };

            initGUI();
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function initGUI() {
            const gui = new GUI({ title: '雷达参数控制', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            setTimeout(() => {
                gui.show();
            }, 100);

            gui.add(params, 'uSize', 20, 100).name('作用范围');
            gui.add(params, 'speed', 0.001, 0.02).name('扩散速度');
            gui.addColor(params, 'uColor').name('雷达颜色');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            if (shaders.length) {
                shaders.forEach((shader) => {
                    shader.uniforms.uTime.value += params.speed;
                    shader.uniforms.uColor.value.set(params.uColor);
                    if (shader.uniforms.uTime.value >= 1) {
                        shader.uniforms.uTime.value = 0;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    renderer.render(scene, camera);

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / renderer.domElement.width, maxSize / renderer.domElement.height);
                    tempCanvas.width = Math.floor(renderer.domElement.width * scale);
                    tempCanvas.height = Math.floor(renderer.domElement.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(renderer.domElement, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });

        init();
    </script>
</body>
</html>
