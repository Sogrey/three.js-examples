<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="地球渐变扫光 - 地球表面的渐变扫描光效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 地球渐变扫光</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls;
        let material = null;

        const params = {
            speed: 0.005,
            color: '#FFFFFF'
        };

        async function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                200
            );
            camera.position.set(37, 50, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('threeContainer').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            const light = new THREE.AmbientLight(0xffffff, 1);
            scene.add(light);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(20, 20, 10);
            scene.add(directionalLight);

            const geometry = new THREE.SphereGeometry(16, 32, 32);
            const texture = new THREE.TextureLoader().load('../images/textures/world.jpg');
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;

            const earthMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                bumpMap: texture,
                bumpScale: 10
            });
            const sphere = new THREE.Mesh(geometry, earthMaterial);
            scene.add(sphere);

            const outerGeometry = new THREE.SphereGeometry(18, 32, 16);
            material = new THREE.ShaderMaterial({
                uniforms: {
                    iTime: { value: 0.0 },
                    uColor: { value: new THREE.Color(params.color) }
                },
                transparent: true,
                vertexShader: `
                    varying vec2 vUv;
                    void main(){
                        vUv=uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }`,
                fragmentShader: `
                    float PI = acos(-1.0);
                    uniform vec3 uColor;
                    uniform float iTime;
                    varying vec2 vUv;
                    void main(){
                        vec2 uv = vUv + vec2(0.0, iTime);
                        float current = abs(sin(uv.y * PI));
                        gl_FragColor.rgb = uColor;
                        gl_FragColor.a = mix(1.0, 0.0, current);
                    }`
            });
            const outerSphere = new THREE.Mesh(outerGeometry, material);
            scene.add(outerSphere);

            initGUI();
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function initGUI() {
            const gui = new GUI({ title: '扫光参数控制', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            setTimeout(() => {
                gui.show();
            }, 100);

            gui.add(params, 'speed', 0.001, 0.02).name('扫光速度');
            gui.addColor(params, 'color').name('扫光颜色').onChange(() => {
                if (material) {
                    material.uniforms.uColor.value.set(params.color);
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            if (material) {
                if (material.uniforms.iTime.value > 1) {
                    material.uniforms.iTime.value = 0;
                } else {
                    material.uniforms.iTime.value += params.speed;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    renderer.render(scene, camera);

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / renderer.domElement.width, maxSize / renderer.domElement.height);
                    tempCanvas.width = Math.floor(renderer.domElement.width * scale);
                    tempCanvas.height = Math.floor(renderer.domElement.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(renderer.domElement, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });

        init();
    </script>
</body>
</html>
