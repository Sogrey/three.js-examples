<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 3D热力山丘图 - 3D热力图山丘可视化">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D热力山丘图</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        
        window.scene = null;
        window.camera = null;
        window.renderer = null;
        
        const params = {
            resolution: 128,
            heatPointCount: 8,
            maxHeight: 3.0,
            colorLow: '#0066ff',
            colorMid: '#ffff00',
            colorHigh: '#ff0000',
            backgroundColor: '#0a0a1a',
            autoRotate: true,
            wireframe: false,
            animationSpeed: 0.5
        };
        
        let heatMesh;
        let controls;
        let heatMaterial;
        let heatPoints = [];
        
        init();
        animate();
        
        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(params.backgroundColor);
            
            window.camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(8, 6, 8);
            window.camera.lookAt(0, 0, 0);
            
            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);
            
            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            generateHeatPoints();
            createHeatHill();
            initGUI();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function generateHeatPoints() {
            heatPoints = [];
            for (let i = 0; i < params.heatPointCount; i++) {
                heatPoints.push({
                    x: Math.random() * 2 - 1,
                    z: Math.random() * 2 - 1,
                    intensity: 0.6 + Math.random() * 0.4,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        
        function getHeatValue(x, z, time) {
            let heat = 0;
            
            for (let i = 0; i < heatPoints.length; i++) {
                const point = heatPoints[i];
                const dx = x - point.x;
                const dz = z - point.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                const animatedIntensity = point.intensity * (0.7 + 0.3 * Math.sin(time * 2.0 + point.phase));
                const falloff = Math.max(0, 1 - dist / 0.5);
                heat += falloff * falloff * animatedIntensity;
            }
            
            return Math.min(heat, 1.0);
        }
        
        function createHeatHill() {
            if (heatMesh) {
                window.scene.remove(heatMesh);
                heatMesh.geometry.dispose();
                heatMesh.material.dispose();
            }
            
            const geometry = new THREE.PlaneGeometry(10, 10, params.resolution, params.resolution);
            const positions = geometry.attributes.position.array;
            const colors = new Float32Array(positions.length);
            
            const time = 0;
            
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const z = positions[i + 1];
                const nx = (x / 5 + 1) / 2;
                const nz = (z / 5 + 1) / 2;
                
                const heat = getHeatValue(nx * 2 - 1, nz * 2 - 1, time);
                const height = heat * params.maxHeight;
                
                positions[i + 2] = height;
                
                let color;
                if (heat < 0.5) {
                    const t = heat * 2;
                    color = new THREE.Color(params.colorLow).lerp(new THREE.Color(params.colorMid), t);
                } else {
                    const t = (heat - 0.5) * 2;
                    color = new THREE.Color(params.colorMid).lerp(new THREE.Color(params.colorHigh), t);
                }
                
                colors[i] = color.r;
                colors[i + 1] = color.g;
                colors[i + 2] = color.b;
            }
            
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            
            heatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uMaxHeight: { value: params.maxHeight },
                    uColorLow: { value: new THREE.Color(params.colorLow) },
                    uColorMid: { value: new THREE.Color(params.colorMid) },
                    uColorHigh: { value: new THREE.Color(params.colorHigh) },
                    uLightDirection: { value: new THREE.Vector3(1, 1, 0.5).normalize() }
                },
                vertexShader: `
                    attribute vec3 color;
                    varying vec3 vColor;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vColor = color;
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform float uMaxHeight;
                    uniform vec3 uColorLow;
                    uniform vec3 uColorMid;
                    uniform vec3 uColorHigh;
                    uniform vec3 uLightDirection;
                    
                    varying vec3 vColor;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        float diffuse = max(dot(vNormal, uLightDirection), 0.3);
                        
                        float height = vPosition.z / uMaxHeight;
                        vec3 rimColor = mix(uColorMid, uColorHigh, height);
                        
                        vec3 finalColor = vColor * diffuse + rimColor * 0.2;
                        
                        float alpha = 0.9;
                        gl_FragColor = vec4(finalColor, alpha);
                    }
                `,
                vertexColors: true,
                wireframe: params.wireframe,
                side: THREE.DoubleSide
            });
            
            heatMesh = new THREE.Mesh(geometry, heatMaterial);
            heatMesh.rotation.x = -Math.PI / 2;
            window.scene.add(heatMesh);
            
            const gridHelper = new THREE.GridHelper(10, 20, 0x333333, 0x222222);
            gridHelper.position.y = -0.01;
            window.scene.add(gridHelper);
        }
        
        function updateHeatHill(time) {
            const positions = heatMesh.geometry.attributes.position.array;
            const colors = heatMesh.geometry.attributes.color.array;
            
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const z = positions[i + 1];
                const nx = (x / 5 + 1) / 2;
                const nz = (z / 5 + 1) / 2;
                
                const heat = getHeatValue(nx * 2 - 1, nz * 2 - 1, time);
                const height = heat * params.maxHeight;
                
                positions[i + 2] = height;
                
                let color;
                if (heat < 0.5) {
                    const t = heat * 2;
                    color = new THREE.Color(params.colorLow).lerp(new THREE.Color(params.colorMid), t);
                } else {
                    const t = (heat - 0.5) * 2;
                    color = new THREE.Color(params.colorMid).lerp(new THREE.Color(params.colorHigh), t);
                }
                
                colors[i] = color.r;
                colors[i + 1] = color.g;
                colors[i + 2] = color.b;
            }
            
            heatMesh.geometry.attributes.position.needsUpdate = true;
            heatMesh.geometry.attributes.color.needsUpdate = true;
            heatMesh.geometry.computeVertexNormals();
        }
        
        function initGUI() {
            const gui = new GUI({ title: '3D热力山丘参数控制', width: 300 });
            
            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';
            gui.domElement.style.maxHeight = '80vh';
            gui.domElement.style.overflowY = 'auto';
            
            setTimeout(() => {
                gui.show();
            }, 100);
            
            const hillFolder = gui.addFolder('山丘设置');
            hillFolder.add(params, 'heatPointCount', 3, 20).step(1).name('热力点数量').onChange(() => {
                generateHeatPoints();
            });
            hillFolder.add(params, 'maxHeight', 1.0, 5.0).name('最大高度').onChange((value) => {
                heatMaterial.uniforms.uMaxHeight.value = value;
            });
            hillFolder.add(params, 'animationSpeed', 0.1, 2.0).name('动画速度');
            hillFolder.add(params, 'wireframe').name('线框模式').onChange((value) => {
                heatMaterial.wireframe = value;
            });
            hillFolder.open();
            
            const displayFolder = gui.addFolder('显示设置');
            displayFolder.add(params, 'resolution', 32, 256).step(16).name('分辨率').onChange(() => {
                createHeatHill();
            });
            displayFolder.add(params, 'autoRotate').name('自动旋转视角').onChange((value) => {
                controls.autoRotate = value;
            });
            
            const colorFolder = gui.addFolder('颜色设置');
            colorFolder.addColor(params, 'colorLow').name('低温颜色').onChange((value) => {
                heatMaterial.uniforms.uColorLow.value.set(value);
                createHeatHill();
            });
            colorFolder.addColor(params, 'colorMid').name('中温颜色').onChange((value) => {
                heatMaterial.uniforms.uColorMid.value.set(value);
                createHeatHill();
            });
            colorFolder.addColor(params, 'colorHigh').name('高温颜色').onChange((value) => {
                heatMaterial.uniforms.uColorHigh.value.set(value);
                createHeatHill();
            });
            colorFolder.addColor(params, 'backgroundColor').name('背景颜色').onChange((value) => {
                window.scene.background.set(value);
            });
            colorFolder.open();
        }
        
        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            if (heatMaterial) {
                const time = heatMaterial.uniforms.uTime.value;
                heatMaterial.uniforms.uTime.value += 0.016 * params.animationSpeed;
                updateHeatHill(time);
            }
            
            window.renderer.render(window.scene, window.camera);
        }
    </script>
    
    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });
    </script>
</body>
</html>
