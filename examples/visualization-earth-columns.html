<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 地球柱体 - 使用InstancedMesh实现的地球柱状图">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 地球柱体</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body { margin: 0; overflow: hidden; }
        #threeContainer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const params = {
            columnCount: 500,
            maxHeight: 2.0,
            earthRadius: 5,
            autoRotate: true,
            rotationSpeed: 0.3,
            colorLow: '#0066ff',
            colorHigh: '#ff0066',
            animationSpeed: 1.0
        };

        let earth;
        let columnMesh;
        let controls;
        let columnCount = 0;

        init();
        animate();

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x000510);

            window.camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(0, 10, 15);
            window.camera.lookAt(0, 0, 0);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            createEarth();
            createColumns();
            createStars();
            initGUI();

            window.addEventListener('resize', onWindowResize);
        }

        function createEarth() {
            if (earth) {
                window.scene.remove(earth);
                earth.geometry.dispose();
                earth.material.dispose();
            }

            const earthGeometry = new THREE.SphereGeometry(params.earthRadius, 64, 64);
            const earthMaterial = new THREE.MeshPhongMaterial({
                color: 0x1a1a2e,
                emissive: 0x112244,
                specular: 0x333333,
                shininess: 25
            });

            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            window.scene.add(earth);
        }

        function getColumnData(count) {
            const data = [];
            for (let i = 0; i < count; i++) {
                const lat = (Math.random() - 0.5) * Math.PI * 0.8;
                const lon = Math.random() * Math.PI * 2;
                const height = 0.3 + Math.random() * 0.7;
                data.push({ lat, lon, height });
            }
            return data;
        }

        function createColumns() {
            if (columnMesh) {
                window.scene.remove(columnMesh);
                columnMesh.geometry.dispose();
                columnMesh.material.dispose();
            }

            const data = getColumnData(params.columnCount);
            columnCount = data.length;

            const geometries = [];
            const colorArray = [];

            for (let i = 0; i < columnCount; i++) {
                const { lat, lon, height } = data[i];
                const heightScale = height * params.maxHeight;

                const cylinderGeo = new THREE.CylinderGeometry(0.08, 0.1, heightScale, 8);
                const position = new THREE.Vector3(
                    Math.cos(lat) * Math.cos(lon) * (params.earthRadius + heightScale * 0.5),
                    Math.sin(lat) * (params.earthRadius + heightScale * 0.5),
                    Math.cos(lat) * Math.sin(lon) * (params.earthRadius + heightScale * 0.5)
                );

                const up = new THREE.Vector3(0, 1, 0);
                const normal = position.clone().normalize();
                const quaternion = new THREE.Quaternion().setFromUnitVectors(up, normal);

                const matrix = new THREE.Matrix4();
                matrix.compose(position, quaternion, new THREE.Vector3(1, 1, 1));
                cylinderGeo.applyMatrix4(matrix);

                geometries.push(cylinderGeo);

                const color = new THREE.Color(params.colorLow).lerp(
                    new THREE.Color(params.colorHigh),
                    height
                );
                const vertexCount = cylinderGeo.attributes.position.count;
                for (let j = 0; j < vertexCount; j++) {
                    colorArray.push(color.r, color.g, color.b);
                }
            }

            const mergedGeometry = customMergeGeometries(geometries, colorArray);

            const columnMaterial = new THREE.MeshPhongMaterial({
                vertexColors: true,
                shininess: 50,
                transparent: true,
                opacity: 0.9
            });

            columnMesh = new THREE.Mesh(mergedGeometry, columnMaterial);
            window.scene.add(columnMesh);

            geometries.forEach(g => g.dispose());
        }

        function customMergeGeometries(geometries, colorArray) {
            const positions = [];
            const normals = [];
            let index = 0;

            for (const geo of geometries) {
                const pos = geo.attributes.position.array;
                const norm = geo.attributes.normal ? geo.attributes.normal.array : null;

                for (let i = 0; i < pos.length; i++) {
                    positions.push(pos[i]);
                    if (norm) normals.push(norm[i]);
                }
                index += geo.attributes.position.count;
            }

            const merged = new THREE.BufferGeometry();
            merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            if (normals.length > 0) {
                merged.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            }
            if (colorArray.length > 0) {
                merged.setAttribute('color', new THREE.Float32BufferAttribute(colorArray, 3));
            }

            return merged;
        }

        function createStars() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const positions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                const radius = 50 + Math.random() * 100;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i + 2] = radius * Math.cos(phi);
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.8
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            window.scene.add(stars);
        }

        function initGUI() {
            const gui = new GUI({ title: '地球柱体参数控制', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            setTimeout(() => { gui.show(); }, 100);

            const displayFolder = gui.addFolder('显示设置');
            displayFolder.add(params, 'autoRotate').name('自动旋转');
            displayFolder.add(params, 'rotationSpeed', 0.1, 2.0).name('旋转速度');
            displayFolder.add(params, 'animationSpeed', 0.1, 3.0).name('动画速度');
            displayFolder.open();

            const columnFolder = gui.addFolder('柱体设置');
            columnFolder.add(params, 'columnCount', 100, 1000).step(10).name('柱体数量').onChange(() => {
                createColumns();
            });
            columnFolder.add(params, 'maxHeight', 0.5, 5.0).name('最大高度').onChange(() => {
                createColumns();
            });
            columnFolder.open();

            const colorFolder = gui.addFolder('颜色设置');
            colorFolder.addColor(params, 'colorLow').name('低高度颜色').onChange(() => {
                if (columnMesh) {
                    columnMesh.material.uniforms.uColorLow.value.set(params.colorLow);
                }
            });
            colorFolder.addColor(params, 'colorHigh').name('高高度颜色').onChange(() => {
                if (columnMesh) {
                    columnMesh.material.uniforms.uColorHigh.value.set(params.colorHigh);
                }
            });
            colorFolder.open();
        }

        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            if (params.autoRotate && earth) {
                earth.rotation.y += 0.002 * params.rotationSpeed;
            }

            if (columnMesh && columnMesh.material.uniforms && columnMesh.material.uniforms.uTime) {
                columnMesh.material.uniforms.uTime.value += 0.016 * params.animationSpeed;
            }

            window.renderer.render(window.scene, window.camera);
        }

        function stopAnimation() {
            cancelAnimationFrame(animate);
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                stopAnimation();
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: window.renderer.domElement.toDataURL('image/jpeg', 0.8)
                    }, '*');
                    animate();
                }, 100);
            }
        });
    </script>
</body>
</html>
