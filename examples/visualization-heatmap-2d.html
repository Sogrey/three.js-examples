<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 2D热力图 - 平面热力图可视化">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 2D热力图</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        
        window.scene = null;
        window.camera = null;
        window.renderer = null;
        
        const params = {
            resolution: 100,
            heatPointCount: 10,
            heatRadius: 0.3,
            heatIntensity: 1.5,
            colorLow: '#0000ff',
            colorMid: '#ffff00',
            colorHigh: '#ff0000',
            backgroundColor: '#0a0a1a',
            autoRotate: true,
            showGrid: true,
            animationSpeed: 0.5
        };
        
        let heatMesh;
        let controls;
        let heatMaterial;
        let heatPoints = [];
        
        init();
        animate();
        
        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(params.backgroundColor);
            
            window.camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(0, 8, 8);
            window.camera.lookAt(0, 0, 0);
            
            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);
            
            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            generateHeatPoints();
            createHeatMap();
            initGUI();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function generateHeatPoints() {
            heatPoints = [];
            for (let i = 0; i < params.heatPointCount; i++) {
                heatPoints.push({
                    x: Math.random() * 2 - 1,
                    z: Math.random() * 2 - 1,
                    intensity: 0.5 + Math.random() * 0.5,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        
        function createHeatMap() {
            if (heatMesh) {
                window.scene.remove(heatMesh);
                heatMesh.geometry.dispose();
                heatMesh.material.dispose();
            }
            
            const geometry = new THREE.PlaneGeometry(10, 10, params.resolution, params.resolution);
            
            heatMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uResolution: { value: params.resolution },
                    uHeatRadius: { value: params.heatRadius },
                    uHeatIntensity: { value: params.heatIntensity },
                    uColorLow: { value: new THREE.Color(params.colorLow) },
                    uColorMid: { value: new THREE.Color(params.colorMid) },
                    uColorHigh: { value: new THREE.Color(params.colorHigh) },
                    uHeatPoints: { value: [] },
                    uHeatPointCount: { value: params.heatPointCount }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    
                    void main() {
                        vUv = uv;
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform float uResolution;
                    uniform float uHeatRadius;
                    uniform float uHeatIntensity;
                    uniform vec3 uColorLow;
                    uniform vec3 uColorMid;
                    uniform vec3 uColorHigh;
                    uniform vec3 uHeatPoints[20];
                    uniform int uHeatPointCount;
                    
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    
                    void main() {
                        float heat = 0.0;
                        
                        for (int i = 0; i < 20; i++) {
                            if (i >= uHeatPointCount) break;
                            
                            vec2 pointPos = uHeatPoints[i].xy;
                            float pointIntensity = uHeatPoints[i].z;
                            float phase = uHeatPoints[i].z;
                            
                            float dist = distance(vUv, pointPos);
                            float animatedIntensity = pointIntensity * (0.7 + 0.3 * sin(uTime * 2.0 + phase));
                            float falloff = 1.0 - smoothstep(0.0, uHeatRadius, dist);
                            heat += falloff * animatedIntensity * uHeatIntensity;
                        }
                        
                        heat = clamp(heat, 0.0, 1.0);
                        
                        vec3 color;
                        if (heat < 0.5) {
                            color = mix(uColorLow, uColorMid, heat * 2.0);
                        } else {
                            color = mix(uColorMid, uColorHigh, (heat - 0.5) * 2.0);
                        }
                        
                        float alpha = 0.3 + heat * 0.7;
                        
                        gl_FragColor = vec4(color, alpha);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide
            });
            
            updateHeatPointsUniform();
            
            heatMesh = new THREE.Mesh(geometry, heatMaterial);
            heatMesh.rotation.x = -Math.PI / 2;
            window.scene.add(heatMesh);
            
            if (params.showGrid) {
                const gridHelper = new THREE.GridHelper(10, 20, 0x333333, 0x222222);
                gridHelper.position.y = 0.01;
                window.scene.add(gridHelper);
            }
        }
        
        function updateHeatPointsUniform() {
            const pointsData = [];
            for (let i = 0; i < 20; i++) {
                if (i < heatPoints.length) {
                    pointsData.push(new THREE.Vector3(
                        (heatPoints[i].x + 1) / 2,
                        (heatPoints[i].z + 1) / 2,
                        heatPoints[i].intensity
                    ));
                } else {
                    pointsData.push(new THREE.Vector3(0, 0, 0));
                }
            }
            heatMaterial.uniforms.uHeatPoints.value = pointsData;
        }
        
        function initGUI() {
            const gui = new GUI({ title: '热力图参数控制', width: 300 });
            
            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';
            gui.domElement.style.maxHeight = '80vh';
            gui.domElement.style.overflowY = 'auto';
            
            setTimeout(() => {
                gui.show();
            }, 100);
            
            const heatFolder = gui.addFolder('热力设置');
            heatFolder.add(params, 'heatPointCount', 3, 30).step(1).name('热力点数量').onChange(() => {
                generateHeatPoints();
                updateHeatPointsUniform();
            });
            heatFolder.add(params, 'heatRadius', 0.1, 0.8).name('热力半径').onChange((value) => {
                heatMaterial.uniforms.uHeatRadius.value = value;
            });
            heatFolder.add(params, 'heatIntensity', 0.5, 3.0).name('热力强度').onChange((value) => {
                heatMaterial.uniforms.uHeatIntensity.value = value;
            });
            heatFolder.add(params, 'animationSpeed', 0.1, 2.0).name('动画速度');
            heatFolder.open();
            
            const displayFolder = gui.addFolder('显示设置');
            displayFolder.add(params, 'resolution', 20, 200).step(10).name('分辨率').onChange((value) => {
                heatMaterial.uniforms.uResolution.value = value;
                createHeatMap();
            });
            displayFolder.add(params, 'showGrid').name('显示网格').onChange((value) => {
                createHeatMap();
            });
            displayFolder.add(params, 'autoRotate').name('自动旋转视角').onChange((value) => {
                controls.autoRotate = value;
            });
            
            const colorFolder = gui.addFolder('颜色设置');
            colorFolder.addColor(params, 'colorLow').name('低温颜色').onChange((value) => {
                heatMaterial.uniforms.uColorLow.value.set(value);
            });
            colorFolder.addColor(params, 'colorMid').name('中温颜色').onChange((value) => {
                heatMaterial.uniforms.uColorMid.value.set(value);
            });
            colorFolder.addColor(params, 'colorHigh').name('高温颜色').onChange((value) => {
                heatMaterial.uniforms.uColorHigh.value.set(value);
            });
            colorFolder.addColor(params, 'backgroundColor').name('背景颜色').onChange((value) => {
                window.scene.background.set(value);
            });
            colorFolder.open();
        }
        
        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            if (heatMaterial) {
                heatMaterial.uniforms.uTime.value += 0.016 * params.animationSpeed;
            }
            
            window.renderer.render(window.scene, window.camera);
        }
    </script>
    
    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });
    </script>
</body>
</html>
