<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2D云彩着色器 - 使用噪声函数和fbm创建云彩效果">
    <meta name="three-version" content="r179">
    <title>2D云彩着色器</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.001, 10000);
        camera.position.z = 5;

        window.scene = new THREE.Scene();

        window.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0x1a2a3a);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(camera, window.renderer.domElement);

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                iUv: { value: new THREE.Vector2() },
                iResolution: { value: new THREE.Vector2() },
                iTime: { value: 0.0 }
            },
            vertexShader: vertexShader(),
            fragmentShader: fragmentShader()
        });

        const a = 51.2;
        const b = 7.2;

        const planeGeometry = new THREE.PlaneGeometry(a, b);
        const planeMesh = new THREE.Mesh(planeGeometry, shaderMaterial);
        window.scene.add(planeMesh);

        shaderMaterial.uniforms.iResolution.value.set(a, b);

        window.camera = camera;

        function animate() {
            requestAnimationFrame(animate);
            shaderMaterial.uniforms.iTime.value += 0.03;
            window.renderer.render(window.scene, window.camera);
        }

        function vertexShader() {
            return `
                varying vec2 iUv;

                void main() {
                    iUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
        }

        function fragmentShader() {
            return `
                varying vec2 iUv;
                uniform vec2 iResolution;
                uniform float iTime;

                const float cloudscale = 1.1;
                const float speed = 0.03;
                const float clouddark = 0.5;
                const float cloudlight = 0.3;
                const float cloudcover = 0.2;
                const float cloudalpha = 8.0;
                const float skytint = 0.5;
                const vec3 skycolour1 = vec3(0.2, 0.4, 0.6);
                const vec3 skycolour2 = vec3(0.4, 0.7, 1.0);
                const mat2 m = mat2(1.6, 1.2, -1.2, 1.6);

                vec2 hash(vec2 p) {
                    p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
                    return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
                }

                float noise(in vec2 p) {
                    const float K1 = 0.366025404;
                    const float K2 = 0.211324865;
                    vec2 i = floor(p + (p.x + p.y) * K1);
                    vec2 a = p - i + (i.x + i.y) * K2;
                    vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec2 b = a - o + K2;
                    vec2 c = a - 1.0 + 2.0 * K2;
                    vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
                    vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
                    return dot(n, vec3(70.0));
                }

                float fbm(vec2 n) {
                    float total = 0.0, amplitude = 0.1;
                    for (int i = 0; i < 7; i++) {
                        total += noise(n) * amplitude;
                        n = m * n;
                        amplitude *= 0.4;
                    }
                    return total;
                }

                void main() {
                    vec2 p = iUv.xy;
                    vec2 uv = p * vec2(iResolution.x / iResolution.y, 1.0);
                    float time = iTime * speed;
                    float q = fbm(uv * cloudscale * 0.5);

                    float r = 0.0;
                    uv *= cloudscale;
                    uv -= q - time;
                    float weight = 0.8;
                    for (int i = 0; i < 8; i++) {
                        r += abs(weight * noise(uv));
                        uv = m * uv + time;
                        weight *= 0.7;
                    }

                    float f = 0.0;
                    uv = p * vec2(iResolution.x / iResolution.y, 1.0);
                    uv *= cloudscale;
                    uv -= q - time;
                    weight = 0.7;
                    for (int i = 0; i < 8; i++) {
                        f += weight * noise(uv);
                        uv = m * uv + time;
                        weight *= 0.6;
                    }

                    f *= r + f;

                    float c = 0.0;
                    time = iTime * speed * 2.0;
                    uv = p * vec2(iResolution.x / iResolution.y, 1.0);
                    uv *= cloudscale * 2.0;
                    uv -= q - time;
                    weight = 0.4;
                    for (int i = 0; i < 7; i++) {
                        c += weight * noise(uv);
                        uv = m * uv + time;
                        weight *= 0.6;
                    }

                    float c1 = 0.0;
                    time = iTime * speed * 3.0;
                    uv = p * vec2(iResolution.x / iResolution.y, 1.0);
                    uv *= cloudscale * 3.0;
                    uv -= q - time;
                    weight = 0.4;
                    for (int i = 0; i < 7; i++) {
                        c1 += abs(weight * noise(uv));
                        uv = m * uv + time;
                        weight *= 0.6;
                    }

                    c += c1;

                    vec3 skycolour = mix(skycolour2, skycolour1, p.y);
                    vec3 cloudcolour = vec3(1.1, 1.1, 0.9) * clamp((clouddark + cloudlight * c), 0.0, 1.0);

                    f = cloudcover + cloudalpha * f * r;

                    vec3 result = mix(skycolour, clamp(skytint * skycolour + cloudcolour, 0.0, 1.0), clamp(f + c, 0.0, 1.0));

                    gl_FragColor = vec4(result, 1.0);
                }
            `;
        }

        animate();
    </script>

    <script>
        let _screenshotRenderer;
        const MAX_RETRY = 3;
        const RETRY_DELAY = 200;

        function doScreenshot(retryCount = 0) {
            try {
                if (!_screenshotRenderer && window.renderer) {
                    _screenshotRenderer = window.renderer;
                }

                if (!_screenshotRenderer) {
                    throw new Error('渲染器未初始化');
                }

                if (!window.scene || !window.camera) {
                    throw new Error('场景或相机未初始化');
                }

                _screenshotRenderer.render(window.scene, window.camera);

                const quality = 0.8;
                const canvas = _screenshotRenderer.domElement;

                if (canvas.width === 0 || canvas.height === 0) {
                    throw new Error('Canvas尺寸无效');
                }

                const tempCanvas = document.createElement('canvas');
                const maxSize = 600;
                const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                tempCanvas.width = Math.floor(canvas.width * scale);
                tempCanvas.height = Math.floor(canvas.height * scale);

                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                window.parent.postMessage({
                    type: 'screenshot-data',
                    dataUrl: dataUrl
                }, '*');

            } catch (error) {
                console.error('截图失败 (尝试 ' + (retryCount + 1) + '):', error);

                if (retryCount < MAX_RETRY) {
                    setTimeout(() => {
                        doScreenshot(retryCount + 1);
                    }, RETRY_DELAY * (retryCount + 1));
                } else {
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                requestAnimationFrame(() => {
                    doScreenshot();
                });
            }
        });
    </script>
</body>
</html>
