<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js UV雷达扩散特效 - 基于UV坐标的雷达波纹动画">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - UV雷达扩散特效</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        
        window.scene = null;
        window.camera = null;
        window.renderer = null;
        
        const params = {
            radarColor: '#00ff88',
            backgroundColor: '#001122',
            waveCount: 3,
            waveSpeed: 1.0,
            waveWidth: 0.15,
            gridDensity: 20,
            autoRotate: true,
            rotationSpeed: 0.5
        };
        
        let mesh;
        let controls;
        let material;
        
        init();
        animate();
        
        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(params.backgroundColor);
            
            window.camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(0, 3, 5);
            window.camera.lookAt(0, 0, 0);
            
            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);
            
            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            createMesh();
            initGUI();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function createMesh() {
            if (mesh) {
                window.scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            }
            
            const geometry = new THREE.PlaneGeometry(10, 10, 1, 1);
            
            material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uRadarColor: { value: new THREE.Color(params.radarColor) },
                    uBackgroundColor: { value: new THREE.Color(params.backgroundColor) },
                    uWaveCount: { value: params.waveCount },
                    uWaveSpeed: { value: params.waveSpeed },
                    uWaveWidth: { value: params.waveWidth },
                    uGridDensity: { value: params.gridDensity }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform vec3 uRadarColor;
                    uniform vec3 uBackgroundColor;
                    uniform float uWaveCount;
                    uniform float uWaveSpeed;
                    uniform float uWaveWidth;
                    uniform float uGridDensity;
                    
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(vUv, center);
                        
                        vec2 grid = fract(vUv * uGridDensity);
                        float gridLine = step(0.95, grid.x) + step(0.95, grid.y);
                        gridLine = min(gridLine, 1.0);
                        
                        float wave = 0.0;
                        for (float i = 0.0; i < 10.0; i++) {
                            if (i >= uWaveCount) break;
                            float delay = i * 0.3;
                            float waveDist = fract((uTime * uWaveSpeed - delay));
                            float ring = 1.0 - smoothstep(0.0, uWaveWidth, abs(dist - waveDist));
                            wave += ring * (1.0 - waveDist);
                        }
                        
                        float fadeOut = 1.0 - smoothstep(0.3, 0.5, dist);
                        wave *= fadeOut;
                        
                        vec3 color = mix(uBackgroundColor, uRadarColor, wave * 0.8);
                        
                        vec3 gridColor = mix(color, uRadarColor * 0.3, gridLine * 0.5);
                        
                        float alpha = 0.3 + wave * 0.7;
                        
                        gl_FragColor = vec4(gridColor, alpha);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide
            });
            
            mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            window.scene.add(mesh);
        }
        
        function initGUI() {
            const gui = new GUI({ title: '雷达参数控制', width: 300 });
            
            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';
            gui.domElement.style.maxHeight = '80vh';
            gui.domElement.style.overflowY = 'auto';
            
            setTimeout(() => {
                gui.show();
            }, 100);
            
            const colorFolder = gui.addFolder('颜色设置');
            colorFolder.addColor(params, 'radarColor').name('雷达颜色').onChange((value) => {
                material.uniforms.uRadarColor.value.set(value);
            });
            colorFolder.addColor(params, 'backgroundColor').name('背景颜色').onChange((value) => {
                material.uniforms.uBackgroundColor.value.set(value);
                window.scene.background.set(value);
            });
            colorFolder.open();
            
            const waveFolder = gui.addFolder('波纹设置');
            waveFolder.add(params, 'waveCount', 1, 10).step(1).name('波纹数量').onChange((value) => {
                material.uniforms.uWaveCount.value = value;
            });
            waveFolder.add(params, 'waveSpeed', 0.1, 5.0).name('波纹速度').onChange((value) => {
                material.uniforms.uWaveSpeed.value = value;
            });
            waveFolder.add(params, 'waveWidth', 0.05, 0.5).name('波纹宽度').onChange((value) => {
                material.uniforms.uWaveWidth.value = value;
            });
            waveFolder.add(params, 'gridDensity', 5, 50).step(1).name('网格密度').onChange((value) => {
                material.uniforms.uGridDensity.value = value;
            });
            waveFolder.open();
            
            const controlFolder = gui.addFolder('控制设置');
            controlFolder.add(params, 'autoRotate').name('自动旋转').onChange((value) => {
                controls.autoRotate = value;
            });
            controlFolder.add(params, 'rotationSpeed', 0.1, 2.0).name('旋转速度');
        }
        
        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (params.autoRotate) {
                controls.autoRotate = true;
                controls.autoRotateSpeed = params.rotationSpeed;
            }
            
            controls.update();
            
            if (material) {
                material.uniforms.uTime.value += 0.016;
            }
            
            window.renderer.render(window.scene, window.camera);
        }
    </script>
    
    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });
    </script>
</body>
</html>
