<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="canvas 2D风场图 - 使用Canvas绘制的风场流向图">
    <title>示例 - canvas 2D风场图</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a1a; }
        #canvas2d {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <canvas id="canvas2d"></canvas>

    <script src="../libs/windy.js"></script>
    <script>
        let canvas2d, ctx2d, bgCanvas, bgCtx;
        let animationId;
        let windy = null;

        async function init() {
            canvas2d = document.getElementById('canvas2d');
            ctx2d = canvas2d.getContext('2d');
            bgCanvas = document.getElementById('bgCanvas');
            bgCtx = bgCanvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            await loadBackground();
            await initWindy();
        }

        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            canvas2d.width = width;
            canvas2d.height = height;
            
            bgCanvas.width = width;
            bgCanvas.height = height;
            
            if (windy && windy.canvas) {
                windy.canvas.width = width;
                windy.canvas.height = height;
                windy.ctx.lineWidth = windy.lineWidth;
            }
        }

        async function loadBackground() {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = '../images/textures/world.jpg';
                img.onload = () => {
                    bgCtx.drawImage(img, 0, 0, bgCanvas.width, bgCanvas.height);
                    resolve();
                };
                img.onerror = () => {
                    console.warn('无法加载背景图片');
                    bgCtx.fillStyle = '#0a0a1a';
                    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
                    resolve();
                };
            });
        }

        async function fetchData(url) {
            const response = await fetch(url);
            return await response.json();
        }

        async function initWindy() {
            const header = await fetchData('../models/json/wind.json');
            
            windy = new Windy({
                header,
                canvas: canvas2d,
                speed: 0.1,
                particlesCount: 2000,
                maxAge: 120,
                frame: 10,
                color: {
                    0: 'rgba(255, 255, 200, 0)',
                    0.3: 'rgba(0, 255, 255, 0.5)',
                    0.6: 'rgba(0, 255, 0, 0.7)',
                    1: '#ffff00'
                },
                lineWidth: 2,
                imageUrl: '../images/textures/wind.png',
                autoAnimate: true
            });
        }

        function stopAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                stopAnimation();
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: canvas2d.toDataURL('image/jpeg', 0.8)
                    }, '*');
                }, 100);
            }
        });

        init();
    </script>
</body>
</html>
