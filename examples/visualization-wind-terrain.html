<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js示例 - 流过地形的风线">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 流过地形的风线</title>
    <link rel="stylesheet" href="../css/example-common.css">
    <style>
        body {
            overflow: hidden;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

        let scene, camera, renderer, controls, light;
        let simplex, terrain, lines = [];
        let canvas, context, texture;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('deepskyblue');

            camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight);
            camera.position.set(0, 2.5, 8);
            camera.lookAt(scene.position);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            light = new THREE.DirectionalLight('white');
            light.position.set(1, 1, 1);
            scene.add(light);

            simplex = new SimplexNoise();

            createTerrain();
            createTexture();
            createLines();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animationLoop);
        }

        function elevation(x, y) {
            if (x * x > 24.9) return -1;
            if (y * y > 24.9) return -1;

            let major = 0.6 * simplex.noise(0.1 * x, 0.1 * y);
            let minor = 0.2 * simplex.noise(0.3 * x, 0.3 * y);

            return major + minor;
        }

        function createTerrain() {
            let geometry = new THREE.PlaneGeometry(10, 10, 100, 100);
            let pos = geometry.getAttribute('position');

            for (let i = 0; i < pos.count; i++) {
                pos.setZ(i, elevation(pos.getX(i), pos.getY(i)));
            }

            geometry.computeVertexNormals();

            terrain = new THREE.Mesh(
                geometry,
                new THREE.MeshPhysicalMaterial({
                    roughness: 1,
                    metalness: 0,
                    color: 'seagreen'
                })
            );
            terrain.rotation.x = -Math.PI / 2;
            scene.add(terrain);
        }

        function createTexture() {
            canvas = document.createElement('CANVAS');
            canvas.width = 64;
            canvas.height = 8;

            context = canvas.getContext('2d');

            let gradient = context.createLinearGradient(0, 0, 64, 0);
            gradient.addColorStop(0.0, 'rgba(255,255,255,0)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,128)');
            gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 8);

            texture = new THREE.CanvasTexture(canvas);
        }

        function createLines() {
            let n = 10;

            for (let i = 0; i < n; i++) {
                let line = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1, 20, 1),
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.DoubleSide,
                        transparent: true,
                        depthWrite: false
                    })
                );
                line.pos = line.geometry.getAttribute('position');
                line.rnda = Math.random();
                line.rndb = Math.random();
                line.rndc = Math.random();
                line.rndd = Math.random();
                lines.push(line);
            }

            scene.add(...lines);
        }

        function flowLine(time, line) {
            time = time / 3000;
            for (let i = 0; i < 42; i++) {
                let t = time + (i % 21) / 60;
                let x = 4 * Math.sin(5 * line.rnda * t + 6 * line.rndb);
                let y = 4 * Math.cos(5 * line.rndc * t + 6 * line.rndd);
                let z = elevation(x, y) + 0.5 + 0.04 * (i > 20 ? 1 : -1) * Math.cos((i % 21 - 10) / 8);

                line.pos.setXYZ(i, x, z, -y);
            }
            line.pos.needsUpdate = true;
        }

        function animationLoop(t) {
            for (let line of lines) flowLine(t, line);

            controls.update();
            light.position.copy(camera.position);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        }

        init();
    </script>
    
    <script>
        let _screenshotRenderer;
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
