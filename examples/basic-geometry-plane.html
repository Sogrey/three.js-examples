<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="创建一个矩形平面，可调整宽度、高度和分段数。">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 矩形平面</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;
        let mesh;
        let controls;
        let texture;

        const params = {
            width: 4,
            height: 3,
            widthSegments: 1,
            heightSegments: 1,

            color: 0x3498db,
            metalness: 0.2,
            roughness: 0.5,
            wireframe: false,
            side: 'double',
            useTexture: true,

            autoRotate: true
        };

        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x2c3e50);

            window.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            window.camera.position.set(0, 6, 8);
            window.camera.lookAt(0, 0, 0);

            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);

            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = params.autoRotate;

            const textureLoader = new THREE.TextureLoader();
            texture = textureLoader.load('../images/textures/uv-grid.jpg');
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);

            createPlane();
            initGUI();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 5, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0x84c3be, 0.5);
            directionalLight2.position.set(-5, -2, -5);
            scene.add(directionalLight2);

            const gridHelper = new THREE.GridHelper(10, 10, 0x888888, 0x444444);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function createPlane() {
            if (mesh) {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            }

            const geometry = new THREE.PlaneGeometry(
                params.width,
                params.height,
                params.widthSegments,
                params.heightSegments
            );

            let side;
            switch(params.side) {
                case 'front':
                    side = THREE.FrontSide;
                    break;
                case 'back':
                    side = THREE.BackSide;
                    break;
                case 'double':
                default:
                    side = THREE.DoubleSide;
                    break;
            }

            const material = new THREE.MeshStandardMaterial({
                color: params.color,
                metalness: params.metalness,
                roughness: params.roughness,
                wireframe: params.wireframe,
                side: side,
                map: params.useTexture ? texture : null
            });

            mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            scene.add(mesh);
        }

        function initGUI() {
            const gui = new GUI({ title: '参数控制面板', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';
            gui.domElement.style.maxHeight = '80vh';
            gui.domElement.style.overflowY = 'auto';

            setTimeout(() => {
                gui.show();
                for (const controller of gui.controllers) {
                    controller.updateDisplay();
                }
            }, 100);

            const geometryFolder = gui.addFolder('几何体参数');
            geometryFolder.add(params, 'width', 1, 10)
                .onChange(createPlane)
                .name('宽度');
            geometryFolder.add(params, 'height', 1, 10)
                .onChange(createPlane)
                .name('高度');
            geometryFolder.add(params, 'widthSegments', 1, 20)
                .step(1)
                .onChange(createPlane)
                .name('宽度分段数');
            geometryFolder.add(params, 'heightSegments', 1, 20)
                .step(1)
                .onChange(createPlane)
                .name('高度分段数');
            geometryFolder.open();

            const materialFolder = gui.addFolder('材质参数');
            materialFolder.add(params, 'metalness', 0, 1)
                .step(0.01)
                .onChange(value => {
                    mesh.material.metalness = value;
                })
                .name('金属度');
            materialFolder.add(params, 'roughness', 0, 1)
                .step(0.01)
                .onChange(value => {
                    mesh.material.roughness = value;
                })
                .name('粗糙度');
            materialFolder.addColor(params, 'color')
                .onChange(value => {
                    mesh.material.color.set(value);
                })
                .name('颜色');
            materialFolder.add(params, 'wireframe')
                .onChange(value => {
                    mesh.material.wireframe = value;
                })
                .name('线框模式');
            materialFolder.add(params, 'side', ['front', 'back', 'double'])
                .onChange(value => {
                    switch(value) {
                        case 'front':
                            mesh.material.side = THREE.FrontSide;
                            break;
                        case 'back':
                            mesh.material.side = THREE.BackSide;
                            break;
                        case 'double':
                            mesh.material.side = THREE.DoubleSide;
                            break;
                    }
                    mesh.material.needsUpdate = true;
                })
                .name('渲染面');
            materialFolder.add(params, 'useTexture')
                .onChange(value => {
                    mesh.material.map = value ? texture : null;
                    mesh.material.needsUpdate = true;
                })
                .name('使用纹理');
            materialFolder.open();

            const animationFolder = gui.addFolder('动画参数');
            animationFolder.add(params, 'autoRotate')
                .name('自动旋转')
                .onChange(value => {
                    controls.autoRotate = value;
                    params.autoRotate = value;
                });
            animationFolder.open();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            window.renderer.render(window.scene, window.camera);
        }

        init();
    </script>

    <script>
        let _screenshotRenderer;

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }

                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }

                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }

                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
