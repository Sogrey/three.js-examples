<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js三球轮播 - 沉浸式落地页</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        /* 页面容器 - 用于滚动翻页 */
        .page {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }
        
        /* 每一屏都占据视口 */
        .screen {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 2;
            pointer-events: none; /* 让文字层不干扰点击，但依然可以显示 */
        }
        
        /* 第一屏的两个子屏用于过渡动画，这里简化，直接展示内容 */
        .wrap-1 {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        
        /* Canvas 容器，位于底层 */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #0a0a2a 0%, #000000 100%);
        }
        
        /* 内容层，位于顶层，但允许点击穿透到canvas */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }
        
        .title {
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: 4px;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #aaccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            animation: bounce 2s infinite;
            pointer-events: none;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }
        
        /* 第二屏、第三屏样式 */
        .screen-2, .screen-3 {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: auto; /* 卡片区域可以交互，但本例中只是展示 */
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2rem; }
            .card { padding: 20px; width: 90%; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="page" id="page-container">
        <!-- 第一屏包含两个子屏内容的区域，这里简化为直接在第一屏显示内容，通过滚动进入第二屏 -->
        <div class="wrap-1">
            <div class="screen screen-1">
                <div class="content">
                    <div class="title">三体·引力交响</div>
                    <div class="subtitle">Three.js 沉浸式球体轮播</div>
                </div>
                <div class="scroll-hint">向下滚动 探索宇宙</div>
            </div>
        </div>
        <div class="screen screen-2">
            <div class="card">
                <h2>无序之恒纪元</h2>
                <p>三个太阳的世界，运动毫无规律。点击任意球体，让它成为焦点，感受引力下的轮转。</p>
                <p style="font-size: 14px; margin-top: 20px;">✨ 球体具有大气散射与边缘发光效果 ✨</p>
            </div>
        </div>
        <div class="screen screen-3">
            <div class="card">
                <h2>技术栈</h2>
                <p>Three.js + GSAP + Raycaster</p>
                <p>自定义着色器材质 | 响应式动态定位 | 丝滑轮播动画</p>
                <button id="reset-view" style="margin-top: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 30px; cursor: pointer; pointer-events: auto;">重置视角</button>
            </div>
        </div>
    </div>

    <!-- 引入 Three.js 核心库以及扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/",
                "gsap": "../libs/gsap/index.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import gsap from 'gsap';

        // --- 初始化场景、相机、渲染器 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null; // 透明背景，让 CSS 渐变透出
        scene.fog = new THREE.FogExp2(0x050510, 0.008); // 轻微雾效增强景深

        // 透视相机: 视野, 宽高比, 近平面, 远平面
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha 透明背景
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x000000, 0); // 完全透明
        container.appendChild(renderer.domElement);

        // 辅助点缀: 添加一些星星粒子背景 (增强视觉效果)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100;
            starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // 让星星缓慢旋转
        function animateStars() {
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- 核心: 透明平面用于射线定位 (响应式边缘计算) ---
        // 创建一个足够大的平面，用于射线检测，确定屏幕边缘在3D空间中的位置
        const planeHelper = new THREE.Mesh(
            new THREE.PlaneGeometry(25, 20),
            new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }) // 不可见但射线可检测
        );
        scene.add(planeHelper);
        
        // 存储三个球体
        const balls = [];
        const raycaster = new THREE.Raycaster();
        
        // 当前激活的球体 (1,2,3) 对应索引 0,1,2
        let nowActive = 1; // 默认球体2在中间
        
        // --- 着色器代码 (顶点与片段) ---
        // 顶点着色器: 传递 uv 和 法线
        const vertexShader = `
            varying vec2 vertexUV;
            varying vec3 vertexNormal;
            void main() {
                vertexUV = uv;
                vertexNormal = normalize(normalMatrix * normal);
                gl_PointSize = 1.0;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        
        // 片段着色器: 实现大气散射 + 边缘发光
        const fragmentShader = `
            uniform sampler2D globeTexture;
            uniform vec3 atmosphereColor;
            varying vec2 vertexUV;
            varying vec3 vertexNormal;
            void main() {
                // 视线方向 (相机空间 Z 轴正方向指向屏幕外，但为了边缘光，简单用法线与视线夹角)
                // 在视图空间中，视线方向指向相机，近似为 (0,0,1)
                vec3 viewDir = vec3(0.0, 0.0, 1.0);
                float intensity = 1.05 - dot(vertexNormal, viewDir);
                // 大气层颜色，强度映射
                vec3 atmosphere = atmosphereColor * pow(intensity, 1.5);
                // 边缘发光 (强度更高次幂)
                float edgeGlow = pow(intensity, 6.0) * 0.7;
                vec3 edgeColor = vec3(1.0, 0.9, 0.7) * edgeGlow;
                // 贴图颜色
                vec3 texColor = texture2D(globeTexture, vertexUV).rgb;
                // 最终颜色混合: 大气 + 贴图 + 边缘光
                vec3 finalColor = atmosphere + texColor + edgeColor;
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;
        
        // 生成随机纹理或使用 Canvas 制作风格化纹理 (因为无法加载外部图片，使用 Canvas 生成抽象纹理，模拟星球)
        function createProceduralTexture(baseColor, patternColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // 绘制随机斑点模拟星球表面
            for (let i = 0; i < 400; i++) {
                ctx.beginPath();
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 30 + 5;
                const alpha = Math.random() * 0.5 + 0.2;
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = patternColor;
                ctx.fill();
            }
            // 绘制高光条纹
            ctx.strokeStyle = 'rgba(255,255,200,0.4)';
            ctx.lineWidth = 20;
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                const startX = Math.random() * canvas.width;
                const startY = Math.random() * canvas.height;
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + (Math.random() - 0.5) * 200, startY + (Math.random() - 0.5) * 200);
                ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 1);
            return texture;
        }
        
        // 创建三个不同色调的纹理和大气颜色
        const tex1 = createProceduralTexture('#3a6ea5', '#c9e2ff');
        const tex2 = createProceduralTexture('#5a3a6e', '#e0b0ff');
        const tex3 = createProceduralTexture('#6e5a3a', '#ffd68a');
        
        const atmosColor1 = new THREE.Color(0.2, 0.4, 0.8);
        const atmosColor2 = new THREE.Color(0.6, 0.2, 0.8);
        const atmosColor3 = new THREE.Color(0.8, 0.5, 0.2);
        
        const geometry = new THREE.SphereGeometry(1.2, 128, 128); // 高细分球体
        
        function createBall(texture, atmosColor, id) {
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    globeTexture: { value: texture },
                    atmosphereColor: { value: atmosColor }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: false,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.userData = { active: id };
            scene.add(mesh);
            return mesh;
        }
        
        const ball1 = createBall(tex1, atmosColor1, 1);
        const ball2 = createBall(tex2, atmosColor2, 2);
        const ball3 = createBall(tex3, atmosColor3, 3);
        balls.push(ball1, ball2, ball3);
        
        // --- 辅助函数: 通过射线计算屏幕边缘点在3D空间中的位置 ---
        // 输入屏幕坐标 (x, y) 范围 0-1 (0左/上, 1右/下), 返回与平面的交点
        function getScreenEdgePosition(screenX, screenY) {
            // 转换到NDC
            const ndcX = (screenX / window.innerWidth) * 2 - 1;
            const ndcY = -(screenY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
            const intersects = raycaster.intersectObject(planeHelper);
            if (intersects.length > 0) {
                return intersects[0].point.clone();
            }
            return new THREE.Vector3(0, 0, 0);
        }
        
        // 计算所有关键位置: 左边缘中心、右边缘中心、屏幕中间底部等
        // 策略: 左边缘球体中心位于屏幕左边缘外侧一半处 => 我们需要获取左边缘点，然后 x 偏移 -1.2 (半径)
        // 为了效果美观，让三个球体呈三角形排列: 左、右、下 (中间)
        function calculateResponsivePositions() {
            // 获取左边缘中点 (x=0, y=屏幕中心)
            const leftEdge = getScreenEdgePosition(0, window.innerHeight / 2);
            // 右边缘中点
            const rightEdge = getScreenEdgePosition(window.innerWidth, window.innerHeight / 2);
            // 底部中心位置 (用于中间的球体悬停)
            const bottomCenter = getScreenEdgePosition(window.innerWidth / 2, window.innerHeight * 0.85);
            // 中心上方一点 (激活位置)
            const centerActive = getScreenEdgePosition(window.innerWidth / 2, window.innerHeight / 2);
            centerActive.z = 0;
            
            // 调整左右位置的Z轴，使其稍微突出或者保持在同一平面
            leftEdge.z = 0;
            rightEdge.z = 0;
            bottomCenter.z = 0;
            
            // 为了三角形布局: 左球在左边缘，右球在右边缘，中球在底部中间
            // 但轮播时会有位置映射，我们需要定义6个位置: left, right, bottom, topCenter(active), leftOut, rightOut
            // 简化但实现文章中的循环逻辑: 状态1: 球2中(底部),球1左,球3右; 状态2: 球3中,球2右,球1左; 状态3: 球1中,球3左,球2右;
            // 修改: 为了使视觉效果更好，让激活的球体上升到屏幕中央，非激活球体在左右两侧偏下位置
            const activePos = centerActive;
            const leftPos = leftEdge.clone();
            leftPos.y -= 1.5; // 让左右球位置稍低
            const rightPos = rightEdge.clone();
            rightPos.y -= 1.5;
            // 预备位置 (在屏幕外，用于轮换过渡)
            const leftOutPos = leftEdge.clone();
            leftOutPos.x -= 2.5;
            leftOutPos.y -= 1.5;
            const rightOutPos = rightEdge.clone();
            rightOutPos.x += 2.5;
            rightOutPos.y -= 1.5;
            
            return { activePos, leftPos, rightPos, leftOutPos, rightOutPos };
        }
        
        // 动画切换函数
        let activeTimeline = null;
        function animateBallsToState(activeId) {
            if (activeTimeline) activeTimeline.kill();
            const positions = calculateResponsivePositions();
            // 定义不同状态下三个球体各自的目标位置
            // 状态1: 球1在左，球2在中间(激活)，球3在右
            // 状态2: 球1在右，球2在右外(待切)，球3在中 -> 稍调整为了视觉平衡，重新映射
            // 根据文章思路: 循环左中右移位。但为了让效果更明显，采用类似轮盘: 激活的球到activePos，其他两个分别到leftPos和rightPos
            let targets = [];
            if (activeId === 1) {
                targets = [positions.activePos, positions.leftPos, positions.rightPos];
            } else if (activeId === 2) {
                targets = [positions.rightPos, positions.activePos, positions.leftPos];
            } else {
                targets = [positions.leftPos, positions.rightPos, positions.activePos];
            }
            
            activeTimeline = gsap.timeline();
            balls.forEach((ball, idx) => {
                const targetPos = targets[idx];
                activeTimeline.to(ball.position, {
                    x: targetPos.x,
                    y: targetPos.y,
                    z: targetPos.z,
                    duration: 1.2,
                    ease: "power2.inOut",
                    overwrite: true
                }, 0);
            });
            // 同时让相机轻微晃动? 或球体自转动画在循环中处理即可
        }
        
        // 初始化球体位置 (状态1)
        function initPositions() {
            const pos = calculateResponsivePositions();
            ball1.position.copy(pos.leftPos);
            ball2.position.copy(pos.activePos);
            ball3.position.copy(pos.rightPos);
            nowActive = 2; // 球2居中
        }
        
        // 窗口大小改变时重新计算位置并平滑移动
        let resizeTimeout;
        window.addEventListener('resize', () => {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                // 更新相机比例
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                // 重新定位球体到当前激活状态
                animateBallsToState(nowActive);
            }, 100);
        });
        
        // --- 射线交互: 点击球体切换激活 ---
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.top = 0;
        renderer.domElement.style.left = 0;
        renderer.domElement.style.cursor = 'pointer';
        
        function onClickCanvas(event) {
            // 计算鼠标位置归一化坐标
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(balls);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const newActive = hit.userData.active;
                if (newActive !== nowActive) {
                    nowActive = newActive;
                    animateBallsToState(nowActive);
                    // 添加简单震动反馈
                    gsap.to(hit.scale, { duration: 0.2, x: 1.1, y: 1.1, z: 1.1, yoyo: true, repeat: 1 });
                }
            }
        }
        
        renderer.domElement.addEventListener('click', onClickCanvas);
        
        // 自动轮播 (可选，为了展示效果，每5秒切换一次)
        let autoTimer;
        function startAutoRotate() {
            if (autoTimer) clearInterval(autoTimer);
            autoTimer = setInterval(() => {
                let next = nowActive + 1;
                if (next > 3) next = 1;
                nowActive = next;
                animateBallsToState(nowActive);
            }, 5000);
        }
        startAutoRotate();
        
        // 当用户交互时暂停自动轮播
        renderer.domElement.addEventListener('mouseenter', () => {
            if (autoTimer) clearInterval(autoTimer);
        });
        renderer.domElement.addEventListener('mouseleave', () => {
            startAutoRotate();
        });
        
        // --- 滚动翻页逻辑 ---
        const pages = document.querySelectorAll('.screen');
        const pageContainer = document.getElementById('page-container');
        let isScrollingPage = false;
        let currentScreenIndex = 0;
        
        function scrollToScreen(index) {
            if (isScrollingPage) return;
            if (index < 0) index = 0;
            if (index >= pages.length) index = pages.length - 1;
            if (index === currentScreenIndex) return;
            isScrollingPage = true;
            const targetTop = pages[index].offsetTop;
            gsap.to(pageContainer, {
                scrollTop: targetTop,
                duration: 0.8,
                ease: "power2.inOut",
                onComplete: () => {
                    isScrollingPage = false;
                    currentScreenIndex = index;
                    // 当滚动到第二屏以后，可以稍微改变相机视角或者不做处理，为了沉浸，保持球体可见
                }
            });
        }
        
        // 监听滚轮事件
        let wheelTimer;
        pageContainer.addEventListener('wheel', (e) => {
            if (isScrollingPage) return;
            if (wheelTimer) clearTimeout(wheelTimer);
            const delta = e.deltaY;
            if (delta > 20) {
                scrollToScreen(currentScreenIndex + 1);
            } else if (delta < -20) {
                scrollToScreen(currentScreenIndex - 1);
            }
            wheelTimer = setTimeout(() => {}, 200);
        });
        
        // 重置视角按钮逻辑
        document.getElementById('reset-view')?.addEventListener('click', () => {
            // 重置相机位置和球体状态
            camera.position.set(0, 0, 12);
            camera.lookAt(0, 0, 0);
            nowActive = 2;
            animateBallsToState(nowActive);
        });
        
        // 启动渲染循环
        function renderLoop() {
            renderer.render(scene, camera);
            requestAnimationFrame(renderLoop);
        }
        
        // 初次计算定位
        setTimeout(() => {
            initPositions();
            renderLoop();
        }, 100);
        
        // 给平面一个合适的位置，确保射线能碰到 (放在相机视野中心)
        planeHelper.position.set(0, 0, 0);
        // 响应初始尺寸
        window.dispatchEvent(new Event('resize'));
        
        // 小彩蛋: 控制台输出
        console.log('Three.js 三球轮播已启动 | 点击球体切换焦点 | 滚动翻页');
        
        // 将 Three.js 对象暴露到 window 以便截图功能使用
        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;

        // 截图功能 - 监听来自父窗口的消息
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    let _screenshotRenderer = window.renderer;
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    // 强制渲染一帧，确保内容是最新的
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
