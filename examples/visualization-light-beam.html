<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基础光束流动效果</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <script type="importmap">
    {
        "imports": {
            "three": "../libs/three/r179/build/three.module.js",
            "three/addons/": "../libs/three/r179/jsm/"
        }
    }
  </script>
  
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let scene, camera, renderer, controls, composer;
    let materials = [];
    const speed = 0.005;

    function init() {
      const container = document.getElementById('canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
      camera.position.set(69.92, 55.65, 143.17);

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      initLight();
      createLightBeams();
      initPostProcessing();
      animate();
    }

    function initLight() {
      const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
      scene.add(ambientLight);
    }

    function createLightBeams() {
      const commonUniforms = {
        uFade: { value: new THREE.Vector2(0, 0.6) },
        uOffset: { value: new THREE.Vector2(40, 20) }
      };

      const lineWidth = 0.5;
      const width = 88;
      const height = 400;
      const gap = 8;
      const amount = 20;

      const spline = new THREE.LineCurve3(
        new THREE.Vector3(0, 0, height * 0.25),
        new THREE.Vector3(0, 0, -height * 0.75)
      );
      const geometry = new THREE.TubeGeometry(spline, height, lineWidth, 8, false);

      const vertexShader = `
        varying vec2 vUv;
        void main(void) {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`;

      const fragmentShader = `
        varying vec2 vUv;
        uniform float uSpeed;
        uniform float uTime;
        uniform vec2 uFade;
        uniform vec3 uColor;
        uniform float uDirection;
        void main() {
            vec3 color = uColor;
            float s = 0.0;
            float v = 0.0;
            if(uDirection == 1.0) {
                v = vUv.x;
                s = -uTime * uSpeed;
            } else {
                v = -vUv.x;
                s = -uTime * uSpeed;
            }
            float d = mod((v + s), 1.0);
            if(d > uFade.y) discard;
            else {
                float alpha = smoothstep(uFade.x, uFade.y, d);
                if(alpha < 0.0001) discard;
                gl_FragColor = vec4(color, alpha);
            }
        }`;

      const step = (width - gap) / amount;
      for (let i = 0; i < amount; i++) {
        const c = new THREE.Color();
        const v = i / amount;
        c.setHSL(
          THREE.MathUtils.lerp(0.7, 0.2, v),
          1,
          THREE.MathUtils.lerp(0.5, 1.0, v)
        );

        const material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          transparent: true,
          uniforms: {
            uColor: { value: c },
            uTime: { value: THREE.MathUtils.lerp(-1, 1, Math.random()) },
            uDirection: { value: i < amount * 0.5 ? 1 : 0 },
            uSpeed: { value: THREE.MathUtils.lerp(1, 1.5, Math.random()) },
            ...commonUniforms
          },
          vertexShader,
          fragmentShader
        });

        materials.push(material);
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.x = i * step + (i > amount * 0.5 - 1 ? gap : 0);
        mesh.position.y = Math.random() * 5;
        scene.add(mesh);
      }
    }

    function initPostProcessing() {
      const params = {
        threshold: 0,
        strength: 0.5,
        radius: 0.5
      };

      const renderScene = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
      bloomPass.threshold = params.threshold;
      bloomPass.strength = params.strength;
      bloomPass.radius = params.radius;

      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);
    }

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      materials.forEach((m) => {
        m.uniforms.uTime.value += speed;
        if (m.uniforms.uTime.value > 1) {
          m.uniforms.uTime.value = 0;
        }
      });

      renderer.autoClear = false;
      renderer.clear();
      composer.render();
      renderer.clearDepth();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      composer.setSize(width, height);
    }

    window.addEventListener('resize', onWindowResize);
    init();
  </script>
</body>
</html>
