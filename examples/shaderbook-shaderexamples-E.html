<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="云彩着色器 - 使用多层噪声混合创建云朵效果">
    <meta name="three-version" content="r179">
    <title>云彩着色器</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.001, 10000);
        camera.position.z = 5;

        window.scene = new THREE.Scene();

        window.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0x1a2a3a);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const controls = new OrbitControls(camera, window.renderer.domElement);

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                iUv: { value: new THREE.Vector2() },
                iResolution: { value: new THREE.Vector2() },
                iTime: { value: 0.0 }
            },
            vertexShader: vertexShader(),
            fragmentShader: fragmentShader()
        });

        const a = 51.2;
        const b = 7.2;

        const planeGeometry = new THREE.PlaneGeometry(a, b);
        const planeMesh = new THREE.Mesh(planeGeometry, shaderMaterial);
        window.scene.add(planeMesh);

        shaderMaterial.uniforms.iResolution.value.set(a, b);

        window.camera = camera;

        function animate() {
            requestAnimationFrame(animate);
            shaderMaterial.uniforms.iTime.value += 0.03;
            window.renderer.render(window.scene, window.camera);
        }

        function vertexShader() {
            return `
                varying vec2 iUv;

                void main() {
                    iUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
        }

        function fragmentShader() {
            return `
                varying vec2 iUv;
                uniform vec2 iResolution;
                uniform float iTime;

                float noise(vec2 pq) {
                    return fract(
                        sin(
                            (pq.x * 19.) + iTime / 11111111150. +
                            (pq.y * 180.) + iTime / 11111111150.
                        ) * 360.
                    );
                }

                float noiseSmooth(vec2 pq) {
                    vec2 index = floor(pq);
                    vec2 frag = fract(pq);
                    frag = smoothstep(0.0, 1.0, frag);

                    float topLeft = noise(index);
                    float topRight = noise(index + vec2(1, 0));
                    float top = mix(topLeft, topRight, frag.x);

                    float bottomLeft = noise(index + vec2(0, 1));
                    float bottomRight = noise(index + vec2(1, 1));
                    float bottom = mix(bottomLeft, bottomRight, frag.x);

                    return mix(top, bottom, frag.y);
                }

                void main() {
                    vec2 uv = iUv;
                    uv.x *= iResolution.x / iResolution.y;

                    vec3 sky = vec3(0.09, 0.7, 1.5) * (1.5 - uv.y) / (1.5 - uv.y) * 0.5;

                    uv.x += iTime / 35.;

                    vec2 uv2 = uv;
                    uv2 += sin(iTime / 120.);
                    vec2 uv3 = uv;
                    uv3 += cos(iTime / 90.);

                    vec3 col = vec3(noiseSmooth(uv * 2.));
                    col += vec3(noiseSmooth(uv3 * 32.)) * 0.125;
                    col += vec3(noiseSmooth(uv3 * 64.)) * 0.0625;
                    col += vec3(noiseSmooth(uv2 * 16.)) * 0.25;
                    col += vec3(noiseSmooth(uv * 8.)) * 0.5;
                    col /= 1.5;

                    col *= smoothstep(0.2, 0.9, (col + vec3(noiseSmooth(uv2 * 8.)) * 0.5) - 0.1);
                    col = mix(vec3(1.), sky, 1.0 - col);

                    gl_FragColor = vec4(col, 1.0);
                }
            `;
        }

        animate();
    </script>

    <script>
        let _screenshotRenderer;
        const MAX_RETRY = 3;
        const RETRY_DELAY = 200;

        function doScreenshot(retryCount = 0) {
            try {
                if (!_screenshotRenderer && window.renderer) {
                    _screenshotRenderer = window.renderer;
                }

                if (!_screenshotRenderer) {
                    throw new Error('渲染器未初始化');
                }

                if (!window.scene || !window.camera) {
                    throw new Error('场景或相机未初始化');
                }

                _screenshotRenderer.render(window.scene, window.camera);

                const quality = 0.8;
                const canvas = _screenshotRenderer.domElement;

                if (canvas.width === 0 || canvas.height === 0) {
                    throw new Error('Canvas尺寸无效');
                }

                const tempCanvas = document.createElement('canvas');
                const maxSize = 600;
                const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                tempCanvas.width = Math.floor(canvas.width * scale);
                tempCanvas.height = Math.floor(canvas.height * scale);

                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                window.parent.postMessage({
                    type: 'screenshot-data',
                    dataUrl: dataUrl
                }, '*');

            } catch (error) {
                console.error('截图失败 (尝试 ' + (retryCount + 1) + '):', error);

                if (retryCount < MAX_RETRY) {
                    setTimeout(() => {
                        doScreenshot(retryCount + 1);
                    }, RETRY_DELAY * (retryCount + 1));
                } else {
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                requestAnimationFrame(() => {
                    doScreenshot();
                });
            }
        });
    </script>
</body>
</html>
