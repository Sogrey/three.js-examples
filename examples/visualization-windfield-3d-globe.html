<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three.js 3D风场图地球 - 地球上的风场流动可视化">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 3D风场图地球</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        
        window.scene = null;
        window.camera = null;
        window.renderer = null;
        
        const params = {
            particleCount: 8000,
            windSpeed: 1.0,
            particleSize: 0.15,
            colorLow: '#0000ff',
            colorMid: '#00ff00',
            colorHigh: '#ff0000',
            earthColor: '#1a1a2e',
            atmosphereColor: '#4fc3f7',
            autoRotate: true,
            rotationSpeed: 0.5
        };
        
        let earth;
        let particles;
        let controls;
        let particleMaterial;
        
        init();
        animate();
        
        function init() {
            window.scene = new THREE.Scene();
            window.scene.background = new THREE.Color(0x000510);
            
            window.camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            window.camera.position.set(0, 5, 10);
            window.camera.lookAt(0, 0, 0);
            
            window.renderer = new THREE.WebGLRenderer({ antialias: true });
            window.renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('threeContainer').appendChild(window.renderer.domElement);
            
            controls = new OrbitControls(window.camera, window.renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = params.rotationSpeed;
            
            createEarth();
            createWindParticles();
            initGUI();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function createEarth() {
            if (earth) {
                window.scene.remove(earth);
                earth.geometry.dispose();
                earth.material.dispose();
            }
            
            const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
            const earthMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uEarthColor: { value: new THREE.Color(params.earthColor) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uEarthColor;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    
                    void main() {
                        float fresnel = pow(1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        vec3 color = mix(uEarthColor, uEarthColor * 0.5, fresnel);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
            
            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            window.scene.add(earth);
            
            const glowGeometry = new THREE.SphereGeometry(2.15, 64, 64);
            const glowMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uAtmosphereColor: { value: new THREE.Color(params.atmosphereColor) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uAtmosphereColor;
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(uAtmosphereColor, intensity * 0.6);
                    }
                `,
                transparent: true,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            
            const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
            window.scene.add(glowMesh);
        }
        
        function getWindOnSphere(lat, lon, time) {
            const windX = Math.sin(lat * 2 + time) * Math.cos(lon * 3 + time * 0.7);
            const windY = Math.sin(lat * 1.5 - time * 0.3) * Math.cos(lon * 2);
            const windZ = Math.cos(lat * 2.5 + time * 0.5) * Math.sin(lon * 2.5);
            const speed = Math.sqrt(windX * windX + windY * windY + windZ * windZ);
            return {
                x: windX / (speed + 0.1),
                y: windY / (speed + 0.1),
                z: windZ / (speed + 0.1),
                speed: Math.min(speed, 1.0)
            };
        }
        
        function getWindSpeedColor(speed) {
            const colorLow = new THREE.Color(params.colorLow);
            const colorMid = new THREE.Color(params.colorMid);
            const colorHigh = new THREE.Color(params.colorHigh);
            
            if (speed < 0.5) {
                return colorLow.clone().lerp(colorMid, speed * 2);
            } else {
                return colorMid.clone().lerp(colorHigh, (speed - 0.5) * 2);
            }
        }
        
        function createWindParticles() {
            if (particles) {
                window.scene.remove(particles);
                particles.geometry.dispose();
                particles.material.dispose();
            }
            
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(params.particleCount * 3);
            const colors = new Float32Array(params.particleCount * 3);
            const sizes = new Float32Array(params.particleCount);
            const randoms = new Float32Array(params.particleCount);
            
            for (let i = 0; i < params.particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                const x = Math.sin(phi) * Math.cos(theta) * 2.05;
                const y = Math.sin(phi) * Math.sin(theta) * 2.05;
                const z = Math.cos(phi) * 2.05;
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                
                const color = getWindSpeedColor(Math.random());
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                
                sizes[i] = Math.random() * 0.2 + 0.1;
                randoms[i] = Math.random();
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('random', new THREE.BufferAttribute(randoms, 1));
            
            particleMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uParticleSize: { value: params.particleSize }
                },
                vertexShader: `
                    attribute float size;
                    attribute float random;
                    varying vec3 vColor;
                    uniform float uTime;
                    uniform float uParticleSize;

                    void main() {
                        vColor = color;

                        vec3 pos = position;
                        float time = uTime * 0.5 + random * 100.0;

                        float lat = asin(clamp(pos.y / 2.05, -1.0, 1.0));
                        float lon = atan(pos.z, pos.x);

                        vec3 wind = vec3(
                            sin(lat * 2.0 + time) * cos(lon * 3.0 + time * 0.7),
                            sin(lat * 1.5 - time * 0.3) * cos(lon * 2.0),
                            cos(lat * 2.5 + time * 0.5) * sin(lon * 2.5)
                        );
                        float windSpeed = length(wind);
                        if (windSpeed > 0.001) {
                            wind = wind / windSpeed;
                        }

                        float moveSpeed = 0.02 * min(windSpeed, 1.0);
                        lat += wind.x * moveSpeed;
                        lon += wind.z * moveSpeed;

                        lat = clamp(lat, -1.55, 1.55);

                        float newX = sin(clamp(lat, -1.55, 1.55)) * cos(lon) * 2.05;
                        float newY = sin(clamp(lat, -1.55, 1.55));
                        float newZ = sin(clamp(lat, -1.55, 1.55)) * sin(lon) * 2.05;

                        pos.x = newX;
                        pos.y = newY;
                        pos.z = newZ;

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = uParticleSize * size * (200.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;

                    void main() {
                        float dist = length(gl_PointCoord - vec2(0.5));
                        if (dist > 0.5) discard;

                        float alpha = smoothstep(0.5, 0.2, dist) * 0.8;
                        gl_FragColor = vec4(vColor, alpha);
                    }
                `,
                transparent: true,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            particles = new THREE.Points(geometry, particleMaterial);
            window.scene.add(particles);
        }
        
        function initGUI() {
            const gui = new GUI({ title: '风场地球参数控制', width: 300 });
            
            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';
            gui.domElement.style.maxHeight = '80vh';
            gui.domElement.style.overflowY = 'auto';
            
            setTimeout(() => {
                gui.show();
            }, 100);
            
            const particleFolder = gui.addFolder('粒子设置');
            particleFolder.add(params, 'particleCount', 2000, 15000).step(100).name('粒子数量').onChange(() => {
                createWindParticles();
            });
            particleFolder.add(params, 'particleSize', 0.05, 0.5).name('粒子大小').onChange((value) => {
                particleMaterial.uniforms.uParticleSize.value = value;
            });
            particleFolder.open();
            
            const windFolder = gui.addFolder('风场设置');
            windFolder.add(params, 'windSpeed', 0.1, 3.0).name('风速');
            
            const colorFolder = gui.addFolder('颜色设置');
            colorFolder.addColor(params, 'colorLow').name('低速颜色');
            colorFolder.addColor(params, 'colorMid').name('中速颜色');
            colorFolder.addColor(params, 'colorHigh').name('高速颜色');
            colorFolder.addColor(params, 'earthColor').name('地球颜色').onChange((value) => {
                earth.material.uniforms.uEarthColor.value.set(value);
            });
            colorFolder.addColor(params, 'atmosphereColor').name('大气颜色');
            colorFolder.open();
            
            const controlFolder = gui.addFolder('控制设置');
            controlFolder.add(params, 'autoRotate').name('自动旋转').onChange((value) => {
                controls.autoRotate = value;
            });
            controlFolder.add(params, 'rotationSpeed', 0.1, 2.0).name('旋转速度');
        }
        
        function onWindowResize() {
            window.camera.aspect = window.innerWidth / window.innerHeight;
            window.camera.updateProjectionMatrix();
            window.renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            if (particleMaterial) {
                particleMaterial.uniforms.uTime.value += 0.016 * params.windSpeed;
            }
            
            window.renderer.render(window.scene, window.camera);
        }
    </script>
    
    <script>
        let _screenshotRenderer;
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    if (!_screenshotRenderer && window.renderer) {
                        _screenshotRenderer = window.renderer;
                    }
                    
                    if (!_screenshotRenderer) {
                        throw new Error('渲染器未初始化');
                    }
                    
                    if (window.scene && window.camera) {
                        _screenshotRenderer.render(window.scene, window.camera);
                    }
                    
                    const quality = event.data.quality || 0.8;
                    const canvas = _screenshotRenderer.domElement;
                    
                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;
                    
                    const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                    tempCanvas.width = Math.floor(canvas.width * scale);
                    tempCanvas.height = Math.floor(canvas.height * scale);
                    
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    
                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });
    </script>
</body>
</html>
