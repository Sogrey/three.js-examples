<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="地球3D风场图 - 地球上的风场粒子流动效果">
    <meta name="three-version" content="r179">
    <title>Three.js 示例 - 地球3D风场图</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script src="../libs/windy.js"></script>

    <script type="x-shader/x-vertex" id="vertexShader">
        float PI = 3.1415926;
        float rad = 3.1415926 / 180.;
        uniform vec2 uResolution;
        uniform vec2 uSize;
        uniform mat4 rotateX;
        uniform float radius;

        varying vec2 vUv;

        vec3 lnglat2pos(vec2 p) {
            float lng = p.x * rad;
            float lat = p.y * rad;
            float x = cos(lat) * cos(lng);
            float y = cos(lat) * sin(lng);
            float z = sin(lat);
            return vec3(x, z, y);
        }

        void main() {
            vUv = vec2(position.z);
            vec2 p = vec2(position.x, -position.y) - vec2(180., 90.);
            vec3 newPosition = radius * lnglat2pos(p);
            gl_Position = projectionMatrix * modelViewMatrix * rotateX * vec4(newPosition, 1.);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentShader">
        varying vec2 vUv;
        uniform vec3 startColor;
        uniform vec3 endColor;

        void main() {
            gl_FragColor = vec4(mix(startColor, endColor, vUv.y), 1.0);
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls;
        let geometry = null;
        let windy = null;
        let material = null;

        const params = {
            speed: 0.05,
            particlesCount: 2000,
            maxAge: 120,
            frame: 10,
            lineWidth: 3,
            startColor: '#ffff00',
            endColor: '#ff0000',
            radius: 2,
            displaySizeX: 20,
            displaySizeY: 10
        };

        async function fetchData(url) {
            const response = await fetch(url);
            return await response.json();
        }

        function sleep(time) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve();
                }, time);
            });
        }

        async function createWindy() {
            const header = await fetchData('../models/json/wind.json');

            const num = params.particlesCount;
            const points = new Float32Array(num * 6);
            let i = 0;

            windy = new Windy({
                header: header,
                speed: params.speed,
                particlesCount: num,
                maxAge: params.maxAge,
                frame: params.frame,
                color: params.startColor,
                lineWidth: params.lineWidth,
                imageUrl: '../images/textures/wind.png',
                pointCallback: (p) => {
                    points[i] = p.x;
                    points[i + 1] = p.y;
                    points[i + 2] = 0;
                    points[i + 3] = p.tx;
                    points[i + 4] = p.ty;
                    points[i + 5] = 1;
                    i += 6;
                }
            });

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(points, 3));

            return { geometry, header };
        }

        async function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('threeContainer').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            const worldTex = new THREE.TextureLoader().load('../images/textures/world.jpg');
            worldTex.offset.x = 0.5;
            worldTex.wrapS = THREE.RepeatWrapping;

            const sphereGeo = new THREE.SphereGeometry(2, 32, 16);
            const sphereMesh = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ map: worldTex }));
            scene.add(sphereMesh);

            const { geometry: geo, header } = await createWindy();
            await sleep(100);

            const matrix = new THREE.Matrix4();
            matrix.makeRotationX(Math.PI);

            material = new THREE.ShaderMaterial({
                uniforms: {
                    rotateX: { value: matrix },
                    uResolution: { value: new THREE.Vector2(header.nx, header.ny) },
                    uSize: { value: new THREE.Vector2(params.displaySizeX, params.displaySizeY) },
                    radius: { value: params.radius },
                    startColor: { value: new THREE.Color(params.startColor) },
                    endColor: { value: new THREE.Color(params.endColor) }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                side: THREE.DoubleSide,
                transparent: true
            });

            const lines = new THREE.LineSegments(geo, material);
            scene.add(lines);

            initGUI();
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function initGUI() {
            const gui = new GUI({ title: '风场参数控制', width: 300 });

            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '60px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '1000';

            setTimeout(() => {
                gui.show();
            }, 100);

            const windFolder = gui.addFolder('风场参数');
            windFolder.add(params, 'speed', 0.01, 0.2).name('速度');
            windFolder.add(params, 'particlesCount', 500, 3000).step(100).name('粒子数量');
            windFolder.add(params, 'maxAge', 50, 200).name('生命周期');
            windFolder.open();

            const displayFolder = gui.addFolder('显示设置');
            displayFolder.add(params, 'displaySizeX', 5, 50).name('经度范围').onChange(() => updateMaterial());
            displayFolder.add(params, 'displaySizeY', 5, 50).name('纬度范围').onChange(() => updateMaterial());
            displayFolder.addColor(params, 'startColor').name('起始颜色').onChange(() => updateMaterial());
            displayFolder.addColor(params, 'endColor').name('结束颜色').onChange(() => updateMaterial());
        }

        function updateMaterial() {
            if (material) {
                material.uniforms.uSize.value.set(params.displaySizeX, params.displaySizeY);
                material.uniforms.startColor.value.set(params.startColor);
                material.uniforms.endColor.value.set(params.endColor);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let frameCount = 0;
        const frameRate = Math.floor(60 / 16);

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            if (frameCount % frameRate === 0 && windy && geometry) {
                let i = 0;
                const g = geometry;
                windy.movePoints((p) => {
                    g.attributes.position.array[i] = p.x;
                    g.attributes.position.array[i + 1] = p.y;
                    g.attributes.position.array[i + 3] = p.tx;
                    g.attributes.position.array[i + 4] = p.ty;
                    i += 6;
                });
                g.attributes.position.needsUpdate = true;
            }

            frameCount++;
            renderer.render(scene, camera);
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                try {
                    renderer.render(scene, camera);

                    const tempCanvas = document.createElement('canvas');
                    const maxSize = 600;

                    const scale = Math.min(maxSize / renderer.domElement.width, maxSize / renderer.domElement.height);
                    tempCanvas.width = Math.floor(renderer.domElement.width * scale);
                    tempCanvas.height = Math.floor(renderer.domElement.height * scale);

                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(renderer.domElement, 0, 0, tempCanvas.width, tempCanvas.height);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);

                    window.parent.postMessage({
                        type: 'screenshot-data',
                        dataUrl: dataUrl
                    }, '*');
                } catch (error) {
                    console.error('截图失败:', error);
                }
            }
        });

        init();
    </script>
</body>
</html>
