<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="周期性开合盒子 - 立方体表面创建多个动态开合的圆形孔洞">
    <meta name="three-version" content="r179">
    <title>周期性开合盒子</title>
    <link rel="stylesheet" href="../css/example-common.css">
</head>
<body>
    <div class="three-container" id="threeContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "../libs/three/r179/build/three.module.js",
                "three/addons/": "../libs/three/r179/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.scene = null;
        window.camera = null;
        window.renderer = null;

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(1, 1, 1.3);

        window.scene = new THREE.Scene();

        window.renderer = new THREE.WebGLRenderer({ antialias: true });
        window.renderer.setSize(window.innerWidth, window.innerHeight);
        window.renderer.setClearColor(0x3e9724);
        document.getElementById('threeContainer').appendChild(window.renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.2);
        light.position.set(5, 5, 5);
        window.scene.add(light);

        const controls = new OrbitControls(camera, window.renderer.domElement);

        const canvas1 = document.createElement('canvas');
        canvas1.width = 256;
        canvas1.height = 256;
        const ctx1 = canvas1.getContext('2d');
        const gradient1 = ctx1.createLinearGradient(0, 0, 0, 256);
        gradient1.addColorStop(0, '#2d5a27');
        gradient1.addColorStop(0.5, '#4a7c45');
        gradient1.addColorStop(1, '#1e3d1a');
        ctx1.fillStyle = gradient1;
        ctx1.fillRect(0, 0, 256, 256);
        const forestTexture = new THREE.CanvasTexture(canvas1);

        const canvas2 = document.createElement('canvas');
        canvas2.width = 256;
        canvas2.height = 256;
        const ctx2 = canvas2.getContext('2d');
        const gradient2 = ctx2.createRadialGradient(128, 128, 0, 128, 128, 128);
        gradient2.addColorStop(0, '#c9a06b');
        gradient2.addColorStop(0.5, '#8b6914');
        gradient2.addColorStop(1, '#5c400e');
        ctx2.fillStyle = gradient2;
        ctx2.fillRect(0, 0, 256, 256);
        const squirrelTexture = new THREE.CanvasTexture(canvas2);

        let frShPart1, openingPosition, frShPart2;
        shaderParts();

        let shaderMaterial = [];

        for (let i = 0; i < 3; i++) {
            shaderMaterial[i] = new THREE.ShaderMaterial({
                uniforms: {
                    v_Uv: { value: new THREE.Vector2() },
                    u_time: { value: 1.5 },
                    u_Texture: { value: forestTexture }
                },
                vertexShader: vertexShader(),
                fragmentShader: frShPart1 + openingPosition[i] + frShPart2,
                side: THREE.DoubleSide,
                transparent: true
            });
        }

        const sphereGeometry = new THREE.SphereGeometry(0.3, 32, 32);
        const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0x8b6914 });
        const sphereMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphereMesh.position.y = -0.5;
        window.scene.add(sphereMesh);

        const boxMaterials = [
            shaderMaterial[0],
            new THREE.MeshBasicMaterial({ map: squirrelTexture, side: THREE.DoubleSide }),
            shaderMaterial[1],
            new THREE.MeshBasicMaterial({ color: 0x3f5b50, side: THREE.DoubleSide }),
            shaderMaterial[2],
            new THREE.MeshBasicMaterial({ map: forestTexture, side: THREE.DoubleSide })
        ];

        const boxGeometry = new THREE.BoxGeometry();
        const boxMesh = new THREE.Mesh(boxGeometry, boxMaterials);
        window.scene.add(boxMesh);

        window.camera = camera;

        function shaderParts() {
            frShPart1 = `
                varying vec2 v_Uv;
                uniform float u_time;
                uniform sampler2D u_Texture;
                float circle(vec2 pos, vec2 c, float r) {
                    vec2 dist = pos - vec2(c.x, c.y);
                    return step(0.5 * r, dot(dist, dist));
                }
                void main() {
                    vec2 position = v_Uv;
                    float radius = 1.3;
                    vec2 center = vec2(0.85 + 0.5 * (1.0 + sin(u_time)));
            `;

            openingPosition = [
                ` position = vec2(1.0 - v_Uv.x, 0.0 + v_Uv.y); `,
                ` position = vec2(0.0 + v_Uv.x, 1.0 - v_Uv.y); `,
                ` position = vec2(0.0 + v_Uv.x, 0.0 + v_Uv.y); `
            ];

            frShPart2 = `
                float aCirc = circle(position, center, radius);
                vec3 colorTex = texture(u_Texture, v_Uv).rgb;
                float aTex = texture(u_Texture, v_Uv).a;
                vec4 color = vec4(colorTex, aTex) * vec4(vec3(1.0), aCirc);
                gl_FragColor = color;
            }
            `;
        }

        function vertexShader() {
            return `
                varying vec2 v_Uv;
                void main() {
                    v_Uv = uv;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;
        }

        function animate() {
            requestAnimationFrame(animate);
            shaderMaterial[0].uniforms.u_time.value += 0.01;
            shaderMaterial[1].uniforms.u_time.value += 0.01;
            shaderMaterial[2].uniforms.u_time.value += 0.01;
            sphereMesh.rotation.y += 0.01;
            window.renderer.render(window.scene, window.camera);
        }

        animate();
    </script>

    <script>
        let _screenshotRenderer;
        const MAX_RETRY = 3;
        const RETRY_DELAY = 200;

        function doScreenshot(retryCount = 0) {
            try {
                if (!_screenshotRenderer && window.renderer) {
                    _screenshotRenderer = window.renderer;
                }

                if (!_screenshotRenderer) {
                    throw new Error('渲染器未初始化');
                }

                if (!window.scene || !window.camera) {
                    throw new Error('场景或相机未初始化');
                }

                _screenshotRenderer.render(window.scene, window.camera);

                const quality = 0.8;
                const canvas = _screenshotRenderer.domElement;

                if (canvas.width === 0 || canvas.height === 0) {
                    throw new Error('Canvas尺寸无效');
                }

                const tempCanvas = document.createElement('canvas');
                const maxSize = 600;
                const scale = Math.min(maxSize / canvas.width, maxSize / canvas.height);
                tempCanvas.width = Math.floor(canvas.width * scale);
                tempCanvas.height = Math.floor(canvas.height * scale);

                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                const dataUrl = tempCanvas.toDataURL('image/jpeg', quality);

                window.parent.postMessage({
                    type: 'screenshot-data',
                    dataUrl: dataUrl
                }, '*');

            } catch (error) {
                console.error('截图失败 (尝试 ' + (retryCount + 1) + '):', error);

                if (retryCount < MAX_RETRY) {
                    setTimeout(() => {
                        doScreenshot(retryCount + 1);
                    }, RETRY_DELAY * (retryCount + 1));
                } else {
                    window.parent.postMessage({
                        type: 'screenshot-error',
                        error: error.message
                    }, '*');
                }
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'take-screenshot') {
                requestAnimationFrame(() => {
                    doScreenshot();
                });
            }
        });
    </script>
</body>
</html>
